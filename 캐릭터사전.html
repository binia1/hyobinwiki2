        :root {

        #app-container {
            position: relative; width: 1280px; height: 720px;
            background: linear-gradient(135deg, rgba(10,11,26,0.95) 0%, rgba(15,15,30,0.95) 100%);

            overflow: hidden; transform-origin: center; display: flex; flex-direction: column;
        }

        .top-bar {
            height: 70px; background: linear-gradient(to bottom, rgba(10, 11, 26, 0.9), rgba(10, 11, 26, 0.4));
            backdrop-filter: blur(12px); border-bottom: 2px solid var(--active-color);
            display: flex; justify-content: space-between; align-items: center; padding: 0 30px;
            z-index: 20; box-shadow: 0 4px 20px rgba(0,0,0,0.5); transition: border-color 0.4s;
        }

        .main-wrapper {
            display: flex; flex: 1; height: calc(100% - 70px); overflow: hidden;
        }

        .sidebar {
            width: 280px; background: rgba(0, 0, 0, 0.4); border-right: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; overflow-y: auto; padding: 20px 10px; gap: 8px; z-index: 10;
        }
        
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        .char-tab {
            display: flex; align-items: center; padding: 12px 15px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s; border: 1px solid transparent; background: rgba(255,255,255,0.02);
        }
        .char-tab:hover { background: rgba(255,255,255,0.08); }
        .char-tab.active {
            background: linear-gradient(90deg, rgba(255,255,255,0.1) 0%, transparent 100%);
            border-color: var(--active-color); box-shadow: inset 4px 0 0 var(--active-color);
        }
        
        .char-color-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 12px; box-shadow: 0 0 8px currentColor; }

        .content-area {
            flex: 1; padding: 30px; overflow-y: auto; position: relative; scroll-behavior: smooth;
        }
        .content-area::-webkit-scrollbar { width: 8px; }
        .content-area::-webkit-scrollbar-thumb { background: var(--active-color); border-radius: 4px; }
        .content-area::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }

            display: flex; gap: 30px; align-items: flex-end; margin-bottom: 30px;
            padding-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .profile-img-container {
            width: 200px; height: 280px; position: relative; display: flex; justify-content: center; align-items: flex-end;

            max-width: 100%; max-height: 100%; object-fit: contain; object-position: bottom;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8)); transition: transform 0.3s;
        }
        .profile-img-container:hover img { transform: scale(1.05); }

        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; }
        .info-grid.full { grid-template-columns: 1fr; }

        .data-card {

        .data-card h3 {
            font-size: 18px; font-weight: 900; color: var(--active-color); margin-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 8px; display: flex; align-items: center; gap: 8px;

            teamPos: '효빈광역시 공식 얼굴마담 및 정신적 지주 (시장님의 아이돌)', titleRule: '박효빈 시장을 \'시장님/철없는 남동생\' 취급하며 챙겨줌', specialSetting: '리듬게임(뱅드림) 30렙 엄지 풀콤보 초고수. 킹블레이드 썬더스네이크 달인.',
            academic: '타자 속도 800타 키보드 워리어, 지하철 노선도 타임어택', grades: '(요정)', gpa: '(요정)', studyType: '썬더스네이크/로망스 오타게, 리듬게임 쌉고수', railLevel: '서브컬처/리듬게임 SSS랭크 (성덕)',
            metaJoke: "- 결재 반려되면 창 휘두르며 '오라버니..!' (아라 한). 회식 때 별 스티커 붙이고 '키라키라 도키도키!' 외침 (카스미).",
            foodLike: '엠마 베르데 빵, 간식 창고(초콜릿, 젤리, 사탕) 털어먹기', foodDislike: '갈색 음식(카레, 짜장면) - 두청운수 트라우마로 구역질함', hobby: '시내버스 도색 감상, 고난도 리듬게임, 양손에 킹블레이드 오타게',
            hairColor: '백발/은발 계열 (이미지 의존)', hairStyle: '바다 요정을 연상시키는 신비로운 스타일.', visual: '신비로운 마스코트, 압도적 볼륨(G컵)',
            llLookalike: '정보 없음', bdLookalike: '정보 없음', lookalikeDetail: '효빈광역시 오리지널 텐션.',
            wealth: '불명 (요정)', familyBg: '박현만 전 시장 기획으로 2000년 탄생', incomeSource: '홍보대사 활동 (시청 예산)', spending: '식비와 킹블레이드, 리듬게임 과금',
            jobDetail: '효빈시청 대변인실 홍보대사', status: '공식 마스코트', statusNote: '효빈시의 정신적 지주이자 HAF 여신.',
            phone: '공용 스마트폰 (추정)', phoneBrand: '불명', tmi: '지하 창고 생존왕.', rank: '홍보대사 (마스코트)', incomeType: '마스코트 활동비', monthlyIncome: '불명', mainExpense: '덕질 및 간식', financialStatus: '시청 예산 지원 (무한 동력)', clan: '바다 요정'
        }
    ];

    const sidebar = document.getElementById('sidebar-list');
    const contentArea = document.getElementById('content-area');

    function renderSidebar() {
        charData.forEach((char, index) => {
            const btn = document.createElement('div');
            btn.className = 'char-tab';
            // 7호선의 경우 이름 분리 표시 보정
            let displayName = char.id;
            if (char.id === '7호선(세정)') displayName = '7호선 (세정)';
            if (char.id === '7호선(세하)') displayName = '7호선 (세하)';

            btn.innerHTML = `
                <div class="char-color-dot" style="background-color: ${char.color}; color: ${char.color}"></div>
                <div>
                    <div class="text-[11px] font-bold text-gray-400 mb-0.5">${displayName}</div>
                    <div class="text-sm font-black text-white tracking-wide">${char.nameKR}</div>
                </div>
            `;
            btn.onclick = () => selectCharacter(index, btn);
            sidebar.appendChild(btn);
        });
    }

    function renderField(label, value, isHighlight = false) {
        if(!value || value === '정보 없음' || value === '(정보 없음)') return '';
        let valHtml = value;
        if(isHighlight) valHtml = `<span class="text-[var(--active-color)] font-bold">${value}</span>`;
        
        // 콤마나 middot 구분자를 태그로 변환 (일부 항목)
        if(label === '대표작' && value.includes(',')) {
            valHtml = value.split(',').map(v => `<span class="tag">${v.trim()}</span>`).join('');
        }
        if((label === '강점' || label === '약점') && value.includes('·')) {
            valHtml = value.split('·').map(v => `<li class="ml-4 list-disc mb-1">${v.trim()}</li>`).join('');
            valHtml = `<ul class="my-1">${valHtml}</ul>`;
        }

        return `
            <div class="data-row">
                <div class="data-label">${label}</div>
                <div class="data-value">${valHtml}</div>
            </div>
        `;
    }

    function selectCharacter(index, btnElement) {
        // 스타일 업데이트
        document.querySelectorAll('.char-tab').forEach(b => b.classList.remove('active'));
        if(btnElement) btnElement.classList.add('active');
        
        const char = charData[index];
        document.documentElement.style.setProperty('--active-color', char.color);

        // 데이터 렌더링
        let html = `
            <div class="profile-header">
                <div class="profile-img-container" style="border-color: ${char.color}">
                    <div class="absolute inset-0 bg-gradient-to-t from-[${char.color}] to-transparent opacity-20"></div>
                    <img src="이미지/${char.file}" alt="${char.nameKR}" onerror="this.src='https://placehold.co/200x280/1a1a2e/ffffff?text=${char.nameKR}'">
                </div>
                <div class="pb-2">
                    <div class="inline-block px-3 py-1 bg-[var(--active-color)] text-white text-xs font-black rounded-full mb-2 tracking-widest shadow-[0_0_15px_var(--active-color)]">
                        ${char.id}
                    </div>
                    <h1 class="text-5xl font-black text-white mb-2 tracking-tight">${char.nameKR} <span class="text-2xl text-gray-400 font-normal ml-2">${char.nameCN} / ${char.nameJP}</span></h1>
                    <p class="text-lg text-gray-300 font-bold mb-3">${char.jobDetail} <span class="mx-2">|</span> ${char.statusNote}</p>
                    <div class="flex flex-wrap gap-2">
                        <span class="tag highlight">MBTI : ${char.mbti}</span>
                        <span class="tag highlight">나이 : ${char.age26}세 (${char.birthYear}년생)</span>
                        <span class="tag highlight">신체 : ${char.height}cm / ${char.cup}</span>
                    </div>
                </div>
            </div>

            <div class="info-grid">
                <!-- 1. 기본 프로필 -->
                <div class="data-card">
                    <h3><span class="text-xl">📋</span> 기본 정보</h3>
                    ${renderField('생년월일', `${char.dob} (${char.birthday})`)}
                    ${renderField('거주지', `${char.city} ${char.town}`)}
                    ${renderField('출신/소속', `${char.highSchool} ➔ ${char.finalEdu}`)}
                    ${renderField('현재 직장/직업', char.job)}
                    ${renderField('신체 사이즈', `B${char.bust} / W${char.waist} / H${char.hip}`)}
                    ${renderField('본관', char.clan)}
                    ${renderField('가족 관계', char.family)}
                </div>

                <!-- 2. 캐릭터성 -->
                <div class="data-card">
                    <h3><span class="text-xl">✨</span> 캐릭터성 및 서사</h3>
                    ${renderField('주요 특징', char.charTrait, true)}
                    ${renderField('성격 코어', char.corePersonality)}
                    ${renderField('가족 서사', char.familyLore)}
                    ${renderField('밈 (Meme)', char.meme)}
                    ${renderField('팀 포지션', char.teamPos)}
                    ${renderField('호칭 특이사항', char.titleRule)}
                </div>
            </div>

            <div class="info-grid">
                <!-- 3. 장단점 & 개그 -->
                <div class="data-card">
                    <h3><span class="text-xl">🎭</span> 장단점 및 개그 포인트</h3>
                    ${renderField('작품 내 강점', char.strength)}
                    ${renderField('약점 및 결함', char.weakness)}
                    ${renderField('코믹 트리거(버튼)', char.trigger)}
                    ${renderField('러닝 개그/소품', char.runningGag)}
                    ${renderField('말투/대사 결', char.speechStyle)}
                    ${renderField('특수 설정', char.specialSetting)}
                </div>

                <!-- 4. 성우 & 메타 -->
                <div class="data-card">
                    <h3><span class="text-xl">🎙️</span> 성우 및 메타 정보</h3>
                    ${renderField('한국 성우', `<span class="font-bold text-white">${char.cvKR}</span>`)}
                    ${renderField('대표작 (韓)', char.cvKRRoles)}
                    ${renderField('일본 성우', `<span class="font-bold text-white">${char.cvJP}</span>`)}
                    ${renderField('대표작 (日)', char.cvJPRoles)}
                    ${renderField('성우 드립 (메타)', char.metaJoke)}
                </div>
            </div>

            <div class="info-grid">
                <!-- 5. 학업 & 취향 -->
                <div class="data-card">
                    <h3><span class="text-xl">📚</span> 학업 및 취향</h3>
                    ${renderField('학업 성향', char.academic)}
                    ${renderField('과목별 등급', char.grades)}
                    ${renderField('추정 내신(GPA)', char.gpa)}
                    ${renderField('특기/유형', char.studyType)}
                    ${renderField('철덕 레벨', char.railLevel, true)}
                    ${renderField('좋아하는 음식', char.foodLike)}
                    ${renderField('싫어하는 음식', char.foodDislike)}
                    ${renderField('취미', char.hobby)}
                </div>

                <!-- 6. 비주얼 & 외형 -->
                <div class="data-card">
                    <h3><span class="text-xl">👗</span> 비주얼 및 외형 설정</h3>
                    ${renderField('머리 색상', char.hairColor)}
                    ${renderField('헤어스타일', char.hairStyle)}
                    ${renderField('핵심 비주얼', char.visual)}
                    ${renderField('LL 닮은꼴', char.llLookalike)}
                    ${renderField('BD 닮은꼴', char.bdLookalike)}
                    ${renderField('외형 분석 디테일', char.lookalikeDetail)}
                </div>
            </div>

            <div class="info-grid full">
                <!-- 7. 재무 & 환경 -->
                <div class="data-card">
                    <h3><span class="text-xl">💰</span> 환경 및 재무 상태</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            ${renderField('부의 수준(계급)', char.wealth, true)}
                            ${renderField('가족 배경/환경', char.familyBg)}
                            ${renderField('주 수입원', char.incomeSource)}
                            ${renderField('소득 유형/직급', `${char.incomeType} / ${char.rank}`)}
                            ${renderField('월 추정 소득', char.monthlyIncome)}
                        </div>
                        <div>
                            ${renderField('휴대폰 기종', `${char.phone} (${char.phoneBrand})`)}
                            ${renderField('기기 특징(TMI)', char.tmi)}
                            ${renderField('주요 지출처', char.mainExpense)}
                            ${renderField('지출 성향', char.spending)}
                            ${renderField('재무 상태 요약', char.financialStatus)}
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        contentArea.innerHTML = html;
        contentArea.scrollTop = 0; // 스크롤 맨 위로
    }

    renderSidebar();
    
    // 초기 로딩 시 첫 번째 캐릭터(고나미) 선택
    setTimeout(() => {
        const firstTab = document.querySelector('.char-tab');
        if(firstTab) selectCharacter(0, firstTab);
    }, 100);

</script>
</body>
</html>
