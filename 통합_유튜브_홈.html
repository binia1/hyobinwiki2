<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="이미지/효빈위키아이콘.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지자체 공식 유튜브 채널 - 홈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #ffffff; color: #0f0f0f; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        .yt-red { color: #ff0000; }
        .hover-bg-yt-gray:hover { background-color: #e5e5e5; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
<script src="ad_logic.js"></script>
</head>
<body class="flex flex-col min-h-screen pt-[56px]">

    <div class="w-full bg-gray-800 text-white p-2 text-center text-sm font-bold fixed top-0 z-[100]">
        ⚙️ [템플릿 테스트용] 유튜브 채널 변경: 
        <select id="regionSelect" class="text-black px-2 py-1 rounded ml-2 outline-none cursor-pointer" onchange="changeRegion(this.value)">
            <option value="중구청" selected>중구청 (효빈시 원도심)</option>
            <option value="청엽구청">청엽구청 (효빈시 생태)</option>
            <option value="덕빈북도청">덕빈북도청 (광역지자체)</option>
            <option value="약산시청">약산시청 (덕빈북도 산하)</option>
        </select>
        <span class="ml-4 font-normal text-xs text-gray-300">선택 시 파라미터가 자동으로 유지됩니다!</span>
    </div>

    <nav class="bg-white fixed top-[44px] sm:top-0 w-full z-50 h-[56px] flex items-center justify-between px-4 border-b border-gray-200 sm:mt-11">
        <div class="flex items-center gap-4">
            <button class="w-10 h-10 rounded-full hover-bg-yt-gray flex justify-center items-center transition" onclick="goTo('유튜브 사이드바.html')"><i class="fas fa-bars text-xl"></i></button>
            <div class="flex items-center gap-1 cursor-pointer" onclick="goTo('통합_유튜브_홈.html')">
                <i class="fab fa-youtube text-3xl yt-red"></i>
                <span class="text-xl font-bold tracking-tighter">YouTube</span><span class="text-xs text-gray-500 -mt-3">KR</span>
            </div>
        </div>
        <div class="hidden md:flex flex-1 justify-center max-w-[720px] ml-10">
            <div class="flex w-full">
                <div class="flex items-center w-full border border-gray-300 rounded-l-full px-4 py-2 bg-white focus-within:border-blue-500">
                    <i class="fas fa-search text-gray-400 mr-2"></i>
                    <input type="text" placeholder="검색" class="w-full outline-none font-medium" onkeypress="if(event.key === 'Enter') goTo('유튜브 검색결과.html')">
                </div>
                <button class="border border-l-0 border-gray-300 bg-[#f8f8f8] px-5 rounded-r-full hover:bg-[#f0f0f0] transition" onclick="goTo('유튜브 검색결과.html')"><i class="fas fa-search text-gray-600"></i></button>
            </div>
            <button class="w-10 h-10 ml-4 rounded-full bg-[#f2f2f2] hover-bg-yt-gray flex justify-center items-center flex-shrink-0 transition" onclick="goTo('유튜브 음성검색.html')"><i class="fas fa-microphone"></i></button>
        </div>
        <div class="flex items-center gap-2 sm:gap-4">
            <button class="w-10 h-10 rounded-full hover-bg-yt-gray flex justify-center items-center transition relative" onclick="goTo('유튜브 알림.html')">
                <i class="far fa-bell text-xl"></i><span class="absolute top-1 right-1 bg-red-600 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full font-bold border-2 border-white">3</span>
            </button>
            <button class="w-8 h-8 rounded-full overflow-hidden ml-2" onclick="goTo('유튜브 내채널.html')"><img src=이미지/"임세하 로고.png" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/32'"></button>
        </div>
    </nav>

    <div class="flex flex-1 h-full mt-11 sm:mt-24">
        <aside class="hidden xl:flex flex-col w-[240px] px-3 py-2 fixed h-[calc(100vh-100px)] overflow-y-auto">
            <a href="javascript:void(0)" onclick="goTo('통합_유튜브_홈.html')" class="flex items-center px-3 py-2.5 rounded-lg hover-bg-yt-gray transition mb-1"><i class="fas fa-home text-xl w-8 text-center mr-4"></i><span class="font-medium">홈</span></a>
            <a href="javascript:void(0)" onclick="goTo('유튜브 Shorts.html')" class="flex items-center px-3 py-2.5 rounded-lg hover-bg-yt-gray transition mb-1"><i class="fas fa-bolt text-xl w-8 text-center mr-4"></i><span class="font-medium">Shorts</span></a>
            <div class="h-[1px] bg-gray-200 my-3"></div>
            <h3 class="px-4 py-1 text-base font-bold">구독</h3>
            <a href="javascript:void(0)" onclick="goTo('통합_유튜브_홈.html')" class="flex items-center px-3 py-2.5 rounded-lg bg-gray-100 font-bold transition mb-1">
                <img id="side-logo" src="이미지/효빈시_로고.png" class="w-6 h-6 rounded-full mr-4 object-cover" onerror="this.src='https://via.placeholder.com/24'">
                <span id="side-name" class="truncate">지자체명</span>
            </a>
        </aside>

        <main class="flex-1 xl:ml-[240px] w-full max-w-[1280px] mx-auto pb-10 animate-fade-in" id="main-content">
            <div class="w-full h-[15vw] min-h-[150px] max-h-[250px] xl:rounded-2xl overflow-hidden mt-4 bg-gray-200 cursor-pointer" onclick="goTo('채널 배너 원본.html')">
                <img id="yt-banner" src="이미지/효빈광역시전경.png" alt="배너" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/1280x250?text=Banner'">
            </div>
            <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 px-4 py-6">
                <img id="yt-logo" src="이미지/효빈시_로고.png" alt="로고" class="w-[120px] h-[120px] sm:w-[160px] sm:h-[160px] rounded-full object-cover border border-gray-200 cursor-pointer" onclick="goTo('채널 프로필.html')" onerror="this.src='https://via.placeholder.com/160'">
                <div class="flex-1 text-center sm:text-left">
                    <h1 class="text-3xl font-bold mb-1 flex items-center justify-center sm:justify-start gap-2">
                        <span id="yt-name" class="cursor-pointer" onclick="goTo('통합_유튜브_홈.html')">지자체명</span> <i class="fas fa-check-circle text-gray-500 text-[18px]"></i>
                    </h1>
                    <div class="text-gray-600 text-sm mb-2 font-medium cursor-pointer hover:text-black" onclick="goTo('채널 정보.html')">
                        <span id="yt-handle" class="font-bold text-black">@Handle</span> ‧ 구독자 <span id="yt-subs">0만명</span> ‧ 동영상 1,024개 <i class="fas fa-chevron-right text-xs"></i>
                    </div>
                    <p id="yt-desc" class="text-gray-600 text-sm mb-4 max-w-2xl line-clamp-2">소개글</p>
                    <button id="subscribe-btn" class="bg-[#0f0f0f] hover:bg-[#272727] text-white font-bold px-4 py-2 rounded-full transition" onclick="toggleSubscribe()">구독</button>
                </div>
            </div>

            <!-- 🌟 탭 메뉴 -->
            <div class="flex border-b border-gray-200 px-4 overflow-x-auto">
                <a id="tab-home" href="#" class="px-6 py-3 font-bold text-black border-b-[3px] border-black whitespace-nowrap">홈</a>
                <a id="tab-videos" href="#" class="px-6 py-3 font-semibold text-gray-600 hover:text-black transition whitespace-nowrap">동영상</a>
                <a id="tab-shorts" href="#" onclick="goTo('채널 Shorts.html', event)" class="px-6 py-3 font-semibold text-gray-600 hover:text-black transition whitespace-nowrap">Shorts</a>
                <a id="tab-community" href="#" class="px-6 py-3 font-semibold text-gray-600 hover:text-black transition whitespace-nowrap">커뮤니티</a>
            </div>

            <div class="px-4 py-6 border-b border-gray-200">
                <div id="featured-video" class="flex flex-col md:flex-row gap-4 cursor-pointer hover:bg-gray-50 rounded-xl transition p-2" onclick="goTo('영상 재생.html')">
                    <!-- JS 렌더링 -->
                </div>
            </div>

            <div class="px-4 py-6">
                <div class="flex items-center gap-2 mb-4">
                    <h2 class="text-lg font-bold cursor-pointer hover:text-blue-600" onclick="goTo('통합_유튜브_동영상.html')">최근 업로드된 동영상</h2>
                    <button class="w-8 h-8 rounded-full hover:bg-gray-200 flex items-center justify-center transition" onclick="goTo('통합_유튜브_동영상.html')"><i class="fas fa-play text-xs"></i></button>
                </div>
                <div id="recent-videos-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-4 gap-y-8">
                    <!-- JS 렌더링 -->
                </div>
            </div>
        </main>
    </div>

    <script>
        const regionData = {
            "중구청": {
                name: "효빈시 중구청", handle: "@Hyobin_JungGu", subs: "4.8만",
                logo: "중구청 로고.png", banner: "중구청 전경.png",
                desc: "원도심의 화려한 부활! 역사와 전통, 그리고 서브컬처가 공존하는 효빈의 심장 중구청 공식 유튜브입니다.",
                videos: [
                    { img: "중구재생.png", title: "[중구] 구시청앞역 7호선 아논 테마거리 완벽 가이드 🌸", views: "1.2만회", time: "1일 전", duration: "12:30" },
                    { img: "중구맛집.png", title: "원도심 부활! 중보로 노포 맛집 TOP 5 🍜", views: "3.5만회", time: "1주 전", duration: "08:45" },
                    { img: "1대청사.png", title: "[다큐] 1952년 사라진 1대 청사의 진실 (feat. 윤대환 전 시장 망언)", views: "8,900회", time: "2주 전", duration: "25:10" },
                    { img: "아논입간판.png", title: "테마거리에 등장한 임세정/세하 쌍둥이 입간판 제작기", views: "4.2만회", time: "1개월 전", duration: "10:05" },
                    { img: "야행축제.png", title: "효빈 중구 문화재 야행 축제 하이라이트 ✨", views: "1.8만회", time: "2개월 전", duration: "05:55" }
                ]
            },
            "청엽구청": {
                name: "청엽구청", handle: "@Cheongyeop_Gu", subs: "6.1만",
                logo: "청엽구청 로고.png", banner: "청엽구 전경.png",
                desc: "자연과 첨단이 어우러진 친환경 생태교육도시 청엽구청 공식 유튜브입니다! 🍃",
                videos: [
                    { img: "청엽공원.png", title: "2호선 모카(하루빈)와 함께하는 생태공원 나들이 🌳", views: "8,400회", time: "2일 전", duration: "10:15" },
                    { img: "청엽국제학교.png", title: "청엽국제학교 학생들의 리얼 브이로그 🎒", views: "2.1만회", time: "1주 전", duration: "14:20" },
                    { img: "수목원.png", title: "도심 속 힐링, 청엽 수목원 탐방기", views: "5,300회", time: "3주 전", duration: "07:30" },
                    { img: "길고양이.png", title: "길고양이 밥자리 정비 현장 스케치 🐈", views: "1.5만회", time: "1개월 전", duration: "04:45" },
                    { img: "모카ASMR.png", title: "[ASMR] 2호선 모카(하루빈) 역 안내방송 모음 (1시간 반복)", views: "12만회", time: "2개월 전", duration: "1:00:00" }
                ]
            },
            "덕빈북도청": {
                name: "덕빈북도청", handle: "@Deokbin_North", subs: "21.5만",
                logo: "덕빈북도청 로고.png", banner: "덕빈북도 전경.png",
                desc: "첨단 산업과 눈부신 자연이 공존하는 대한민국 중심, 덕빈북도청 공식 채널입니다.",
                videos: [
                    { img: "광역철도 노선.png", title: "빈주권 광역철도 코레일 블루 탑승기 🚄", views: "12만회", time: "3일 전", duration: "18:20" },
                    { img: "상생발전.png", title: "덕빈북도 상생 발전 협약식 현장 (효빈시-덕빈북도)", views: "4,500회", time: "2주 전", duration: "05:10" },
                    { img: "도지사투어.png", title: "도지사와 함께하는 덕빈북도 명소 투어 🏞️", views: "8,900회", time: "1개월 전", duration: "22:15" },
                    { img: "청년창업.png", title: "청년 창업 지원금 설명회 풀영상", views: "3.2만회", time: "2개월 전", duration: "45:00" },
                    { img: "덕빈북도홍보.png", title: "[홍보] 대한민국 첨단 산업의 중심, 덕빈북도", views: "50만회", time: "6개월 전", duration: "03:30" }
                ]
            },
            "약산시청": {
                name: "약산시청", handle: "@Yaksan_City", subs: "3.2만",
                logo: "약산시청 로고.png", banner: "약산시 전경.png",
                desc: "덕빈북도의 숨은 진주, 약산시청 공식 유튜브 채널입니다. (※특산물: 약산 사과)",
                videos: [
                    { img: "약산사과축제.png", title: "제10회 약산 꿀사과 축제 현장 스케치 🍎", views: "2.5만회", time: "1일 전", duration: "08:15" },
                    { img: "사과먹방.png", title: "[먹방] 약산 사과로 만든 디저트 5종 찐리뷰", views: "1.2만회", time: "2주 전", duration: "11:20" },
                    { img: "당일치기.png", title: "광역철도 타고 가는 약산시 당일치기 투어 코스 추천!", views: "4.8만회", time: "1개월 전", duration: "15:45" },
                    { img: "직거래장터.png", title: "약산 농산물 직거래 장터 오픈 현장!", views: "3,200회", time: "3개월 전", duration: "04:10" },
                    { img: "신년인사.png", title: "약산시장의 2026년 신년 인사", views: "1,500회", time: "4개월 전", duration: "02:50" }
                ]
            }
        };

        function goTo(page, event) {
            if(event) event.stopPropagation();
            const region = document.getElementById('regionSelect').value || "중구청";
            window.location.href = `${page}?region=${region}`;
        }

        function getRegionFromURL() {
            return new URLSearchParams(window.location.search).get('region') || "중구청";
        }

        function updateTabLinks(regionKey) {
            document.getElementById('tab-home').href = `통합_유튜브_홈.html?region=${regionKey}`;
            document.getElementById('tab-videos').href = `통합_유튜브_동영상.html?region=${regionKey}`;
            document.getElementById('tab-community').href = `통합_유튜브.html?region=${regionKey}`;
        }

        function changeRegion(regionKey) {
            const data = regionData[regionKey] || regionData["중구청"];
            const select = document.getElementById('regionSelect');
            if(select) select.value = regionKey;
            
            updateTabLinks(regionKey);

            document.getElementById('yt-banner').src = data.banner;
            document.getElementById('yt-logo').src = data.logo;
            document.getElementById('side-logo').src = data.logo;
            document.getElementById('yt-name').innerText = data.name;
            document.getElementById('side-name').innerText = data.name;
            document.getElementById('yt-handle').innerText = data.handle;
            document.getElementById('yt-subs').innerText = data.subs;
            document.getElementById('yt-desc').innerText = data.desc;

            const fv = data.videos[0];
            document.getElementById('featured-video').innerHTML = `
                <div class="relative w-full md:w-[450px] aspect-video rounded-xl overflow-hidden flex-shrink-0">
                    <img src=이미지/"${fv.img}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/640x360/EEEEEE/333333?text=Video'">
                    <span class="absolute bottom-1 right-1 bg-black bg-opacity-80 text-white text-xs font-bold px-1 py-0.5 rounded">${fv.duration}</span>
                </div>
                <div class="flex flex-col justify-center">
                    <h3 class="text-xl font-bold text-black line-clamp-2 mb-2">${fv.title}</h3>
                    <div class="text-sm text-gray-500 mb-2">조회수 ${fv.views} • ${fv.time}</div>
                    <p class="text-sm text-gray-600 line-clamp-3">해당 지자체의 최신 소식을 영상으로 만나보세요. 구독과 좋아요 알림 설정까지 부탁드립니다!</p>
                </div>
            `;

            const recentHtml = data.videos.slice(1).map(v => `
                <div class="flex flex-col cursor-pointer group" onclick="goTo('영상 재생화면.html', event)">
                    <div class="relative w-full aspect-video rounded-xl overflow-hidden mb-3">
                        <img src=이미지/"${v.img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/640x360/EEEEEE/333333?text=Video'">
                        <span class="absolute bottom-1 right-1 bg-black bg-opacity-80 text-white text-xs font-bold px-1 py-0.5 rounded">${v.duration}</span>
                    </div>
                    <div class="flex gap-3">
                        <div class="flex-1">
                            <h3 class="text-sm font-bold text-black line-clamp-2 mb-1 group-hover:text-blue-600">${v.title}</h3>
                            <div class="text-xs text-gray-500">조회수 ${v.views} • ${v.time}</div>
                        </div>
                        <button class="text-gray-500 hover:text-black mt-1" onclick="goTo('게시물 옵션.html', event)"><i class="fas fa-ellipsis-v"></i></button>
                    </div>
                </div>
            `).join('');
            document.getElementById('recent-videos-grid').innerHTML = recentHtml;
        }

        let isSubscribed = false;
        function toggleSubscribe() {
            const btn = document.getElementById('subscribe-btn');
            isSubscribed = !isSubscribed;
            btn.innerHTML = isSubscribed ? '<i class="far fa-bell mr-1"></i> 구독중 <i class="fas fa-chevron-down text-xs ml-1"></i>' : '구독';
            btn.className = isSubscribed ? "bg-[#f2f2f2] text-black font-bold px-4 py-2 rounded-full" : "bg-[#0f0f0f] text-white font-bold px-4 py-2 rounded-full hover:bg-[#272727]";
        }

        window.onload = () => changeRegion(getRegionFromURL());
    </script>
</body>
</html>
