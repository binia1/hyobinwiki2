<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
    <!-- 배경: 코레일 블루 -->
    <rect width="900" height="240" fill="#005BAC" />

    <!-- 좌측 심볼 엠블럼 -->
    <g transform="translate(130, 120)">
        <!-- 월계수 잎 -->
        <g fill="#37B484">
            <!-- 좌측 브랜치 -->
            <ellipse cx="-65" cy="45" rx="10" ry="5" transform="rotate(-25 -65 45)" />
            <ellipse cx="-72" cy="25" rx="10" ry="5" transform="rotate(-35 -72 25)" />
            <ellipse cx="-76" cy="3" rx="10" ry="5" transform="rotate(-45 -76 3)" />
            <ellipse cx="-74" cy="-20" rx="10" ry="5" transform="rotate(-55 -74 -20)" />
            <ellipse cx="-66" cy="-40" rx="10" ry="5" transform="rotate(-65 -66 -40)" />
            <ellipse cx="-52" cy="-56" rx="10" ry="5" transform="rotate(-75 -52 -56)" />
            <!-- 우측 브랜치 -->
            <ellipse cx="65" cy="45" rx="10" ry="5" transform="rotate(25 65 45)" />
            <ellipse cx="72" cy="25" rx="10" ry="5" transform="rotate(35 72 25)" />
            <ellipse cx="76" cy="3" rx="10" ry="5" transform="rotate(45 76 3)" />
            <ellipse cx="74" cy="-20" rx="10" ry="5" transform="rotate(55 74 -20)" />
            <ellipse cx="66" cy="-40" rx="10" ry="5" transform="rotate(65 66 -40)" />
            <ellipse cx="52" cy="-56" rx="10" ry="5" transform="rotate(75 52 -56)" />
        </g>

        <!-- 방패 -->
        <path d="M -50 -55 Q 0 -63 50 -55 Q 52 20 0 62 Q -52 20 -50 -55 Z" fill="#005BAC" stroke="#FFFFFF" stroke-width="4.5" />
        <path d="M -43 -49 Q 0 -56 43 -49 Q 45 16 0 53 Q -45 16 -43 -49 Z" fill="none" stroke="#FFFFFF" stroke-width="2" />

        <!-- 책 -->
        <path d="M -2 -3 Q -18 -12 -33 -7 L -33 15 Q -18 10 -2 20 Z" fill="#FFFFFF" />
        <path d="M 2 -3 Q 18 -12 33 -7 L 33 15 Q 18 10 2 20 Z" fill="#FFFFFF" />

        <!-- 새싹 -->
        <ellipse cx="-10" cy="-22" rx="12" ry="6" fill="#37B484" transform="rotate(-40 -10 -22)" />
        <ellipse cx="10" cy="-25" rx="14" ry="7" fill="#37B484" transform="rotate(40 10 -25)" />

        <!-- HBNU 이니셜 -->
        <text x="0" y="42" fill="#FFFFFF" font-size="17" font-weight="900" font-family="Arial, sans-serif" text-anchor="middle">HBNU</text>
    </g>

    <!-- 우측 교명 (부산대 스타일 국/영문) -->
    <text x="265" y="115" fill="#FFFFFF" font-size="68" font-weight="800" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" letter-spacing="6">효빈대학교</text>
    <text x="270" y="160" fill="#FFFFFF" font-size="23" font-weight="600" font-family="Arial, Montserrat, sans-serif" letter-spacing="3">HYOBIN NATIONAL UNIVERSITY</text>
</svg>
