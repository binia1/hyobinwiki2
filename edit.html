<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="이미지/효빈위키아이콘.webp" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>편집 - 효빈위키</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f4f4f9; color: #333; margin: 0; }
        
        .wiki-container { max-width: 1200px; margin: 30px auto; background: white; padding: 40px; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); min-height: 80vh; }
        
        .nav-logo-box { width: 30px; height: 30px; background: white; color: #7777AA; border-radius: 4px; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        
        .editor-toolbar button { transition: all 0.2s; }
        .editor-toolbar button:hover { background-color: #e2e8f0; color: #0055AA; }
        
        textarea#wikiEditor {
            background-color: #f8fafc;
            background-image: linear-gradient(#f1f5f9 1px, transparent 1px);
            background-size: 100% 28px;
            line-height: 28px;
            resize: vertical;
        }

        /* 일괄 적용된 SVG 수직 정렬 CSS */
        .svg-logo { width: 38px; height: 38px; object-fit: contain; flex-shrink: 0; }
        .svg-logo-sm { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
        .svg-logo-inline { height: 1.5rem; vertical-align: middle; margin-right: 5px; }
        .flex-center-inline { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; }
        .flex-center { display: flex; align-items: center; justify-content: center; gap: 6px; }
        .flex-start { display: flex; align-items: center; justify-content: flex-start; gap: 6px; }
    </style>
    <!-- 효빈위키 폰트 CSS -->
    <link rel="stylesheet" href="wiki_font_standard.css" />
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
</head>
<body>
    <!-- 상단 내비게이션 바 -->
    <nav class="font-sans bg-[#7777AA] text-white p-3 flex justify-between items-center shadow-md sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="nav-logo-box">H</div>
            <a href="index.html" class="font-bold text-xl cursor-pointer no-underline text-white">HyobinWiki</a>
            <div class="hidden md:flex gap-3 text-sm opacity-90 ml-4">
                <a href="index.html" class="hover:underline font-bold text-white no-underline">대문</a>
                <a href="최근_변경.html" class="hover:underline text-white no-underline">최근 변경</a>
                <a href="최근_토론.html" class="hover:underline text-white no-underline">최근 토론</a>
            </div>
        </div>
        <div class="flex flex-col items-end gap-1">
            <div class="flex items-center gap-2">
                <div class="hidden lg:flex items-center gap-1 mr-2">
                    <a href="편집요청.html" class="bg-[#666699] hover:bg-[#555588] text-white text-xs px-2 py-1 rounded transition-colors no-underline font-bold">편집요청</a>
                    <a href="최근_토론.html" class="bg-[#666699] hover:bg-[#555588] text-white text-xs px-2 py-1 rounded transition-colors no-underline font-bold">토론</a>
                    <a href="역사.html" id="navHistoryBtn" class="bg-[#666699] hover:bg-[#555588] text-white text-xs px-2 py-1 rounded transition-colors no-underline font-bold">역사</a>
                    <a href="즐겨찾기.html" title="즐겨찾기" class="bg-[#666699] hover:bg-[#555588] text-yellow-300 text-xs px-2 py-1 rounded transition-colors no-underline font-bold">★</a>
                    <a href="더보기.html" class="bg-[#666699] hover:bg-[#555588] text-white text-xs px-2 py-1 rounded transition-colors no-underline font-bold flex items-center gap-1">더보기 <span class="text-[9px]">▼</span></a>
                </div>
                <!-- 검색창 -->
                <input type="text" id="headerSearchInput" placeholder="문서 검색" class="p-1 px-3 rounded text-black text-sm focus:outline-none border-none shadow-inner w-32 md:w-48" onkeypress="if(event.keyCode==13) { handleSearch('headerSearchInput'); }">
                <button onclick="handleSearch('headerSearchInput')" class="bg-[#555588] p-1 px-3 rounded text-xs transition-colors shadow-inner font-bold">🔍</button>
            </div>
            <div id="auth-buttons" class="flex gap-1">
                <button id="btn-login" onclick="toggleModal('loginModal')" class="bg-[#666699] hover:bg-[#555588] text-white text-xs px-2 py-0.5 rounded transition-colors">로그인</button>
                <button onclick="toggleModal('settingsModal')" class="bg-[#666699] hover:bg-[#555588] text-white text-xs px-2 py-0.5 rounded transition-colors">설정</button>
            </div>
        </div>
    </nav>

    <!-- 메인 컨테이너 -->
    <div class="wiki-container relative">
        <div class="border-b-2 border-[#7777AA] pb-3 mb-6 flex justify-between items-end">
            <h1 class="text-3xl font-black text-gray-800">
                <span class="text-[#7777AA]" id="docTitleMain">...</span> 
                <span class="text-xl text-gray-500 font-bold ml-2">(편집)</span>
            </h1>
            <span class="text-sm font-bold text-gray-500"><i class="fa-solid fa-pen-nib"></i> 문서 수정 중</span>
        </div>

        <div class="bg-red-50 border-l-4 border-red-500 text-red-800 p-4 rounded shadow-sm mb-6 text-sm flex gap-3 items-start">
            <i class="fa-solid fa-triangle-exclamation text-red-500 mt-1"></i>
            <div>
                <strong>문서 편집 주의사항:</strong> 저작권을 침해하는 내용은 삭제될 수 있습니다. 효빈위키 서술 원칙(나무위키식 서술, 취소선, 드립 허용)을 준수해주시되, 특정 인물에 대한 과도한 비방은 차단 사유가 됩니다. 특히 <b>노선 색상(#Hex) 반달리즘</b>은 영구 차단 대상입니다.
            </div>
        </div>

        <!-- 에디터 툴바 -->
        <div class="editor-toolbar flex flex-wrap gap-2 mb-2 bg-gray-100 p-2 border border-gray-300 rounded-t-lg shadow-sm">
            <button class="px-3 py-1 bg-white border border-gray-300 rounded font-black" title="굵게" onclick="insertTag('\'\'\'', '\'\'\'')">B</button>
            <button class="px-3 py-1 bg-white border border-gray-300 rounded italic font-serif" title="기울임" onclick="insertTag('\'\'', '\'\'')">I</button>
            <button class="px-3 py-1 bg-white border border-gray-300 rounded line-through" title="취소선" onclick="insertTag('--', '--')">S</button>
            <button class="px-3 py-1 bg-white border border-gray-300 rounded text-blue-600 font-bold" title="내부 링크" onclick="insertTag('[[', ']]')"><i class="fa-solid fa-link"></i> 링크</button>
            <button class="px-3 py-1 bg-white border border-gray-300 rounded text-gray-600" title="각주" onclick="insertTag('[* ', ']')"><i class="fa-solid fa-asterisk"></i> 각주</button>
            <div class="w-px bg-gray-300 mx-1"></div>
            <button class="px-3 py-1 bg-white border border-gray-300 rounded text-gray-600" title="틀 삽입" onclick="insertTag('[include(틀:', ')]')"><i class="fa-regular fa-clone"></i> 틀</button>
            <button class="px-3 py-1 bg-white border border-gray-300 rounded text-gray-600" title="매크로" onclick="insertTag('[목차]', '')"><i class="fa-solid fa-list-ol"></i> 목차</button>
        </div>

        <!-- 텍스트 영역 -->
        <textarea id="wikiEditor" class="w-full h-[500px] border border-gray-300 border-t-0 p-5 font-mono text-sm focus:outline-none focus:border-[#7777AA] shadow-inner mb-6 rounded-b-lg" spellcheck="false" placeholder="내용을 입력하세요..."></textarea>

        <!-- 편집 요약 및 저장 -->
        <div class="bg-gray-50 p-5 border border-gray-200 rounded-lg shadow-sm">
            <label class="block font-bold mb-2 text-gray-700"><i class="fa-regular fa-comment-dots"></i> 편집 요약</label>
            <input type="text" id="editSummary" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-[#7777AA] mb-4" placeholder="수정 사유를 입력하세요 (예: 노선 정보 업데이트, 오타 수정)" />
            
            <div class="flex justify-between items-center">
                <div class="text-xs text-gray-500">
                    <input type="checkbox" id="minorEdit" class="mr-1"><label for="minorEdit">사소한 편집</label>
                </div>
                <div class="flex gap-2">
                    <button onclick="history.back()" class="px-6 py-2 border border-gray-300 bg-white rounded text-gray-700 font-bold hover:bg-gray-100 shadow-sm transition">취소</button>
                    <button onclick="saveEdit()" class="px-8 py-2 bg-[#7777AA] text-white rounded font-bold hover:bg-[#555588] shadow transition"><i class="fa-solid fa-check"></i> 문서 저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 외부 스크립트 연결 -->
    <script src="assets/wiki_index.js"></script>
    <script src="assets/hb_data_map.js"></script>
    <script src="secret_search.js"></script>
    <script src="assets/hb_wiki_core.js?v=2"></script>
    <script src="assets/hb_index_scripts.js"></script>
    <script src="assets/jana.js"></script>
    
    <!-- 동적 렌더링 스크립트 -->
    <script>
        // 1. 마법의 앵커(문서명) 추적 시스템
        const urlParams = new URLSearchParams(window.location.search);
        let docName = urlParams.get("doc"); 
        
        if (!docName && window.location.hash) {
            docName = window.location.hash.substring(1); 
        }
        
        if (!docName && document.referrer) {
            try {
                let refUrl = new URL(document.referrer);
                let pathName = refUrl.pathname.split('/').pop(); 
                if (pathName && pathName.endsWith('.html') && !pathName.includes('역사') && !pathName.includes('토론') && !pathName.includes('편집')) {
                    docName = pathName.replace('.html', ''); 
                }
            } catch (e) {}
        }
        
        if (docName) {
            docName = decodeURIComponent(docName).replace(/_/g, ' ');
        } else {
            docName = "효빈광역시"; 
        }
        
        // 동적 타이틀 설정
        document.title = `${docName} (편집) - 효빈위키`;
        document.getElementById("docTitleMain").innerText = docName;
        
        // 네비게이션 역사 버튼 동적 링크
        document.getElementById("navHistoryBtn").href = `역사.html?doc=${encodeURIComponent(docName)}`;

        // 2. 문서명에 따른 스마트 텍스트 프리로드 (더미 위키문법)
        const editor = document.getElementById("wikiEditor");
        let preloadedText = "";

        if (docName.includes("버스")) {
            preloadedText = `[include(틀:상위 문서, 문서명1=효빈광역시 시내버스)]\n[목차]\n\n== 개요 ==\n효빈광역시에서 운행하는 [[${docName}]] 노선.\n\n== 역사 ==\n* 과거 [[두청운수]] 시절에는 75인승 과적과 플라스틱 시트라는 흑역사가 존재했다.\n* 스타더스트 작전 이후 현재의 도색과 시스템을 갖추게 되었다.\n\n== 특징 ==\n--취소선 드립은 여기에 작성--\n\n== 연계 철도역 ==\n* [[효빈도시철도 1호선]]: \n* [[효빈도시철도 2호선]]: \n\n[각주]`;
        } else if (docName === "하루빈") {
            preloadedText = `[include(틀:마스코트, 이름=하루빈, 노선=2호선)]\n[목차]\n\n== 개요 ==\n[[효빈도시철도 2호선]]의 공식 마스코트. 외형은 뱅드림의 [[아오바 모카]]에서 모티브를 따왔다.\n\n== 특징 ==\n검은색 승무원 제복을 입고 있으며, 항상 주머니 속에 빵을 숨기고 다닌다는 설정이 있다.[* 2호선 노선 특성상 빵집 밀집 구역을 지나기 때문이라는 썰이 유력하다.]\n\n== 갤러리 ==\n[[파일:이미지/하루빈.webp|width=300]]`;
        } else if (docName === "박효빈") {
            preloadedText = `[include(틀:주의, 내용=이 문서는 효빈광역시의 창조주이자 시장인 인물에 대해 다루고 있습니다. 서술 시 주의 바랍니다.)]\n[목차]\n\n== 개요 ==\n효빈광역시의 시장. 1996년생 남자이다.\n\n== 생애 ==\n전북대학교 사회복지학과 및 경영학과를 복수전공 하였으며...\n\n== 논란 및 사건사고 ==\n* 전주역 앞 첫마중길 불법 현수막 사태`;
        } else {
            preloadedText = `[include(틀:분류, 분류명1=${docName.split(' ')[0]})]\n[목차]\n\n== 개요 ==\n[[${docName}]]에 대한 문서입니다.\n\n== 상세 ==\n여기에 내용을 입력하세요.\n\n== 여담 ==\n* \n\n[각주]`;
        }
        
        editor.value = preloadedText;

        // 3. 툴바 기능 함수
        function insertTag(openTag, closeTag) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;
            const selectedText = text.substring(start, end);
            
            const replacement = openTag + selectedText + closeTag;
            editor.value = text.substring(0, start) + replacement + text.substring(end, text.length);
            
            // 커서 위치 조정
            editor.focus();
            if (selectedText.length === 0) {
                editor.selectionStart = editor.selectionEnd = start + openTag.length;
            } else {
                editor.selectionStart = editor.selectionEnd = start + replacement.length;
            }
        }

        // 4. 저장 시뮬레이션
        function saveEdit() {
            const summary = document.getElementById("editSummary").value;
            if(!summary) {
                if(!confirm("편집 요약이 비어있습니다. 이대로 저장하시겠습니까?")) return;
            }
            
            const btn = document.querySelector("button[onclick='saveEdit()']");
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 저장 중...';
            btn.disabled = true;
            
            setTimeout(() => {
                alert(`'${docName}' 문서가 성공적으로 편집되었습니다.\n(편집 요약: ${summary || "없음"})`);
                location.href = `역사.html?doc=${encodeURIComponent(docName)}`;
            }, 800);
        }
    </script>
    <script src="assets/load-footer.js"></script>
</body>
</html>
