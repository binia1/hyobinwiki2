                feature: `
                    <p>북구 최초의 고등학교답게 교내 박물관이 있을 정도로 역사가 깊다. 건물 곳곳에서 100년이 넘는 세월의 흔적(?)을 느낄 수 있으며, 특히 구관 복도는 <strong>밤에 혼자 걸으면 등골이 오싹하다</strong>는 전설이 내려온다. <s>귀신 나온다는 소문 때문에 야자 째는 핑계로 아주 유용하게 쓰인다.</s></p>
                    <p>2018년 사능동에서 고송동으로 이전하면서 최신식 신축 건물로 이사했지만, 구관의 붉은 벽돌 일부를 굳이(?) 떼어와 정문에 장식해 두었다. 학생들은 그걸 보고 <strong>"통곡의 벽"</strong>이라고 부르며 시험 기간에 머리를 찧는 시늉을 하거나 부적처럼 쓰다듬고 간다.</p>
                `,
                life: `
                    <p><strong>동아리:</strong> '역사연구반'이 학교의 근본 동아리로 꼽히는데, 명분은 효빈시 전체 역사 탐방이지만 실상은 <strong>효빈시 맛집 탐방 동아리</strong>라는 소문이 파다하다. <s>답사 보고서보다 학교 앞 분식집 리스트업이 더 두껍고 체계적이다.</s> 체육대회 때는 무려 '탈춤'이나 '널뛰기' 같은 전통 종목이 이벤트성으로 등장해 100년 전통의 짬바를 과시한다.</p>
                    <p><strong>매점:</strong> '인서 매점'의 특제 소세지 빵이 명물이다. 3교시 쉬는 시간 종이 울리기 무섭게 좀비 떼처럼 매점으로 전력 질주하는 학생들의 모습은 인서고의 3대 절경 중 하나다.</p>
                `,
                trivia: `
                    <ul class="list-disc pl-5">
                        <li>교복 디자인이 100년 전 개화기 모던보이/모던걸 스타일을 현대적으로 재해석한 것이라 호불호가 극명하게 갈린다. <s>"미스터 션샤인 같아서 멋지다"는 낭만파와 "이게 교복이냐 한복이냐"며 절망하는 실용파의 대립이 끊이지 않는다.</s></li>
                        <li>같은 유서 깊은 학교인 <a href="javascript:void(0);" onclick="changeSchool('hbjeil')" class="wiki-link">효빈제일고</a>와 영혼의 라이벌 관계다. 두 학교가 맞붙는 축구 시합은 일명 <strong>'효빈 더비'</strong>라 불리며, 응원전이 살벌하기 그지없다. 지면 그날 야자 분위기는 초상집이다.</li>
                        <li>교장 선생님 훈화 말씀의 80%는 "우리 자랑스러운 인서의 선배님들은..."으로 시작된다. <s>단군 할아버지랑 동기라는 썰도 있다.</s></li>
                    </ul>
                `,
                subway: "3호선, 6호선 고송나루역", bus: "간선29, 간선92, 지선121, 지선211, 지선291, 지선921, 급행09, 급행09-1", bgType: "coed"
            },
            "sochang": {
                name: "소창고등학교", engName: "Sochang High School", founded: "1935년",
                type: "일반계 (공립)", gender: "남녀공학", op: "공립", principal: "이태준",
                motto: "창조, 협동", address: "효빈광역시 북구 오내1동", color: "#2E7D32",
                note: "사능중고 분리 후 2000년대 이전에 현재 위치인 오내1동으로 이전했다.",
                feature: `
                    <p>원래 사능동3가에 있다가 2000년대 이전에 오내1동으로 이사 왔다. 학교 부지가 꽤 넓어서 웬만한 프로 축구장 규격이 제대로 나온다. 덕분에 <strong>축구부의 자부심이 하늘을 찌르며</strong>, 학교 전체가 축구에 미쳐있다고 해도 과언이 아니다.</p>
                    <p>학교 건물이 'ㅁ'자 형태로 되어 있어 중앙 정원(일명 콜로세움)에서의 소리가 엄청나게 울린다. 점심시간에 누군가 고백이라도 하면 전교생이 복도 창문을 열고 구경하는 팝콘각이 열린다. <s>고백 실패하면 3년 내내 놀림감이다. 묵념.</s></p>
                `,

                    <p>급식실 아주머니들의 손맛이 효빈시 1티어로 꼽히며, 학생들 사이에서는 <strong>미슐랭 3스타</strong> 급으로 추앙받는다. 특히 수요일 특식인 '소창 비빔밥'과 '수제 돈가스'는 졸업생들도 이거 먹고 싶어서 몰래 담 넘다 걸릴 정도로 전설적인 맛을 자랑한다.</p>

                        <li>축구장 모래가 너무 고와서 바람 부는 날엔 학교 전체가 사하라 사막으로 변한다. 창문 안 닫고 체육 다녀오면 책상 위에 모래성이 쌓여 있다.</li>

                { name: "고송여고", key: "gosong_girls", type: "girl", prefix: "" },
                { name: "남전고", key: "namjeon", type: "coed", prefix: "" },
                { name: "산남고", key: "sannam", type: "coed", prefix: "" },
                { name: "서신고", key: "seosin", type: "coed", prefix: "⊙" },
                { name: "소창고", key: "sochang", type: "coed", prefix: "" },
                { name: "오내고", key: "onae", type: "coed", prefix: "" },
                { name: "이남고", key: "inam", type: "boy", prefix: "" }, 
                { name: "인서고", key: "inseo", type: "coed", prefix: "" },
                { name: "중수고", key: "jungsu", type: "boy", prefix: "" }, 
                { name: "중수여고", key: "jungsu_girls", type: "girl", prefix: "" },
                { name: "진희고", key: "jinhee", type: "coed", prefix: "" },

                { name: "효빈북부공고", key: "hbtech", type: "coed", prefix: "◈" },
                { name: "효빈북여고", key: "hbgirls", type: "girl", prefix: "" },
                { name: "효빈예고", key: "hbarts", type: "coed", prefix: "▣" },
                { name: "효빈종합고", key: "hbcomp", type: "coed", prefix: "▣" },
                { name: "사능고", key: "saneung", type: "coed", prefix: "" },
                { name: "천왕사고", key: "cheonwangsa", type: "coed", prefix: "" },

                { name: "효빈제일고", key: "hbjeil", type: "coed", prefix: "" }
            ];
            
            navSchools.sort((a, b) => a.name.localeCompare(b.name));

            let html = `
                <div class="nav-box rounded overflow-hidden shadow-sm" style="border: 2px solid var(--wiki-main);">
                    <div class="nav-box-header cursor-default" style="background-color: #373a3c;">
                        <span>효빈광역시 북구의 고등학교</span>
                    </div>
                    <div class="bg-white p-2 text-center text-xs border-b border-[#ccc]">

                        <span class="bg-girl px-1 border border-gray-200">여자고등학교</span>, 
                        이외 남녀공학
                    </div>
                    <div class="bg-white p-1 text-center text-xs border-b border-[#ccc] font-bold text-[#FF9922]">※: 자사고, ⊙: 자공고, ▣: 특목고, ◈: 특성화고, 이외 일반계고</div>
                    <table class="school-table"><tbody>`;

            let columns = 5;
            let rowCount = Math.ceil(navSchools.length / columns);

            // 링크 맵핑 (개별 문서가 있는 학교들)
            const externalLinks = {
                "gosong": "고송고등학교.html",
                "gosong_girls": "고송여자고등학교.html",
                "seosin": "서신고등학교.html",
                "jungsu": "중수고등학교.html",

                "hbcomp": "효빈종합고등학교.html",
                "hbarts": "효빈예술고등학교.html",
                "tomo": "토모고등학교.html"
            };

            for (let i = 0; i < rowCount; i++) {
                html += "<tr>";
                for (let j = 0; j < columns; j++) {
                    let index = i * columns + j;
                    if (index < navSchools.length) {
                        const s = navSchools[index];
                        let cellClass = "";
                        if (s.type === "boy") cellClass = 'class="bg-boy"';
                        else if (s.type === "girl") cellClass = 'class="bg-girl"';
                        
                        let linkHTML = "";
                        if (externalLinks[s.key]) {
                            // 개별 문서로 이동
                            linkHTML = `<a href="${externalLinks[s.key]}" class="wiki-link">${s.name}</a>`;
                        } else {
                            // 템플릿 내부 변경
                            linkHTML = `<a href="javascript:void(0);" onclick="changeSchool('${s.key}')" class="wiki-link">${s.name}</a>`;
                        }

                        html += `<td ${cellClass}>${s.prefix}${linkHTML}</td>`;
                    } else {
                        html += "<td></td>";
                    }
                }
                html += "</tr>";
            }
            html += `</tbody></table></div>`;
            targetElement.innerHTML = html;

            // URL 파라미터 체크하여 해당 학교 열기, 없으면 인서고 오픈
            const urlParams = new URLSearchParams(window.location.search);
            const schoolParam = urlParams.get('school');
            if (schoolParam && schoolsDB[schoolParam]) {
                renderSchool(schoolParam);
            } else {
                renderSchool("inseo");
            }
        });

        function toggleTheme() {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeBtn').innerText = isDark ? '다크모드' : '라이트모드';
        }

        function showMsg(text) {
            const box = document.getElementById('wiki-msg-box');
            box.innerText = text; box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 2000);
        }
