<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- 1. 스패너 외곽선을 따라 삼각 표지판을 깔끔하게 파내는 투명 갭 마스크 -->
    <mask id="triangleGap">
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <!-- 스패너 레이어의 회전 궤적과 동일하게 정렬하여 6px의 여백 외곽선을 뚫어냄 -->
      <g transform="translate(50,50) rotate(-35) translate(-50,-50)">
        <rect x="34" y="6" width="32" height="26" rx="5" fill="black" stroke="black" stroke-width="6" />
        <rect x="40" y="24" width="20" height="12" fill="black" stroke="black" stroke-width="6" />
        <rect x="42" y="32" width="16" height="52" rx="4" fill="black" stroke="black" stroke-width="6" />
        <circle cx="50" cy="82" r="9" fill="black" stroke="black" stroke-width="6" />
      </g>
    </mask>
    
    <!-- 2. 몽키스패너 고유의 기계적 홈 및 핸들 내 '호기심 경고문양' 음각 마스크 -->
    <mask id="wrenchDetails">
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <!-- 스패너 헤드 상단 턱(Jaw) 개방구 -->
      <rect x="34" y="5" width="14" height="16" fill="black" />
      <!-- 간격 조절용 널링 나사 홈 -->
      <rect x="38" y="27" width="24" height="5" fill="black" />
      <!-- 손잡이 끝단 걸이용 원형 구멍 -->
      <circle cx="50" cy="82" r="3" fill="black" />
      <!-- 호기심 시한폭탄 설정을 투영한 핸들 내부 느낌표(!) 음각화 -->
      <path d="M 50 42 L 50 60" stroke="black" stroke-width="3" stroke-linecap="round" />
      <circle cx="50" cy="68" r="2.2" fill="black" />
    </mask>
  </defs>

  <!-- [레이어 1] 우측 상단: 언제 터질지 모르는 시한폭탄의 도화선 불꽃 이펙트 -->
  <g stroke="#9856FF" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 72 26 Q 84 18 86 32" />
    <line x1="86" y1="32" x2="93" y2="28" />
    <line x1="86" y1="32" x2="90" y2="39" />
    <line x1="86" y1="32" x2="80" y2="35" />
  </g>

  <!-- [레이어 2] 배경: 위험/주의 삼각 표지판 (스패너 겹침부 갭 마스크 적용) -->
  <polygon points="50,14 88,80 12,80" fill="none" stroke="#9856FF" stroke-width="7" stroke-linejoin="round" mask="url(#triangleGap)" />

  <!-- [레이어 3] 전면: 유리아의 시그니처 오브젝트인 역동적인 각도의 몽키스패너 -->
  <g transform="translate(50,50) rotate(-35) translate(-50,-50)" mask="url(#wrenchDetails)">
    <!-- 스패너 고정 턱 및 헤드 뭉치 -->
    <rect x="36" y="10" width="28" height="22" rx="4" fill="#9856FF" />
    <!-- 나사 구동부 프레임 -->
    <rect x="41" y="25" width="18" height="10" fill="#9856FF" />
    <!-- 스패너 메인 핸들 단면 -->
    <rect x="44" y="34" width="12" height="46" rx="3" fill="#9856FF" />
    <!-- 하단 원형 그립 마감 -->
    <circle cx="50" cy="82" r="7" fill="#9856FF" />
  </g>
</svg>
