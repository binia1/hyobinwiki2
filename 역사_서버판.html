<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>편집 역사 - 효빈위키</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css"> 
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f4f4f9; color: #333; }
        
        .wiki-container { max-width: 1200px; margin: 30px auto; background: white; padding: 40px; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .history-table { border-collapse: collapse; width: 100%; border: 1px solid #e2e8f0; font-size: 14px; }
        .history-table th { background: #7777AA; color: white; padding: 12px; border: 1px solid #e2e8f0; }
        .history-table td { padding: 12px; border: 1px solid #e2e8f0; }
        .history-table tr:nth-child(even) { background-color: #f8fafc; }
        .history-table tr:hover { background-color: #f1f5f9; }
        
        #versionViewArea { display: none; }
        .version-info-bar { background: #fee2e2; border: 2px solid #ef4444; color: #b91c1c; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="bg-[#7777AA] text-white p-3 shadow-md sticky top-0 z-50">
        <div class="max-w-[1400px] mx-auto flex items-center justify-between">
            <a href="index.html" class="font-bold text-xl flex items-center gap-2 hover:opacity-90 transition">
                <i class="fa-solid fa-book-open"></i> HyobinWiki <span class="text-xs font-bold bg-white/20 px-2 py-1 rounded-full tracking-wider">HISTORY</span>
            </a>
        </div>
    </nav>

    <div class="wiki-container">
        <div id="listViewArea">
            <div class="border-b-2 border-[#7777AA] pb-3 mb-6 flex justify-between items-center">
                <h1 class="text-3xl font-black text-gray-800"><span id="docTitleMain">...</span> - 편집 역사</h1>
                <a href="#" id="backToDocBtn" class="text-sm font-bold text-[#7777AA] hover:underline">문서로 돌아가기</a>
            </div>

            <table class="history-table shadow-sm">
                <thead>
                    <tr>
                        <th width="5%">번호</th>
                        <th width="25%">날짜/시간</th>
                        <th width="40%">수정 요약</th>
                        <th width="15%">작성자 (IP)</th>
                        <th width="15%">도구</th>
                    </tr>
                </thead>
                <tbody id="historyBody" class="font-medium text-center text-gray-700">
                    <tr><td colspan="5" class="py-10 text-gray-400"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><br>역사를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="versionViewArea">
            <div class="version-info-bar flex justify-between items-center">
                <div>
                    <i class="fa-solid fa-clock-rotate-left"></i> 당신은 현재 <span id="verTimeSpan" class="font-black underline">...</span> 에 저장된 <b>과거 버전</b>을 보고 있습니다.
                </div>
                <button onclick="closeVersionView()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-1.5 rounded text-sm font-bold">
                    목록으로 돌아가기
                </button>
            </div>
            <div id="htmlRenderArea" class="wiki-body-content pt-5"></div>
        </div>
    </div>

    <script src="wiki_char.js"></script>
    <script src="assets/틀_효빈광역시전철노선.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXlxuSvvSOEEMegjfoY_UzZQs4m0NeIJo",
            authDomain: "hyobinwiki.firebaseapp.com",
            projectId: "hyobinwiki"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(location.search);
        const docName = params.get("doc");

        if (!docName) {
            alert("잘못된 접근입니다.");
            location.href = 'index.html';
        }

        document.getElementById("docTitleMain").innerText = docName;
        document.getElementById("backToDocBtn").href = `${docName.replace(/ /g, "_")}.html`;

        async function loadHistory() {
            const tableBody = document.getElementById("historyBody");
            try {
                // 🚨 오타 수정 완료: timestamp -> updatedAt 🚨
                const q = query(
                    collection(db, "wiki_docs", docName, "revisions"),
                    orderBy("updatedAt", "desc"),
                    limit(50)
                );
                const querySnapshot = await getDocs(q);
                
                if(querySnapshot.empty) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-10 text-gray-400">보관된 편집 역사가 없습니다.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = ""; 
                let revCount = querySnapshot.size;

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    
                    // 🚨 오타 수정 완료: data.timestamp -> data.updatedAt 🚨
                    const dateObj = data.updatedAt ? data.updatedAt.toDate() : new Date();
                    
                    const dateStr = dateObj.getFullYear() + '-' + 
                                    String(dateObj.getMonth() + 1).padStart(2, '0') + '-' + 
                                    String(dateObj.getDate()).padStart(2, '0') + ' ' + 
                                    String(dateObj.getHours()).padStart(2, '0') + ':' + 
                                    String(dateObj.getMinutes()).padStart(2, '0') + ':' + 
                                    String(dateObj.getSeconds()).padStart(2, '0');

                    const row = `
                        <tr>
                            <td>r${revCount--}</td>
                            <td class="font-mono text-gray-500">${dateStr}</td>
                            <td class="text-left font-bold text-gray-900">${data.rev_note || '내용 수정'}</td>
                            <td>127.0.0.1</td>
                            <td>
                                <button onclick="viewPastVersion('${docSnap.id}', '${dateStr}')" class="bg-[#f0f9ff] hover:bg-blue-100 text-[#3182ce] px-3 py-1 rounded text-xs font-bold border border-blue-200">
                                    <i class="fa-solid fa-eye"></i> 보기
                                </button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });

            } catch(e) {
                console.error(e);
                tableBody.innerHTML = `<tr><td colspan="5" class="py-10 text-red-500">역사 로딩 실패: ${e.message}</td></tr>`;
            }
        }

        window.viewPastVersion = async function(revId, dateStr) {
            const renderArea = document.getElementById("htmlRenderArea");
            renderArea.innerHTML = `<div class="text-center py-20 text-gray-400"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div>`;
            
            document.getElementById("listViewArea").style.display = 'none';
            document.getElementById("versionViewArea").style.display = 'block';
            document.getElementById("verTimeSpan").innerText = dateStr;

            try {
                const docSnap = await getDoc(doc(db, "wiki_docs", docName, "revisions", revId));
                if(docSnap.exists()) {
                    const data = docSnap.data();
                    
                    renderArea.innerHTML = data.raw_html;

                    const scripts = renderArea.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                }
            } catch(e) {
                console.error(e);
                renderArea.innerHTML = `<p class="text-red-500 py-20 text-center">버전을 불러오지 못했습니다.</p>`;
            }
        }

        window.closeVersionView = function() {
            document.getElementById("listViewArea").style.display = 'block';
            document.getElementById("versionViewArea").style.display = 'none';
            document.getElementById("htmlRenderArea").innerHTML = "";
        }

        loadHistory();
    </script>
        <script src="assets/wiki_index.js"></script>
    <script src="assets/hb_wiki_core.js"></script>
    <script src="assets/hb_index_scripts.js"></script>
    <script src="assets/jana.js"></script>
</body>
</html>
