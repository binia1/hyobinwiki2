        let isSearchOpen = false;

        function toggleSearchPanel(event) {
            if(event) event.preventDefault();
            const panel = document.getElementById('search-panel');
            if(!isSearchOpen) {
                const isDesktop = window.innerWidth >= 1280;
                panel.style.left = isDesktop ? '244px' : '72px';
                isSearchOpen = true;
                setTimeout(() => document.getElementById('main-search-input').focus(), 300);
            } else {
                panel.style.left = '-400px';
                isSearchOpen = false;
            }
        }

        // mockDatabase에서 13명 전체의 검색용 데이터를 동적으로 생성
        const mockSearchData = Object.values(mockDatabase).map(u => ({
            type: 'user',
            name: u.username,
            desc: u.fullname + (u.username === 'real_yoonjaehoon' ? ' • 효빈시' : ''),
            img: u.profilePic
        }));

        function performSearch(query) {
            const keyword = query.trim().toLowerCase();
            const resultList = document.getElementById('search-results-list');
            const clearBtn = document.getElementById('search-clear-btn');
            const recentHeader = document.getElementById('search-recent-header');
            const noResult = document.getElementById('no-search-results');

            if (keyword.length > 0) {
                clearBtn.classList.remove('hidden');
                recentHeader.classList.add('hidden');
                
                // 이름이나 설명에 검색어가 포함된 계정 필터링
                const filtered = mockSearchData.filter(item => item.name.toLowerCase().includes(keyword) || item.desc.toLowerCase().includes(keyword));
                
                resultList.innerHTML = '';
                if (filtered.length > 0) {
                    noResult.classList.add('hidden');
                    filtered.forEach(item => {
                        let imgElement = `<img src="${item.img}" class="w-11 h-11 rounded-full border border-gray-200 object-cover" onerror="this.src='https://via.placeholder.com/44'">`;
                        // 클릭 시 해당 프로필 화면으로 이동하도록 구현
                        resultList.insertAdjacentHTML('beforeend', `<li class="flex items-center justify-between px-6 py-2 hover:bg-gray-50 cursor-pointer transition" onclick="window.location.href='profile.html?user=${item.name}'"><div class="flex items-center gap-3">${imgElement}<div class="flex flex-col"><span class="font-bold text-[14px] text-[#262626]">${item.name}</span><span class="text-gray-500 text-[14px]">${item.desc}</span></div></div></li>`);
                    });
                } else { 
                    noResult.classList.remove('hidden'); 
                }
            } else { 
                clearSearch(); 
            }
        }

        function clearSearch() {
            document.getElementById('main-search-input').value = '';
            document.getElementById('search-clear-btn').classList.add('hidden');

            document.getElementById('search-results-list').innerHTML = `<li class="flex items-center justify-between px-6 py-2 hover:bg-gray-50 cursor-pointer group" onclick="window.location.href='profile.html?user=real_yoonjaehoon'"><div class="flex items-center gap-3"><img src="이미지/윤재훈.webp" class="w-11 h-11 rounded-full border border-gray-200 object-cover" onerror="this.src='https://via.placeholder.com/44'"><div class="flex flex-col"><span class="font-bold text-[14px] text-[#262626]">real_yoonjaehoon</span><span class="text-gray-500 text-[14px]">윤재훈 • 효빈시</span></div></div><i class="fas fa-times text-gray-400 text-sm opacity-0 group-hover:opacity-100 transition"></i></li>`;

        function renderProfile(user) {
            document.title = `${user.fullname} (@${user.username}) • Instagram 사진 및 동영상`;

            document.getElementById('user-profile-pic').src = user.profilePic;
            
            let verifiedHtml = user.verified ? `<i class="fas fa-check-circle text-blue-500 text-sm" title="인증됨"></i>` : '';
            document.getElementById('user-username').innerHTML = `${user.username} ${verifiedHtml}`;
            
            document.getElementById('user-fullname').innerText = user.fullname;
            
            const formattedBio = user.bio.replace(/#(\S+)/g, '<a href="#" class="text-[#00376b] hover:underline">#$1</a>');
            document.getElementById('user-bio').innerHTML = formattedBio;
            
            document.getElementById('user-post-count').innerText = typeof user.postsCount === 'number' ? user.postsCount.toLocaleString() : user.postsCount;

            document.getElementById('user-following').innerText = typeof user.following === 'number' ? user.following.toLocaleString() : user.following;

            isFollowing = false;
            updateFollowBtn();

                user.highlights.forEach(hl => {

                    `;
                    hlContainer.insertAdjacentHTML('beforeend', hlHtml);

            const gridContainer = document.getElementById('user-posts-grid');
            gridContainer.innerHTML = '';
            
            if (user.posts.length === 0) {
                gridContainer.innerHTML = `<div class="col-span-3 text-center py-20 text-gray-500 font-bold text-lg"><div class="w-16 h-16 rounded-full border-2 border-black flex items-center justify-center mx-auto mb-4"><i class="fas fa-camera text-3xl text-black"></i></div>게시물이 없습니다.</div>`;
            } else {
                user.posts.forEach((post) => {
                    const safeCaption = post.caption.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                        <div class="aspect-square relative group cursor-pointer overflow-hidden bg-gray-200" onclick="openDynamicModal('${post.img}', '${safeCaption}', ${post.likes}, ${post.comments})">

                                <span class="text-white font-bold text-lg"><i class="fas fa-heart"></i> ${post.likes >= 10000 ? (post.likes/10000).toFixed(1)+'만' : post.likes.toLocaleString()}</span>
                                <span class="text-white font-bold text-lg"><i class="fas fa-comment"></i> ${post.comments >= 10000 ? (post.comments/10000).toFixed(1)+'만' : post.comments.toLocaleString()}</span>
                            </div>
                        </div>
                    `;
                    gridContainer.insertAdjacentHTML('beforeend', postHtml);

            // 탭 스타일 리셋
            document.querySelectorAll('.tab-link').forEach(el => {
                el.classList.remove('border-t', 'border-[#262626]', 'text-[#262626]', '-mt-[1px]');
                el.classList.add('text-gray-500');
            });

            // 선택된 탭 스타일 적용
            const targetBtn = document.getElementById('tab-btn-' + tabId);
            targetBtn.classList.remove('text-gray-500');
            targetBtn.classList.add('border-t', 'border-[#262626]', 'text-[#262626]', '-mt-[1px]');

            // 선택된 컨텐츠 보이기
            if (tabId === 'posts') {
                postsContent.classList.remove('hidden');
                postsContent.classList.add('grid');
            } else if (tabId === 'reels') {
                reelsContent.classList.remove('hidden');
                reelsContent.classList.add('flex');
            } else if (tabId === 'tagged') {
                taggedContent.classList.remove('hidden');
                taggedContent.classList.add('flex');
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.body.style.overflow = 'auto'; }
        function closeModalOnBg(event, id) { if(event.target.id === id) closeModal(id); }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast-message');
            document.getElementById('toast-text').innerText = message;
            toast.classList.remove('opacity-0', 'translate-y-5');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.add('opacity-0', 'translate-y-5'), 2500);
        }

        function toggleIgLike(iconId, countId) {
            const icon = document.getElementById(iconId);
            const countElement = document.getElementById(countId);
            let currentCount = parseInt(countElement.getAttribute('data-count'));
            if (icon.classList.contains('far')) {
                icon.classList.replace('far', 'fas'); icon.classList.add('text-red-500');
                icon.style.transform = 'scale(1.2)'; setTimeout(() => icon.style.transform = 'scale(1)', 150);
                currentCount += 1;
            } else {
                icon.classList.replace('fas', 'far'); icon.classList.remove('text-red-500');
                currentCount -= 1;
            }
            countElement.setAttribute('data-count', currentCount);
            countElement.innerText = currentCount >= 10000 ? (currentCount / 10000).toFixed(1) + '만' : currentCount.toLocaleString('ko-KR');
        }

        function addIgComment(event, inputElement, targetAreaId) { if (event.key === 'Enter' && inputElement.value.trim() !== '') { renderIgComment(inputElement.value, targetAreaId); inputElement.value = ''; } }
        function addIgCommentBtn(inputElement, targetAreaId) { if (inputElement.value.trim() !== '') { renderIgComment(inputElement.value, targetAreaId); inputElement.value = ''; } }

        function applyLoggedUserSidebar() {
            const storedUser = localStorage.getItem('ig_user_account');
            if (storedUser) {
                const userData = JSON.parse(storedUser);
                window.myInstagramUser = userData;
                if(userData.profilePic) {
                    const sidebarPic = document.getElementById('sidebar-profile-pic');
                    if(sidebarPic) sidebarPic.src = userData.profilePic;
                }
            }
        }

        window.renderIgComment = function(text, targetAreaId) {
            const targetArea = document.getElementById(targetAreaId);
            const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const me = window.myInstagramUser || { username: 'guest', profilePic: '이미지/효빈시_로고.webp' };
            const myPic = me.profilePic ? me.profilePic : '이미지/효빈시_로고.webp';
            const commentHTML = `
                <div class="flex gap-3 items-start mt-3 animate-fade-in">
                    <img src="${myPic}" class="w-8 h-8 rounded-full mt-1 border border-gray-200 object-cover">
                    <div class="flex-1">
                        <span class="font-bold cursor-pointer hover:underline text-[14px]">${me.username}</span>
                        <span class="break-all text-[14px]"> ${safeText}</span>
                        <div class="flex gap-3 text-[11px] text-gray-500 font-bold mt-1">
                            <span>방금 전</span><span class="cursor-pointer" onclick="document.getElementById('${targetAreaId.replace('area', 'input')}').focus()">답글 달기</span>
                        </div>
                    </div>
                    <button class="text-xs pt-2 pr-2 text-gray-400 hover:text-gray-600" onclick="this.querySelector('i').classList.toggle('fas'); this.querySelector('i').classList.toggle('text-red-500'); this.querySelector('i').classList.toggle('far');"><i class="far fa-heart"></i></button>
                </div>
            `;
            targetArea.insertAdjacentHTML('beforeend', commentHTML);
            const scrollContainer = targetArea.parentElement;
            scrollContainer.scrollTop = scrollContainer.scrollHeight;
        };
    </script>
