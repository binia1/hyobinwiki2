        :root { 
            /* 덕빈북도 퍼스널 컬러 적용 (본문 테마) */
            --wiki-main: #4AD898;

            --wiki-nav-bg: #7777AA;

            --wiki-text: #000000;
            --wiki-gray-bg: #F9F9FA; 
            --wiki-link: #0022AA; /* 링크는 가독성을 위해 파란색 계열 유지 */
        }

        body { font-family: 'Noto Sans KR', sans-serif; background-color: var(--wiki-bg); color: var(--wiki-text); line-height: 1.6; word-break: keep-all; margin: 0; }
        .wiki-container { max-width: 1300px; margin: 0 auto; padding: 20px 40px; border-left: 1px solid var(--wiki-border); border-right: 1px solid var(--wiki-border); min-height: 100vh; background-color: var(--wiki-bg); }

        /* 타이틀 스타일 */
        .txt-lvl-1 { font-size: var(--font-h1) !important; font-weight: 900 !important; color: #000000; line-height: 1.1; letter-spacing: -1.5px; margin-bottom: 0; } 
        .title-area { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #ccc; margin-bottom: 20px; padding-bottom: 10px; }

        /* 문단 제목 스타일 */
        h2 { font-size: 3.0rem !important; font-weight: 800; border-bottom: 1px solid var(--wiki-border); padding-bottom: 10px; margin-top: 3.5rem; display: flex; align-items: center; gap: 12px; color: #000000; clear: both; }
        h2::before { content: ""; display: inline-block; width: 10px; height: 3.0rem; background: var(--wiki-main); }
        
        /* 위키 버튼 */
        .wiki-btn { 
            border: 1px solid #ccc; background: white; padding: 4px 12px; border-radius: 4px; font-size: var(--font-small); font-weight: bold; color: #000; 
            cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 4px; text-decoration: none !important; 
        }
        .wiki-btn:hover { background: #f0f0f0; color: #000; border-color: #999; }

        /* 링크 스타일 */
        .wiki-link { color: var(--wiki-link); cursor: pointer; text-decoration: none; }
        .wiki-link:hover { text-decoration: underline; }
        .category-box { background: #f9f9f9; border: 1px solid var(--wiki-border); padding: 8px 12px; font-size: 0.8rem; margin: 15px 0; border-radius: 4px; }
        
        /* 지역별 테이블 스타일 (새로운 디자인) */
        .regional-table { width: 100%; border-collapse: collapse; border: 1px solid var(--wiki-border); margin: 20px 0; table-layout: fixed; }
        .regional-table th, .regional-table td { border: 1px solid var(--wiki-border); }
        .regional-table th { padding: 10px 4px; font-weight: bold; text-align: center; font-size: 1rem; }
        .regional-table td { padding: 16px 8px; text-align: center; vertical-align: top; font-size: 0.9rem; line-height: 2.0; background-color: #ffffff; }
        
        #wiki-msg-box { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 24px; border-radius: 50px; font-size: 14px; z-index: 10000; display: none; }
        
        /* 푸터 */
        .wiki-footer { margin-top: 100px; border-top: 1px solid #ccc; padding: 20px; text-align: left; font-size: 0.8rem; color: #000; background-color: #f9f9f9; line-height: 1.5; }
/* 로고 박스 스타일 추가 */
        .nav-logo-box {
            width: 30px; height: 30px; background: white; color: var(--wiki-main);
            border-radius: 4px; font-weight: 900; display: flex; align-items: center;
            justify-content: center; font-size: 1.2rem;
        }

<script>
        function handleSearch() {
            const query = document.getElementById('searchInput').value;

        // 본문 내에서는 모두 <a> 태그로 교체되었습니다.

        function showMsg(text) {
            const box = document.getElementById('wiki-msg-box');
            box.innerText = text; 
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 2000);
