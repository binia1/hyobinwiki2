<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="이미지/효빈위키아이콘.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 전환 • Instagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Noto Sans KR";
            background-color: #fafafa;
            color: #262626;
            overflow: hidden; /* 모달이 떠 있으므로 스크롤 방지 */
        }

        .ig-gradient-border {
            position: relative;
            background: #fff;
            background-clip: padding-box;
            border: solid 2px transparent;
            border-radius: 50%;
        }
        .ig-gradient-border::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: -1;
            margin: -2px;
            border-radius: inherit;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-scale-in { animation: scaleIn 0.2s ease-out forwards; }
    </style>
<script src="ad_logic.js"></script>
</head>
<body class="flex min-h-screen">

    <!-- 토스트 알림 -->
    <div id="toast-message" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 translate-y-5 opacity-0 bg-[#262626] text-white text-sm px-6 py-3 rounded-lg shadow-xl z-[100] pointer-events-none transition-all duration-300 flex items-center gap-2">
        <i class="fas fa-info-circle"></i>
        <span id="toast-text">메시지</span>
    </div>

    <!-- 배경 사이드바 (흐리게 보임) -->
    <nav class="fixed top-0 left-0 h-full w-[72px] xl:w-[244px] bg-white border-r border-gray-300 flex flex-col pt-8 pb-5 px-3 z-30 transition-all duration-300 filter blur-[2px]">
        <div class="mb-8 px-3">
            <img src="이미지/인스타그램.svg" alt="Instagram" class="hidden xl:block h-7 w-auto object-contain">
            <i class="fab fa-instagram text-2xl xl:hidden block text-center"></i>
        </div>
        <div class="flex flex-col gap-2 flex-1">
            <div class="flex items-center gap-4 p-3 rounded-lg text-black">
                <i class="fas fa-home text-2xl"></i><span class="hidden xl:block text-[16px]">홈</span>
            </div>
            <div class="flex items-center gap-4 p-3 rounded-lg text-black">
                <i class="fas fa-search text-2xl"></i><span class="hidden xl:block text-[16px]">검색</span>
            </div>
            <div class="flex items-center gap-4 p-3 rounded-lg text-black">
                <i class="far fa-compass text-2xl"></i><span class="hidden xl:block text-[16px]">탐색 탭</span>
            </div>
            <div class="flex items-center gap-4 p-3 rounded-lg text-black">
                <i class="fas fa-film text-2xl"></i><span class="hidden xl:block text-[16px]">릴스</span>
            </div>
            <div class="flex items-center gap-4 p-3 rounded-lg text-black">
                <i class="far fa-paper-plane text-2xl"></i><span class="hidden xl:block text-[16px]">메시지</span>
            </div>
            <div class="flex items-center gap-4 p-3 rounded-lg text-black">
                <i class="far fa-heart text-2xl"></i><span class="hidden xl:block text-[16px]">알림</span>
            </div>
            <div class="flex items-center gap-4 p-3 rounded-lg text-black">
                <i class="far fa-plus-square text-2xl"></i><span class="hidden xl:block text-[16px]">만들기</span>
            </div>
            <div class="flex items-center gap-4 p-3 rounded-lg text-black font-bold">
                <img src="이미지/효빈시_로고.webp" class="w-6 h-6 rounded-full border border-gray-300" onerror="this.src='https://via.placeholder.com/24'">
                <span class="hidden xl:block text-[16px]">프로필</span>
            </div>
        </div>
        <div class="flex items-center gap-4 p-3 rounded-lg text-black mt-auto">
            <i class="fas fa-bars text-2xl"></i><span class="hidden xl:block text-[16px]">더 보기</span>
        </div>
    </nav>

    <!-- 배경 메인 컨텐츠 (흐리게 보임) -->
    <main class="flex-1 ml-[72px] xl:ml-[244px] bg-[#fafafa] min-h-screen flex justify-center pt-8 filter blur-[2px] z-20">
        <div class="w-full max-w-[935px] px-5">
            <header class="flex gap-8 mb-10 items-start px-10">
                <div class="w-[150px] h-[150px] rounded-full bg-gray-300"></div>
                <div class="flex flex-col w-full gap-4">
                    <div class="h-8 w-48 bg-gray-300 rounded"></div>
                    <div class="h-6 w-64 bg-gray-300 rounded"></div>
                    <div class="h-20 w-full bg-gray-200 rounded mt-2"></div>
                </div>
            </header>
        </div>
    </main>

    <!-- 계정 전환 모달 오버레이 (Z-index 50) -->
    <div id="switch-account-modal" class="fixed inset-0 bg-black bg-opacity-65 z-50 flex items-center justify-center p-4 animate-fade-in" onclick="goBack(event)">
        <!-- 모달 컨텐츠 -->
        <div class="bg-white w-full max-w-[400px] rounded-xl flex flex-col overflow-hidden animate-scale-in" onclick="event.stopPropagation()">
            
            <!-- 헤더 -->
            <div class="flex items-center justify-center p-4 border-b border-gray-200 relative">
                <h3 class="font-bold text-[16px]">계정 전환</h3>
                <i class="fas fa-times text-2xl cursor-pointer absolute right-4 text-[#262626]" onclick="window.history.back()"></i>
            </div>

            <!-- 계정 리스트 -->
            <div class="flex flex-col py-2 max-h-[60vh] overflow-y-auto">
                
                <!-- 현재 로그인된 계정 -->
                <div class="flex items-center justify-between px-4 py-3 hover:bg-gray-50 cursor-pointer transition" onclick="switchAccount('hyobin_city_official')">
                    <div class="flex items-center gap-3">
                        <img src="이미지/효빈시_로고.webp" class="w-12 h-12 rounded-full border border-gray-200 object-cover" onerror="this.src='https://via.placeholder.com/48'">
                        <span class="font-bold text-[14px]">hyobin_city_official</span>
                    </div>
                    <!-- 체크마크 아이콘 (현재 선택됨) -->
                    <div class="w-6 h-6 rounded-full bg-blue-500 flex items-center justify-center text-white text-xs">
                        <i class="fas fa-check"></i>
                    </div>
                </div>

                <!-- 전환 가능한 계정 1 -->
                <div class="flex items-center justify-between px-4 py-3 hover:bg-gray-50 cursor-pointer transition" onclick="switchAccount('real_yoonjaehoon')">
                    <div class="flex items-center gap-3">
                        <img src="이미지/윤재훈.webp" class="w-12 h-12 rounded-full border border-gray-200 object-cover" onerror="this.src='https://via.placeholder.com/48/FF0000/FFFFFF?text=YJH'">
                        <span class="font-bold text-[14px]">real_yoonjaehoon</span>
                    </div>
                </div>

                <!-- 전환 가능한 계정 2 -->
                <div class="flex items-center justify-between px-4 py-3 hover:bg-gray-50 cursor-pointer transition" onclick="switchAccount('justice_citizen')">
                    <div class="flex items-center gap-3">
                        <div class="ig-gradient-border p-[2px]">
                            <img src="이미지/아사카 카린.webp" class="w-11 h-11 rounded-full border-2 border-white object-cover" onerror="this.src='https://via.placeholder.com/48/00376b/FFFFFF?text=JC'">
                        </div>
                        <div class="flex flex-col">
                            <span class="font-bold text-[14px]">justice_citizen</span>
                            <span class="text-[12px] text-gray-500">읽지 않은 알림 3개</span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 하단 액션 (기존 계정으로 로그인) -->
            <div class="border-t border-gray-200">
                <a href="인스타그램 로그인.html" class="block w-full text-center py-4 text-[14px] text-blue-500 font-bold hover:bg-gray-50 transition">
                    기존 계정으로 로그인
                </a>
            </div>

        </div>
    </div>

    <script>
        let toastTimeout;

        function showToast(message, callback) {
            const toast = document.getElementById('toast-message');
            document.getElementById('toast-text').innerText = message;
            toast.classList.remove('opacity-0', 'translate-y-5');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-5');
                if (callback) callback();
            }, 1500); // 1.5초 후 콜백 실행
        }

        // 모달 바깥(배경) 클릭 시 뒤로가기
        function goBack(event) {
            if (event.target.id === 'switch-account-modal') {
                window.history.back(); // 이전 페이지(대부분 프로필이나 홈)로 돌아감
            }
        }

        // 계정 클릭 시 연출
        function switchAccount(username) {
            if (username === 'hyobin_city_official') {
                // 이미 현재 계정일 경우 바로 뒤로가기
                window.history.back();
            } else {
                // 다른 계정 선택 시 토스트 띄우고 (실제 페이지는 없으므로) 잠시 후 뒤로가기
                showToast(`${username} 계정으로 전환 중입니다...`, () => {
                    window.history.back();
                });
            }
        }
    </script>

<script>
    function applyUserData() {
        const storedUser = localStorage.getItem('ig_user_account');
        if (!storedUser) return; // 가입/로그인 정보가 없으면 패스

        const userData = JSON.parse(storedUser);

        // 1. 사이드바 프로필 사진 변경
        const sidebarProfileImgs = document.querySelectorAll('nav img[src*="이미지/효빈시_로고.webp"]');
        sidebarProfileImgs.forEach(img => {
            if (userData.profilePic) img.src = userData.profilePic;
        });

        // 2. 만들기(모달) 프로필 변경
        const createProfileImg = document.querySelector('#step-2 img[src*="이미지/효빈시_로고.webp"]');
        const createProfileName = document.querySelector('#step-2 span.font-bold');
        if (createProfileImg && userData.profilePic) createProfileImg.src = userData.profilePic;
        if (createProfileName) createProfileName.innerText = userData.username;

        // 3. 댓글 입력창 프로필 변경 (있는 경우)
        const commentImgs = document.querySelectorAll('input[placeholder="댓글 달기..."]');
        commentImgs.forEach(input => {
            // 입력창 바로 왼쪽에 있는 프로필 이미지 (또는 아이콘 찾기)
            const parent = input.parentElement;
            const img = parent.querySelector('img');
            if(img && userData.profilePic) img.src = userData.profilePic;
        });
        
        // 4. (추가) 글로벌 변수에 내 정보 저장해두기 (댓글 작성 등에 사용)
        window.myInstagramUser = userData;
    }

    // 화면 로딩 완료 시 실행
    document.addEventListener('DOMContentLoaded', applyUserData);

    // [댓글 작성 함수 덮어쓰기] - 내 이름과 사진으로 달리게 변경
    if (typeof renderIgComment !== 'undefined') {
        window.renderIgComment = function(text, targetAreaId) {
            const targetArea = document.getElementById(targetAreaId);
            const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            // 로그인 데이터 가져오기 (없으면 임시값)
            const me = window.myInstagramUser || { username: 'guest', profilePic: 'https://via.placeholder.com/32' };
            const myPic = me.profilePic ? me.profilePic : 'https://via.placeholder.com/32';
            
            const commentHTML = `
                <div class="flex gap-3 items-start mt-3 animate-fade-in">
                    <img src="${myPic}" class="w-8 h-8 rounded-full mt-1 cursor-pointer border border-gray-200 object-cover">
                    <div class="flex-1">
                        <span class="font-bold cursor-pointer hover:underline text-[14px]">${me.username}</span>
                        <span class="text-[14px] break-all">${safeText}</span>
                        <div class="flex gap-3 text-[11px] text-gray-500 font-bold mt-1">
                            <span>방금 전</span>
                            <span class="cursor-pointer" onclick="document.getElementById('${targetAreaId.replace('area', 'input')}').focus()">답글 달기</span>
                        </div>
                    </div>
                    <button class="text-xs pt-2 pr-2 text-gray-400 hover:text-gray-600" onclick="this.querySelector('i').classList.toggle('fas'); this.querySelector('i').classList.toggle('text-red-500'); this.querySelector('i').classList.toggle('far');"><i class="far fa-heart"></i></button>
                </div>
            `;
            targetArea.insertAdjacentHTML('beforeend', commentHTML);
            const scrollContainer = targetArea.parentElement;
            scrollContainer.scrollTop = scrollContainer.scrollHeight;
        };
    }
</script>
</body>
</html>
