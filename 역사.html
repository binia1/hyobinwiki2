        let docName = urlParams.get("doc"); 
        
        if (!docName && window.location.hash) {
            docName = window.location.hash.substring(1); 
        }
        
        if (!docName && document.referrer) {
            try {
                let refUrl = new URL(document.referrer);
                let pathName = refUrl.pathname.split('/').pop(); 
                if (pathName && pathName.endsWith('.html') && !pathName.includes('역사') && !pathName.includes('토론') && !pathName.includes('역링크') && !pathName.includes('index')) {
                    docName = pathName.replace('.html', ''); 
                }
            } catch (e) {}
        }
        
        if (docName) {
            docName = decodeURIComponent(docName);
        } else {
            docName = "효빈광역시"; 
        }
        
        document.title = `${docName} (역사) - 효빈위키`;

            "고토_히토리": ["🗑️", "쓰레기통", "일반 사용자", "아싸", "결속밴드", ""], 
            "키타_이쿠요": ["✨", "키타앙", "일반 사용자", "창전구", "결속밴드", ""], 
            "이지치_니지카": ["🥁", "천사", "일반 사용자", "라이브하우스", "결속밴드", ""], 
            "야마다_료": ["🌿", "잔고 부족", "일반 사용자", "화단", "결속밴드", ""],
            "이세리_니나": ["🖕", "록 스피릿", "일반 사용자", "현수막", "걸밴크", ""], 
            "카와라기_모모카": ["🎸", "탈퇴", "일반 사용자", "길거리", "걸밴크", ""], 
            "루파": ["🎸", "미소", "일반 사용자", "취객", "걸밴크", ""], 
            "에비즈카_토모": ["🎹", "독설", "일반 사용자", "토론방", "걸밴크", ""], 
            "아와_스바루": ["🥁", "배려", "일반 사용자", "사과", "걸밴크", ""]
        };

        // STREAMING_CHUNK: 편집 이력 및 버전 생성 엔진
        const genericSummaries = [
            "오타 수정", "띄어쓰기 교정", "내용 추가", "문단 분리", "분류 추가", 
            "취소선 뇌절 삭제", "틀 추가", "출처 보강", "가독성 개선", "반달리즘 롤백",
            "문서 훼손 복구", "링크 수정", "서술 다듬기", "최신 데이터 반영", "중립적 시각 유지"
        ];

        let fakeHistoryData = [];
        
        function generateHistory() {
            const users = Object.keys(rawMasterDB);
            const numRevisions = Math.floor(Math.random() * 20) + 20; // 20~40개 리비전
            
            let currentTime = new Date(); // 현재 시간 기준
            let revNum = numRevisions;

            for (let i = 0; i < numRevisions; i++) {
                // 시간 역순으로 무작위 과거로 보냄
                const randomMinutes = Math.floor(Math.random() * 1440) + 1; // 1분 ~ 24시간
                currentTime = new Date(currentTime.getTime() - randomMinutes * 60000);

                const dateStr = currentTime.getFullYear() + '-' + 
                                String(currentTime.getMonth() + 1).padStart(2, '0') + '-' + 
                                String(currentTime.getDate()).padStart(2, '0') + ' ' + 
                                String(currentTime.getHours()).padStart(2, '0') + ':' + 
                                String(currentTime.getMinutes()).padStart(2, '0') + ':' + 
                                String(currentTime.getSeconds()).padStart(2, '0');

                // IP 혹은 특정 유저
                let isAnonymous = Math.random() > 0.7;
                let author = "";
                let icon = "";
                let diff = 0;
                let summary = "";

                if (isAnonymous) {
                    author = `${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.xx.xx`;
                    icon = "🌐";
                    diff = (Math.random() > 0.5 ? "+" : "-") + (Math.floor(Math.random() * 50) + 5);
                    summary = genericSummaries[Math.floor(Math.random() * genericSummaries.length)];
                } else {
                    author = users[Math.floor(Math.random() * users.length)];
                    icon = rawMasterDB[author][0];
                    const isAdd = Math.random() > 0.4;
                    diff = (isAdd ? "+" : "-") + (Math.floor(Math.random() * 800) + 10);
                    
                    // 50% 확률로 캐릭 고유 멘트, 아니면 범용
                    if (Math.random() > 0.5) {
                        summary = rawMasterDB[author][5] || genericSummaries[Math.floor(Math.random() * genericSummaries.length)];
                    } else {
                        summary = genericSummaries[Math.floor(Math.random() * genericSummaries.length)];
                    }
                }

                fakeHistoryData.push({
                    rev: revNum--,
                    dateStr: dateStr,
                    diff: diff,
                    summary: summary,
                    author: author,
                    icon: icon,
                    isIP: isAnonymous
                });
            }
        }

        // STREAMING_CHUNK: 편집 이력 렌더링 및 UI 조작
        function renderHistory() {
            generateHistory();
            const tbody = document.getElementById("historyBody");
            let rows = "";

            fakeHistoryData.forEach((h, index) => {
                const diffNum = parseInt(h.diff);
                let diffHtml = `<span class="byte-zero">0</span>`;
                if (diffNum > 0) diffHtml = `<span class="byte-plus">${h.diff}</span>`;
                else if (diffNum < 0) diffHtml = `<span class="byte-minus">${h.diff}</span>`;

                const authorLink = h.isIP 
                    ? `<span class="text-gray-600">${h.author}</span>` 
                    : `<span class="mr-1">${h.icon}</span><a href="작성자문서.html#${encodeURIComponent(h.author)}" class="author-link">${h.author.replace(/_/g, ' ')}</a>`;

                rows += `
                    <tr>
                        <td class="font-bold text-gray-500">r${h.rev}</td>
                        <td class="font-mono text-gray-600 text-xs">${h.dateStr}</td>
                        <td class="text-center">${diffHtml}</td>
                        <td class="text-left text-gray-800 text-sm italic">"${h.summary}"</td>
                        <td class="text-center">${authorLink}</td>
                        <td>
                            <button onclick="viewPastVersion(${h.rev}, '${h.dateStr}', '${h.author}', '${h.summary}')" class="bg-[#f0f9ff] hover:bg-blue-100 text-[#3182ce] px-3 py-1 rounded text-xs font-bold border border-blue-200 shadow-sm cursor-pointer transition">
                                <i class="fa-solid fa-eye"></i> 열람
                            </button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = rows;
        }

        window.viewPastVersion = function(revNum, dateStr, author, summary) {
            document.getElementById("listViewArea").style.display = 'none';
            document.getElementById("versionViewArea").style.display = 'block';
            document.getElementById("verTimeSpan").innerText = dateStr;
            
            const renderArea = document.getElementById("htmlRenderArea");
            
            // 실제 데이터가 없으므로 효빈위키 고증을 살린 더미 과거 판본 시뮬레이션
            renderArea.innerHTML = `
                <div class="bg-gray-50 border border-gray-200 p-8 rounded-lg mb-6 shadow-inner">
                    <h2 class="text-3xl font-black text-gray-800 mb-3 border-b border-gray-300 pb-2">${docName} <span class="text-lg text-gray-500 font-normal">(r${revNum} 판본)</span></h2>
                    
                    <div class="text-sm text-gray-600 mb-6 bg-white p-3 border border-dashed border-gray-300 rounded">
                        <ul class="list-disc pl-5">
                            <li><strong>편집자:</strong> ${author.replace(/_/g, ' ')}</li>
                            <li><strong>편집 일시:</strong> ${dateStr}</li>
                            <li><strong>편집 요약:</strong> ${summary}</li>
                        </ul>
                    </div>
                    
                    <div class="text-gray-700 leading-relaxed bg-white p-6 border border-gray-200 rounded shadow-sm min-h-[300px]">
                        <p class="font-bold text-lg mb-4 text-[#7777AA]"><i class="fa-solid fa-server"></i> 과거 데이터 시뮬레이션</p>
                        <p>이 화면은 <strong>${dateStr}</strong> 당시의 문서 상태를 보여주는 열람 모드입니다.</p>
                        <p class="mt-2 text-sm text-gray-500">※ 현재 프론트엔드 환경에서는 실제 HTML 스냅샷을 저장하지 않으므로, 더미 레이아웃으로 대체되어 표시됩니다.</p>
                        
                        <div class="mt-8 border-l-4 border-[#7777AA] pl-4">
                            <h3 class="font-bold text-xl mb-2">1. 개요</h3>
                            <p>${docName}에 대한 ${dateStr} 시점의 과거 서술 내용이 이곳에 렌더링됩니다.</p>
                            <p class="mt-2"><span class="line-through text-gray-400">당시에는 이런 취소선 드립이나 낡은 서술이 남아있었을 수 있습니다.</span></p>
                        </div>
                    </div>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        window.closeVersionView = function() {
            document.getElementById("listViewArea").style.display = 'block';
            document.getElementById("versionViewArea").style.display = 'none';
            document.getElementById("htmlRenderArea").innerHTML = "";
        }

        window.addEventListener('DOMContentLoaded', renderHistory);
    </script>
</body>
</html>
