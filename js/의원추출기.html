            const members = parsedData[daesu];
            const isOpen = (num === '22') ? 'open=""' : ''; // 22대만 기본 펼침 처리

            let rowsHtml = '';
            for (let i = 0; i < members.length; i += 4) {
                const group = members.slice(i, i + 4);
                
                // 지역구(th 역할) 행
                rowsHtml += `                                        <tr>\n`;
                group.forEach(m => {
                    const bg = partyColors[m.party] || '#808080';
                    const txt = isLightColor(bg) ? '#000000' : '#ffffff';
                    rowsHtml += `                                            <td style="width: 25%; background-color: ${bg};"><a class="nav-th" href="${m.district}.html" style="color: ${txt}; font-weight: bold;">${m.district}</a></td>\n`;
                });
                for(let j = group.length; j < 4; j++) rowsHtml += `                                            <td style="width: 25%; background-color: #f9f9f9; border: none;"></td>\n`;
                rowsHtml += `                                        </tr>\n`;

                // 의원 이름 행
                rowsHtml += `                                        <tr>\n`;
                group.forEach(m => {
                    let color = partyColors[m.party] || '#000000';
                    if (color.toLowerCase() === '#ffffff') color = '#000000';
                    rowsHtml += `                                            <td><a class="nav-link" href="${m.name}.html" style="color: ${color}; font-weight: bold;">${m.name}</a></td>\n`;
                });
                for(let j = group.length; j < 4; j++) rowsHtml += `                                            <td style="border: none;"></td>\n`;
                rowsHtml += `                                        </tr>\n`;
            }

            const footnoteText = electionFootnotes[`제${num}대`] || "";
            const footnoteHtml = footnoteText ? `<br><span style="font-size: 0.85em; color: #555;">${footnoteText}</span>` : "";

            const prevNum = parseInt(num) - 1;
            const nextNum = parseInt(num) + 1;
            const hasPrev = !!parsedData[`${prevNum}대`];
            const hasNext = !!parsedData[`${nextNum}대`];

            const prevLink = hasPrev ? `<span style="color: #7777AA; font-weight: bold; cursor: pointer;">◀ 제${prevNum}대</span> | ` : '';
            const nextLink = hasNext ? ` | <span style="color: #7777AA; font-weight: bold; cursor: pointer;">제${nextNum}대 ▶</span>` : '';

            // 정확한 JS 템플릿 반환
            return `document.addEventListener("DOMContentLoaded", function() {
    function renderHyobinAssembly${num}Nav(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;

        const html = \`
        <table class="nav-table" style="border: 2px solid #7777AA; width: 100%; margin-bottom: 20px; background-color: #fff;">
            <tbody>
                <tr>
                    <td class="nav-header" style="background-color: #7777AA; text-align: center; padding: 8px;">
                        <span class="nav-header-wrap" style="display:inline-flex; align-items:center; gap:4px;">
                            <a class="wiki-link" href="효빈광역시.html" style="color:white; text-decoration: none;">
                                <div style="font-weight: bold; background-color: white; color: #7777AA; padding: 0 4px; border-radius: 2px; font-size: 0.8rem;">H</div>
                            </a>
                            <a class="wiki-link" href="제${num}대_국회의원.html" style="color:white; text-decoration: none; font-weight: bold; font-size: 1.05rem;">효빈광역시 제${num}대 국회의원</a>
                        </span>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 0;">
                        <details ${isOpen} style="border: none; margin: 0;">
                            <summary style="display:none;">[ 펼치기 · 접기 ]</summary>
                            <div style="padding: 5px;">
                                <table style="width: 100%; text-align: center; border-collapse: collapse;">
                                    <tbody>
${rowsHtml}                                        <tr>
                                            <td colspan="4" style="background-color: #f9f9f9; font-size: 0.9em; padding: 15px 0 10px 0; border-top: 1px solid #ccc;">
                                                <a class="wiki-link" href="제${num}대_국회의원_선거_효빈광역시.html" style="color: #005CB9; font-weight:bold; text-decoration: none;">선거 결과</a>${footnoteHtml}
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                                <div style="margin-top: 5px; font-size: 0.85em; display: flex; justify-content: space-between; padding: 5px 15px; background-color: #f1f5f9; border-top: 1px solid #ddd;">
                                    <span>${prevLink.replace(' | ', '')}</span>
                                    <span>
                                        <span style="background-color: #7777AA; color: white; padding: 2px 6px; border-radius: 3px; font-weight: bold;">효빈</span> 외 타 지역 보기
                                    </span>
                                    <span>${nextLink.replace(' | ', '')}</span>
                                </div>
                            </div>
                        </details>
                    </td>
                </tr>
            </tbody>
        </table>
        \`;

        container.innerHTML = html;
    }
    
    // 컴포넌트 렌더링 실행
    renderHyobinAssembly${num}Nav('hyobin-assembly-${num}-nav-container');
});`;
        }

        const termList = document.getElementById('term-list');
        const codeBlock = document.getElementById('code-block');
        const titleEl = document.getElementById('current-term-title');
        let currentCode = '';

        function selectTerm(daesu) {
            document.querySelectorAll('.term-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${daesu}`).classList.add('active');
            
            titleEl.textContent = `${daesu} 국회의원 JS 코드`;
            currentCode = generateJSCode(daesu);
            codeBlock.textContent = currentCode;
        }

        sortedDaesu.forEach((daesu, index) => {
            const btn = document.createElement('button');
            btn.className = 'term-btn';
            btn.id = `btn-${daesu}`;
            btn.textContent = `${daesu} 국회의원`;
            btn.onclick = () => selectTerm(daesu);
            termList.appendChild(btn);
        });

        // 초기 화면 설정 (22대)
        if (sortedDaesu.length > 0) selectTerm(sortedDaesu[0]);

        function copyCode() {
            const textarea = document.createElement('textarea');
            textarea.value = currentCode;
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                toast.style.pointerEvents = 'auto';
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.pointerEvents = 'none';
                }, 2000);
            } catch (err) {
                console.error('복사 실패', err);
            }
            
            document.body.removeChild(textarea);
        }

        function downloadCode() {
            const activeBtn = document.querySelector('.term-btn.active');
            if (!activeBtn) return;
            
            const daesu = activeBtn.id.replace('btn-', '');
            const num = daesu.replace(/[^0-9]/g, '');
            const fileName = `hyobin_${num}.js`; // 파일명 설정 (예: hyobin_22.js)
            
            const blob = new Blob([currentCode], { type: 'text/javascript;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', fileName);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
