<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>범용 위키 기초자치단체장 JS 코드 자동 추출기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap');
        body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background-color: #f3f4f6; margin: 0; overflow: hidden; }
        
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #2d3748; }
        ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #718096; }

        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: #a0aec0; margin-bottom: 0.25rem; }
        .form-input { width: 100%; background-color: #1a202c; border: 1px solid #4a5568; color: white; padding: 0.5rem; border-radius: 0.375rem; font-size: 0.9rem; }
        .form-input:focus { outline: none; border-color: #63b3ed; }
        
        .term-btn { padding: 0.75rem 1rem; text-align: left; background: none; border: none; color: #cbd5e0; cursor: pointer; border-bottom: 1px solid #4a5568; transition: all 0.2s; font-size: 0.95rem; width: 100%; display: block; }
        .term-btn:hover { background-color: #4a5568; color: white; }
        .term-btn.active { background-color: var(--active-bg, #4AD898); color: #1a202c; font-weight: bold; border-left: 4px solid white; }

        .copy-btn { background-color: #4a5568; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: bold; border: none; cursor: pointer; transition: background-color 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .copy-btn:hover { background-color: #2d3748; }
        .download-btn { background-color: #48bb78; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: bold; border: none; cursor: pointer; transition: background-color 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .download-btn:hover { background-color: #38a169; }
        .download-all-btn { background-color: #d69e2e; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: bold; border: none; cursor: pointer; transition: background-color 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .download-all-btn:hover { background-color: #b7791f; }

        #toast { position: fixed; bottom: 20px; right: 20px; background-color: #48bb78; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }
        
        pre { margin: 0; color: #d4d4d4; font-family: 'Consolas', 'Courier New', monospace; font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all; height: 100%; }
    </style>
</head>
<body class="flex h-screen">

    <div class="w-[350px] bg-gray-800 flex flex-col h-full border-r border-gray-700 z-10 shadow-lg shrink-0">
        <div class="p-4 bg-gray-900 border-b border-gray-700 flex justify-between items-center">
            <h1 class="text-white font-bold text-lg">⚙️ 지자체장 추출기</h1>
        </div>
        <div class="p-4 overflow-y-auto flex-1">
            <div class="form-group">
                <label class="form-label">지역명 (예: 덕빈북도, 덕빈남도, 효빈광역시)</label>
                <input type="text" id="input-region" class="form-input" value="덕빈북도">
            </div>
            <div class="form-group">
                <label class="form-label">영문 식별자 (예: Deokbinbuk)</label>
                <input type="text" id="input-eng" class="form-input" value="Deokbinbuk" placeholder="함수명 생성에 사용">
            </div>
            <div class="form-group">
                <label class="form-label">메인 테마 색상 (Hex)</label>
                <div class="flex gap-2">
                    <input type="color" id="input-color-picker" class="h-9 w-12 rounded cursor-pointer bg-gray-700 border-gray-600" value="#4AD898">
                    <input type="text" id="input-color" class="form-input flex-1" value="#4AD898">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">특이사항 (선거 결과 등)</label>
                <textarea id="input-footnotes" class="form-input h-24" placeholder="형식 (줄바꿈 구분):&#10;민선 1기:* 아무개 사퇴"></textarea>
            </div>
            <div class="form-group flex-1 flex flex-col mb-0">
                <label class="form-label">원시 데이터 (TSV: 기수/연도/지자체명/정당/단체장)</label>
                <textarea id="input-rawdata" class="form-input h-48 resize-y" placeholder="엑셀 복사 붙여넣기..."></textarea>
            </div>
        </div>
        <div class="p-4 bg-gray-900 border-t border-gray-700">
            <button onclick="applySettings()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded transition-colors shadow">
                데이터 파싱 및 적용
            </button>
        </div>
    </div>

    <div class="w-[220px] bg-gray-800 flex flex-col h-full border-r border-gray-700 shrink-0">
        <div class="p-4 bg-gray-900 border-b border-gray-700">
            <h2 class="text-white font-bold text-md text-center" id="term-list-title">기수(대수) 선택</h2>
        </div>
        <div id="term-list" class="flex-1 overflow-y-auto">
            <div class="text-gray-400 text-sm text-center mt-10 p-4">좌측에서 데이터를<br>적용해주세요.</div>
        </div>
    </div>

    <div class="flex-1 bg-[#1e1e1e] flex flex-col h-full relative min-w-0">
        <div class="p-4 bg-white border-b border-gray-200 flex justify-between items-center shrink-0">
            <h2 id="current-term-title" class="text-lg font-bold text-gray-800 truncate">JS 코드</h2>
            <div class="flex gap-2 shrink-0">
                <button class="download-all-btn" onclick="downloadAllCodes()">
                    📦 전체 JS 일괄 저장
                </button>
                <button class="download-btn" onclick="downloadCode()">
                    ⬇️ 현재 JS 저장
                </button>
                <button class="copy-btn" onclick="copyCode()">
                    📋 복사
                </button>
            </div>
        </div>
        <div class="flex-1 p-6 overflow-auto">
            <pre><code id="code-block">코드를 불러오는 중입니다...</code></pre>
        </div>
    </div>

    <div id="toast">복사 완료!</div>

    <script>
        // 전역 설정 상태
        let appState = {
            region: '덕빈북도',
            engId: 'Deokbinbuk',
            color: '#4AD898',
            footnotes: {},
            parsedData: {},
            sortedDaesu: []
        };
        
        let currentCode = '';

        // 범용 정당 색상 (효빈, 덕빈북 및 주요 정당 모두 포함)
        const partyColors = {
            "더불어민주당": "#003B96",
            "국민의힘": "#E61E2B",
            "진보당": "#D6001C",
            "정의당": "#FFED00",
            "개혁신당": "#FF7210",
            "새정치국민회의": "#009A44",
            "자유민주연합": "#1B5B40",
            "한나라당": "#0095DA",
            "새천년민주당": "#00AA7B",
            "열린우리당": "#FFD700",
            "자유선진당": "#00529C",
            "새누리당": "#C9252B",
            "자유한국당": "#C9151E",
            "미래통합당": "#EF426F",
            "무소속": "#808080"
            // 필요에 따라 더 추가 가능하며 없는 정당은 기본 회색 처리됨
        };

        function isLightColor(hex) {
            if (!hex) return false;
            const lightColors = ["#FFD700", "#ADFF2F", "#C0C0FF", "#FADA5E", "#FFD400", "#FFED00", "#E0E0E0", "#FFEF10", "#FAC813", "#FFD2AD", "#C2C247"];
            return lightColors.includes(hex.toUpperCase());
        }

        // 대수/기수 문자열 포맷팅
        function formatDaesu(str) {
            if (str === "제헌") return "제헌";
            if (str.includes("민선")) return str; // 이미 민선 X기 형태면 그대로 유지
            let match = str.match(/^(\d+)(대|기)(.*)$/);
            if (match) return `민선 ${match[1]}기${match[3]}`; // 기본적으로 민선 X기로 통일
            return str;
        }

        // 숫자로만 된 ID 추출 (함수명용)
        function extractNumId(str) {
            if (str === '제헌') return '1';
            return str.replace(/[^0-9]/g, '');
        }

        document.getElementById('input-color-picker').addEventListener('input', function(e) {
            document.getElementById('input-color').value = e.target.value.toUpperCase();
        });
        document.getElementById('input-color').addEventListener('input', function(e) {
            document.getElementById('input-color-picker').value = e.target.value;
        });

        function applySettings() {
            appState.region = document.getElementById('input-region').value.trim() || '덕빈북도';
            appState.engId = document.getElementById('input-eng').value.trim() || 'Deokbinbuk';
            appState.color = document.getElementById('input-color').value.trim() || '#4AD898';
            
            document.documentElement.style.setProperty('--active-bg', appState.color);
            document.getElementById('term-list-title').textContent = `${appState.region} 대수/기수`;

            appState.footnotes = {};
            const fnRaw = document.getElementById('input-footnotes').value;
            fnRaw.split('\n').forEach(line => {
                const parts = line.split(':');
                if (parts.length >= 2) {
                    appState.footnotes[parts[0].trim()] = parts.slice(1).join(':').trim();
                }
            });

            appState.parsedData = {};
            const rawData = document.getElementById('input-rawdata').value;
            const lines = rawData.trim().split('\n');
            
            let startIndex = 0;
            if (lines.length > 0 && (lines[0].includes('선거구') || lines[0].includes('지자체'))) startIndex = 1;

            for (let i = startIndex; i < lines.length; i++) {
                const parts = lines[i].split('\t');
                if (parts.length >= 5) {
                    const daesu = parts[0].trim();
                    const year = parts[1].trim(); // 연도는 파싱만 하고 현재 구조상 생략
                    const district = parts[2].trim();
                    const party = parts[3].trim();
                    const name = parts[4].trim();
                    
                    if (!appState.parsedData[daesu]) appState.parsedData[daesu] = [];
                    appState.parsedData[daesu].push({ district, party, name });
                }
            }

            appState.sortedDaesu = Object.keys(appState.parsedData).sort((a, b) => {
                let numA = parseInt(a.replace(/[^0-9]/g, '')) || 0;
                let numB = parseInt(b.replace(/[^0-9]/g, '')) || 0;
                return numB - numA;
            });

            renderSidebar();
        }

        function renderSidebar() {
            const termList = document.getElementById('term-list');
            termList.innerHTML = '';

            if (appState.sortedDaesu.length === 0) {
                termList.innerHTML = '<div class="text-gray-400 text-sm text-center mt-10 p-4">파싱된 데이터가<br>없습니다.</div>';
                return;
            }

            appState.sortedDaesu.forEach((daesu, index) => {
                const formatted = formatDaesu(daesu);
                const btn = document.createElement('button');
                btn.className = 'term-btn';
                btn.id = `btn-${extractNumId(daesu)}`;
                btn.textContent = `${formatted} 단체장`;
                btn.onclick = () => selectTerm(daesu, index);
                termList.appendChild(btn);
            });

            selectTerm(appState.sortedDaesu[0], 0);
        }

        function generateJSCode(daesu, index) {
            const formattedDaesu = formatDaesu(daesu);
            const numId = extractNumId(daesu);
            const members = appState.parsedData[daesu];
            const isLatest = (index === 0);
            const isOpen = isLatest ? 'open=""' : '';

            const prevDaesuRaw = index < appState.sortedDaesu.length - 1 ? appState.sortedDaesu[index + 1] : null;
            const nextDaesuRaw = index > 0 ? appState.sortedDaesu[index - 1] : null;
            
            const prevLink = prevDaesuRaw ? `◀ <a href="${formatDaesu(prevDaesuRaw)}.html" style="color:#333; text-decoration:none; font-weight:bold;">${formatDaesu(prevDaesuRaw)}</a>` : '';
            const nextLink = nextDaesuRaw ? `<a href="${formatDaesu(nextDaesuRaw)}.html" style="color:#333; text-decoration:none; font-weight:bold;">${formatDaesu(nextDaesuRaw)}</a> ▶` : '';

            // 로고 자동 분기 로직
            let logoHtml = '';
            if (appState.region.includes("효빈광역시")) {
                logoHtml = `<img src="이미지/logo.webp" alt="효빈광역시 로고" style="height: 40px !important; width: auto; vertical-align: middle; filter: brightness(0) invert(1);">`;
            } else if (appState.region.includes("덕빈북도")) {
                logoHtml = `<img src="이미지/덕북로고.webp" alt="덕빈북도 로고" style="height: 20px; vertical-align: middle;">`;
            } else if (appState.region.includes("덕빈남도")) {
                logoHtml = `<img src="이미지/덕빈남도_로고.webp" alt="덕빈남도 로고" style="height: 40px !important; width: auto; vertical-align: middle; filter: brightness(0) invert(1);">`;
            } else {
                logoHtml = `<div class="font-bold bg-white px-1 text-xs rounded" style="color: ${appState.color};">H</div>`;
            }

            let rowsHtml = '';
            for (let i = 0; i < members.length; i += 5) {
                const group = members.slice(i, i + 5);
                
                rowsHtml += `                                        <tr>\n`;
                group.forEach(m => {
                    const bg = partyColors[m.party] || '#808080';
                    const txt = isLightColor(bg) ? '#000000' : '#ffffff';
                    rowsHtml += `                                            <td class="district-cell" style="width: 20%; background-color: ${bg}; padding: 8px 4px; border: 1px solid #aaa; font-weight: bold;"><a href="${m.district}.html" style="color: ${txt}; text-decoration: none;">${m.district}</a></td>\n`;
                });
                for(let j = group.length; j < 5; j++) rowsHtml += `                                            <td style="width: 20%; background-color: #f9f9f9; border: 1px solid #aaa; "></td>\n`;
                rowsHtml += `                                        </tr>\n`;

                rowsHtml += `                                        <tr>\n`;
                group.forEach(m => {
                    let color = partyColors[m.party] || '#000000';
                    if (color.toLowerCase() === '#ffffff') color = '#000000';
                    rowsHtml += `                                            <td class="member-cell" style="background-color: #ffffff; padding: 8px 4px; border: 1px solid #aaa; font-weight: bold;"><a href="${m.name}.html" style="color: ${color}; text-decoration: none;">${m.name}</a></td>\n`;
                });
                for(let j = group.length; j < 5; j++) rowsHtml += `                                            <td style="border: 1px solid #aaa; "></td>\n`;
                rowsHtml += `                                        </tr>\n`;
            }

            let resultBlockHtml = '';
            const footnoteText = appState.footnotes[daesu] || appState.footnotes[formattedDaesu];
            if (footnoteText) {
                resultBlockHtml = `
                            <div class="result-header" style="text-align: center; padding: 8px; background-color: #f8f9fa; border-top: 1px solid #aaa; color: #005CB9; font-size: 0.95rem; font-weight: bold;">
                                <a href="${formattedDaesu}_기초자치단체장_선거.html" style="color: #005CB9; text-decoration: none;">선거 결과</a>
                            </div>
                            <div class="result-content" style="text-align: center; padding: 12px; border-top: 1px solid #aaa; font-size: 0.85rem; background-color: #fff; line-height: 1.8; color: #444;">
                                ${footnoteText}
                            </div>`;
            }

            const funcName = `render${appState.engId}Head${numId}Nav`;
            const containerId = `${appState.engId.toLowerCase()}-head-${numId}-nav-container`;

            return `document.addEventListener("DOMContentLoaded", function() {
    function ${funcName}(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;

        const html = \`
        <div class="nav-box shadow-sm" style="border: 1px solid #aaa; margin-bottom: 30px; background-color: #fff; font-family: 'Noto Sans KR', sans-serif;">
            <div class="nav-header tracking-wide" style="background-color: ${appState.color}; color: white; text-align: center; font-weight: bold; padding: 8px; font-size: 1.05rem;">
                <span style="display:inline-flex; align-items:center; gap:6px;">
                    ${logoHtml}
                    <a href="${appState.region}.html" style="color:white; text-decoration: none;">${appState.region} ${formattedDaesu} 기초자치단체장</a>
                </span>
            </div>
            <details ${isOpen} style="width: 100%;">
                <summary class="nav-summary" style="background-color: #fff; text-align: center; padding: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold; border-bottom: 1px solid #aaa; color: #333; list-style: none;">
                    [ 펼치기 · 접기 ]
                </summary>
                <div style="padding: 0;">
                    <table class="nav-table" style="width: 100%; border-collapse: collapse; table-layout: fixed; background-color: #ffffff; text-align: center; font-size: 0.95rem; word-break: keep-all;">
                        <tbody>
${rowsHtml}                        </tbody>
                    </table>
${resultBlockHtml}
                    <div class="nav-bottom-links" style="background-color: #f8f9fa; display: flex; justify-content: space-between; padding: 8px 15px; font-size: 0.85rem; font-weight: bold; border-top: 1px solid #aaa;">
                        <div>${prevLink}</div>
                        <div>${nextLink}</div>
                    </div>
                </div>
            </details>
        </div>
        \`;

        container.innerHTML = html;
    }
    
    // 컴포넌트 렌더링 실행
    ${funcName}('${containerId}');
});`;
        }

        function selectTerm(daesu, index) {
            document.querySelectorAll('.term-btn').forEach(btn => btn.classList.remove('active'));
            const numId = extractNumId(daesu);
            const btn = document.getElementById(`btn-${numId}`);
            if (btn) btn.classList.add('active');
            
            const formatted = formatDaesu(daesu);
            document.getElementById('current-term-title').textContent = `${appState.region} ${formatted} JS 코드`;
            
            currentCode = generateJSCode(daesu, index);
            document.getElementById('code-block').textContent = currentCode;
        }

        function copyCode() {
            if(!currentCode) return;
            const textarea = document.createElement('textarea');
            textarea.value = currentCode;
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                const toast = document.getElementById('toast');
                toast.textContent = '복사 완료!';
                toast.style.opacity = '1';
                setTimeout(() => toast.style.opacity = '0', 2000);
            } catch (err) {}
            document.body.removeChild(textarea);
        }

        // 현재 보고 있는 대수(기수) 1개 다운로드
        function downloadCode() {
            if(!currentCode) return;
            const activeBtn = document.querySelector('.term-btn.active');
            if (!activeBtn) return;
            
            const daesuRaw = activeBtn.textContent.replace(' 단체장', '').trim();
            const numId = extractNumId(daesuRaw);
            const fileName = `${appState.engId.toLowerCase()}_head_${numId}.js`;
            
            triggerDownload(currentCode, fileName);
        }

        // 전체 대수(기수) 일괄 다운로드 (브라우저 차단 방지를 위해 약간의 딜레이 적용)
        function downloadAllCodes() {
            if (appState.sortedDaesu.length === 0) {
                alert("추출할 데이터가 없습니다.");
                return;
            }

            let delay = 0;
            appState.sortedDaesu.forEach((daesu, index) => {
                setTimeout(() => {
                    const code = generateJSCode(daesu, index);
                    const numId = extractNumId(daesu);
                    const fileName = `${appState.engId.toLowerCase()}_head_${numId}.js`;
                    triggerDownload(code, fileName);
                }, delay);
                delay += 300; // 0.3초마다 1개씩 다운로드 트리거
            });

            const toast = document.getElementById('toast');
            toast.textContent = `총 ${appState.sortedDaesu.length}개의 JS 파일을 일괄 다운로드합니다!`;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 3000);
        }

        function triggerDownload(codeContent, fileName) {
            const blob = new Blob([codeContent], { type: 'text/javascript;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', fileName);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // 초기 데이터 샘플
        document.getElementById('input-rawdata').value = `기수	연도	지자체명	정당	단체장
민선 1기	1995년	서해시	새정치국민회의	경지현
민선 1기	1995년	빈주시	자유민주연합	한광호
민선 1기	1995년	천주시	새정치국민회의	남재일
민선 8기	2022년	서해시	더불어민주당	최정아
민선 8기	2022년	빈주시	국민의힘	이재성`;
        
        applySettings();
    </script>
</body>
</html>
