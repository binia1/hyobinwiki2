        ::-webkit-scrollbar { width: 8px; height: 8px; }

        ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #718096; }

        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: #a0aec0; margin-bottom: 0.25rem; }
        .form-input { width: 100%; background-color: #1a202c; border: 1px solid #4a5568; color: white; padding: 0.5rem; border-radius: 0.375rem; font-size: 0.9rem; }
        .form-input:focus { outline: none; border-color: #63b3ed; }
        
        .term-btn { padding: 0.75rem 1rem; text-align: left; background: none; border: none; color: #cbd5e0; cursor: pointer; border-bottom: 1px solid #4a5568; transition: all 0.2s; font-size: 0.95rem; width: 100%; display: block; }
        .term-btn:hover { background-color: #4a5568; color: white; }
        .term-btn.active { background-color: var(--active-bg, #4AD898); color: #1a202c; font-weight: bold; border-left: 4px solid white; }

        .copy-btn { background-color: #4a5568; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: bold; border: none; cursor: pointer; transition: background-color 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .copy-btn:hover { background-color: #2d3748; }
        .download-btn { background-color: #48bb78; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: bold; border: none; cursor: pointer; transition: background-color 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .download-btn:hover { background-color: #38a169; }

        #toast { position: fixed; bottom: 20px; right: 20px; background-color: #48bb78; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }

        // 밝은 색상 판별 함수 (글자색 대비용)
        function isLightColor(hex) {
            if (!hex) return false;
            const lightColors = ["#FFD700", "#ADFF2F", "#C0C0FF", "#FADA5E", "#FFD400", "#FFED00", "#E0E0E0", "#FFEF10", "#FAC813", "#FFD2AD", "#C2C247"];
            return lightColors.includes(hex.toUpperCase());
        }

        // 대수 문자열 포맷팅
        function formatDaesu(str) {
            if (str === "제헌") return "제헌";
            if (str.startsWith("제") && str.includes("대")) return str;
            let match = str.match(/^(\d+)대(.*)$/);
            if (match) return `제${match[1]}대${match[2]}`;
            return str;
        }

        // 숫자로만 된 ID 추출 (함수명용)
        function extractNumId(str) {
            if (str === '제헌') return '1';
            return str.replace(/[^0-9]/g, '');
        }

        // 색상 픽커 연동
        document.getElementById('input-color-picker').addEventListener('input', function(e) {
            document.getElementById('input-color').value = e.target.value.toUpperCase();

        document.getElementById('input-color').addEventListener('input', function(e) {

        function applySettings() {
            // 1. 설정값 읽기
            appState.region = document.getElementById('input-region').value.trim() || '덕빈북도';
            appState.engId = document.getElementById('input-eng').value.trim() || 'Deokbinbuk';
            appState.color = document.getElementById('input-color').value.trim() || '#4AD898';
            
            // 색상 변수 CSS 업데이트 (활성화 버튼 색상)
            document.documentElement.style.setProperty('--active-bg', appState.color);
            document.getElementById('term-list-title').textContent = `${appState.region} 대수`;

            // 2. 특이사항 파싱
            appState.footnotes = {};
            const fnRaw = document.getElementById('input-footnotes').value;
            fnRaw.split('\n').forEach(line => {
                const parts = line.split(':');
                if (parts.length >= 2) {
                    appState.footnotes[parts[0].trim()] = parts.slice(1).join(':').trim();
                }
            });

            // 3. TSV 데이터 파싱
            appState.parsedData = {};
            const rawData = document.getElementById('input-rawdata').value;
            const lines = rawData.trim().split('\n');
            
            // 헤더 건너뛰기 로직 개선
            let startIndex = 0;
            if (lines.length > 0 && lines[0].includes('선거구명')) startIndex = 1;

            for (let i = startIndex; i < lines.length; i++) {
                const parts = lines[i].split('\t');
                if (parts.length >= 5) {
                    const daesu = parts[0].trim();
                    const year = parts[1].trim();
                    const district = parts[2].trim();
                    const party = parts[3].trim();
                    const name = parts[4].trim();
                    
                    if (!appState.parsedData[daesu]) appState.parsedData[daesu] = [];
                    appState.parsedData[daesu].push({ district, party, name });
                }
            }

            // 4. 대수 정렬
            appState.sortedDaesu = Object.keys(appState.parsedData).sort((a, b) => {
                let numA = parseInt(a.replace(/[^0-9]/g, '')) || (a === '제헌' ? 1 : 0);
                let numB = parseInt(b.replace(/[^0-9]/g, '')) || (b === '제헌' ? 1 : 0);
                return numB - numA;
            });

            renderSidebar();
        }

        function renderSidebar() {
            const termList = document.getElementById('term-list');
            termList.innerHTML = '';

            if (appState.sortedDaesu.length === 0) {
                termList.innerHTML = '<div class="text-gray-400 text-sm text-center mt-10 p-4">파싱된 데이터가<br>없습니다.</div>';
                return;
            }

            appState.sortedDaesu.forEach((daesu, index) => {
                const formatted = formatDaesu(daesu);
                const btn = document.createElement('button');
                btn.className = 'term-btn';
                btn.id = `btn-${extractNumId(daesu)}`;
                btn.textContent = `${formatted} 국회의원`;
                btn.onclick = () => selectTerm(daesu, index);
                termList.appendChild(btn);
            });

            // 가장 최신 대수 자동 선택
            selectTerm(appState.sortedDaesu[0], 0);
        }

        function generateJSCode(daesu, index) {
            const formattedDaesu = formatDaesu(daesu);
            const numId = extractNumId(daesu);
            const members = appState.parsedData[daesu];
            const isLatest = (index === 0);
            const isOpen = isLatest ? 'open=""' : '';

            // 이전/다음 대수 링크 계산
            const prevDaesuRaw = index < appState.sortedDaesu.length - 1 ? appState.sortedDaesu[index + 1] : null;
            const nextDaesuRaw = index > 0 ? appState.sortedDaesu[index - 1] : null;
            
            const prevLink = prevDaesuRaw ? `◀ <a href="${formatDaesu(prevDaesuRaw)}.html" style="color:#333; text-decoration:none; font-weight:bold;">${formatDaesu(prevDaesuRaw)}</a>` : '';
            const nextLink = nextDaesuRaw ? `<a href="${formatDaesu(nextDaesuRaw)}.html" style="color:#333; text-decoration:none; font-weight:bold;">${formatDaesu(nextDaesuRaw)}</a> ▶` : '';

            let rowsHtml = '';
            for (let i = 0; i < members.length; i += 4) {
                const group = members.slice(i, i + 4);
                
                // 지역구(th) 행
                rowsHtml += `                                        <tr>\n`;
                group.forEach(m => {
                    const bg = partyColors[m.party] || '#808080';
                    const txt = isLightColor(bg) ? '#000000' : '#ffffff';
                    rowsHtml += `                                            <td class="district-cell" style="width: 25%; background-color: ${bg}; padding: 8px 4px; border: 1px solid #aaa; font-weight: bold;"><a href="${m.district}.html" style="color: ${txt}; text-decoration: none;">${m.district}</a></td>\n`;
                });
                for(let j = group.length; j < 4; j++) rowsHtml += `                                            <td style="width: 25%; background-color: #f9f9f9; border: 1px solid #aaa; border-style: none solid;"></td>\n`;
                rowsHtml += `                                        </tr>\n`;

                // 의원 이름 행
                rowsHtml += `                                        <tr>\n`;
                group.forEach(m => {
                    let color = partyColors[m.party] || '#000000';
                    if (color.toLowerCase() === '#ffffff') color = '#000000';
                    rowsHtml += `                                            <td class="member-cell" style="background-color: #ffffff; padding: 8px 4px; border: 1px solid #aaa; font-weight: bold;"><a href="${m.name}.html" style="color: ${color}; text-decoration: none;">${m.name}</a></td>\n`;
                });
                for(let j = group.length; j < 4; j++) rowsHtml += `                                            <td style="border: 1px solid #aaa; border-style: none solid;"></td>\n`;
                rowsHtml += `                                        </tr>\n`;
            }

            // 특이사항 블록
            let resultBlockHtml = '';
            const footnoteText = appState.footnotes[formattedDaesu];
            if (footnoteText) {
                resultBlockHtml = `
                            <div class="result-header" style="text-align: center; padding: 8px; background-color: #f8f9fa; border-top: 1px solid #aaa; color: #005CB9; font-size: 0.95rem; font-weight: bold;">
                                <a href="${formattedDaesu}_국회의원_선거.html" style="color: #005CB9; text-decoration: none;">선거 결과</a>
                            </div>
                            <div class="result-content" style="text-align: center; padding: 12px; border-top: 1px solid #aaa; font-size: 0.85rem; background-color: #fff; line-height: 1.8; color: #444;">
                                ${footnoteText}
                            </div>`;
            } else {
                resultBlockHtml = `
                            <div class="result-header" style="text-align: center; padding: 8px; background-color: #f8f9fa; border-top: 1px solid #aaa; color: #005CB9; font-size: 0.95rem; font-weight: bold;">
                                <a href="${formattedDaesu}_국회의원_선거.html" style="color: #005CB9; text-decoration: none;">선거 결과</a>
                            </div>
                            <div class="result-content" style="text-align: center; padding: 12px; border-top: 1px solid #aaa; font-size: 0.85rem; background-color: #fff; line-height: 1.8; color: #888;">
                                * 해당 대수에는 당선무효, 사퇴 등의 특이사항이 없습니다.
                            </div>`;
            }

            const funcName = `render${appState.engId}Assembly${numId}Nav`;
            const containerId = `${appState.engId.toLowerCase()}-assembly-${numId}-nav-container`;

            return `document.addEventListener("DOMContentLoaded", function() {
    function ${funcName}(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;

        const html = \`
        <div class="nav-box shadow-sm" style="border: 1px solid #aaa; margin-bottom: 30px; background-color: #fff; font-family: 'Noto Sans KR', sans-serif;">
            <div class="nav-header tracking-wide" style="background-color: ${appState.color}; color: white; text-align: center; font-weight: bold; padding: 8px; font-size: 1.05rem;">
                <span style="display:inline-flex; align-items:center; gap:4px;">
                    <div class="font-bold bg-white px-1 text-xs rounded" style="color: ${appState.color};">H</div>
                    <a href="${appState.region}.html" style="color:white; text-decoration: none;">${appState.region} ${formattedDaesu} 국회의원</a>
                </span>
            </div>
            <details ${isOpen} style="width: 100%;">
                <summary class="nav-summary" style="background-color: #fff; text-align: center; padding: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold; border-bottom: 1px solid #aaa; color: #333; list-style: none;">
                    [ 펼치기 · 접기 ]
                </summary>
                <div style="padding: 0;">
                    <table class="nav-table" style="width: 100%; border-collapse: collapse; table-layout: fixed; background-color: #ffffff; text-align: center; font-size: 0.95rem; word-break: keep-all;">
                        <tbody>
${rowsHtml}                        </tbody>
                    </table>
${resultBlockHtml}
                    <div class="nav-bottom-links" style="background-color: #f8f9fa; display: flex; justify-content: space-between; padding: 8px 15px; font-size: 0.85rem; font-weight: bold; border-top: 1px solid #aaa;">
                        <div>${prevLink}</div>
                        <div>${nextLink}</div>
                    </div>
                    <div class="nav-footer-areas tracking-wider" style="background-color: #667666; color: white; text-align: center; padding: 10px; font-size: 0.85rem; line-height: 1.8; border-top: 1px solid #aaa; letter-spacing: 0.5px;">
                        비례 · 서울 · 부산 · 대구 · 인천 · 광주 · 대전 · 울산 · 세종<br>
                        경기 · 강원 · 충북 · 충남 · 전남 · 전북 · 경북 · 경남 · 제주 · 효빈 · <span style="font-weight: bold; color: #fde047;">${appState.region}</span> 
                    </div>
                </div>
            </details>
        </div>
        \`;

        container.innerHTML = html;
    }
    
    // 컴포넌트 렌더링 실행 (생성할 문서에 id="\${containerId}" 인 div를 추가하세요)
    ${funcName}('${containerId}');
});`;
        }

        // 대수 선택 핸들러
        function selectTerm(daesu, index) {
            document.querySelectorAll('.term-btn').forEach(btn => btn.classList.remove('active'));
            const numId = extractNumId(daesu);
            const btn = document.getElementById(`btn-${numId}`);
            if (btn) btn.classList.add('active');
            
            const formatted = formatDaesu(daesu);
            document.getElementById('current-term-title').textContent = `${appState.region} ${formatted} JS 코드`;
            
            currentCode = generateJSCode(daesu, index);
            document.getElementById('code-block').textContent = currentCode;
        }

        function copyCode() {
            if(!currentCode) return;
            const textarea = document.createElement('textarea');
            textarea.value = currentCode;
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                toast.style.pointerEvents = 'auto';
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.pointerEvents = 'none';
                }, 2000);
            } catch (err) {
                console.error('복사 실패', err);
            }
            document.body.removeChild(textarea);
        }

        function downloadCode() {
            if(!currentCode) return;
            const activeBtn = document.querySelector('.term-btn.active');
            if (!activeBtn) return;
            
            const daesuRaw = activeBtn.textContent.replace(' 국회의원', '').trim();
            const numId = extractNumId(daesuRaw);
            const fileName = `${appState.engId.toLowerCase()}_${numId}.js`;
            
            const blob = new Blob([currentCode], { type: 'text/javascript;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', fileName);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // 초기 데이터 (덕빈북도 예시 샘플)
        document.getElementById('input-rawdata').value = `대수	연도	선거구명	정당	의원
제헌	1948년	천주군 갑	한국민주당	송진우
제헌	1948년	천주군 을	무소속	백남식
22대	2024년	천주시 갑	더불어민주당	고규미
22대	2024년	천주시 을	더불어민주당	하성민
22대	2024년	빈주시 갑	더불어민주당	박현언
22대	2024년	빈주시 을	더불어민주당	고한선
22대	2024년	서해시 갑	더불어민주당	김세솔
22대	2024년	약산시·선곡군 갑	진보당	소산현`;
        
        // 실행
        applySettings();
    </script>
</body>
</html>
