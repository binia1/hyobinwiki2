<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAILUMINAE SMILE FESTIVAL - 스토리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Orbitron:wght@700&display=swap');

        :root {
            --color-active: #0077DD;
            --color-festival: #C455F6;
            --color-accent: #FF4F91;
            --header-height: 80px;
            --bg-dark: #050510;
        }

        body {
            margin: 0; overflow: hidden; background-color: var(--bg-dark);
            font-family: 'Noto Sans KR', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: white; user-select: none;
        }

        #app-container {
            position: relative; width: 1280px; height: 720px;
            background: linear-gradient(135deg, rgba(10,11,26,0.95) 0%, rgba(15,15,30,0.95) 100%);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255,255,255,0.05);
            overflow: hidden; transform-origin: center; display: flex; flex-direction: column;
        }

        .top-bar {
            height: var(--header-height);
            background: linear-gradient(to bottom, rgba(10, 11, 26, 0.9), rgba(10, 11, 26, 0.4));
            backdrop-filter: blur(12px); border-bottom: 2px solid var(--color-active);
            display: flex; justify-content: space-between; align-items: center; padding: 0 30px;
            z-index: 50; box-shadow: 0 4px 20px rgba(0,0,0,0.5); position: absolute; top: 0; left: 0; width: 100%;
            transition: transform 0.4s ease;
        }
        
        .top-bar.hide { transform: translateY(-100%); }

        /* 에피소드 선택 화면 */
        #episode-selection {
            position: absolute; inset: 0; top: var(--header-height);
            padding: 40px; overflow-y: auto; z-index: 40;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 119, 221, 0.1), transparent 60%);
            display: flex; flex-direction: column; gap: 20px;
        }
        #episode-selection::-webkit-scrollbar { width: 8px; }
        #episode-selection::-webkit-scrollbar-thumb { background: var(--color-active); border-radius: 4px; }

        .episode-card {
            background: rgba(20, 22, 45, 0.8); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 25px; display: flex; gap: 25px; align-items: center;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); backdrop-filter: blur(5px);
        }
        .episode-card:hover {
            background: rgba(40, 45, 80, 0.9); transform: translateX(10px);
            border-color: var(--color-active); box-shadow: -5px 10px 25px rgba(0,119,221,0.3);
        }
        .episode-thumb {
            width: 160px; height: 100px; background: #000; border-radius: 12px;
            overflow: hidden; border: 2px solid rgba(255,255,255,0.2); position: relative;
        }
        .episode-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: opacity 0.3s; }
        .episode-card:hover .episode-thumb img { opacity: 1; }

        /* 비주얼 노벨 (스토리 플레이어) 화면 */
        #story-player {
            position: absolute; inset: 0; background: black; z-index: 100;
            display: none; flex-direction: column; justify-content: flex-end; overflow: hidden;
        }
        
        #story-bg {
            position: absolute; inset: 0; background-size: cover; background-position: center;
            transition: background-image 0.5s ease-in-out, filter 0.5s; z-index: 101; filter: brightness(0.7);
        }

        #story-character-container {
            position: absolute; inset: 0; z-index: 102;
            display: flex; justify-content: center; align-items: flex-end; padding-bottom: 20px;
        }
        
        #story-character {
            max-height: 90%; max-width: 80%; object-fit: contain; object-position: bottom;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8)); transition: opacity 0.3s, transform 0.3s;
            opacity: 0; transform: translateY(20px);
        }
        #story-character.show { opacity: 1; transform: translateY(0); }

        /* 대화창 UI */
        #dialogue-ui {
            position: relative; z-index: 103; width: 1100px; height: 220px; margin: 0 auto 30px auto;
            background: linear-gradient(135deg, rgba(10,11,26,0.95), rgba(30,35,60,0.95));
            border: 2px solid rgba(255,255,255,0.2); border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; padding: 30px 40px; cursor: pointer;
            border-top: 4px solid var(--color-active);
        }
        
        #speaker-name-box {
            position: absolute; top: -25px; left: 40px; background: var(--color-active);
            padding: 8px 25px; border-radius: 12px; font-size: 22px; font-weight: 900; color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.5);
            letter-spacing: 1px; transition: background-color 0.3s; display: none;
        }

        #dialogue-text {
            flex: 1; font-size: 24px; font-weight: 500; color: #E2E8F0; line-height: 1.6;
            word-break: keep-all; text-shadow: 1px 1px 2px black;
        }

        .next-indicator {
            position: absolute; bottom: 20px; right: 30px; font-size: 24px; color: var(--color-active);
            animation: bounce-x 1s infinite;
        }

        @keyframes bounce-x {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(5px); }
        }

        /* 화면 흔들림 효과 */
        .shake-effect { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        /* 자동 진행/스킵 메뉴 */
        #story-controls {
            position: absolute; top: 20px; right: 20px; z-index: 104;
            display: flex; gap: 10px;
        }
        .story-btn {
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 8px 15px; border-radius: 8px; font-weight: bold; font-size: 14px;
            cursor: pointer; backdrop-filter: blur(5px); transition: background 0.2s;
        }
        .story-btn:hover { background: rgba(255,255,255,0.2); }

    
    
</style>

    <!-- 효빈위키 폰트 CSS -->
    <link rel="stylesheet" href="wiki_font_standard.css">
</head>
<body>

<div id="app-container">
    <!-- 상단 바 -->
    <div class="top-bar" id="top-bar">
        <div class="flex items-center gap-4">
            <!-- 뒤로가기 버튼 -->
            <button class="w-12 h-12 bg-gray-800 hover:bg-gray-700 border border-gray-500 rounded-full flex items-center justify-center text-xl transition shadow-lg" onclick="location.href='레일루미네_스마일_페스티벌_게임.html'" title="로비로 돌아가기">◀</button>
            <div>
                <div class="text-xs text-yellow-300 font-bold tracking-widest uppercase">MAIN STORY</div>
                <div class="font-black text-2xl font-['Montserrat'] leading-tight tracking-tight text-white">업무 일지</div>
            </div>
        </div>
    </div>

    <!-- 에피소드 선택 목록 -->
    <div id="episode-selection">
        <!-- JS로 에피소드 목록이 이곳에 생성됩니다. -->
    </div>

    <!-- 비주얼 노벨 플레이어 -->
    <div id="story-player">
        <div id="story-bg"></div>
        <div id="story-character-container">
            <img id="story-character" src="" alt="캐릭터">
        </div>
        
        <div id="story-controls">
            <button class="story-btn" onclick="endStory()">나가기</button>
        </div>

        <div id="dialogue-ui" onclick="nextScene()">
            <div id="speaker-name-box">이름</div>
            <div id="dialogue-text">대사가 출력되는 공간입니다.</div>
            <div class="next-indicator">▶</div>
        </div>
    </div>

</div>

<script>
    // [화면 해상도 자동 맞춤]
    const appContainer = document.getElementById('app-container');
    function resize() {
        const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        appContainer.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resize);
    resize();

    // =========================================================================
    // [스토리 추가 방법]
    // 아래 storyEpisodes 배열 안에 새로운 스토리를 계속 추가하시면 됩니다.
    // 
    // 작성 규칙:
    // id: 에피소드 고유 영문 이름 (예: 'ep1')
    // title: 목록에 표시될 제목
    // desc: 목록에 표시될 설명
    // thumb: 목록에 표시될 썸네일 이미지 (이미지 폴더 내)
    // scenes: 실제 대화 장면들의 배열입니다.
    //   - bg: 배경 이미지 파일명 (안 적으면 이전 배경 유지)
    //   - char: 등장할 캐릭터 이미지 파일명 (안 적으면 이전 캐릭터 유지, 'none' 이면 캐릭터 사라짐)
    //   - name: 대화창 위에 뜰 이름 (안 적으면 이름창 사라짐, 내레이션 효과)
    //   - text: 실제 출력될 대사
    //   - color: 이름창의 배경색 (캐릭터의 고유 컬러코드)
    //   - effect: 'shake' 라고 적으면 대사 출력 시 화면이 흔들립니다. (분노, 놀람 연출)
    // =========================================================================

    const storyEpisodes = [
        {
            id: 'ep1',
            title: '제 1장: 막이 오르다, 페스티벌 준비!',
            desc: '네뷸라 비츠 페스티벌을 앞두고 바빠진 효빈교통공사. 과연 무사히 준비를 마칠 수 있을까?',
            thumb: '교통공사사무실.webp',
            scenes: [
                { bg: '교통공사사무실.webp', name: '고나미', char: '고나미.webp', color: '#0077DD', text: '매니저님, 네뷸라 비츠 페스티벌 기획안 초안 확인했습니다. 규정에 어긋나는 부분은 없습니다만...' },
                { name: '고나미', text: '예산 집행 내역이 조금 타이트합니다. 미소하 주임 쪽에 한 번 더 확인을 거치는 게 좋겠습니다.' },
                { name: '미소하', char: '미소하.webp', color: '#EE0022', text: '(상냥하게 웃으며) 안 그래도 방금 예산팀 명치... 아니, 부장님과 면담을 마친 참이에요.' },
                { name: '미소하', text: '예비비에서 15% 정도 추가로 끌어올 수 있도록 다중회귀분석 자료를 제출했답니다. 훗.' },
                { bg: '곽산역승무본부.webp', name: '하루빈', char: '하루빈.webp', color: '#00CCAA', text: '우와! 역시 소하 주임님! 그럼 제 간식비도 조금 늘어나는 거 맞죠~?' },
                { name: '고나미', char: '고나미.webp', color: '#0077DD', effect: 'shake', text: '하루빈 사원. 축제 준비 기간입니다. 공금 횡령은 규정 위반입니다.' },
                { name: '하루빈', char: '하루빈.webp', color: '#00CCAA', text: '아유~ 농담이죠 농담! 자본주의 미소 장착하고 현장 통제 완벽하게 할 테니까 걱정 마세요!' },
                { char: 'none', text: '그렇게, 효빈교통공사 마스코트들의 시끌벅적한 축제 준비가 시작되었다.' }
            ]
        },
        {
            id: 'ep2',
            title: '제 2장: 공대 너드와 몽키스패너',
            desc: '기계실에서 들려오는 수상한 파열음. 유리아와 세하가 또 무슨 짓을 벌인 걸까?',
            thumb: '기계실.webp',
            scenes: [
                { bg: '기계실.webp', char: 'none', text: '콰당탕탕!! (기계가 무너지는 소리)' },
                { name: '유리아', char: '유리아.webp', color: '#9856FF', text: '헉! 야바이...! 매니저님, 제가 그런 거 아니에요! 그냥 이 버튼이 뭔지 궁금해서...' },
                { name: '임세하', char: '임세하.webp', color: '#FF8899', effect: 'shake', text: '바보야! 그건 감속기 비상 정지 밸브잖아! 베어링 마찰 계수 다 틀어지게 생겼네!' },
                { name: '임세하', text: '하아... WD-40 가져와. 3분 안에 다시 세팅한다. 매니저님은 뒤로 물러나 계세요. 기름 튑니다.' },
                { name: '임세정', char: '임세정.webp', color: '#FF8899', text: '설명은 나중에! 당장 뒤로 물러나! 유리아, 넌 거기 멈춰. 더 이상 기계 만지지 마.' },
                { name: '유리아', char: '유리아.webp', color: '#9856FF', text: '(울먹이며) 힝... 요소로... 죄송합니다아...' },
                { char: 'none', text: '현장의 화신 임세정 대리의 등장으로 기계실은 5분 만에 평화를 되찾았다.' }
            ]
        },
        {
            id: 'ep3',
            title: '막간: 창전동 모노레일의 우아한(?) 일상',
            desc: '개통을 앞둔 창전선. 홍보대사 심세이의 우아한 일상에 이덕희가 난입한다.',
            thumb: '해수욕장.webp',
            scenes: [
                { bg: '마케팅팀.webp', name: '심세이', char: '심세이.webp', color: '#33AAFF', text: '여러분, 창전 모노레일 홍보대사 심세이입니다. 오늘 제 패션, 무척 우아하지 않나요?' },
                { name: '이덕희', char: '이덕희.webp', color: '#FF4F91', text: '세이 언니!! (냅다 달려들며) 오늘 입은 옷, 하스노소라 유닛 라이브 의상 맞지?! 대박이야!' },
                { name: '심세이', color: '#33AAFF', effect: 'shake', text: '¡Ayúdame! (사람 살려!) 17살인 나한테 왜 자꾸 언니라고 부르는 거야, 이 럽순아!! 저리 가!' },
                { name: '전노아', char: '전노아.webp', color: '#6677CC', text: '하하! 두 분 다 텐션 좋네요! 3줄 요약: 이덕희 난입, 심세이 멘붕, 홍보팀 폭소. 오늘 기안서 소재로 딱인데요?' }
            ]
        }
    ];

    // =========================================================================

    const episodeListUI = document.getElementById('episode-selection');
    const storyPlayerUI = document.getElementById('story-player');
    const topBarUI = document.getElementById('top-bar');
    
    // 스토리 관련 UI 요소
    const bgUI = document.getElementById('story-bg');
    const charUI = document.getElementById('story-character');
    const nameBoxUI = document.getElementById('speaker-name-box');
    const textUI = document.getElementById('dialogue-text');
    const appWrapper = document.getElementById('app-container');

    let currentScenes = [];
    let currentSceneIndex = 0;
    let isTyping = false;

    // 1. 에피소드 목록 렌더링
    function renderEpisodes() {
        episodeListUI.innerHTML = '';
        storyEpisodes.forEach(ep => {
            const card = document.createElement('div');
            card.className = 'episode-card';
            card.innerHTML = `
                <div class="episode-thumb">
                    <img src="이미지/${ep.thumb}" onerror="this.src='https://placehold.co/160x100/1a1a2e/ffffff?text=NO+IMAGE'">
                </div>
                <div>
                    <h3 class="text-2xl font-black text-white mb-2">${ep.title}</h3>
                    <p class="text-gray-400 text-sm break-keep leading-relaxed">${ep.desc}</p>
                </div>
            `;
            card.onclick = () => startStory(ep.id);
            episodeListUI.appendChild(card);
        });
    }

    // 2. 스토리 시작
    function startStory(episodeId) {
        const ep = storyEpisodes.find(e => e.id === episodeId);
        if(!ep || ep.scenes.length === 0) return;

        currentScenes = ep.scenes;
        currentSceneIndex = 0;

        // UI 전환
        topBarUI.classList.add('hide');
        episodeListUI.style.display = 'none';
        storyPlayerUI.style.display = 'flex';

        // 초기화
        bgUI.style.backgroundImage = '';
        charUI.src = '';
        charUI.classList.remove('show');
        appWrapper.classList.remove('shake-effect');

        playScene();
    }

    // 3. 씬 재생 (대사 진행)
    function playScene() {
        if (currentSceneIndex >= currentScenes.length) {
            endStory();
            return;
        }

        const scene = currentScenes[currentSceneIndex];
        
        // 배경 변경
        if (scene.bg) {
            bgUI.style.backgroundImage = `url('이미지/${scene.bg}')`;
        }

        // 캐릭터 변경
        if (scene.char) {
            if(scene.char === 'none') {
                charUI.classList.remove('show');
            } else {
                charUI.src = `이미지/${scene.char}`;
                charUI.classList.add('show');
            }
        }

        // 이름창 표시
        if (scene.name) {
            nameBoxUI.style.display = 'block';
            nameBoxUI.innerText = scene.name;
            if (scene.color) {
                nameBoxUI.style.backgroundColor = scene.color;
                document.getElementById('dialogue-ui').style.borderTopColor = scene.color;
            } else {
                nameBoxUI.style.backgroundColor = 'var(--color-active)';
                document.getElementById('dialogue-ui').style.borderTopColor = 'var(--color-active)';
            }
        } else {
            nameBoxUI.style.display = 'none';
            document.getElementById('dialogue-ui').style.borderTopColor = 'rgba(255,255,255,0.2)';
        }

        // 특수 효과 (흔들림)
        appWrapper.classList.remove('shake-effect');
        void appWrapper.offsetWidth; // reflow (애니메이션 재시작 트릭)
        if (scene.effect === 'shake') {
            appWrapper.classList.add('shake-effect');
        }

        // 텍스트 타이핑 효과 적용
        textUI.innerText = '';
        isTyping = true;
        let charIndex = 0;
        const textToType = scene.text;
        
        function typeWriter() {
            if (charIndex < textToType.length && isTyping) {
                textUI.innerText += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 20); // 타이핑 속도 조절 (20ms)
            } else {
                isTyping = false;
                textUI.innerText = textToType; // 타이핑 스킵 방어
            }
        }
        typeWriter();
    }

    // 4. 클릭 시 다음 씬으로 넘어가기
    function nextScene() {
        // 타이핑 중이면 전체 텍스트 즉시 표시 (스킵)
        if (isTyping) {
            isTyping = false;
            textUI.innerText = currentScenes[currentSceneIndex].text;
            return;
        }

        // 아니면 다음 씬으로
        currentSceneIndex++;
        playScene();
    }

    // 5. 스토리 종료 후 목록으로 복귀
    function endStory() {
        storyPlayerUI.style.display = 'none';
        episodeListUI.style.display = 'flex';
        topBarUI.classList.remove('hide');
        appWrapper.classList.remove('shake-effect');
    }

    // 초기화 실행
    renderEpisodes();

</script>
