    <script>
        // DOMContentLoaded 이벤트를 놓치지 않게 즉시 실행 처리
        const originalAddEventListener = document.addEventListener;
        document.addEventListener = function(type, listener, options) {
            if (type === 'DOMContentLoaded') {
                setTimeout(listener, 10);
            } else {
                originalAddEventListener.call(document, type, listener, options);
            }
        };

        // 검색창 엔터키 입력 처리
        window.handleSearch = function(inputId) {
            let input = document.getElementById(inputId).value.trim();
            if(input) {
                if(input.endsWith('.js')) input = input.replace('.js', '');
                let targetHash = window.aliasMap && window.aliasMap[input] ? window.aliasMap[input] : input;
                window.location.hash = targetHash;
            }
        };

        // 모달창 토글 (임시)
        window.toggleModal = function(modalId) {
            console.log(modalId + " 모달창이 열렸습니다.");
        };

        function loadTemplateByHash() {
            let hash = window.location.hash.substring(1);
            if (!hash) { hash = "틀_미개통노선도"; window.location.hash = hash; return; }
            hash = decodeURIComponent(hash);

            let folderPath = window.filePaths ? window.filePaths[hash] : undefined;
            if (folderPath === undefined) { folderPath = "assets/"; } 
            
            let fullPath = folderPath + hash + ".js";
            let data = window.specificDB ? window.specificDB[hash] : null;

            if (!data) {
                let formattedTitle = hash.replace(/_/g, ' ');
                let isTemplate = hash.startsWith('틀') || hash.endsWith('행정') || hash.endsWith('학교') || hash.endsWith('목록');
                data = {
                    title: (isTemplate && !formattedTitle.startsWith('틀')) ? "틀:" + formattedTitle : formattedTitle,
                    categories: isTemplate ? ["자동 분류 틀"] : ["자동 분류 문서"],
                    overview: `<code>${hash}.js</code> 뷰어입니다.`
                };
            }

            document.title = data.title + " - HyobinViewer";
            document.getElementById('page-title').innerText = data.title;
            document.getElementById('doc-title').innerText = data.title + "/설명문서";
            document.getElementById('doc-overview').innerHTML = data.overview;
            document.getElementById('doc-path').innerText = folderPath === "" ? "(Root Directory)" : folderPath;
            document.getElementById('category-list').innerHTML = data.categories.map(c => `<a href="${c}.html" class="wiki-link">${c}</a>`).join(" | ");
            document.getElementById('doc-usage').innerText = `<script src="${fullPath}"><\/script>`;

            document.getElementById('doc-history').innerHTML = `
                <li><strong>경로 검증:</strong> <code>${fullPath}</code> 로드 중...</li>
                <li><strong>종류:</strong> 동적 렌더링 스크립트 (자동 컨테이너 할당)</li>
            `;

            const renderZone = document.getElementById('template-render-zone');
            renderZone.innerHTML = '';

            const originalWrite = document.write;
            const originalWriteln = document.writeln;
            document.write = function(html) { renderZone.insertAdjacentHTML('beforeend', html); };
            document.writeln = function(html) { renderZone.insertAdjacentHTML('beforeend', html + '\n'); };

            // 이전 스크립트 찌꺼기 제거
            document.querySelectorAll('.dynamic-injected-script').forEach(s => s.remove());

            // ★ 핵심 로직: 스크립트를 바로 실행하지 않고, 먼저 텍스트로 읽어옵니다.
            fetch(fullPath)
                .then(response => {
                    if (!response.ok) throw new Error("파일 로드 실패");
                    return response.text();
                })
                .then(scriptText => {
                    // 1. JS 파일 내용을 스캔해서 이 파일이 찾고 있는 클래스(class)와 아이디(id)를 싹 다 찾아냅니다.
                    let classes = [];
                    let ids = [];
                    
                    [...scriptText.matchAll(/querySelector(?:All)?\(['"]\.([^'"]+)['"]\)/g)].forEach(m => classes.push(m[1]));
                    [...scriptText.matchAll(/getElementsByClassName\(['"]([^'"]+)['"]\)/g)].forEach(m => classes.push(m[1]));
                    
                    [...scriptText.matchAll(/querySelector(?:All)?\(['"]#([^'"]+)['"]\)/g)].forEach(m => ids.push(m[1]));
                    [...scriptText.matchAll(/getElementById\(['"]([^'"]+)['"]\)/g)].forEach(m => ids.push(m[1]));

                    // 2. 찾아낸 이름(클래스)대로 렌더링 존에 미리 빈 상자를 깔아줍니다.
                    [...new Set(classes)].forEach(cls => {
                        let div = document.createElement('div');
                        div.className = cls;
                        div.style.width = "100%";
                        renderZone.appendChild(div);
                    });

                    // 3. 찾아낸 이름(ID)대로 렌더링 존에 미리 빈 상자를 깔아줍니다.
                    [...new Set(ids)].forEach(id => {
                        if(!document.getElementById(id)) {
                            let div = document.createElement('div');
                            div.id = id;
                            div.style.width = "100%";
                            renderZone.appendChild(div);
                        }
                    });

                    // 기본 폴백 ID들 (만약을 대비해 추가)
                    const fallbackIds = [hash + '-container', hash];
                    fallbackIds.forEach(id => {
                        if(!document.getElementById(id)) {
                            let div = document.createElement('div');
                            div.id = id;
                            div.style.width = "100%";
                            renderZone.appendChild(div);
                        }
                    });

                    // 4. 완벽하게 무대가 세팅되었으니, 이제 스크립트를 진짜로 실행합니다.
                    const script = document.createElement('script');
                    script.textContent = scriptText; // 읽어온 코드를 그대로 삽입
                    script.className = 'dynamic-injected-script';
                    renderZone.appendChild(script);

                    // 마무리 원상복구
                    document.write = originalWrite;
                    document.writeln = originalWriteln;
                })
                .catch(err => {
                    document.write = originalWrite;
                    document.writeln = originalWriteln;
                    renderZone.innerHTML += `<div style="padding:20px; color:#d9534f; text-align:center; font-weight:bold;">오류: 스크립트 경로(${fullPath})에서 파일을 불러올 수 없습니다. 경로 또는 파일명을 확인하세요.</div>`;
                });
        }

        window.addEventListener('hashchange', loadTemplateByHash);
        window.addEventListener('DOMContentLoaded', loadTemplateByHash);
    </script>
    
    <!-- ★ 새로 추가: Node.js가 생성한 통합 인덱스 (경로, 별칭, 설명문서) 로드 ★ -->
    <script src="assets/js_paths.js"></script>

    <script src="assets/wiki_index.js"></script>
    <script src="assets/hb_wiki_core.js"></script>
    <script src="assets/hb_index_scripts.js"></script>
    <script src="assets/jana.js"></script>
</body>
