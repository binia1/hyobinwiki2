<style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
        
        :root { 
            --wiki-main: #7777AA; --wiki-border: #ccc; --wiki-bg: #ffffff; 
            --wiki-text: #373a3c; --wiki-gray-bg: #F9F9FA; --wiki-link: #0022AA; --wiki-box-bg: #ffffff;
        }

        body.dark-mode {
            --wiki-main: #8888CC; --wiki-border: #444; --wiki-bg: #1f2023; 
            --wiki-text: #ddd; --wiki-gray-bg: #F9F9FA; --wiki-link: #0022AA; --wiki-box-bg: #2a2d30;
        }

        body { font-family: 'Noto Sans KR', sans-serif; background-color: var(--wiki-bg); color: var(--wiki-text); line-height: 1.6; word-break: keep-all; margin: 0; transition: background-color 0.3s, color 0.3s; }
        .wiki-container { max-width: 1300px; margin: 0 auto; padding: 20px 40px; border-left: 1px solid var(--wiki-border); border-right: 1px solid var(--wiki-border); min-height: 100vh; background-color: var(--wiki-bg); }

        .txt-lvl-1 { font-size: var(--font-h1) !important; font-weight: 900 !important; color: var(--wiki-main); line-height: 1.1; letter-spacing: -1px; margin-bottom: 0; } 
        .wiki-link { color: var(--wiki-link); font-weight: bold; cursor: pointer; text-decoration: none; }
        .wiki-link:hover { text-decoration: underline; }
        
        table.recent-changes-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        table.recent-changes-table th, table.recent-changes-table td { border-bottom: 1px solid var(--wiki-border); padding: 10px 12px; text-align: left; vertical-align: middle; }
        table.recent-changes-table th { background-color: var(--wiki-gray-bg); font-weight: bold; color: var(--wiki-text); border-top: 2px solid var(--wiki-main); }
        table.recent-changes-table tr:hover td { background-color: var(--wiki-gray-bg); }
        table.recent-changes-table tr:last-child td { border-bottom: none; }

        .byte-plus { color: #155724; font-weight: bold; }
        .byte-minus { color: #721c24; font-weight: bold; }
        .byte-zero { color: #6c757d; font-weight: bold; }
        body.dark-mode .byte-plus { color: #4ade80; }
        body.dark-mode .byte-minus { color: #f87171; }
        body.dark-mode .byte-zero { color: #9ca3af; }

        .badge-new { display: inline-block; background-color: #dc3545; color: white; font-size: 0.65rem; padding: 2px 5px; border-radius: 3px; font-weight: bold; margin-right: 5px; vertical-align: middle; }

        .filter-toolbar { background-color: var(--wiki-gray-bg); border: 1px solid var(--wiki-border); border-radius: 4px; padding: 15px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .filter-select, .filter-input { padding: 6px 10px; border: 1px solid var(--wiki-border); border-radius: 4px; background: var(--wiki-box-bg); color: var(--wiki-text); outline: none; font-size: 0.9rem; }
        .filter-btn { background-color: var(--wiki-main); color: white; border: none; padding: 6px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .filter-btn:hover { background-color: #666699; }
        .nav-logo-box { width: 30px; height: 30px; background: white; color: var(--wiki-main); border-radius: 4px; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

        .spa-hidden { display: none !important; }

        .diff-table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 0.9rem; border: 1px solid var(--wiki-border); table-layout: fixed; }
        .diff-table th { background-color: var(--wiki-gray-bg); padding: 8px; text-align: center; border-bottom: 1px solid var(--wiki-border); }
        .diff-table td { padding: 4px 8px; vertical-align: top; word-wrap: break-word; }
        .diff-line-info { background-color: #f1f8ff; color: #0366d6; text-align: center; padding: 5px; border-bottom: 1px solid var(--wiki-border); grid-column: span 2; }
        .diff-del-bg { background-color: #ffeef0; color: #b30000; text-decoration: line-through; }
        .diff-add-bg { background-color: #e6ffed; color: #22863a; }
        .diff-empty { background-color: var(--wiki-gray-bg); }
        
        body.dark-mode .diff-line-info { background-color: #1f2a3a; color: #58a6ff; }
        body.dark-mode .diff-del-bg { background-color: #4a1a1f; color: #ff9da6; }
        body.dark-mode .diff-add-bg { background-color: #1a3b22; color: #8cf2a1; }

        .history-timeline { list-style: none; padding: 0; margin: 0; border-left: 3px solid var(--wiki-main); margin-left: 10px; }
        .history-timeline li { position: relative; padding-left: 20px; margin-bottom: 20px; }
        .history-timeline li::before { content: ''; position: absolute; left: -9px; top: 5px; width: 15px; height: 15px; background: white; border: 3px solid var(--wiki-main); border-radius: 50%; }
        body.dark-mode .history-timeline li::before { background: var(--wiki-bg); }

        #wiki-msg-box { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 24px; border-radius: 50px; font-size: 14px; z-index: 10000; display: none; transition: opacity 0.3s; }
/* 로고 박스 스타일 추가 */
        .nav-logo-box {
            width: 30px; height: 30px; background: white; color: var(--wiki-main);
            border-radius: 4px; font-weight: 900; display: flex; align-items: center;
            justify-content: center; font-size: 1.2rem;
        }   
 
    
</style>

            const box = document.getElementById('wiki-msg-box');
            if(!box) return;
            box.textContent = msg;
            box.style.display = 'block';
            box.style.opacity = '1';
            setTimeout(() => {
                box.style.opacity = '0';
                setTimeout(() => box.style.display = 'none', 300);
            }, 3000);
        }

        // ==========================================
        // 2. 엔진: 자동 생성 및 렌더링
        // ==========================================
        let currentChangesData = [];
        let autoRefreshTimer;

        function formatByteDiff(diff) {
            if (diff > 0) return `<span class="byte-plus">+${diff}</span>`;
            if (diff < 0) return `<span class="byte-minus">${diff}</span>`;
            return `<span class="byte-zero">0</span>`;
        }

        function getCategoryByTitle(title) {
            for (const [key, data] of Object.entries(loreData)) {
                if (key !== 'general' && data.keywords.some(kw => title.includes(kw))) return key;
            }
            if(title.toLowerCase().includes('bus')) return 'bus';
            return 'general';
        }

        function generateRandomChanges(count = 50) {
            const changes = [];
            // window.HB_WIKI_PAGES 연동
            const pagesSource = (window.HB_WIKI_PAGES && window.HB_WIKI_PAGES.length > 0) 
                ? window.HB_WIKI_PAGES 
                : [
                    { title: "효빈광역시", href: "효빈광역시.html" }, { title: "박효빈", href: "박효빈.html" },
                    { title: "나카스 카스미", href: "나카스_카스미.html" }, { title: "한바다", href: "한바다.html" }, 
                    { title: "2세대 시내버스", href: "2세대_버스.html" }, { title: "효빈복지대학교", href: "복지대.html" }, 
                    { title: "창전선", href: "창전선.html" }, { title: "국민건강보험공단 효빈지사", href: "#"}, 
                    { title: "홈플러스_고송점", href: "#"}, { title: "안천역(일반열차)", href: "#"}, 
                    { title: "마맹호", href: "#"}, { title: "최_모_부장판사", href:"#"}, { title: "윤재훈 지리기 챌린지", href:"#"}
                ];

            for (let i = 0; i < count; i++) {
                const randomDoc = pagesSource[Math.floor(Math.random() * pagesSource.length)];
                const title = randomDoc.title;
                const cat = getCategoryByTitle(title);
                
                let ns = "문서";
                if (title.includes("틀:")) ns = "틀";
                else if (title.includes("분류:")) ns = "분류";

                const diffVal = Math.floor(Math.random() * 2500) - 1000;
                let summary = (Math.abs(diffVal) < 50) 
                    ? "오타 수정 및 띄어쓰기 교정" 
                    : loreData[cat].summaries[Math.floor(Math.random() * loreData[cat].summaries.length)];

                changes.push({
                    sortTime: Math.floor(Math.random() * 60),
                    title: title,
                    href: randomDoc.href || `${title}.html`,
                    ns: ns,
                    diff: diffVal,
                    user: loreData[cat].authors[Math.floor(Math.random() * loreData[cat].authors.length)],
                    isNew: Math.random() > 0.9,
                    minor: Math.abs(diffVal) < 50,
                    summary: summary
                });
            }
            changes.sort((a, b) => a.sortTime - b.sortTime);
            return changes;
        }

        function renderChanges() {
            const tbody = document.getElementById('recentChangesBody');
            if (!tbody) return;

            const nsFilter = document.getElementById('namespaceFilter').value;
            const userFilter = document.getElementById('userFilter').value.toLowerCase().trim();
            const excludeMinor = document.getElementById('excludeMinor').checked;
            tbody.innerHTML = ''; 

            currentChangesData.forEach(item => {
                if (nsFilter !== '전체' && item.ns !== nsFilter) return;
                if (userFilter && !item.user.toLowerCase().includes(userFilter)) return;
                if (excludeMinor && item.minor) return;

                const tr = document.createElement('tr');
                const newBadge = item.isNew ? `<span class="badge-new">N</span>` : '';
                const displayDocName = item.ns === '문서' ? item.title : `<span class="text-gray-500">${item.ns}:</span>${item.title.replace(`${item.ns}:`, '')}`;
                const timeStr = item.sortTime === 0 ? "방금 전" : `${item.sortTime}분 전`;

                // 🔥 작성자 링크를 동적 앵커(작성자문서.html#유저명)로 연결 🔥
                tr.innerHTML = `
                    <td class="text-gray-600 dark:text-gray-400 font-medium">${timeStr}</td>
                    <td>${newBadge}<a href="${item.href}" class="wiki-link">${displayDocName}</a></td>
                    <td class="text-xs text-gray-500 font-bold">
                        <a href="javascript:void(0)" onclick="navigateSPA('diff', '${item.title}', ${item.diff})" class="hover:text-blue-500 hover:underline">비교</a> | 
                        <a href="javascript:void(0)" onclick="navigateSPA('history', '${item.title}')" class="hover:text-blue-500 hover:underline">역사</a>
                    </td>
                    <td class="text-sm">${formatByteDiff(item.diff)}</td>
                    <td><a href="작성자문서.html#${item.user}" class="text-[var(--wiki-text)] hover:underline">${item.user}</a></td>
                    <td class="text-sm text-gray-500 italic truncate max-w-[200px]" title="${item.summary}">${item.summary}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function loadMoreChanges(manual = false) {
            currentChangesData = generateRandomChanges(50);
            renderChanges();
            if(manual) showWikiMsg('🔄 새로운 최근 변경 내역이 수동으로 업데이트되었습니다.');
        }

        // 2분마다 자동 새로고침 설정
        function startAutoRefresh() {
            if(autoRefreshTimer) clearInterval(autoRefreshTimer);
            autoRefreshTimer = setInterval(() => {
                if(!document.getElementById('view-main').classList.contains('spa-hidden')) {
                    currentChangesData = generateRandomChanges(50);
                    renderChanges();
                    showWikiMsg('🔄 최근 변경 내역이 자동으로 업데이트되었습니다.');
                }
            }, 120000); // 120,000ms = 2분
        }

        // ==========================================
        // 3. SPA 라우팅 및 지능형 뷰 렌더링 로직
        // ==========================================
        const views = ['view-main', 'view-diff', 'view-history'];

        function showView(viewId) {
            views.forEach(v => {
                const el = document.getElementById(v);
                if(el) {
                    if(v === viewId) el.classList.remove('spa-hidden');
                    else el.classList.add('spa-hidden');
                }
            });
            window.scrollTo(0, 0);
        }

        function navigateSPA(action, title, diff = 0) {
            const url = `?${action}=${encodeURIComponent(title)}`;
            history.pushState({ action, title, diff }, '', url);
            handleRoute(action, title, diff);
        }

        function goBackSPA() {
            history.back();
        }

        function handleRoute(action, title, diff) {
            if (action === 'diff') {
                renderIntelligentDiff(title, diff);
                showView('view-diff');
            } else if (action === 'history') {
                renderIntelligentHistory(title);
                showView('view-history');
            } else {
                showView('view-main');
            }
        }

        window.addEventListener('popstate', (event) => {
            if (event.state) handleRoute(event.state.action, event.state.title, event.state.diff);
            else showView('view-main');
        });

        // 🧠 초정밀 지능형 비교(Diff) 생성기
        function renderIntelligentDiff(title, diff) {
            document.getElementById('diffDocTitle').textContent = title;
            const revCurr = Math.floor(Math.random() * 500) + 100;
            document.getElementById('diffPrevRev').textContent = revCurr - 1;
            document.getElementById('diffCurrRev').textContent = revCurr;

            const cat = getCategoryByTitle(title);
            const data = loreData[cat];
            const tbody = document.getElementById('diffTableBody');
            
            const lineNum = Math.floor(Math.random() * 50) + 1;
            let html = `<tr><td colspan="2" class="diff-line-info">@@ -${lineNum},3 +${lineNum},4 @@ 해당 문서 변경점</td></tr>`;

            if (diff <= -50) {
                const delText = data.diffDel[Math.floor(Math.random() * data.diffDel.length)];
                html += `<tr><td class="diff-del-bg">${delText}</td><td class="diff-empty"></td></tr>`;
                if(Math.random() > 0.5) html += `<tr><td class="diff-del-bg">- 불필요한 각주 및 중복 문단 삭제 처리됨.</td><td class="diff-empty"></td></tr>`;
            } else if (diff >= 50) {
                const addText = data.diffAdd[Math.floor(Math.random() * data.diffAdd.length)];
                html += `<tr><td class="diff-empty"></td><td class="diff-add-bg">${addText}</td></tr>`;
                if(Math.random() > 0.5) html += `<tr><td class="diff-empty"></td><td class="diff-add-bg">+ [관련 틀] 및 디자인 양식 업데이트.</td></tr>`;
            } else {
                html += `<tr><td class="diff-del-bg">- 기존 서술 중 띄어쓰기나 맞춤법이 일부 틀린 부분이 존재하였다.</td>
                             <td class="diff-add-bg">+ 기존 서술 중 띄어쓰기나 맞춤법이 일부 틀린 부분이 존재하였다. (수정됨)</td></tr>`;
            }

            tbody.innerHTML = html;
        }

        // 🧠 초정밀 지능형 문서 역사 생성기
        function renderIntelligentHistory(title) {
            document.getElementById('historyDocTitle').textContent = title;
            const ul = document.getElementById('historyTimelineBody');
            ul.innerHTML = ''; 

            const cat = getCategoryByTitle(title);
            const authors = loreData[cat].authors;
            const summaries = loreData[cat].summaries;

            const historyCount = Math.floor(Math.random() * 6) + 5;
            let baseRev = Math.floor(Math.random() * 500) + 100;
            let currentDay = new Date(); // 현재 시점 기준

            for(let i=0; i<historyCount; i++) {
                const li = document.createElement('li');
                
                let user, sum, diff;
                if (i === historyCount - 1) {
                    user = authors[0] || "Admin_01";
                    sum = "새 문서 생성";
                    diff = Math.floor(Math.random() * 3000) + 500;
                } else {
                    user = authors[Math.floor(Math.random() * authors.length)];
                    sum = summaries[Math.floor(Math.random() * summaries.length)];
                    diff = Math.floor(Math.random() * 1000) - 500;
                }

                const dateStr = `${currentDay.getFullYear()}-${String(currentDay.getMonth()+1).padStart(2,'0')}-${String(currentDay.getDate()).padStart(2,'0')} ${String(Math.floor(Math.random()*24)).padStart(2,'0')}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`;

                // 🔥 작성자 링크를 동적 앵커(작성자문서.html#유저명)로 연결 🔥
                li.innerHTML = `
                    <div class="flex items-center gap-2 mb-1">
                        <span class="font-bold text-[var(--wiki-main)]">r${baseRev}</span>
                        <span class="text-xs text-gray-400">|</span>
                        <a href="작성자문서.html#${user}" class="text-[var(--wiki-link)] font-bold hover:underline">${user}</a>
                        <span class="text-xs text-gray-400">|</span>
                        ${formatByteDiff(diff)}
                        <span class="text-xs text-gray-400 ml-auto">${dateStr}</span>
                    </div>
                    <div class="text-sm text-gray-500 bg-[var(--wiki-gray-bg)] p-2 rounded border border-[var(--wiki-border)] inline-block">
                        "${sum}"
                    </div>
                `;
                ul.appendChild(li);
                
                baseRev--; 
                currentDay.setDate(currentDay.getDate() - Math.floor(Math.random() * 3));
            }
        }

        // 초기 로드 및 자동 새로고침 타이머 가동
        loadMoreChanges();
        startAutoRefresh();

        const params = new URLSearchParams(window.location.search);
        if(params.has('diff')) handleRoute('diff', params.get('diff'), 0);
        else if(params.has('history')) handleRoute('history', params.get('history'), 0);
        else showView('view-main');

    </script>
</body>
</html>
