<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="이미지/효빈위키아이콘.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 활동 • Instagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Noto Sans KR";
            background-color: #fafafa;
            color: #262626;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #dbdbdb; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #c7c7c7; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    </style>
<script src="ad_logic.js"></script>
</head>
<body class="flex min-h-screen bg-white xl:bg-[#fafafa]">

    <nav class="fixed top-0 left-0 h-full w-[72px] xl:w-[244px] bg-white border-r border-gray-300 flex flex-col pt-8 pb-5 px-3 z-40 transition-all duration-300">
        <div class="mb-8 px-3 cursor-pointer" onclick="window.location.href='효빈광역시청 인스타그램.html'">
            <img src="이미지/인스타그램.svg" alt="Instagram" class="hidden xl:block h-7 w-auto object-contain">
            <i class="fab fa-instagram text-2xl xl:hidden block text-center"></i>
        </div>

        <div class="flex flex-col gap-2 flex-1">
            <a href="효빈광역시청 인스타그램.html" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black">
                <i class="fas fa-home text-2xl group-hover:scale-105 transition-transform"></i>
                <span class="hidden xl:block text-[16px]">홈</span>
            </a>
            <a href="인스타그램 만들기.html" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black">
                <i class="far fa-plus-square text-2xl group-hover:scale-105 transition-transform"></i>
                <span class="hidden xl:block text-[16px]">만들기</span>
            </a>
            <a href="효빈광역시청 인스타그램.html" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black">
                <img src="이미지/효빈시_로고.png" class="w-6 h-6 rounded-full border border-gray-300">
                <span class="hidden xl:block text-[16px]">프로필</span>
            </a>
        </div>
    </nav>

    <main class="flex-1 ml-[72px] xl:ml-[244px] bg-white xl:bg-[#fafafa] min-h-screen flex justify-center py-6 px-4">
        <div class="w-full max-w-[935px] flex flex-col md:flex-row bg-white xl:border xl:border-gray-300 xl:rounded-md xl:shadow-sm h-[85vh]">
            
            <!-- 좌측 메뉴 리스트 -->
            <div class="w-full md:w-[30%] flex-shrink-0 border-r border-gray-300 flex flex-col overflow-y-auto">
                <div class="p-6 pb-2">
                    <h2 class="text-xl font-bold text-[#262626]">내 활동</h2>
                </div>
                
                <div class="flex flex-col py-2" id="activity-menu">
                    <button class="flex items-center gap-3 px-6 py-3 text-left hover:bg-gray-50 transition bg-gray-100 border-l-2 border-black" onclick="switchTab(this, 'interactions')">
                        <i class="fas fa-exchange-alt w-5 text-center text-gray-700"></i>
                        <span class="text-[15px] font-bold text-[#262626]">인터랙션 (댓글)</span>
                    </button>
                    <button class="flex items-center gap-3 px-6 py-3 text-left hover:bg-gray-50 transition border-l-2 border-transparent" onclick="switchTab(this, 'photos')">
                        <i class="fas fa-image w-5 text-center text-gray-500"></i>
                        <span class="text-[15px] text-[#262626]">사진 및 동영상</span>
                    </button>
                </div>
            </div>

            <!-- 우측 상세 컨텐츠 -->
            <div class="flex-1 overflow-y-auto p-8 relative bg-white">
                
                <!-- [탭 1] 인터랙션 -->
                <div id="tab-interactions" class="tab-content animate-fade-in block">
                    <h3 class="text-2xl font-bold mb-2">인터랙션</h3>
                    <p class="text-gray-500 text-[15px] mb-8">회원님이 좋아했거나, 댓글을 달았거나, 다른 인터랙션을 한 콘텐츠를 검토하고 삭제할 수 있습니다.</p>

                    <!-- 댓글 목록 렌더링 영역 -->
                    <div id="interactions-list" class="flex flex-col gap-4">
                        <!-- JS에서 데이터 로드됨 -->
                    </div>
                </div>

                <!-- [탭 2] 사진 및 동영상 -->
                <div id="tab-photos" class="tab-content hidden animate-fade-in">
                    <h3 class="text-2xl font-bold mb-2">사진 및 동영상</h3>
                    <p class="text-gray-500 text-[15px] mb-8">회원님이 공유한 사진과 동영상을 확인, 보관하거나 삭제하세요.</p>
                    
                    <!-- 사진 목록 렌더링 영역 -->
                    <div id="photos-grid" class="grid grid-cols-3 gap-1">
                        <!-- JS에서 데이터 로드됨 -->
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        // 화면 로드 시 실행 (데이터 불러오기)
        window.onload = () => {
            initializeMockData(); // 초기 세계관 데이터가 없으면 셋업
            renderActivities();   // 로컬 스토리지에서 읽어서 화면에 그리기
        };

        // 🌟 핵심: 로컬 스토리지 데이터 렌더링
        function renderActivities() {
            const activities = JSON.parse(localStorage.getItem('ig_activities') || '[]');
            
            const interactionsList = document.getElementById('interactions-list');
            const photosGrid = document.getElementById('photos-grid');
            
            interactionsList.innerHTML = '';
            photosGrid.innerHTML = '';

            // 업로드한 게시물이 없을 때 표시할 빈 화면 처리용 변수
            let photoCount = 0;
            let commentCount = 0;

            activities.forEach(activity => {
                if (activity.type === 'post') {
                    // 게시물 (사진) 탭에 추가
                    photoCount++;
                    const imgHTML = `<img src="${activity.image}" class="w-full aspect-square object-cover cursor-pointer hover:opacity-80 transition" title="${activity.content}">`;
                    photosGrid.insertAdjacentHTML('beforeend', imgHTML);
                } 
                else if (activity.type === 'comment') {
                    // 인터랙션 (댓글) 탭에 추가
                    commentCount++;
                    const commentHTML = `
                        <div class="flex gap-4 border border-gray-200 p-4 rounded-lg items-start hover:shadow-sm transition cursor-pointer">
                            <img src="이미지/효빈시_로고.png" class="w-10 h-10 rounded-full border border-gray-200 object-cover">
                            <div class="flex-1">
                                <div class="text-[14px]">
                                    <span class="font-bold">hyobin_city_official</span>님이 <span class="font-bold cursor-pointer hover:underline text-[#00376b]">${activity.targetUser}</span>님의 게시물에 댓글을 남겼습니다.
                                </div>
                                <div class="mt-2 text-[14px] bg-gray-50 p-3 rounded-lg border border-gray-100">
                                    "${activity.content}"
                                </div>
                                <div class="text-[12px] text-gray-500 mt-2">${activity.timestamp}</div>
                            </div>
                            <img src="${activity.image}" class="w-12 h-12 object-cover rounded">
                        </div>
                    `;
                    interactionsList.insertAdjacentHTML('beforeend', commentHTML);
                }
            });

            // 데이터가 하나도 없을 경우의 처리
            if (photoCount === 0) {
                photosGrid.innerHTML = `<div class="col-span-3 text-center py-10 text-gray-500">업로드한 게시물이 없습니다.</div>`;
            }
            if (commentCount === 0) {
                interactionsList.innerHTML = `<div class="text-center py-10 text-gray-500">작성한 댓글이 없습니다.</div>`;
            }
        }

        // 탭 전환 기능
        function switchTab(btnElement, tabId) {
            const buttons = document.getElementById('activity-menu').querySelectorAll('button');
            buttons.forEach(btn => {
                btn.classList.remove('bg-gray-100', 'border-black');
                btn.classList.add('border-transparent');
                btn.querySelector('i').classList.replace('text-gray-700', 'text-gray-500');
                btn.querySelector('span').classList.remove('font-bold');
            });

            btnElement.classList.remove('border-transparent');
            btnElement.classList.add('bg-gray-100', 'border-black');
            btnElement.querySelector('i').classList.replace('text-gray-500', 'text-gray-700');
            btnElement.querySelector('span').classList.add('font-bold');

            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
                content.classList.remove('block');
            });

            const targetTab = document.getElementById('tab-' + tabId);
            targetTab.classList.remove('hidden');
            targetTab.classList.add('block');
        }

        // 초기 접속 시 세계관 기본 데이터 셋업 (스토리지가 비어있을 때만)
        function initializeMockData() {
            if (!localStorage.getItem('ig_activities')) {
                const initialData = [
                    { type: 'post', content: '공약 이행 제로투 댄스', image: '이미지/박효빈.png', timestamp: '2일 전' },
                    { type: 'post', content: '돈불라 화형식', image: '이미지/돈불라 화형식.png', timestamp: '5일 전' },
                    { type: 'post', content: 'HAF 개최', image: '이미지/HAF현수기.png', timestamp: '1주 전' },
                    { type: 'comment', targetUser: 'real_yoonjaehoon', content: '수감자님, 업무 태만이 2차 적발되어 금일 야간 아논 인형 실밥 정리 1000개 특별 작업이 추가되었습니다. ^^', image: '이미지/윤재훈 구속.png', timestamp: '1시간 전' },
                    { type: 'comment', targetUser: 'yoondaehwan_official', content: '수감자님, 반성 기미가 전혀 없어 교정 센터 내 BGM FIRE BIRD 볼륨 2단계 상향 조치했습니다. ^^', image: '이미지/윤대환.png', timestamp: '1일 전' }
                ];
                localStorage.setItem('ig_activities', JSON.stringify(initialData));
            }
        }
    </script>

<script>
    function applyUserData() {
        const storedUser = localStorage.getItem('ig_user_account');
        if (!storedUser) return; // 가입/로그인 정보가 없으면 패스

        const userData = JSON.parse(storedUser);

        // 1. 사이드바 프로필 사진 변경
        const sidebarProfileImgs = document.querySelectorAll('nav img[src*="이미지/효빈시_로고.png"]');
        sidebarProfileImgs.forEach(img => {
            if (userData.profilePic) img.src = userData.profilePic;
        });

        // 2. 만들기(모달) 프로필 변경
        const createProfileImg = document.querySelector('#step-2 img[src*="이미지/효빈시_로고.png"]');
        const createProfileName = document.querySelector('#step-2 span.font-bold');
        if (createProfileImg && userData.profilePic) createProfileImg.src = userData.profilePic;
        if (createProfileName) createProfileName.innerText = userData.username;

        // 3. 댓글 입력창 프로필 변경 (있는 경우)
        const commentImgs = document.querySelectorAll('input[placeholder="댓글 달기..."]');
        commentImgs.forEach(input => {
            // 입력창 바로 왼쪽에 있는 프로필 이미지 (또는 아이콘 찾기)
            const parent = input.parentElement;
            const img = parent.querySelector('img');
            if(img && userData.profilePic) img.src = userData.profilePic;
        });
        
        // 4. (추가) 글로벌 변수에 내 정보 저장해두기 (댓글 작성 등에 사용)
        window.myInstagramUser = userData;
    }

    // 화면 로딩 완료 시 실행
    document.addEventListener('DOMContentLoaded', applyUserData);

    // [댓글 작성 함수 덮어쓰기] - 내 이름과 사진으로 달리게 변경
    if (typeof renderIgComment !== 'undefined') {
        window.renderIgComment = function(text, targetAreaId) {
            const targetArea = document.getElementById(targetAreaId);
            const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            // 로그인 데이터 가져오기 (없으면 임시값)
            const me = window.myInstagramUser || { username: 'guest', profilePic: 'https://via.placeholder.com/32' };
            const myPic = me.profilePic ? me.profilePic : 'https://via.placeholder.com/32';
            
            const commentHTML = `
                <div class="flex gap-3 items-start mt-3 animate-fade-in">
                    <img src="${myPic}" class="w-8 h-8 rounded-full mt-1 cursor-pointer border border-gray-200 object-cover">
                    <div class="flex-1">
                        <span class="font-bold cursor-pointer hover:underline text-[14px]">${me.username}</span>
                        <span class="text-[14px] break-all">${safeText}</span>
                        <div class="flex gap-3 text-[11px] text-gray-500 font-bold mt-1">
                            <span>방금 전</span>
                            <span class="cursor-pointer" onclick="document.getElementById('${targetAreaId.replace('area', 'input')}').focus()">답글 달기</span>
                        </div>
                    </div>
                    <button class="text-xs pt-2 pr-2 text-gray-400 hover:text-gray-600" onclick="this.querySelector('i').classList.toggle('fas'); this.querySelector('i').classList.toggle('text-red-500'); this.querySelector('i').classList.toggle('far');"><i class="far fa-heart"></i></button>
                </div>
            `;
            targetArea.insertAdjacentHTML('beforeend', commentHTML);
            const scrollContainer = targetArea.parentElement;
            scrollContainer.scrollTop = scrollContainer.scrollHeight;
        };
    }
</script>
</body>
</html>
