<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="이미지/효빈위키아이콘.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>효빈위키 틀 제작기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 스타일링용 CSS 연결 -->
    <link rel="stylesheet" href="css/colorcss.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
        
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #e5e7eb; color: #333; }
        
        /* 미리보기 영역 */
        .wiki-preview {
            background-color: #ffffff;
            color: #373a3c;
            line-height: 1.6;
            font-size: 15px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            min-height: 300px;
        }

        .wiki-link { color: #0055AA; font-weight: bold; text-decoration: none; cursor: pointer; }
        .wiki-link:hover { text-decoration: underline; }
        /* 외부 링크도 내부 링크와 동일한 색상으로 변경 */
        .wiki-link.external { color: #0055AA; } 
        del { color: #999; text-decoration: line-through; }

        /* 인포박스 스타일 */
        .infobox { 
            border: 2px solid #7777AA; 
            background-color: #fff; 
            width: 100%; 
            max-width: 400px;
            font-size: 0.9rem; 
            margin: 0 auto;
            border-radius: 4px; 
            overflow: hidden; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .infobox-title { background-color: #7777AA; color: white; padding: 10px; text-align: center; font-size: 1.2rem !important; font-weight: 900; }
        .infobox-image { text-align: center; padding: 10px; border-bottom: 1px solid #ccc; background: white; }
        .infobox-image img { max-width: 100%; border-radius: 4px; }
        .infobox table { width: 100%; border-collapse: collapse; border: none; margin: 0; }
        .infobox th { background-color: #f5f5f5; color: #333; width: 35%; padding: 6px 8px; border: 1px solid #ddd; text-align: center; font-weight: bold; vertical-align: middle; }
        .infobox td { padding: 6px 8px; border: 1px solid #ddd; vertical-align: middle; text-align: left; }

        /* 효빈위키식 접기 테이블 */
        .namu-nav-container { border: 2px solid #7777AA; margin: 10px 0; font-size: 0.9rem; background: white; width: 100%; }
        .namu-nav-header { 
            background-color: #7777AA; 
            color: white; 
            padding: 6px 12px; 
            font-weight: bold; 
            display: flex; 
            justify-content: center; /* 가운데 정렬로 변경 */
            align-items: center;
            position: relative; /* 버튼 배치를 위해 relative 추가 */
        }
        .namu-nav-content { display: block; padding: 0; }
        .namu-nav-table { width: 100%; border-collapse: collapse; }
        .namu-nav-row th { background-color: #7777AA; color: white; width: 120px; text-align: center; font-weight: bold; border-bottom: 1px solid white; border-right: 1px solid white; padding: 8px; }
        .namu-nav-row td { background-color: #fff; padding: 8px; text-align: left; border-bottom: 1px solid #ccc; }

        /* 일반 표 스타일 (N행 N열) */
        .wiki-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.95em; }
        .wiki-table th { background-color: #f0f0f0; border: 1px solid #ccc; padding: 8px; font-weight: bold; text-align: center; }
        .wiki-table td { border: 1px solid #ccc; padding: 8px; }

        /* 뱃지 스타일 */
        .wiki-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            font-size: 0.8em;
            margin-right: 2px;
            background-color: #7777AA; /* 기본값 */
        }

        /* 로고 스타일 (미리보기용) */
        .logo-ring { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #7777AA; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; color: #7777AA; background: white; }
        .logo-box-fill { padding: 5px 10px; background-color: #7777AA; color: white; font-weight: bold; border-radius: 4px; display: inline-block; }
        .logo-box-outline { padding: 5px 10px; border: 2px solid #7777AA; color: #7777AA; font-weight: bold; border-radius: 4px; display: inline-block; background: white; }

        /* UI 컨트롤 */
        .control-group { margin-bottom: 15px; }
        .control-label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; color: #555; }
        .input-field { width: 100%; padding: 8px; border: 1px solid #ccc; rounded: 4px; font-size: 0.9rem; }
        .row-item { display: flex; gap: 5px; margin-bottom: 5px; }
        .remove-btn { color: red; cursor: pointer; padding: 5px; }
        
        /* 도구 버튼 스타일 */
        .tool-btn { 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 0.8rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s;
            border: 1px solid #ddd;
            background-color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .tool-btn:hover { background-color: #f3f4f6; }
        .tool-btn:active { transform: translateY(1px); }

        /* 아코디언 스타일 */
        .accordion-item { border: 1px solid #e5e7eb; border-radius: 4px; margin-bottom: 5px; background: white; overflow: hidden; }
        .accordion-header { 
            padding: 10px; 
            background-color: #f9fafb; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.9rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .accordion-header:hover { background-color: #f3f4f6; }
        .accordion-content { padding: 10px; display: none; border-top: 1px solid #e5e7eb; }
        .accordion-content.active { display: block; }
        .accordion-icon { transition: transform 0.2s; }
        .accordion-header.active .accordion-icon { transform: rotate(180deg); }

        /* 팝업 스타일 (아이콘 등) */
        .tool-popup {
            position: absolute;
            bottom: 100%;
            left: 0;
            margin-bottom: 5px;
            width: 280px;
            background: white;
            border: 1px solid #ccc;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 4px;
            padding: 10px;
            z-index: 50;
            display: none;
        }
        .tool-wrapper:hover .tool-popup { display: block; }
    </style>
<script src="ad_logic.js"></script>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        <!-- 왼쪽: 설정 패널 -->
        <div class="w-full lg:w-1/3 bg-white p-6 rounded-lg shadow-md h-fit max-h-[90vh] overflow-y-auto">
            <h1 class="text-2xl font-black text-[#7777AA] mb-4 border-b-2 border-[#7777AA] pb-2">
                <i class="fa-solid fa-screwdriver-wrench"></i> 효빈위키 틀 제작기
            </h1>

            <!-- 1. 템플릿 선택 -->
            <div class="control-group">
                <label class="control-label">제작할 틀 종류</label>
                <select id="templateType" class="input-field border rounded p-2" onchange="changeTemplateType()">
                    <option value="infobox">기본 인포박스 (프로필)</option>
                    <option value="admin_box">행정구역 정보표 (지역)</option>
                    <option value="navbox">둘러보기 틀 (기본)</option>
                    <option value="collapsible_navbox">둘러보기 틀 (시작 시 접힘)</option>
                    <option value="grid_table">N행 N열 데이터 표 (선거/통계)</option>
                    <option value="alert">알림 상자 (경고/정보)</option>
                </select>
            </div>

            <!-- 2. 색상 선택 (메인 테마용) -->
            <div class="control-group">
                <label class="control-label">테마 색상 선택 (틀 전체)</label>
                <div class="flex gap-2 mb-2">
                    <input type="color" id="customColor" class="w-12 h-10 cursor-pointer border rounded" value="#7777AA" onchange="updatePreview()">
                    <select id="colorPreset" class="input-field border rounded p-2 text-sm flex-grow" onchange="applyPreset()">
                        <option value="">-- 테마 색상 프리셋 --</option>
                        <!-- JS로 자동 생성됨 -->
                    </select>
                </div>
            </div>

            <!-- 3. 공통 입력 -->
            <div class="control-group">
                <label class="control-label">제목 / 헤더 텍스트</label>
                <input type="text" id="inputTitle" class="input-field border rounded p-2" placeholder="제목을 입력하세요" oninput="updatePreview()" onfocus="setFocus(this)">
            </div>

            <div class="control-group" id="imageGroup">
                <label class="control-label">이미지 파일명 (자동으로 경로 변환)</label>
                <input type="text" id="inputImage" class="input-field border rounded p-2" placeholder="예: 전동차_측면" oninput="updatePreview()" onfocus="setFocus(this)">
                <div class="text-xs text-gray-500 mt-1">* '한국어이름.png' 형식으로 자동 변환됩니다.</div>
            </div>

            <!-- 4. 표 설정 (N행 N열 전용) -->
            <div class="control-group hidden" id="gridConfig">
                <label class="control-label">표 크기 및 설정</label>
                <div class="flex gap-2 mb-2">
                    <input type="number" id="gridRows" class="input-field w-1/3" placeholder="행(줄)" value="3" min="1">
                    <input type="number" id="gridCols" class="input-field w-1/3" placeholder="열(칸)" value="3" min="1">
                    <button onclick="createGridInputs()" class="bg-[#7777AA] text-white px-3 py-1 rounded text-xs w-1/3 font-bold">그리드 생성</button>
                </div>
                <div class="flex items-center gap-2 text-sm mb-2">
                    <input type="checkbox" id="gridHeader" checked onchange="updatePreview()"> 첫 행을 헤더(제목)로 사용
                </div>
            </div>

            <!-- 5. 동적 데이터 입력 -->
            <div class="control-group" id="dynamicRows">
                <label class="control-label flex justify-between items-center" id="rowsLabel">
                    데이터 항목
                    <div>
                        <button onclick="addRow()" class="text-xs bg-gray-200 px-2 py-1 rounded hover:bg-gray-300"><i class="fa-solid fa-plus"></i> 행 추가</button>
                    </div>
                </label>
                <div id="rowsContainer" class="space-y-2 max-h-60 overflow-y-auto p-1"></div>
            </div>

            <!-- 6. 서술 도우미 (아코디언 방식) -->
            <div class="control-group border-t pt-4 mt-4 bg-gray-50 p-3 rounded">
                <label class="control-label mb-2 flex justify-between">
                    서술 도우미
                    <span class="text-xs font-normal text-blue-600 self-center">※ 입력창 클릭 후 사용</span>
                </label>
                
                <!-- 아코디언 메뉴 시작 -->
                <div class="accordion">
                    <!-- 1. 텍스트 서식/정렬/크기 -->
                    <div class="accordion-item">
                        <div class="accordion-header" onclick="toggleAccordion(this)">
                            <span><i class="fa-solid fa-font"></i> 텍스트 서식/정렬/크기</span>
                            <i class="fa-solid fa-chevron-down accordion-icon"></i>
                        </div>
                        <div class="accordion-content active">
                            <!-- 1열: 기본 서식 & 색상 -->
                            <div class="flex flex-wrap gap-2 mb-2">
                                <button onclick="insertTag('<b>', '</b>')" class="tool-btn font-bold" title="굵게">B</button>
                                <button onclick="insertTag('<del>', '</del>')" class="tool-btn line-through text-gray-500" title="취소선">S</button>
                                <button onclick="insertTag('<span class=\'wiki-gray\'>', '</span>')" class="tool-btn text-gray-400" title="작게/회색">회색</button>
                                <button onclick="insertTag('<br>', '')" class="tool-btn" title="줄바꿈">줄바꿈</button>
                                <div class="flex items-center border rounded px-1 bg-white">
                                    <input type="color" id="textColorPicker" class="w-5 h-5 cursor-pointer border-none p-0" value="#ff0000">
                                    <button onclick="insertColor()" class="ml-1 text-xs font-bold text-gray-600 px-1 hover:bg-gray-100 rounded">색상</button>
                                </div>
                            </div>
                            
                            <hr class="my-2 border-gray-100">

                            <!-- 2열: 정렬 & 크기 -->
                            <div class="flex flex-wrap gap-3 items-center">
                                <!-- 정렬 -->
                                <div class="flex border rounded overflow-hidden bg-white" title="문단 정렬">
                                    <button onclick="insertTag('<div style=\'text-align:left\'>', '</div>')" class="px-2 py-1 hover:bg-gray-100 border-r text-gray-700" title="왼쪽 정렬"><i class="fa-solid fa-align-left"></i></button>
                                    <button onclick="insertTag('<div style=\'text-align:center\'>', '</div>')" class="px-2 py-1 hover:bg-gray-100 border-r text-gray-700" title="가운데 정렬"><i class="fa-solid fa-align-center"></i></button>
                                    <button onclick="insertTag('<div style=\'text-align:right\'>', '</div>')" class="px-2 py-1 hover:bg-gray-100 text-gray-700" title="오른쪽 정렬"><i class="fa-solid fa-align-right"></i></button>
                                </div>

                                <!-- 크기 (Point) -->
                                <div class="flex items-center border rounded bg-white px-1" title="글자 크기 (pt)">
                                    <input type="number" id="textSizeInput" class="w-12 text-xs p-1 border-none focus:ring-0 text-right outline-none" placeholder="pt" value="12" min="1">
                                    <span class="text-xs text-gray-500 mr-1 font-bold">pt</span>
                                    <button onclick="insertTextSize()" class="tool-btn text-xs bg-gray-50 border-l rounded-none border-t-0 border-b-0 border-r-0 h-full">적용</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 2. 링크 도구 -->
                    <div class="accordion-item">
                        <div class="accordion-header" onclick="toggleAccordion(this)">
                            <span><i class="fa-solid fa-link"></i> 링크 삽입</span>
                            <i class="fa-solid fa-chevron-down accordion-icon"></i>
                        </div>
                        <div class="accordion-content">
                            <div class="space-y-2">
                                <div class="flex gap-1 items-center">
                                    <span class="text-xs font-bold w-12">내부:</span>
                                    <input type="text" id="toolLinkInternal" class="border text-xs p-1 flex-grow rounded" placeholder="문서명 (예: 효빈광역시)">
                                    <button onclick="generateLink('internal')" class="bg-blue-500 text-white text-xs px-2 py-1 rounded">삽입</button>
                                </div>
                                <div class="flex gap-1 items-center">
                                    <span class="text-xs font-bold w-12">외부:</span>
                                    <input type="text" id="toolLinkExText" class="border text-xs p-1 w-1/3 rounded" placeholder="표시 텍스트">
                                    <input type="text" id="toolLinkExUrl" class="border text-xs p-1 flex-grow rounded" placeholder="https://...">
                                    <button onclick="generateLink('external')" class="bg-green-500 text-white text-xs px-2 py-1 rounded">삽입</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. 꾸미기 (뱃지/로고) -->
                    <div class="accordion-item">
                        <div class="accordion-header" onclick="toggleAccordion(this)">
                            <span><i class="fa-solid fa-medal"></i> 꾸미기 (뱃지/로고)</span>
                            <i class="fa-solid fa-chevron-down accordion-icon"></i>
                        </div>
                        <div class="accordion-content">
                            <!-- 꾸미기용 색상 선택기 추가 -->
                            <div class="mb-2 text-xs bg-gray-100 p-2 rounded">
                                <label class="font-bold text-gray-600 mb-1 block">장식 전용 색상 선택:</label>
                                <div class="flex gap-1">
                                    <input type="color" id="decoColor" class="w-8 h-8 cursor-pointer border rounded" value="#7777AA">
                                    <select id="decoColorPreset" class="border rounded p-1 text-xs flex-grow" onchange="applyDecoPreset()">
                                        <option value="">-- 색상 프리셋 선택 --</option>
                                    </select>
                                </div>
                            </div>

                            <div class="flex flex-wrap gap-2 mb-2">
                                <button onclick="insertBadge()" class="tool-btn bg-purple-100 text-purple-700 font-bold border-purple-200"><i class="fa-solid fa-tag"></i> 뱃지 생성</button>
                            </div>
                            <hr class="my-2 border-gray-100">
                            <div class="text-xs font-bold mb-1 text-gray-500">로고 삽입 (위에서 선택한 색상 적용)</div>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="insertLogo('ring')" class="tool-btn"><i class="fa-regular fa-circle"></i> 링형</button>
                                <button onclick="insertLogo('box-fill')" class="tool-btn"><i class="fa-solid fa-square"></i> 사각(채움)</button>
                                <button onclick="insertLogo('box-outline')" class="tool-btn"><i class="fa-regular fa-square"></i> 사각(선)</button>
                            </div>
                        </div>
                    </div>

                    <!-- 4. 표/이미지 도구 -->
                    <div class="accordion-item">
                        <div class="accordion-header" onclick="toggleAccordion(this)">
                            <span><i class="fa-solid fa-table"></i> 표/이미지 도구</span>
                            <i class="fa-solid fa-chevron-down accordion-icon"></i>
                        </div>
                        <div class="accordion-content">
                            <div class="flex flex-wrap gap-2 mb-2">
                                <button onclick="insertTableCell('colspan')" class="tool-btn text-xs">가로병합(Colspan)</button>
                                <button onclick="insertTableCell('rowspan')" class="tool-btn text-xs">세로병합(Rowspan)</button>
                            </div>
                            <hr class="my-2 border-gray-100">
                            <div class="flex gap-1 items-center">
                                <span class="text-xs font-bold w-12">이미지:</span>
                                <input type="text" id="toolImgName" class="border text-xs p-1 w-1/3 rounded" placeholder="파일명">
                                <input type="text" id="toolImgWidth" class="border text-xs p-1 w-1/4 rounded" value="100%">
                                <button onclick="generateImageTag()" class="bg-blue-500 text-white text-xs px-2 py-1 rounded">삽입</button>
                            </div>
                        </div>
                    </div>

                    <!-- 5. 아이콘/기능 -->
                    <div class="accordion-item">
                        <div class="accordion-header" onclick="toggleAccordion(this)">
                            <span><i class="fa-solid fa-icons"></i> 아이콘/기타</span>
                            <i class="fa-solid fa-chevron-down accordion-icon"></i>
                        </div>
                        <div class="accordion-content">
                            <div class="flex flex-wrap gap-2 mb-2">
                                <button onclick="generateCollapsible()" class="tool-btn bg-green-50 text-green-700 border-green-200"><i class="fa-solid fa-chevron-down"></i> 접기틀 삽입</button>
                            </div>
                            <hr class="my-2 border-gray-100">
                            <!-- 아이콘 색상 선택기 추가 -->
                            <div class="mb-2 text-xs bg-gray-100 p-2 rounded flex items-center gap-2">
                                <label class="font-bold text-gray-600">아이콘 색상:</label>
                                <input type="color" id="iconColorPicker" class="w-5 h-5 cursor-pointer border-none p-0" value="#000000">
                                <span class="text-xs text-gray-400">(선택 시 적용)</span>
                            </div>
                            <div class="grid grid-cols-8 gap-1" id="iconGrid">
                                <!-- JS로 아이콘 자동 생성됨 -->
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 아코디언 끝 -->
            </div>
        </div>

        <!-- 오른쪽: 미리보기 및 코드 출력 -->
        <div class="w-full lg:w-2/3 flex flex-col gap-4">
            <div class="bg-white p-6 rounded-lg shadow-md flex-grow">
                <h2 class="text-lg font-bold text-gray-700 mb-2 border-b pb-2 flex justify-between">
                    <span><i class="fa-solid fa-eye"></i> 실시간 미리보기</span>
                    <span class="text-xs font-normal text-gray-500 self-end">실제 적용 시 스타일이 더 깔끔하게 나옵니다.</span>
                </h2>
                <div id="previewArea" class="wiki-preview bg-gray-50 flex items-start justify-center p-8 overflow-auto"></div>
            </div>

            <div class="bg-[#2d2d2d] p-4 rounded-lg shadow-md text-white">
                <h2 class="text-sm font-bold text-gray-300 mb-2 flex justify-between items-center">
                    <span><i class="fa-solid fa-code"></i> 생성된 HTML 코드</span>
                    <div class="flex gap-2">
                        <button onclick="downloadCode('txt')" class="bg-[#555588] hover:bg-[#444477] text-white px-3 py-1 rounded text-xs font-bold transition">
                            <i class="fa-solid fa-file-lines"></i> TXT
                        </button>
                        <button onclick="downloadCode('html')" class="bg-[#555588] hover:bg-[#444477] text-white px-3 py-1 rounded text-xs font-bold transition">
                            <i class="fa-brands fa-html5"></i> HTML
                        </button>
                        <button onclick="copyResult()" class="bg-[#7777AA] hover:bg-[#555588] text-white px-3 py-1 rounded text-xs font-bold transition">
                            <i class="fa-regular fa-copy"></i> 코드 복사하기
                        </button>

        // 공통 파싱 함수 (제목, 내용 모두 적용)
        function parseWikiText(text) {
            if (!text) return '';
            let parsed = text;
            
            // 기본 서식
            parsed = parsed.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, '<a href="$1.html" class="wiki-link">$2</a>');
            parsed = parsed.replace(/\[\[([^\]]+)\]\]/g, '<a href="$1.html" class="wiki-link">$1</a>');
            parsed = parsed.replace(/~~(.+?)~~/g, '<del>$1</del>');
            parsed = parsed.replace(/<b>(.+?)<\/b>/g, '<strong>$1</strong>');
            
            // 뱃지 미리보기 (간단 스타일 적용)
            parsed = parsed.replace(/<span class=['"]wiki-badge['"](.*?)>(.*?)<\/span>/g, '<span class="wiki-badge" $1>$2</span>');
            
            // 로고 미리보기
            parsed = parsed.replace(/<div class=['"]logo-ring['"](.*?)>(.*?)<\/div>/g, '<div class="logo-ring" $1>$2</div>');
            parsed = parsed.replace(/<span class=['"]logo-box-fill['"](.*?)>(.*?)<\/span>/g, '<span class="logo-box-fill" $1>$2</span>');
            parsed = parsed.replace(/<span class=['"]logo-box-outline['"](.*?)>(.*?)<\/span>/g, '<span class="logo-box-outline" $1>$2</span>');

            return parsed;
        }

        // 태그 자동 삽입
        function insertTag(startTag, endTag) {
            if (!currentFocusedInput) {
                alert("입력창을 먼저 클릭해주세요.");
                return;
            }
            const input = currentFocusedInput;
            const startPos = input.selectionStart;
            const endPos = input.selectionEnd;
            const text = input.value;
            const selectedText = text.substring(startPos, endPos);
            const replacement = startTag + selectedText + endTag;
            input.value = text.substring(0, startPos) + replacement + text.substring(endPos);
            updatePreview();
            input.focus();
        }

        function insertColor() {
            const color = document.getElementById('textColorPicker').value;
            insertTag(`<span style='color:${color}'>`, `</span>`);
        }

            const size = document.getElementById('textSizeInput').value;

            } else {
                alert("크기를 입력해주세요.");
            }
        }

            } else if (type === 'box-fill') {

                insertTag(tag, `</span>`);
            } else if (type === 'box-outline') {
                tag = `<span class='logo-box-outline' style='border-color:${color}; color:${color}'>`;
                insertTag(tag, `</span>`);
            }

                if(currentFocusedInput && text) {
                    const tag = `[[${text}]]`;
                    const input = currentFocusedInput;
                    const start = input.selectionStart;
                    const end = input.selectionEnd;
                    input.value = input.value.substring(0, start) + tag + input.value.substring(end);
                    updatePreview();

                    insertTag('[[', ']]'); 
                }
            } else {
                const text = document.getElementById('toolLinkExText').value.trim();

                if (text && url && currentFocusedInput) {
                    const tag = `<a href="${url}" class="wiki-link external" target="_blank">${text} </a>`;
                    const input = currentFocusedInput;
                    const start = input.selectionStart;
                    const end = input.selectionEnd;
                    input.value = input.value.substring(0, start) + tag + input.value.substring(end);
                    updatePreview();
                }
            }
        }

        function copyToClipboard(text, label = '텍스트') {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if(successful) {
                    alert(`${label}이(가) 클립보드에 복사되었습니다.\n(입력창을 선택하지 않아 복사만 수행됨)`);
                }
            } catch (err) {
                console.error(err);
            }
            document.body.removeChild(textArea);
        }

        function downloadCode(ext) {
            const code = document.getElementById('resultCode').value;
            if (!code.trim()) {
                alert("다운로드할 코드가 없습니다.");
                return;
            }
            const blob = new Blob([code], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `hyobinwiki_template.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 그리드 입력창 생성 함수 (N행 N열)
        function createGridInputs() {
            const rows = parseInt(document.getElementById('gridRows').value) || 2;
            const cols = parseInt(document.getElementById('gridCols').value) || 2;
            const container = document.getElementById('rowsContainer');
            
            container.innerHTML = ''; // 초기화
            container.style.display = 'grid';
            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            container.style.gap = '4px';

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'input-field grid-cell text-xs';
                    input.dataset.row = r;
                    input.dataset.col = c;
                    
                    // 플레이스홀더 설정
                    if (r === 0 && document.getElementById('gridHeader').checked) {
                        input.placeholder = `제목 ${c+1}`;
                        input.classList.add('bg-gray-100', 'font-bold'); // 헤더 시각적 구분
                    } else {
                        input.placeholder = `데이터 (${r+1},${c+1})`;
                    }
                    
                    input.oninput = updatePreview;
                    input.onfocus = function() { setFocus(this); };
                    container.appendChild(input);
                }
            }
            updatePreview();
        }

        function addRow(key = '', val = '') {
            rowCount++;
            const container = document.getElementById('rowsContainer');
            // 그리드 모드 해제 (flex 복구)
            container.style.display = 'block';
            
            const div = document.createElement('div');
            div.className = 'row-item';
            div.id = `row-${rowCount}`;
            
            const phKey = document.getElementById('templateType').value === 'alert' ? '속성' : '항목명 (왼쪽)';
            const phVal = document.getElementById('templateType').value === 'alert' ? '값' : '내용 (오른쪽)';

            div.innerHTML = `
                <input type="text" class="input-field w-1/3 key-input" placeholder="${phKey}" value="${key}" oninput="updatePreview()" onfocus="setFocus(this)">
                <input type="text" class="input-field w-2/3 val-input" placeholder="${phVal}" value="${val}" oninput="updatePreview()" onfocus="setFocus(this)">
                <div class="remove-btn" onclick="removeRow(${rowCount})"><i class="fa-solid fa-minus"></i></div>
            `;
            container.appendChild(div);
            updatePreview();
        }

            }
        }

        function applyDecoPreset() {
            const val = document.getElementById('decoColorPreset').value;
            if(val) document.getElementById('decoColor').value = val;
        }

        function updatePreview() {
            const type = document.getElementById('templateType').value;
            const titleInput = document.getElementById('inputTitle').value || '제목';
            const title = parseWikiText(titleInput); // 제목에도 링크/볼드 등 적용
            const color = document.getElementById('customColor').value;
            const imgName = document.getElementById('inputImage').value;
            
            // 일반 모드용 데이터
            const keys = document.querySelectorAll('.key-input');
            const vals = document.querySelectorAll('.val-input');
            let rowsHtml = '';

            // 1. 인포박스 & 행정구역 정보표 (구조 유사)
            if (type === 'infobox' || type === 'admin_box') {
                let imgHtml = '';
                if (imgName) {
                    const safeImg = imgName.trim() + '.png';
                    imgHtml = `
    <div class="infobox-image">
        <img src="이미지/${safeImg}" alt="${titleInput}" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
    </div>`;
                }

                for (let i = 0; i < keys.length; i++) {
                    if(keys[i].value) {
                        let content = parseWikiText(vals[i].value);
                        
                        rowsHtml += `
        <tr>
            <th>${keys[i].value}</th>
            <td>${content}</td>
        </tr>`;
                    }
                }

                const html = `
<aside class="infobox" style="border-color: ${color};">
    <div class="infobox-title" style="background-color: ${color};">${title}</div>${imgHtml}
    <table>${rowsHtml}
    </table>
</aside>`;
                render(html);
            } 
            // 2. 둘러보기 틀 (Navbox) - 일반 및 접힘형
            else if (type === 'navbox' || type === 'collapsible_navbox') {
                for (let i = 0; i < keys.length; i++) {
                    if(keys[i].value) {
                        let content = parseWikiText(vals[i].value);

                        rowsHtml += `
        <tr class="namu-nav-row">
            <th style="background-color: ${color};">${keys[i].value}</th>
            <td>${content}</td>
        </tr>`;
                    }
                }

                const rndId = 'nav-' + Math.random().toString(36).substr(2, 9);
                // 접힘형일 경우 초기 display: none 설정
                const isCollapsed = (type === 'collapsible_navbox');
                const displayStyle = isCollapsed ? 'style="display: none;"' : '';
                const btnText = isCollapsed ? '[펼치기]' : '[접기]';

                const html = `
<div class="namu-nav-container" style="border-color: ${color};">
    <div class="namu-nav-header" style="background-color: ${color};">
        <span>${title}</span>
        <span class="text-xs bg-white/20 px-2 py-0.5 rounded cursor-pointer" style="position: absolute; right: 10px;" onclick="const c=document.getElementById('${rndId}'); c.style.display = c.style.display==='none'?'block':'none'; this.innerText = c.style.display==='none'?'[펼치기]':'[접기]';">${btnText}</span>
    </div>
    <div id="${rndId}" class="namu-nav-content" ${displayStyle}>
        <table class="namu-nav-table">${rowsHtml}
        </table>
    </div>
</div>`;
                render(html);
            }
            // 3. 일반 데이터 표 (Custom Table - 2열 고정)
            else if (type === 'custom_table') {
                let headerHtml = '';
                let bodyHtml = '';
                
                if (keys.length > 0) {
                    headerHtml = `<tr>`;
                    headerHtml += `<th style="background-color:${color}; color:white;">${keys[0].value || '항목'}</th>`;
                    headerHtml += `<th style="background-color:${color}; color:white;">${parseWikiText(vals[0].value) || '내용'}</th>`;
                    headerHtml += `</tr>`;
                }

                for (let i = 1; i < keys.length; i++) {
                    if(keys[i].value || vals[i].value) {
                         bodyHtml += `
        <tr>
            <td>${parseWikiText(keys[i].value)}</td>
            <td>${parseWikiText(vals[i].value)}</td>
        </tr>`;
                    }
                }

                const html = `
<table class="wiki-table" style="border-top: 2px solid ${color};">
    <caption style="font-weight:bold; padding: 5px; color: ${color}; text-align: left;">${title}</caption>
    <thead>${headerHtml}</thead>
    <tbody>${bodyHtml}
    </tbody>
</table>`;
                render(html);
            }
            // 4. N행 N열 데이터 표 (Grid Table - 동적 생성)
            else if (type === 'grid_table') {
                const rows = parseInt(document.getElementById('gridRows').value) || 2;
                const cols = parseInt(document.getElementById('gridCols').value) || 2;
                const useHeader = document.getElementById('gridHeader').checked;
                const cells = document.querySelectorAll('.grid-cell');
                
                let tableHtml = `<table class="wiki-table" style="border-top: 2px solid ${color}; width: 100%;">\n`;
                if(title) tableHtml += `    <caption style="font-weight:bold; padding: 5px; color: ${color}; text-align: center;">${title}</caption>\n`;
                
                // 그리드 데이터 수집 (1차원 NodeList -> 2차원 매핑)
                // cells[r * cols + c]
                
                for (let r = 0; r < rows; r++) {
                    // 첫 행이고 헤더 옵션 켜짐 -> thead 생성
                    if (r === 0 && useHeader) {
                        tableHtml += `    <thead>\n        <tr>\n`;
                        for (let c = 0; c < cols; c++) {
                            const val = parseWikiText(cells[r * cols + c]?.value || '');
                            // 헤더 배경색 적용
                            tableHtml += `            <th style="background-color:${color}; color:white;">${val}</th>\n`;
                        }
                        tableHtml += `        </tr>\n    </thead>\n    <tbody>\n`;
                    } 
                    // 나머지 행 -> tbody (혹은 thead 없는 경우)
                    else {
                        if (r === 0 && !useHeader) tableHtml += `    <tbody>\n`; // tbody 시작점 보정
                        tableHtml += `        <tr>\n`;
                        for (let c = 0; c < cols; c++) {
                            const val = parseWikiText(cells[r * cols + c]?.value || '');
                            tableHtml += `            <td>${val}</td>\n`;
                        }
                        tableHtml += `        </tr>\n`;
                    }
                }
                tableHtml += `    </tbody>\n</table>`;
                render(tableHtml);
            }
            // 5. 알림 상자 (Alert)
            else if (type === 'alert') {
                let icon = 'fa-circle-info';
                let content = '내용을 입력하세요.';
                
                for(let i=0; i<keys.length; i++) {
                    if(keys[i].value === '아이콘') icon = vals[i].value;
                    if(keys[i].value === '내용') content = vals[i].value;
                }

                // 아이콘에도 파싱 적용 (필요하다면)
                const parsedContent = parseWikiText(content);

                const html = `
<div style="border: 2px solid ${color}; background-color: #fff; padding: 15px; border-radius: 6px; display: flex; align-items: center; gap: 15px; margin: 15px 0;">
    <div style="font-size: 2rem; color: ${color}; min-width: 50px; text-align: center;">
        <i class="fa-solid ${icon}"></i>
    </div>
    <div style="flex-grow: 1; line-height: 1.5;">
        ${parsedContent}
    </div>
</div>`;
                render(html);
            }
        }

        function render(html) {
            document.getElementById('previewArea').innerHTML = html;
            document.getElementById('resultCode').value = html.trim();
        }

        function copyResult() {
            const copyText = document.getElementById("resultCode");
            copyText.select();
            
            try {
                const successful = document.execCommand('copy');
                if(successful) {
                    alert("코드가 복사되었습니다!");
                } else {
                    alert("복사에 실패했습니다.");
                }
            } catch (err) {
                alert("복사 기능이 지원되지 않는 브라우저입니다.");
            }
        }

        function copyTag(start, end) {
            copyToClipboard(start + "내용" + end, `'${start}...${end}'`);
        }

        function copyToClipboard(text, label = '텍스트') {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if(successful) {
                    const msg = document.getElementById('copyMsg');
                    msg.innerText = `${label} 복사됨!`;
                    msg.style.opacity = 1;
                    setTimeout(() => { msg.style.opacity = 0; }, 1500);
                }
            } catch (err) {
                console.error(err);
            }
            document.body.removeChild(textArea);
        }

        function downloadCode(ext) {
            const code = document.getElementById('resultCode').value;
            if (!code.trim()) {
                alert("다운로드할 코드가 없습니다.");
                return;
            }
            const blob = new Blob([code], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `hyobinwiki_template.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        window.onload = function() {
            loadColorsFromJS('colorPreset');
            loadColorsFromJS('decoColorPreset');
            changeTemplateType();
            initIconGrid(); // 아이콘 그리드 초기화
        }
    </script>
