            "루파": ["베이스", "미소", "일반 사용자", "취객", "걸밴크", "온화한 미소로 진상 취객을 물리력으로 제압합니다."],
            "에비즈카_토모": ["키보드", "독설", "일반 사용자", "토론방", "걸밴크", "위키 토론방 키배로 상대방 터는 마스터입니다."],
            "아와_스바루": ["드럼", "배려", "일반 사용자", "사과", "걸밴크", "멤버들 깽판 뒷수습하고 사과합니다."]
        };

        // 3. 로어 데이터를 분석해 동적으로 '최근 기여 이력'을 생성하는 함수
        function generateHistoryForUser(username) {
            let userHistory = [];
            // loreData 전체를 뒤져서 해당 유저가 authors 배열에 있는지 확인
            for (const catKey in loreData) {
                const cat = loreData[catKey];
                if (cat.authors.includes(username)) {
                    // 이 유저가 이 카테고리 담당이라면, 해당 카테고리에서 무작위 기록 3~5개 생성
                    const numEdits = Math.floor(Math.random() * 3) + 3; 
                    for(let i=0; i<numEdits; i++) {
                        const kw = cat.keywords.length > 0 ? cat.keywords[Math.floor(Math.random() * cat.keywords.length)] : "효빈광역시";
                        const isAdd = Math.random() > 0.3;
                        const diffArr = isAdd ? cat.diffAdd : (cat.diffDel.length > 0 ? cat.diffDel : cat.diffAdd);
                        const diffText = diffArr[Math.floor(Math.random() * diffArr.length)].replace(/^[-+]\s*/, '').trim();
                        const diffNum = (isAdd ? "+" : "-") + (Math.floor(Math.random() * 1000) + 15);
                        
                        userHistory.push({
                            time: `${Math.floor(Math.random() * 60) + 1}분 전`,
                            doc: kw,
                            diff: diffNum,
                            summary: diffText
                        });
                    }
                }
            }
            
            // 만약 loreData authors에 없는 캐릭터(서브컬처 캐릭터 등)라면 범용 기여 기록 생성
            if (userHistory.length === 0) {
                userHistory = [
                    { time: "5분 전", doc: rawMasterDB[username]?.[3] || "효빈광역시", diff: "+150", summary: "문서 내용 보강 및 다듬기" },
                    { time: "2시간 전", doc: "효빈위키", diff: "-12", summary: "오타 수정" },
                    { time: "어제", doc: "지선버스", diff: "+45", summary: "분류 추가" }
                ];
            }
            
            return userHistory.sort((a,b) => parseInt(a.time) - parseInt(b.time)); // 대략적인 시간순 정렬
        }

        // ==========================================
        // 4. 동적 렌더링 엔진 (SPA)
        // ==========================================
        function formatByteDiff(diff) {
            const num = parseInt(diff);
            if (num > 0) return `<span class="byte-plus">+${num}</span>`;
            if (num < 0) return `<span class="byte-minus">${num}</span>`;
            return `<span class="byte-zero">0</span>`;
        }

        function renderNamuUserProfile() {
            const container = document.getElementById('user-document-container');
            let hash = window.location.hash.substring(1);
            let username = decodeURIComponent(hash);

            if (!username) username = "Admin_01";
            
            let user = rawMasterDB[username];
            let userObj = {};

            if (user) {
                // 마스터 DB에 있는 유저 객체화
                userObj = {
                    name: username.replace(/_/g, ' '),
                    avatarTxt: user[0],
                    status: user[1],
                    rights: user[2],
                    favorite: user[3],
                    cat: user[4],
                    intro: user[5],
                    editCount: Math.floor(Math.random() * 5000) + 150 + "회",
                    history: generateHistoryForUser(username)
                };
            } else {
                // 완전 생판 모르는 IP나 유저 (기본값)
                const isIP = /^[0-9x]{1,3}\.[0-9x]{1,3}\.[0-9x]{1,3}\.[0-9x]{1,3}$/.test(username);
                userObj = {
                    name: username,
                    avatarTxt: isIP ? "🌐" : "👤",
                    status: "유동적 편집 중",
                    rights: isIP ? "비로그인 유동 IP" : "일반 위키러",
                    favorite: "알 수 없음",
                    editCount: Math.floor(Math.random() * 80) + 5 + "회",
                    intro: `효빈위키에서 활동 중인 ${isIP ? '비로그인 유동 IP 사용자' : '일반 유저'}입니다.`,
                    cat: isIP ? "비로그인 사용자 | IP 유저" : "일반 사용자",
                    history: [{ time: "방금 전", doc: "효빈광역시", diff: "+12", summary: "오타 수정 및 자잘한 띄어쓰기 교정" }]
                };
            }

            let historyRows = '';
            userObj.history.forEach(h => {
                historyRows += `
                    <tr>
                        <td class="text-center text-gray-500 text-xs">${h.time}</td>
                        <td><a href="${h.doc}.html" class="wiki-link">${h.doc}</a></td>
                        <td class="text-center">${formatByteDiff(h.diff)}</td>
                        <td class="text-gray-600 dark:text-gray-400 text-sm">"${h.summary}"</td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <h1 class="wiki-title">사용자:${userObj.name}</h1>
                <div class="wiki-meta">최근 수정 시각: ${timeString}</div>
                
                <div class="toolbar" style="display: flex; border: 1px solid var(--wiki-border); border-radius: 4px; width: fit-content; background: var(--wiki-box-bg); margin-bottom: 20px;">
                    <button class="toolbar-btn" onclick="location.href='☆.html?doc=${username}'">☆</button>
                    <button class="toolbar-btn" onclick="location.href='편집.html?doc=${username}'">📝 편집</button>
                    <button class="toolbar-btn" onclick="location.href='토론.html?doc=${username}'">💬 토론</button>
                    <button class="toolbar-btn" onclick="location.href='기여목록.html?doc=${username}'">📄 기여 목록</button>
                    
                    <div style="position: relative;">
                        <button class="toolbar-btn" onclick="toggleMenu(event)" style="border-right: none;">⋮</button>
                        <div id="moreMenu" class="dropdown" style="display: none; position: absolute; top: 100%; left: 0; background: var(--wiki-box-bg); border: 1px solid var(--wiki-border); width: 160px; z-index: 1000;">
                            <a href="역사.html?doc=${username}" style="display: block; padding: 10px; border-bottom: 1px solid var(--wiki-border); text-decoration: none; color: var(--wiki-text);">역사</a>
                            <a href="역링크.html?doc=${username}" style="display: block; padding: 10px; border-bottom: 1px solid var(--wiki-border); text-decoration: none; color: var(--wiki-text);">역링크</a>
                            <a href="ACL.html?doc=${username}" style="display: block; padding: 10px; text-decoration: none; color: var(--wiki-text);">ACL 관리</a>
                        </div>
                    </div>
                </div>

                <table class="namu-infobox">
                    <tr><th colspan="2" class="infobox-header">${userObj.name}</th></tr>
                    <tr><td colspan="2" class="infobox-img-container"><div class="infobox-avatar">${userObj.avatarTxt}</div></td></tr>
                    <tr class="infobox-row"><th>현재 상태</th><td>${userObj.status}</td></tr>
                    <tr class="infobox-row"><th>계정 권한</th><td class="text-red-500 font-bold">${userObj.rights}</td></tr>
                    <tr class="infobox-row"><th>최애 문서</th><td><a href="${userObj.favorite}.html" class="wiki-link">${userObj.favorite}</a></td></tr>
                    <tr class="infobox-row"><th>편집 횟수</th><td class="font-bold text-blue-600 dark:text-blue-400">${userObj.editCount}</td></tr>
                </table>

                <div class="wiki-body-content">
                    <h2>1. 개요</h2>
                    ${userObj.intro}
                </div>

                <div class="clear-both" style="padding-top: 20px;">
                    <h2>2. 최근 기여 이력</h2>
                    <table class="wiki-table">
                        <colgroup><col width="15%"><col width="25%"><col width="15%"><col width="45%"></colgroup>
                        <thead>
                            <tr><th>시간</th><th>문서명</th><th>바이트 변화</th><th>편집 요약</th></tr>
                        </thead>
                        <tbody>
                            ${historyRows}
                        </tbody>
                    </table>
                </div>

                <div class="namu-category-box">
                    <strong>분류:</strong> ${userObj.cat.split('|').map(c => `<a href="${c.trim()}.html" class="wiki-link ml-1">${c.trim()}</a>`).join(' | ')}
                </div>

                <div class="cc-box">
                    <img src="https://licensebuttons.net/l/by-nc-sa/3.0/88x31.webp" alt="CC BY-NC-SA">
                    이 저작물은 <strong>CC BY-NC-SA 2.0 KR</strong>에 따라 이용할 수 있습니다. (단, 라이선스가 명시된 일부 문서 및 삽화 제외)<br>
                    기여하신 문서의 저작권은 각 기여자에게 있으며, 각 기여자는 기여하신 부분의 저작권을 갖습니다.<br>
                    효빈위키는 백과사전이 아니며 검증되지 않았거나, 편향적이거나, 잘못된 서술이 있을 수 있습니다.
                </div>
            `;
        }

        function toggleMenu(event) {
            event.stopPropagation();
            const menu = document.getElementById('moreMenu');
            if (menu) menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        }

        document.addEventListener('click', () => {
            const menu = document.getElementById('moreMenu');
            if (menu) menu.style.display = 'none';
        });

        window.addEventListener('DOMContentLoaded', renderNamuUserProfile);
        window.addEventListener('hashchange', renderNamuUserProfile);
    </script>

    <script src="assets/load-footer.js"></script>
</body>
</html>
