    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Noto Sans KR";
            background-color: #fafafa;
            color: #262626;
            overflow: hidden; 
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #dbdbdb; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #c7c7c7; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        
        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #8e8e8e;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
<script src="ad_logic.js"></script>

    <script>
        // 13명 리스트 및 탭(tab) 속성 추가 (기본/일반 분리용)
        const chatData = {

            'user4': { id: 'user4', username: 'bus_mania_99', alias: '버스 덕후', img: '이미지/하루빈 로고.png', status: '3시간 전 활동', unread: 0, tab: '일반', messages: [] },

            'user6': { id: 'user6', username: 'happy_hyobin_life', alias: '귤대장 치카', img: '이미지/타카미 치카.png', status: '1시간 전 활동', unread: 0, tab: '일반', messages: [] },
            'user7': { id: 'user7', username: 'yoondaehwan_official', alias: '윤대환 전 시장', img: '이미지/윤대환.png', status: '현재 활동 중', unread: 0, tab: '기본', messages: [{ type: 'received', text: '내놔!! 내 재산 다 돌려내라고!!!' }] },
            'user8': { id: 'user8', username: 'ruined_economy_yoon', alias: '경제파탄 윤대환', img: '이미지/라세나 로고.png', status: '어제 활동', unread: 0, tab: '일반', messages: [] },
            'user9': { id: 'user9', username: 'vote_for_mayor', alias: '효빈시민연대', img: '이미지/심세이_로고.png', status: '현재 활동 중', unread: 0, tab: '일반', messages: [] },
            'user10': { id: 'user10', username: 'hyobin_humor', alias: '효빈 유머 저장소', img: '이미지/효빈역_전경.png', status: '5분 전 활동', unread: 0, tab: '일반', messages: [] },
            'user11': { id: 'user11', username: 'subway_duck', alias: '요소로 철도', img: '이미지/와타나베 요우.png', status: '현재 활동 중', unread: 0, tab: '일반', messages: [] },
            'user12': { id: 'user12', username: 'train_lover_korail', alias: '코레일 사랑', img: '이미지/하루빈 로고.png', status: '현재 활동 중', unread: 0, tab: '일반', messages: [] },
            'user13': { id: 'user13', username: 'clean_hyobin_now', alias: '깨끗한 효빈', img: '이미지/심세이_로고.png', status: '어제 활동', unread: 0, tab: '일반', messages: [] }
        };

        let currentChatId = null;
        let currentTab = '기본'; // 현재 활성화된 탭 ('기본' 또는 '일반')

        window.onload = () => {
            renderChatList();
            openChat('user2'); 

            const input = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            
            input.addEventListener('input', function() {
                if(this.value.trim().length > 0) {
                    sendBtn.classList.remove('hidden', 'opacity-0');
                    sendBtn.classList.add('opacity-100');
                } else {
                    sendBtn.classList.add('hidden', 'opacity-0');
                    sendBtn.classList.remove('opacity-100');
                }
            });

            // 바탕 클릭 시 이모티콘 닫기
            document.addEventListener('click', function(e) {
                const picker = document.getElementById('emoji-picker');
                if(!picker.classList.contains('hidden') && !e.target.closest('#emoji-picker') && !e.target.closest('.fa-smile')) {
                    picker.classList.add('hidden');
                }
            });
        };

        // ==========================================
        // 탭 전환 기능
        // ==========================================
        function switchTab(tabName) {
            currentTab = tabName;
            
            const tabPrimary = document.getElementById('tab-primary');
            const tabGeneral = document.getElementById('tab-general');

            if (tabName === '기본') {

        function performSearch() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const clearBtn = document.getElementById('clear-search');
            const resultsContainer = document.getElementById('search-results');

            if (query.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');

            if (!query) {
                resultsContainer.innerHTML = '<div class="p-6 text-center text-gray-500 font-bold text-sm">최근 검색 항목이 없습니다.</div>';
                return;
            }

            const allUsers = Object.values(chatData);
            const results = allUsers.filter(user => 
                user.username.toLowerCase().includes(query) || 
                user.alias.toLowerCase().includes(query)
            );

            if (results.length === 0) {
                resultsContainer.innerHTML = '<div class="p-6 text-center text-gray-500 text-sm">검색 결과가 없습니다.</div>';
                return;
            }

            let html = '';
            results.forEach(user => {

            // 현재 선택된 탭(기본/일반)에 해당하는 유저만 필터링
            const filteredUsers = Object.keys(chatData).filter(key => chatData[key].tab === currentTab);

                listContainer.innerHTML = '<div class="p-6 text-center text-gray-500 text-sm">메시지가 없습니다.</div>';
                return;
            }

            filteredUsers.forEach(key => {
                const user = chatData[key];
                const lastMsg = user.messages[user.messages.length - 1];
                let lastMsgText = '메시지를 보내보세요.';

                    if (lastMsg.type === 'image') {
                        lastMsgText = (lastMsg.align === 'sent' ? '회원님: ' : '') + '사진을 보냈습니다.';
                    } else {
                        lastMsgText = (lastMsg.type === 'sent' ? '회원님: ' : '') + lastMsg.text;

                if (lastMsgText.length > 15) lastMsgText = lastMsgText.substring(0, 15) + '...';

            const typingIndicator = document.getElementById('typing-indicator');
            typingIndicator.classList.remove('hidden'); 
            scrollToBottom();

            const delay = Math.floor(Math.random() * 1500) + 1500;

            setTimeout(() => {
                typingIndicator.classList.add('hidden'); 
                
                const reply = generateBotReply(userId, userText);
                chatData[userId].messages.push({ type: 'received', text: reply });
                
                if (currentChatId === userId) {

                } else {
                    chatData[userId].unread += 1;
                }
                renderChatList();
            }, delay);

    <!-- IndexedDB 로직 추가: 로그인한 사용자 데이터 가져오기 -->
    <script>
        function getActiveUserFromIndexedDB() {
            return new Promise((resolve) => {
                const request = indexedDB.open('HyobinAccountDB', 1);
                
                request.onsuccess = (e) => {
                    const db = e.target.result;
                    if(!db.objectStoreNames.contains('users')) { resolve(null); return; }
                    
                    const tx = db.transaction('users', 'readonly');
                    const store = tx.objectStore('users');
                    const getAllReq = store.getAll();
                    
                    getAllReq.onsuccess = () => {
                        const users = getAllReq.result;
                        const activeUser = users.find(u => u.isLoggedIn === true);
                        resolve(activeUser || null);
                    };
                    getAllReq.onerror = () => resolve(null);
                };
                request.onerror = () => resolve(null);
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const userData = await getActiveUserFromIndexedDB();
            if (!userData) return; 

            const sidebarProfileImgs = document.querySelectorAll('nav img[src*="이미지/효빈시_로고.png"]');
            sidebarProfileImgs.forEach(img => { if (userData.profilePic) img.src = userData.profilePic; });
            
            const accountNameEl = document.getElementById('my-account-name');
            if(accountNameEl && userData.username) accountNameEl.innerText = userData.username;

            window.myInstagramUser = userData;
        });
    </script>
