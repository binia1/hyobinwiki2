        // 실시간 Gemini API 호출 비동기 함수 (맥락 유지 포함)
        async function fetchGeminiReply(userId, userText) {
            const user = chatData[userId];
            const username = user.username;
            const alias = user.alias;
            const persona = characterPrompts[username] || "너는 효빈시의 평범한 시민이야.";

            // 대화 맥락 유지를 위해 최근 5개 메시지 추출
            let historyText = "";
            const recentMessages = user.messages.slice(-5);
            recentMessages.forEach(msg => {
                if (msg.type === 'sent') historyText += `시장: ${msg.text}\n`;
                else historyText += `${alias}: ${msg.text}\n`;
            });

            // AI에게 전달할 최종 프롬프트 구성
            const prompt = `
            [상황] 너는 현재 인스타그램 DM 창에서 효빈광역시장(사용자)과 대화하고 있어.
            [너의 페르소나] ${persona}
            너의 이름/아이디: ${alias} (@${username})

            [최근 대화 맥락]
            ${historyText}

            [지시사항]
            1. 너의 캐릭터 설정과 성격에 100% 빙의해서 대답해라. 절대 AI 챗봇인 티를 내지 마라.
            2. 상대방의 최근 메시지 맥락을 정확히 파악하고 대화의 흐름을 자연스럽게 이어가라.
            3. 인스타그램 DM 스타일로 한 줄에서 두 줄 사이로 아주 짧고 임팩트 있게 대답해라. 설명조로 길게 쓰지 마라.
            4. 시장이 하트('❤️')를 보냈다면 성격에 맞게 좋아하거나 불쾌해해라.
            5. 시장이 '[사진을 보냈습니다: 파일명]' 형태로 보냈다면, 마치 실제 스마트폰으로 그 사진을 본 것처럼 해당 사진 내용에 맞게 반응해라.
            
            시장님의 새로운 메시지: "${userText}"
            너의 답변:`;

            try {
                // config.js에 정의된 GEMINI_API_KEY 사용
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text.trim();
            } catch (error) {
                console.error("Gemini API 통신 에러:", error);
                return "앗, 효빈시 인스타그램 서버 통신망이 잠시 불안정하네요!";
            }
        }

        // 메시지 입력 시 발동하는 봇 트리거 로직 (타이핑 효과 및 동기화)
        async function triggerBotResponse(userId, userText) {
            const typingIndicator = document.getElementById('typing-indicator');
            if (typingIndicator) typingIndicator.classList.remove('hidden'); 
            scrollToBottom();

            // Gemini API 응답 대기
            const aiReply = await fetchGeminiReply(userId, userText);

            if (typingIndicator) typingIndicator.classList.add('hidden'); 
            
            // 가져온 AI 텍스트를 메시지 객체에 푸시
            chatData[userId].messages.push({ type: 'received', text: aiReply });
            
            // UI 렌더링 갱신
            if (currentChatId === userId) {
                renderMessages();
            } else {
                chatData[userId].unread += 1;
            }
            renderChatList();
        }
    </script>

    <script>
        function getActiveUserFromIndexedDB() {
            return new Promise((resolve) => {
                const request = indexedDB.open('HyobinAccountDB', 1);
                
                request.onsuccess = (e) => {
                    const db = e.target.result;
                    if(!db.objectStoreNames.contains('users')) { resolve(null); return; }
                    
                    const tx = db.transaction('users', 'readonly');
                    const store = tx.objectStore('users');
                    const getAllReq = store.getAll();
                    
                    getAllReq.onsuccess = () => {
                        const users = getAllReq.result;
                        const activeUser = users.find(u => u.isLoggedIn === true);
                        resolve(activeUser || null);
                    };
                    getAllReq.onerror = () => resolve(null);
                };
                request.onerror = () => resolve(null);
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const userData = await getActiveUserFromIndexedDB();
            if (!userData) return; 

            const sidebarProfileImgs = document.querySelectorAll('nav img[src*="이미지/효빈시_로고.webp"]');
            sidebarProfileImgs.forEach(img => { if (userData.profilePic) img.src = userData.profilePic; });
            
            const accountNameEl = document.getElementById('my-account-name');
            if(accountNameEl && userData.username) accountNameEl.innerText = userData.username;

            window.myInstagramUser = userData;
        });

        function blockCurrentChat() {
            if (!currentChatId) return;

            delete chatData[currentChatId];

            closeInfo(); 
            currentChatId = null; 
            document.getElementById('chat-history').innerHTML = ''; 
            
            renderChatList();
            showToast('해당 사용자가 차단되었습니다.');
        }

        function reportCurrentChat() {
            if (!currentChatId) return;
            document.getElementById('info-modal').classList.add('hidden');
            document.getElementById('report-modal').classList.remove('hidden');
        }

        function closeReportModal(e) {
            if(e) e.stopPropagation();
            document.getElementById('report-modal').classList.add('hidden');
        }

        function submitReport(reason) {
            if (!currentChatId) return;
            closeReportModal();
            showToast(`'${reason}'(으)로 신고 접수됨. 효빈시 보안팀이 처단합니다.`);
            setTimeout(() => { blockCurrentChat(); }, 1500);
        }
    </script>
</body>
</html>
