// ==========================================
        // 🔥 IndexedDB 채팅 저장 엔진
        // ==========================================
        let chatDB;

        function initChatDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('HyobinChatHistoryDB', 1);
                
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('chats')) {
                        db.createObjectStore('chats');
                    }
                };
                request.onsuccess = (e) => {
                    chatDB = e.target.result;
                    resolve();
                };
                request.onerror = (e) => reject(e);
            });
        }

        // 전체 채팅 데이터 덮어쓰기 저장
        function saveChatData() {
            if (!chatDB) return;
            const tx = chatDB.transaction('chats', 'readwrite');
            const store = tx.objectStore('chats');
            store.put(chatData, 'main_chat_data'); // 'main_chat_data'라는 키로 통째로 저장
        }

        // 저장된 채팅 데이터 불러오기
        function loadChatData() {
            return new Promise((resolve) => {
                if (!chatDB) return resolve(null);
                const tx = chatDB.transaction('chats', 'readonly');
                const store = tx.objectStore('chats');
                const req = store.get('main_chat_data');
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        }
window.onload = async () => { // 💡 async 추가
            // 1. DB 초기화 및 데이터 불러오기
            await initChatDB();
            const savedData = await loadChatData();
            
            // 2. 저장된 데이터가 있으면 기본 chatData 덮어쓰기

        function performSearch() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const clearBtn = document.getElementById('clear-search');
            const resultsContainer = document.getElementById('search-results');

            if (query.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');

            if (!query) {
                resultsContainer.innerHTML = '<div class="p-6 text-center text-gray-500 font-bold text-sm">최근 검색 항목이 없습니다.</div>';
                return;
            }

            const allUsers = Object.values(chatData);
            const results = allUsers.filter(user => 
                user.username.toLowerCase().includes(query) || 
                user.alias.toLowerCase().includes(query)
            );

            if (results.length === 0) {
                resultsContainer.innerHTML = '<div class="p-6 text-center text-gray-500 text-sm">검색 결과가 없습니다.</div>';
                return;
            }

            let html = '';
            results.forEach(user => {

                    }
                }
                container.insertAdjacentHTML('beforeend', msgHTML);
            });
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-history');
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            
            if (text === '' || !currentChatId) return;

            chatData[currentChatId].messages.push({ type: 'sent', text: text });
            input.value = '';
            document.getElementById('send-btn').classList.add('hidden', 'opacity-0');
            document.getElementById('emoji-picker').classList.add('hidden'); 
            renderMessages();
            renderChatList();

            triggerBotResponse(currentChatId, text);
            saveChatData();
        }

        function sendHeart() {
            if (!currentChatId) return;
            chatData[currentChatId].messages.push({ type: 'sent', text: '❤️' });
            renderMessages();
            renderChatList();
            triggerBotResponse(currentChatId, '❤️');
            saveChatData();
        }

// 실시간 Gemini API 호출 비동기 함수 (에러 방어막 & 심의 해제 완벽 적용)
        async function fetchGeminiReply(userId, userText) {
            const user = chatData[userId];
            const username = user.username;
            const alias = user.alias;
            const persona = characterPrompts[username] || "너는 효빈시의 평범한 시민이야.";

            // 대화 맥락 유지를 위해 최근 5개 메시지 추출
            let historyText = "";
            const recentMessages = user.messages.slice(-5);
            recentMessages.forEach(msg => {
                if (msg.type === 'sent') historyText += `시장: ${msg.text}\n`;
                else historyText += `${alias}: ${msg.text}\n`;
            });

            const prompt = `
            [상황] 너는 현재 인스타그램 DM 창에서 효빈광역시장(사용자)과 대화하고 있어.
            [너의 페르소나] ${persona}
            너의 이름/아이디: ${alias} (@${username})

            [최근 대화 맥락]
            ${historyText}

            [지시사항]
            1. 너의 캐릭터 설정과 성격에 100% 빙의해서 대답해라. 절대 AI 챗봇인 티를 내지 마라.
            2. 상대방의 최근 메시지 맥락을 정확히 파악하고 대화의 흐름을 자연스럽게 이어가라.
            3. 인스타그램 DM 스타일로 한 줄에서 두 줄 사이로 아주 짧고 임팩트 있게 대답해라. 설명조로 길게 쓰지 마라.
            4. 시장이 하트('❤️')를 보냈다면 성격에 맞게 좋아하거나 불쾌해해라.
            5. 시장이 '[사진을 보냈습니다: 파일명]' 형태로 보냈다면, 마치 실제 스마트폰으로 그 사진을 본 것처럼 해당 사진 내용에 맞게 반응해라.
            
            시장님의 새로운 메시지: "${userText}"
            너의 답변:`;

            try {
                // 💡 수정됨: 모델 이름을 확실한 gemini-1.5-flash 로 변경
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        // 💡 빌런 모드를 위한 구글 AI 자체 심의 규정(안전 필터) 완전 해제
                        safetySettings: [
                            { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                        ]
                    })
                });
                
                const data = await response.json();

                // 💡 수정됨: 구글 API가 정상 응답을 주지 않았을 때 (404, 400 등) 에러 원인을 화면에 띄움
                if (!response.ok) {
                    console.error("구글 API 에러 상세:", data);
                    return `[API 에러] 앗! 구글 서버가 응답을 거부했습니다. 원인: ${data.error?.message || response.statusText}`;
                }

                return data.candidates[0].content.parts[0].text.trim();
                
            } catch (error) {
                // 💡 수정됨: 인터넷이 끊기거나 코드 자체에서 문제가 발생했을 때 방어
                console.error("통신 자체 에러:", error);
                return "[시스템 에러] 인스타그램 통신망이 잠시 불안정하네요! (F12 콘솔창을 확인하세요)";
            }
        }
        // 메시지 입력 시 발동하는 봇 트리거 로직 (타이핑 효과 및 동기화)
        async function triggerBotResponse(userId, userText) {
            const typingIndicator = document.getElementById('typing-indicator');
            if (typingIndicator) typingIndicator.classList.remove('hidden'); 
            scrollToBottom();

            // Gemini API 응답 대기
            const aiReply = await fetchGeminiReply(userId, userText);

            if (typingIndicator) typingIndicator.classList.add('hidden'); 
            
            // 가져온 AI 텍스트를 메시지 객체에 푸시
            chatData[userId].messages.push({ type: 'received', text: aiReply });
            
            // UI 렌더링 갱신
            if (currentChatId === userId) {
                renderMessages();
            } else {
                chatData[userId].unread += 1;
            }
            renderChatList();
            saveChatData();
        }
    </script>

    <script>
        function getActiveUserFromIndexedDB() {
            return new Promise((resolve) => {
                const request = indexedDB.open('HyobinAccountDB', 1);
                
                request.onsuccess = (e) => {
                    const db = e.target.result;
                    if(!db.objectStoreNames.contains('users')) { resolve(null); return; }
                    
                    const tx = db.transaction('users', 'readonly');
                    const store = tx.objectStore('users');
                    const getAllReq = store.getAll();
                    
                    getAllReq.onsuccess = () => {
                        const users = getAllReq.result;
                        const activeUser = users.find(u => u.isLoggedIn === true);
                        resolve(activeUser || null);
                    };
                    getAllReq.onerror = () => resolve(null);
                };
                request.onerror = () => resolve(null);
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const userData = await getActiveUserFromIndexedDB();
            if (!userData) return; 

            const sidebarProfileImgs = document.querySelectorAll('nav img[src*="이미지/효빈시_로고.webp"]');
            sidebarProfileImgs.forEach(img => { if (userData.profilePic) img.src = userData.profilePic; });
            
            const accountNameEl = document.getElementById('my-account-name');
            if(accountNameEl && userData.username) accountNameEl.innerText = userData.username;

            window.myInstagramUser = userData;
        });

        function blockCurrentChat() {
            if (!currentChatId) return;

            delete chatData[currentChatId];

            closeInfo(); 
            currentChatId = null; 
            document.getElementById('chat-history').innerHTML = ''; 
            
            renderChatList();
            showToast('해당 사용자가 차단되었습니다.');
        }

        function reportCurrentChat() {
            if (!currentChatId) return;
            document.getElementById('info-modal').classList.add('hidden');
            document.getElementById('report-modal').classList.remove('hidden');
        }

        function closeReportModal(e) {
            if(e) e.stopPropagation();
            document.getElementById('report-modal').classList.add('hidden');
        }

        function submitReport(reason) {
            if (!currentChatId) return;
            closeReportModal();
            showToast(`'${reason}'(으)로 신고 접수됨. 효빈시 보안팀이 처단합니다.`);
            setTimeout(() => { blockCurrentChat(); }, 1500);
        }
    </script>
</body>
</html>
