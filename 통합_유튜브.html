<script>
        // 1. 외부 JSON 연동
        let regionDB = {};

        // 🌟 도시 로고 경로 생성 헬퍼 함수 (이미지/도시명.webp)
        function getCityLogo(regionName) {
            // 괄호 포함 지역명 완벽 파싱 (예: 남구(효빈광역시) -> 남구)
            const cleanName = regionName.replace(/\([^)]*\)/g, '').trim(); 
            return `이미지/${cleanName}.webp`;
        }

        async function init() {
            try {
                // 파이썬으로 추출한 youtube_regionDB.json 읽기
                const response = await fetch('youtube_regionDB.json');
                if(response.ok) {
                    regionDB = await response.json();
                    console.log("✅ youtube_regionDB.json 데이터 로딩 성공!");
                } else {
                    console.warn("⚠️ youtube_regionDB.json을 찾을 수 없습니다. 자동 생성 모드로 작동합니다.");
                }
            } catch(e) {
                console.warn("⚠️ 로컬 환경이거나 파일을 찾을 수 없습니다. 자동 생성 모드로 작동합니다.", e);
            }

            // URL 파라미터 확인 및 적용
            const urlParams = new URLSearchParams(window.location.search);
            const region = urlParams.get('region') || "천성구";
            const tab = urlParams.get('tab') || "home";

            changeRegion(region);
            switchTab(tab);
        }

        // JSON에 없는 지역일 경우 즉석에서 데이터를 빚어내는 만능 공장
        function generateData(regionName) {
            if(regionDB[regionName]) {
                // JSON에서 불러온 데이터라도 로고 경로는 강제로 '이미지/도시명.webp' 적용
                regionDB[regionName].logo = getCityLogo(regionName);
                return regionDB[regionName];
            }
            
            // 괄호 포함 지역명 완벽 파싱 (예: 남구(효빈광역시) -> 남구 -> 남)
            const cleanName = regionName.replace(/\([^)]*\)/g, '').trim(); 
            const shortName = cleanName.replace(/(광역시청|시청|군청|구청|도청|광역시|시|군|구)$/, "").trim(); 
            const displayName = shortName || cleanName;

            return {
                name: regionName, handle: "@" + displayName + "_Official", subs: "1.5만",
                logo: getCityLogo(regionName),
                banner: `https://via.placeholder.com/1280x250/333333/ffffff?text=${displayName}+Banner`,
                desc: `${regionName} 공식 채널입니다. 알찬 시정 소식을 전해드립니다.`,
                videos: [
                    { img: `https://via.placeholder.com/640x360?text=${displayName}1`, title: `${displayName} 시정 브리핑`, views: "1.2만회", time: "1일 전", duration: "10:15" },
                    { img: `https://via.placeholder.com/640x360?text=${displayName}2`, title: `${displayName} 명소 랜선 투어`, views: "3.5만회", time: "1주 전", duration: "08:45" },
                    { img: `https://via.placeholder.com/640x360?text=${displayName}3`, title: `${displayName} 맛집 탐방`, views: "1.8만회", time: "2주 전", duration: "12:00" },
                    { img: `https://via.placeholder.com/640x360?text=${displayName}4`, title: `${displayName} 브이로그`, views: "9,900회", time: "1개월 전", duration: "05:10" }
                ],
                shorts: [
                    { img: `https://via.placeholder.com/300x533?text=${displayName}S1`, title: `${displayName} 1분 요약`, views: "15만회" }
                ],
                posts: [
                    {
                        id: `post_${displayName}_1`,
                        text: `📢 <b>[공지] ${regionName} 채널 안내</b><br><br>${displayName}의 새로운 소식을 전해드립니다!`,
                        img: `https://via.placeholder.com/800x450?text=${displayName}+Notice`,
                        likes: 1240,
                        comments: [
                            { author: `${displayName}시민`, handle: `@${displayName}_citizen`, text: "응원합니다!!", time: "1시간 전", isVillain: false, isOfficial: false },
                            { author: "전직시장_윤대환", handle: "@YoonDaeHwan_Official", text: "어린놈의 시장이 시키드나! 내 두청운수나 돌려내!!", time: "30분 전", isVillain: true, isOfficial: false, replies: [
                                { author: regionName, handle: `@${displayName}_Official`, text: "@YoonDaeHwan_Official 수감자님, 교정센터 노역을 추가했습니다. ^^", time: "10분 전", isOfficial: true }
                            ]}
                        ]
                    }
                ]
            };
        }

        let currentData = null;
        let currentRegionName = "";

        // 탭 전환 (SPA 라우팅)
        function switchTab(tabName) {
            document.querySelectorAll('.yt-tab').forEach(el => {
                el.classList.remove('font-bold', 'text-black', 'border-b-[3px]', 'border-black');
                el.classList.add('font-semibold', 'text-gray-600');
            });
            const activeBtn = document.getElementById('tab-btn-' + tabName);
            if(activeBtn) {
                activeBtn.classList.remove('font-semibold', 'text-gray-600');
                activeBtn.classList.add('font-bold', 'text-black', 'border-b-[3px]', 'border-black');
            }

            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.add('hidden');
                el.classList.remove('block');
            });
            const targetContent = document.getElementById('content-' + tabName);
            if(targetContent) {
                targetContent.classList.remove('hidden');
                targetContent.classList.add('block');
            }

            // URL 업데이트
            const urlParams = new URLSearchParams(window.location.search);
            urlParams.set('tab', tabName);
            window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);
        }

        // 지역 변경 및 렌더링
        function changeRegion(regionKey) {
            currentRegionName = regionKey;
            currentData = generateData(regionKey);
            const data = currentData;

            // 호환성 패치 (단일 post -> posts 배열)
            if (!data.posts && data.post) {
                data.posts = [{
                    id: "post_gen_1",
                    text: data.post.text || "게시물이 없습니다.",
                    img: data.post.img || "https://via.placeholder.com/800x450",
                    likes: data.post.likes || 0,
                    comments: data.comments || []
                }];
            }

            // Select 박스에 없는 지역이 들어오면 추가
            const select = document.getElementById('regionSelect');
            if(select && !Array.from(select.options).some(opt => opt.value === regionKey)) {
                select.appendChild(new Option(`${regionKey}`, regionKey));
            }
            if(select) select.value = regionKey;

            // 사이드바 업데이트
            updateSidebar();

            // 공통 헤더 바인딩
            document.getElementById('yt-banner').src = data.banner || `https://via.placeholder.com/1280x250?text=${data.name}`;
            document.getElementById('yt-logo').src = data.logo || `https://via.placeholder.com/160?text=${data.name}`;
            document.getElementById('yt-name').innerText = data.name;
            document.getElementById('yt-handle').innerText = data.handle;
            document.getElementById('yt-subs').innerText = data.subs;
            document.getElementById('yt-desc').innerText = data.desc;
            document.getElementById('modal-desc').innerHTML = data.desc.replace(/\n/g, '<br>');
            document.getElementById('modal-subs').innerText = data.subs;

            // 홈 탭 렌더링
            if(data.videos && data.videos.length > 0) {
                const fv = data.videos[0];
                document.getElementById('home-featured').innerHTML = `
                    <div class="relative w-full md:w-[450px] aspect-video rounded-xl overflow-hidden flex-shrink-0" onclick="goToVideo('${currentRegionName}')">
                        <img src="${fv.img}" class="w-full h-full object-cover">
                        <span class="absolute bottom-1 right-1 bg-black bg-opacity-80 text-white text-xs font-bold px-1 py-0.5 rounded">${fv.duration}</span>
                    </div>
                    <div class="flex flex-col justify-center" onclick="goToVideo('${currentRegionName}')">
                        <h3 class="text-xl font-bold text-black line-clamp-2 mb-2">${fv.title}</h3>
                        <div class="text-sm text-gray-500 mb-2">조회수 ${fv.views} • ${fv.time}</div>
                        <p class="text-sm text-gray-600 line-clamp-3">최신 소식을 영상으로 만나보세요. 구독과 알림 설정 부탁드립니다!</p>
                    </div>
                `;

                document.getElementById('home-recent-videos').innerHTML = data.videos.slice(1).map(v => `
                    <div class="flex flex-col cursor-pointer group min-w-[250px] snap-center" onclick="goToVideo('${currentRegionName}')">
                        <div class="relative w-full aspect-video rounded-xl overflow-hidden mb-3">
                            <img src="${v.img}" class="w-full h-full object-cover group-hover:scale-105 transition">
                            <span class="absolute bottom-1 right-1 bg-black bg-opacity-80 text-white text-xs font-bold px-1 py-0.5 rounded">${v.duration}</span>
                        </div>
                        <h3 class="text-sm font-bold text-black line-clamp-2 mb-1 group-hover:text-blue-600">${v.title}</h3>
                        <div class="text-xs text-gray-500">조회수 ${v.views} • ${v.time}</div>
                    </div>
                `).join('');
            }

            // 동영상 및 기타 탭 렌더링
            renderVideos("");
            
            if(data.shorts) {
                document.getElementById('shorts-grid').innerHTML = data.shorts.map(s => `
                    <div class="flex flex-col cursor-pointer group" onclick="window.location.href='유튜브 Shorts 재생.html?region=${regionKey}'">
                        <div class="relative w-full aspect-[9/16] rounded-xl overflow-hidden mb-2">
                            <img src="${s.img}" class="w-full h-full object-cover group-hover:scale-105 transition">
                            <i class="fas fa-play absolute bottom-2 left-2 text-white bg-black bg-opacity-50 p-1 rounded"></i>
                        </div>
                        <h3 class="text-sm font-bold text-black line-clamp-2 leading-tight">${s.title}</h3>
                        <div class="text-xs text-gray-500 mt-1">조회수 ${s.views}</div>
                    </div>
                `).join('');
            }

            renderCommunity(data);

            // URL 지역명 업데이트
            const urlParams = new URLSearchParams(window.location.search);
            urlParams.set('region', regionKey);
            window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);
        }

        // 사이드바 목록 갱신 (최대 5개 표시)
        function updateSidebar() {
            const select = document.getElementById('regionSelect');
            // JSON에 있는 키와 select에 있는 옵션 병합
            let allRegions = Array.from(select.options).map(o => o.value);
            Object.keys(regionDB).forEach(k => { if(!allRegions.includes(k)) allRegions.push(k); });
            
            // 앞 5개만 사이드바에 표시
            const visible = allRegions.slice(0, 5);
            const sidebarHtml = visible.map(opt => {
                const d = regionDB[opt] || generateData(opt);
                const isActive = (opt === currentRegionName) ? 'bg-gray-100 font-bold' : '';
                return `
                    <a href="javascript:void(0)" onclick="changeRegion('${opt}'); switchTab('home'); closeAllSubsModal();" class="flex items-center px-3 py-2.5 rounded-lg hover:bg-gray-100 transition mb-1 ${isActive}">
                        <img src="${getCityLogo(opt)}" onerror="this.src='https://via.placeholder.com/24'" class="w-6 h-6 rounded-full mr-4 object-cover">
                        <span class="truncate">${d.name}</span>
                    </a>
                `;
            }).join('');
            document.getElementById('sidebar-subscriptions').innerHTML = sidebarHtml;
        }

        // 🌟 전체 보기 모달 제어
        function openAllSubsModal() {
            const modal = document.getElementById('all-subs-modal');
            const content = document.getElementById('all-subs-content');
            
            // 모든 지역 리스트업
            const select = document.getElementById('regionSelect');
            let allRegions = Array.from(select.options).map(o => o.value);
            Object.keys(regionDB).forEach(k => { if(!allRegions.includes(k)) allRegions.push(k); });
            
            const listHtml = allRegions.map(opt => {
                const d = regionDB[opt] || generateData(opt);
                return `
                    <div class="flex items-center gap-4 p-3 hover:bg-gray-100 rounded-lg cursor-pointer transition" onclick="changeRegion('${opt}'); switchTab('home'); closeAllSubsModal();">
                        <img src="${getCityLogo(opt)}" onerror="this.src='https://via.placeholder.com/40'" class="w-10 h-10 rounded-full object-cover">
                        <div class="flex-1">
                            <h4 class="font-bold text-sm">${d.name}</h4>
                            <p class="text-xs text-gray-500">${d.handle}</p>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('all-subs-list').innerHTML = listHtml;

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            setTimeout(() => { content.classList.remove('scale-95'); content.classList.add('scale-100'); }, 10);
        }

        function closeAllSubsModal() {
            const modal = document.getElementById('all-subs-modal');
            const content = document.getElementById('all-subs-content');
            content.classList.remove('scale-100'); content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; }, 200);
        }

        // 커뮤니티 탭 다중 게시글 렌더링
        function renderCommunity(data) {
            const container = document.getElementById('community-posts-container');
            if(!data.posts || data.posts.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500">아직 게시물이 없습니다.</p>`;
                return;
            }

            const officialLogo = getCityLogo(currentRegionName);
            let html = '';
            data.posts.forEach((post, index) => {
                const postId = post.id || `post_${index}`;
                const likeCountText = post.likes >= 10000 ? (post.likes / 10000).toFixed(1) + '만' : post.likes.toLocaleString();
                
                // 해당 게시글의 댓글들 생성
                let commentsHtml = '';
                if(post.comments) {
                    post.comments.forEach((c, cIndex) => {
                        const commentId = `${postId}_c${cIndex}`;
                        let pImg = c.isVillain ? (c.author.includes('대환') ? '이미지/윤대환.webp' : '이미지/윤재훈.webp') : 'https://via.placeholder.com/40';
                        let nameBadge = c.isOfficial ? 'bg-gray-500 text-white px-1.5 py-0.5 rounded-full' : 'text-black font-bold';
                        
                        commentsHtml += `
                            <div class="flex gap-3 mb-6">
                                <img src="${c.isOfficial ? officialLogo : pImg}" onerror="this.src='https://via.placeholder.com/40'" class="w-10 h-10 rounded-full object-cover">
                                <div class="flex-1 w-full min-w-0">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-[13px] ${nameBadge} truncate">${c.handle}</span>
                                        <span class="text-[12px] text-gray-500">${c.time}</span>
                                    </div>
                                    <p class="text-[14px] text-black mb-1 break-words">${c.text}</p>
                                    <div class="flex items-center gap-4 text-gray-600 mt-2">
                                        <button onclick="toggleIcon(this)"><i class="far fa-thumbs-up text-sm"></i></button>
                                        <button onclick="toggleIcon(this)"><i class="far fa-thumbs-down text-sm"></i></button>
                                        <button class="text-xs font-bold hover:bg-gray-100 px-3 py-1 rounded-full transition" onclick="toggleReplyInput('${commentId}')">답글</button>
                                    </div>
                                    
                                    <!-- 🌟 답글 입력 영역 -->
                                    <div id="reply-input-area-${commentId}" class="hidden mt-2 flex gap-3 items-start animate-fade-in">
                                        <img src="https://via.placeholder.com/24" class="w-6 h-6 rounded-full">
                                        <div class="flex-1">
                                            <input type="text" id="reply-input-${commentId}" placeholder="답글 추가..." class="w-full bg-transparent border-b border-gray-300 focus:border-black outline-none py-1 text-[13px] transition" onkeypress="if(event.key === 'Enter') addReply('${commentId}')">
                                            <div class="flex justify-end mt-2">
                                                <button class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1 rounded-full text-xs font-bold transition" onclick="addReply('${commentId}')">답글 달기</button>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- 🌟 답글 목록 영역 -->
                                    <div id="replies-container-${commentId}" class="mt-2 space-y-4">
                        `;
                        // 답글(공식 계정 사이다 등)
                        if(c.replies) {
                            c.replies.forEach(r => {
                                let rBg = r.isOfficial ? 'bg-blue-50 p-3 rounded-xl' : ''; 
                                let rBadge = r.isOfficial ? 'bg-gray-500 text-white px-2 py-0.5 rounded-full' : 'text-black font-bold';
                                let rpImg = r.isOfficial ? officialLogo : 'https://via.placeholder.com/24';
                                commentsHtml += `
                                    <div class="flex gap-3 ${rBg}">
                                        <img src="${rpImg}" class="w-6 h-6 rounded-full object-cover mt-1" onerror="this.src='https://via.placeholder.com/24'">
                                        <div class="flex-1 min-w-0">
                                            <div class="flex items-center gap-2 mb-0.5">
                                                <span class="text-[12px] ${rBadge} truncate">${r.handle}</span>
                                                ${r.isOfficial ? '<i class="fas fa-check-circle text-gray-500 text-[10px]"></i>' : ''}
                                                <span class="text-[11px] text-gray-500">${r.time}</span>
                                            </div>
                                            <p class="text-[13px] text-black break-words">${r.text}</p>
                                        </div>
                                    </div>
                                `;
                            });
                        }
                        commentsHtml += `</div></div></div>`;
                    });
                }

                const commentTotal = post.comments ? post.comments.length : (post.commentsCount || 0);

                // 게시글 HTML 조립
                html += `
                    <div class="border border-gray-200 rounded-xl p-4 sm:p-5 mb-6 shadow-sm">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex gap-3 cursor-pointer">
                                <img src="${officialLogo}" onerror="this.src='https://via.placeholder.com/40'" class="w-10 h-10 rounded-full object-cover">
                                <div><h3 class="font-bold text-sm hover:underline"><span>${data.name}</span> <span class="text-xs text-gray-500 font-normal ml-1">게시됨</span></h3></div>
                            </div>
                        </div>
                        <div class="text-sm mb-3 break-words">${post.text}</div>
                        <div class="rounded-xl overflow-hidden bg-gray-100 mb-3 border border-gray-200 cursor-pointer">
                            <img src="${post.img}" class="w-full h-auto max-h-[500px] object-cover" onerror="this.src='https://via.placeholder.com/800x450/EEEEEE/333333?text=Image'">
                        </div>
                        <div class="flex items-center gap-4 mt-3 pt-2">
                            <div class="flex bg-gray-100 rounded-full">
                                <button class="flex items-center gap-2 px-4 py-2 hover:bg-gray-200 rounded-l-full transition" onclick="togglePostLike(this, '${postId}', ${post.likes})">
                                    <i class="far fa-thumbs-up text-[16px]"></i><span id="like-count-${postId}" class="text-xs font-bold">${likeCountText}</span>
                                </button>
                                <div class="w-[1px] bg-gray-300 my-2"></div>
                                <button class="px-4 py-2 hover:bg-gray-200 rounded-r-full transition" onclick="toggleIcon(this)"><i class="far fa-thumbs-down text-[16px]"></i></button>
                            </div>
                            <button class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-full transition flex items-center gap-2" onclick="shareLink()">
                                <i class="fas fa-share text-[16px]"></i> <span class="text-xs font-bold">공유</span>
                            </button>
                            <button class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-full transition flex items-center gap-2" onclick="document.getElementById('input-${postId}').focus()">
                                <i class="far fa-comment-alt text-[16px]"></i> <span id="comment-total-${postId}" class="text-xs font-bold">${commentTotal}</span>
                            </button>
                        </div>
                        
                        <div class="mt-4 border-t border-gray-100 pt-4">
                            <div class="flex gap-3 items-start mb-5">
                                <img src="https://via.placeholder.com/32" class="w-8 h-8 rounded-full">
                                <div class="flex-1">
                                    <input type="text" id="input-${postId}" placeholder="댓글 추가..." class="w-full bg-transparent border-b border-gray-300 focus:border-black outline-none py-1 text-sm transition" onkeypress="if(event.key === 'Enter') addPostComment('${postId}')">
                                    <div class="flex justify-end mt-2">
                                        <button class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1 rounded-full text-xs font-bold transition" onclick="addPostComment('${postId}')">댓글</button>
                                    </div>
                                </div>
                            </div>
                            <div id="comments-area-${postId}" class="space-y-5">
                                ${commentsHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 🌟 동영상 및 "채널 검색 결과" 렌더링
        function renderVideos(searchQuery) {
            const channelResultContainer = document.getElementById('channel-search-result');
            const gridElement = document.getElementById('videos-grid');
            channelResultContainer.innerHTML = ''; // 기존 채널 검색 결과 초기화

            if (!currentData || !currentData.videos) return;
            let targetVideos = currentData.videos;

            // 검색어가 있을 때
            if (searchQuery) {
                // 1. [채널 검색] 지자체명이 검색어와 일치하는 채널 찾기
                const select = document.getElementById('regionSelect');
                let allRegions = Array.from(select.options).map(o => o.value);
                Object.keys(regionDB).forEach(k => { if(!allRegions.includes(k)) allRegions.push(k); });
                
                const matchedChannels = allRegions.filter(name => name.toLowerCase().includes(searchQuery.toLowerCase()));
                
                if (matchedChannels.length > 0) {
                    const channelCards = matchedChannels.map(rName => {
                        const d = regionDB[rName] || generateData(rName);
                        return `
                            <div class="flex items-center gap-4 p-4 border border-gray-200 rounded-xl hover:bg-gray-50 cursor-pointer transition shadow-sm" onclick="changeRegion('${rName}'); switchTab('home');">
                                <img src="${getCityLogo(rName)}" onerror="this.src='https://via.placeholder.com/160'" class="w-[80px] h-[80px] sm:w-[120px] sm:h-[120px] rounded-full object-cover">
                                <div class="flex-1 min-w-0">
                                    <h3 class="text-lg sm:text-xl font-bold flex items-center gap-1 truncate">${d.name} <i class="fas fa-check-circle text-gray-500 text-[14px]"></i></h3>
                                    <div class="text-sm text-gray-600 truncate">${d.handle} • 구독자 ${d.subs}</div>
                                    <p class="text-xs text-gray-500 mt-1 line-clamp-2">${d.desc}</p>
                                </div>
                                <button class="hidden sm:block bg-[#0f0f0f] text-white font-bold px-4 py-2 rounded-full whitespace-nowrap">구독</button>
                            </div>
                        `;
                    }).join('');
                    channelResultContainer.innerHTML = `<h3 class="font-bold text-gray-700 mb-3 ml-1">채널 검색 결과</h3>${channelCards}<hr class="my-6 border-gray-200">`;
                }

                // 2. [영상 검색] 현재 채널의 영상 중 검색어가 포함된 것 필터링
                targetVideos = currentData.videos.filter(v => v.title.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            // 영상 그리드 렌더링
            if (targetVideos.length === 0) {
                gridElement.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-500"><i class="fas fa-search text-4xl mb-4"></i><p class="text-lg">영상 검색 결과가 없습니다.</p></div>`;
            } else {
                gridElement.innerHTML = targetVideos.map(v => `
                    <div class="flex flex-col cursor-pointer group" onclick="goToVideo('${currentRegionName}')">
                        <div class="relative w-full aspect-video rounded-xl overflow-hidden mb-3">
                            <img src="${v.img}" class="w-full h-full object-cover group-hover:scale-105 transition" onerror="this.src='https://via.placeholder.com/640x360'">
                            <span class="absolute bottom-1 right-1 bg-black bg-opacity-80 text-white text-xs font-bold px-1 py-0.5 rounded">${v.duration}</span>
                        </div>
                        <h3 class="text-sm font-bold text-black line-clamp-2 mb-1 group-hover:text-blue-600">${v.title}</h3>
                        <div class="text-xs text-gray-500">조회수 ${v.views} • ${v.time}</div>
                    </div>
                `).join('');
            }
        }

        function executeSearch() {
            const query = document.getElementById('top-search-input').value.trim();
            switchTab('videos'); // 동영상 탭으로 이동
            renderVideos(query); // 채널 및 영상 필터링 렌더링
        }

        function goToVideo(region) {
            window.location.href = `유튜브 영상재생.html?region=${region}`;
        }

        function openAboutModal() {
            const modal = document.getElementById('about-modal');
            const content = document.getElementById('about-modal-content');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            setTimeout(() => { content.classList.remove('scale-95'); content.classList.add('scale-100'); }, 10);
        }

        function closeAboutModal() {
            const modal = document.getElementById('about-modal');
            const content = document.getElementById('about-modal-content');
            content.classList.remove('scale-100'); content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; }, 200);
        }

        let isSubscribed = false;
        function toggleSubscribe() {
            const btn = document.getElementById('subscribe-btn');
            isSubscribed = !isSubscribed;
            btn.innerHTML = isSubscribed ? '<i class="far fa-bell mr-1"></i> 구독중' : '구독';
            btn.className = isSubscribed ? "bg-[#f2f2f2] text-black font-bold px-4 py-2 rounded-full" : "bg-[#0f0f0f] text-white font-bold px-4 py-2 rounded-full hover:bg-[#272727]";
        }

        function togglePostLike(btn, postId, baseCount) {
            const icon = btn.querySelector('i');
            const countEl = document.getElementById('like-count-' + postId);
            if(icon.classList.contains('far')) {
                icon.classList.replace('far', 'fas');
                let n = baseCount + 1;
                countEl.innerText = (n >= 10000) ? (n / 10000).toFixed(1) + '만' : n.toLocaleString();
            } else {
                icon.classList.replace('fas', 'far');
                countEl.innerText = (baseCount >= 10000) ? (baseCount / 10000).toFixed(1) + '만' : baseCount.toLocaleString();
            }
        }

        function toggleIcon(btn) { 
            btn.querySelector('i').classList.toggle('fas'); 
            btn.querySelector('i').classList.toggle('far'); 
        }

        function addPostComment(postId) {
            const input = document.getElementById('input-' + postId);
            const text = input.value.trim();
            if (text === '') return;
            const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            const newComment = `
                <div class="flex gap-3 mb-6 animate-fade-in">
                    <img src="https://via.placeholder.com/40" class="w-10 h-10 rounded-full object-cover">
                    <div class="flex-1 w-full min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-bold text-[13px] text-black truncate">@Citizen_New</span>
                            <span class="text-[12px] text-gray-500">방금 전</span>
                        </div>
                        <p class="text-[14px] text-black mb-1 break-words">${safeText}</p>
                    </div>
                </div>
            `;
            document.getElementById('comments-area-' + postId).insertAdjacentHTML('afterbegin', newComment);
            input.value = '';
            const totalEl = document.getElementById('comment-total-' + postId);
            totalEl.innerText = (parseInt(totalEl.innerText.replace(/,/g,'')) + 1).toString();
        }

        // 🌟 개별 답글(대댓글) UI 토글 및 등록 함수
        function toggleReplyInput(commentId) {
            const el = document.getElementById('reply-input-area-' + commentId);
            el.classList.toggle('hidden');
            if(!el.classList.contains('hidden')) {
                document.getElementById('reply-input-' + commentId).focus();
            }
        }

        function addReply(commentId) {
            const input = document.getElementById('reply-input-' + commentId);
            const text = input.value.trim();
            if (text === '') return;
            const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            const replyHtml = `
                <div class="flex gap-3 animate-fade-in">
                    <img src="https://via.placeholder.com/24" class="w-6 h-6 rounded-full object-cover mt-1">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-0.5">
                            <span class="text-[12px] font-bold text-black truncate">@Citizen_New</span>
                            <span class="text-[11px] text-gray-500">방금 전</span>
                        </div>
                        <p class="text-[13px] text-black break-words">${safeText}</p>
                    </div>
                </div>
            `;
            document.getElementById('replies-container-' + commentId).insertAdjacentHTML('beforeend', replyHtml);
            input.value = '';
            toggleReplyInput(commentId);
        }

        function shareLink() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>

    <script src="assets/hb_index_scripts.js"></script>

    <script src="assets/load-footer.js"></script>
