    <div id="imageModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-90 items-center justify-center p-4">
        <button id="closeModal" class="absolute top-4 right-4 sm:top-8 sm:right-8 text-white hover:text-gray-300 focus:outline-none transition z-50">
            <i class="fa-solid fa-xmark text-4xl"></i>
        </button>
        <div class="modal-animate max-w-5xl w-full flex flex-col items-center">
            <img id="modalImg" src="" alt="확대 이미지" class="max-h-[80vh] max-w-full object-contain shadow-2xl rounded">

    <!-- 스크립트 충돌 방지를 위한 IIFE(즉시 실행 함수) 패턴 적용 -->
    <script>
        (() => {
            const categories = [
                { id: 'all', name: '전체보기', icon: 'fa-border-all' },
                { id: 'station', name: '역/승강장', icon: 'fa-train-subway' },
                { id: 'map', name: '지도/노선도', icon: 'fa-map-location-dot' },
                { id: 'vehicle', name: '교통수단', icon: 'fa-bus' },
                { id: 'character', name: '캐릭터', icon: 'fa-user-group' },
                { id: 'place', name: '명소/건물', icon: 'fa-building' },
                { id: 'logo', name: '로고/기타', icon: 'fa-shapes' }
            ];

            let currentCategory = 'all';
            let searchQuery = '';
            const ITEMS_PER_PAGE = 30; 
            let currentPage = 1;
            const basePath = "이미지/";

            const galleryGrid = document.getElementById('galleryGrid');
            const searchInput = document.getElementById('searchInput');
            const noResult = document.getElementById('noResult');
            const totalCount = document.getElementById('totalCount');
            const categoryContainer = document.getElementById('categoryContainer');
            const paginationContainer = document.getElementById('pagination');
            const scrollContainer = document.getElementById('scrollContainer');
            
            const imageModal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            const modalCaption = document.getElementById('modalCaption');
            const closeModalBtn = document.getElementById('closeModal');

            function getCategoryForFile(file) {
                const lowerFile = file.toLowerCase();
                if (lowerFile.includes('노선도') || lowerFile.includes('지도') || lowerFile.includes('행정동')) return 'map';
                if (lowerFile.includes('역_') || lowerFile.includes('승강장') || lowerFile.includes('플랫폼') || lowerFile.includes('신호장') || lowerFile.includes('출장소') || lowerFile.includes('역사.webp') || lowerFile.includes('플랫')) return 'station';
                if (lowerFile.includes('전동차') || lowerFile.includes('호대') || lowerFile.includes('버스') || lowerFile.includes('여객') || lowerFile.includes('운수') || lowerFile.includes('교통') || lowerFile.includes('고속') || lowerFile.includes('열차') || lowerFile.includes('래핑')) {
                    if (!lowerFile.includes('본사') && !lowerFile.includes('로고') && !lowerFile.includes('광고')) return 'vehicle';
                }
                const charKeywords = ['sd', 'basic', '고나미', '하루빈', '박라미', '다로나', '미소하', '라세나', '임세정', '임세하', '유리아', '전노아', '박효빈', '윤대환', 'char_', '사복', '단체', '나인스타즈', '카스미', '카난', '다이아', '마리', '하나마루', '루비', '요시코', '리코', '요우', '치카', '니코', '우미', '노조미', '에리', '린', '코토리', '마키', '호노카', '조상현', '김성민', '최형석', '시장', '인물', '과잠'];
                if (charKeywords.some(kw => lowerFile.includes(kw))) {
                    if (!lowerFile.includes('로고') && !lowerFile.includes('버스') && !lowerFile.includes('열차') && !lowerFile.includes('역_')) return 'character';
                }
                if (lowerFile.includes('백화점') || lowerFile.includes('마트') || lowerFile.includes('홈플러스') || lowerFile.includes('터미널') || lowerFile.includes('공항') || lowerFile.includes('시청') || lowerFile.includes('대학교') || lowerFile.includes('해수욕장') || lowerFile.includes('공단') || lowerFile.includes('본사') || lowerFile.includes('아쿠아') || lowerFile.includes('호텔') || lowerFile.includes('전경') || lowerFile.includes('센터') || lowerFile.includes('회관') || lowerFile.includes('공원') || lowerFile.includes('홀') || lowerFile.includes('기지') || lowerFile.includes('사업소')) return 'place';
                if (lowerFile.includes('로고') || lowerFile.includes('ui') || lowerFile.includes('휘장') || lowerFile.includes('마크') || lowerFile.includes('광고') || lowerFile.includes('슬로건') || lowerFile.includes('logo')) return 'logo';
                return 'logo'; 
            }

            function initArchive() {
                if (typeof imageFiles === 'undefined') {
                    console.error('image_data.js 파일이 로드되지 않았습니다.');
                    if(galleryGrid) galleryGrid.innerHTML = '<div class="col-span-full text-center py-10 text-red-500">이미지 데이터를 불러올 수 없습니다.</div>';
                    return;
                }
                renderCategoryTabs();
                filterAndRender();
            }

            function renderCategoryTabs() {
                if(!categoryContainer) return;
                categoryContainer.innerHTML = '';
                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    const isActive = currentCategory === cat.id;
                    btn.className = `category-tab px-4 py-1.5 rounded-full text-sm font-medium border flex items-center gap-2
                        ${isActive ? 'bg-white text-[#555588] border-white shadow-sm' : 'bg-[#444477] text-gray-200 border-transparent hover:bg-[#666699] hover:text-white'}`;
                    btn.innerHTML = `<i class="fa-solid ${cat.icon}"></i> ${cat.name}`;
                    btn.onclick = () => {
                        currentCategory = cat.id;
                        currentPage = 1; 
                        renderCategoryTabs();
                        filterAndRender();
                    };
                    categoryContainer.appendChild(btn);
                });
            }

            function filterAndRender() {
                if(typeof imageFiles === 'undefined') return;
                
                const filtered = imageFiles.filter(file => {
                    const matchesSearch = file.toLowerCase().includes(searchQuery);
                    const fileCat = getCategoryForFile(file);
                    const matchesCategory = currentCategory === 'all' || fileCat === currentCategory;
                    return matchesSearch && matchesCategory;
                });
                
                if(totalCount) totalCount.textContent = `${filtered.length}개`;
                
                if (filtered.length === 0) {
                    if(noResult) noResult.classList.remove('hidden');
                    if(galleryGrid) galleryGrid.classList.add('hidden');
                    if(paginationContainer) paginationContainer.classList.add('hidden');
                    return;
                }

                if(noResult) noResult.classList.add('hidden');
                if(galleryGrid) galleryGrid.classList.remove('hidden');

                const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
                if (currentPage > totalPages) currentPage = 1;

                const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
                const endIndex = startIndex + ITEMS_PER_PAGE;
                const paginatedFiles = filtered.slice(startIndex, endIndex);

                renderGallery(paginatedFiles);
                renderPagination(totalPages);
            }

            if(searchInput) {
                searchInput.addEventListener('input', (e) => {
                    searchQuery = e.target.value.toLowerCase();
                    currentPage = 1; 
                    filterAndRender();
                });
            }

            function renderGallery(files) {
                if(!galleryGrid) return;
                galleryGrid.innerHTML = '';
                files.forEach(file => {
                    const card = document.createElement('div');
                    card.className = 'img-card bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden cursor-pointer flex flex-col h-48 relative';
                    const fileCat = getCategoryForFile(file);
                    const catObj = categories.find(c => c.id === fileCat) || categories[categories.length - 1];

                    // 사용자 지침에 따라 placeholder 완전히 배제, 순수 경로만 적용
                    card.innerHTML = `
                        <div class="absolute top-2 right-2 bg-black bg-opacity-60 text-white text-xs px-1.5 py-0.5 rounded shadow z-10 backdrop-blur-sm">
                            <i class="fa-solid ${catObj.icon}"></i>
                        </div>
                        <div class="h-36 w-full bg-gray-100 flex items-center justify-center overflow-hidden">
                            <img src="${basePath}${file}" alt="${file}" loading="lazy" class="w-full h-full object-cover">
                        </div>
                        <div class="p-2 border-t border-gray-100 bg-gray-50 flex-1 flex items-center justify-center">
                            <p class="text-xs text-gray-700 font-medium text-center w-full truncate-text px-1" title="${file}">
                                ${file}
                            </p>
                        </div>
                    `;
                    card.addEventListener('click', () => openModal(file));
                    galleryGrid.appendChild(card);
                });
            }

            function renderPagination(totalPages) {
                if(!paginationContainer) return;
                paginationContainer.innerHTML = '';
                
                if (totalPages <= 1) {
                    paginationContainer.classList.add('hidden');
                    return;
                }
                paginationContainer.classList.remove('hidden');

                const prevBtn = document.createElement('button');
                prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
                prevBtn.className = `w-8 h-8 flex items-center justify-center rounded-md border ${currentPage === 1 ? 'bg-gray-100 text-gray-400 cursor-not-allowed border-gray-200' : 'bg-white text-gray-700 hover:bg-gray-50 border-gray-300 transition'}`;
                prevBtn.disabled = currentPage === 1;
                prevBtn.onclick = () => {
                    if (currentPage > 1) {
                        currentPage--;
                        filterAndRender();
                        scrollToTop();
                    }
                };
                paginationContainer.appendChild(prevBtn);

                let startPage = Math.max(1, currentPage - 2);
                let endPage = Math.min(totalPages, currentPage + 2);

                if (startPage > 1) {
                    paginationContainer.appendChild(createPageBtn(1));
                    if (startPage > 2) paginationContainer.appendChild(createEllipsis());
                }

                for (let i = startPage; i <= endPage; i++) {
                    paginationContainer.appendChild(createPageBtn(i));
                }

                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) paginationContainer.appendChild(createEllipsis());
                    paginationContainer.appendChild(createPageBtn(totalPages));
                }

                const nextBtn = document.createElement('button');
                nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
                nextBtn.className = `w-8 h-8 flex items-center justify-center rounded-md border ${currentPage === totalPages ? 'bg-gray-100 text-gray-400 cursor-not-allowed border-gray-200' : 'bg-white text-gray-700 hover:bg-gray-50 border-gray-300 transition'}`;
                nextBtn.disabled = currentPage === totalPages;
                nextBtn.onclick = () => {
                    if (currentPage < totalPages) {
                        currentPage++;
                        filterAndRender();
                        scrollToTop();
                    }
                };
                paginationContainer.appendChild(nextBtn);
            }

            function createPageBtn(page) {
                const btn = document.createElement('button');
                btn.textContent = page;
                btn.className = `w-8 h-8 flex items-center justify-center rounded-md text-sm font-medium transition ${currentPage === page ? 'bg-[#555588] text-white border border-[#555588]' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50'}`;
                btn.onclick = () => {
                    currentPage = page;
                    filterAndRender();
                    scrollToTop();
                };
                return btn;
            }

            function createEllipsis() {
                const span = document.createElement('span');
                span.textContent = '...';
                span.className = 'px-1 text-gray-500';
                return span;
            }

            function scrollToTop() {
                if(scrollContainer) scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function openModal(file) {
                if(modalImg) modalImg.src = `${basePath}${file}`;
                if(modalCaption) modalCaption.textContent = file;
                if(imageModal) {
                    imageModal.classList.remove('hidden');
                    imageModal.classList.add('flex');
                }
            }

            function closeImageModal() {
                if(imageModal) {
                    imageModal.classList.add('hidden');
                    imageModal.classList.remove('flex');
                }
            }

            if(closeModalBtn) closeModalBtn.addEventListener('click', closeImageModal);
            if(imageModal) {
                imageModal.addEventListener('click', (e) => {
                    if (e.target === imageModal) closeImageModal();
                });
            }
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && imageModal && !imageModal.classList.contains('hidden')) closeImageModal();
            });

            window.addEventListener('DOMContentLoaded', initArchive);
        })();
    </script>
