<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="이미지/효빈위키아이콘.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 즐겨찾기 - 효빈위키</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        :root { 
            --wiki-main: #7777AA; 
            --wiki-main-light: #9999CC;
            --wiki-main-lightest: #EEEEF5;
            --wiki-border: #ccc; 
            --wiki-bg: #ffffff; 
            --wiki-text: #373a3c; 
            --wiki-gray-bg: #F9F9FA; 
            --wiki-link: #0022AA;
            --wiki-box-bg: #ffffff;
            --wiki-toc-bg: #f8f9fa;
            --wiki-toc-border: #e9ecef;
            --wiki-icon-bg: #666699;
        }

        body.dark-mode {
            --wiki-main: #8888CC; 
            --wiki-main-light: #555588;
            --wiki-main-lightest: #2d3035;
            --wiki-border: #444;
            --wiki-bg: #1f2023;
            --wiki-text: #ddd;
            --wiki-gray-bg: #F9F9FA;
            --wiki-link: #4477FF; /* 다크모드일때 링크색 살짝 밝게 조정 */
            --wiki-box-bg: #2a2d30;
            --wiki-toc-bg: #2d3035;
            --wiki-toc-border: #444;
            --wiki-icon-bg: #555588;
        }

        body { font-family: 'Noto Sans KR', sans-serif; background-color: var(--wiki-bg); color: var(--wiki-text); line-height: 1.7; word-break: keep-all; margin: 0; transition: background-color 0.3s, color 0.3s; }
        .wiki-container { max-width: 1300px; margin: 0 auto; padding: 20px 40px; border-left: 1px solid var(--wiki-border); border-right: 1px solid var(--wiki-border); min-height: 100vh; background-color: var(--wiki-bg); }

        .wiki-link { color: var(--wiki-link); cursor: pointer; text-decoration: none; font-weight: 500; }
        .wiki-link:hover { text-decoration: underline; }

        .nav-logo-box { width: 30px; height: 30px; background: white; color: var(--wiki-main); border-radius: 4px; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        
        h1.title { font-size: 2.2rem; font-weight: 800; margin-bottom: 5px; }
        .wiki-paragraph { margin-bottom: 15px; font-size: 0.95rem; }

        /* 즐겨찾기 리스트 전용 스타일 (효빈위키 카테고리 스타일 응용) */
        .category-section { border: 1px solid var(--wiki-border); padding: 20px; border-radius: 4px; background: var(--wiki-box-bg); margin-bottom: 20px; }
        .category-section-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid var(--wiki-border); padding-bottom: 5px; }
        .category-list { list-style: none; padding: 0; margin: 0; font-size: 1.05rem; }
        .category-list li { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed var(--wiki-border); display: flex; align-items: center; }
        .category-list li:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .category-list li::before { content: '📄'; margin-right: 10px; font-size: 1.1em; opacity: 0.8; }
        
        /* 모달 스타일 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 10000; justify-content: center; align-items: center; }
        .modal-window { background: var(--wiki-bg); color: var(--wiki-text); width: 90%; max-width: 400px; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid var(--wiki-border); }
        .modal-header { font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; border-bottom: 2px solid var(--wiki-main); padding-bottom: 5px; }
        .modal-input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid var(--wiki-border); border-radius: 4px; background: var(--wiki-gray-bg); color: var(--wiki-text); }
        .modal-btn { width: 100%; padding: 10px; background: var(--wiki-main); color: white; font-weight: bold; border-radius: 4px; margin-top: 10px; cursor: pointer; border: none; }
        .modal-btn:hover { opacity: 0.9; }
        .close-btn { float: right; cursor: pointer; color: #888; }
    
    
</style>

    <!-- 효빈위키 폰트 CSS -->
    <link rel="stylesheet" href="wiki_font_standard.css">
</head>
<body id="body">

    <!-- 상단 네비게이션 (그대로 유지) -->
    <nav class="font-sans bg-[#7777AA] text-white p-3 flex justify-between items-center shadow-md sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="nav-logo-box">H</div>
            <a href="index.html" class="font-bold text-xl cursor-pointer no-underline text-white">HyobinWiki</a>
            <div class="hidden md:flex gap-3 text-sm opacity-90 ml-4">
                <a href="index.html" class="hover:underline font-bold text-white no-underline">대문</a>
                <a href="최근_변경.html" class="hover:underline text-white no-underline">최근 변경</a>
                <a href="최근_토론.html" class="hover:underline text-white no-underline">최근 토론</a>
                <!-- 여기에 즐겨찾기 버튼이 자연스럽게 들어갑니다 (앞서 적용하신 스크립트로 생성될 예정) -->
            </div>
        </div>
        <div class="flex flex-col items-end gap-1">
            <div class="flex items-center gap-2">
                <div class="hidden lg:flex items-center gap-1 mr-2">
                    <a href="편집요청.html" class="bg-[#666699] hover:bg-[#555588] text-white text-xs px-2 py-1 rounded transition-colors no-underline font-bold">편집요청</a>
                    <a href="최근_토론.html" class="bg-[#666699] hover:bg-[#555588] text-white text-xs px-2 py-1 rounded transition-colors no-underline font-bold">토론</a>
                    <a href="역사.html" class="bg-[#666699] hover:bg-[#555588] text-white text-xs px-2 py-1 rounded transition-colors no-underline font-bold">역사</a>
                    <a href="더보기.html" class="bg-[#666699] hover:bg-[#555588] text-white text-xs px-2 py-1 rounded transition-colors no-underline font-bold flex items-center gap-1">더보기 <span class="text-[9px]">▼</span></a>
                </div>
                
                <input type="text" id="headerSearchInput" placeholder="문서 검색" class="p-1 px-3 rounded text-black text-sm focus:outline-none border-none shadow-inner w-32 md:w-48" onkeypress="if(event.keyCode==13) { handleSearch('headerSearchInput'); }">
                <button onclick="handleSearch('headerSearchInput')" class="bg-[#555588] p-1 px-3 rounded text-xs transition-colors shadow-inner font-bold">🔍</button>
            </div>
            <div class="flex gap-1" id="auth-buttons">
                <button onclick="toggleModal('loginModal')" class="bg-[#666699] hover:bg-[#555588] text-white text-xs px-2 py-0.5 rounded transition-colors" id="btn-login">로그인</button>
                <button onclick="toggleModal('settingsModal')" class="bg-[#666699] hover:bg-[#555588] text-white text-xs px-2 py-0.5 rounded transition-colors">설정</button>
            </div>
        </div>
    </nav>

    <!-- 메인 컨텐츠 영역 -->
    <div class="wiki-container shadow-lg pt-8">
        <div class="flex flex-col md:flex-row md:justify-between md:items-end mb-4 border-b border-[var(--wiki-border)] pb-2">
            <div>
                <h1 class="title">⭐ 내 즐겨찾기</h1>
                <div class="recent-mod">브라우저 로컬 저장소 기준</div>
            </div>
        </div>
        
        <div class="wiki-paragraph font-bold">
            위키 문서를 열람하다가 상단의 별표(★)를 눌러 저장한 문서들이 이곳에 모입니다.
        </div>
        
        <div class="border border-[var(--wiki-border)] p-3 mb-6 text-sm inline-block rounded bg-[var(--wiki-gray-bg)]">
            💡 <strong>안내:</strong> 즐겨찾기 데이터는 현재 사용 중인 기기의 브라우저(로컬 스토리지)에 안전하게 저장됩니다. 인터넷 사용 기록이나 캐시를 비우면 목록이 초기화될 수 있으니 주의해 주세요.
        </div>

        <!-- 즐겨찾기 리스트가 뿌려질 영역 -->
        <div class="category-section mt-4">
            <h2 class="category-section-title">저장된 문서 목록</h2>
            <div class="category-count" id="bookmarkCount">전체 0개 문서</div>
            
            <ul class="category-list file-list" id="bookmarkList">
                <!-- 자바스크립트가 여기에 문서를 끼워넣습니다 -->
            </ul>
        </div>


    <!-- 모달창 영역 (그대로 유지) -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal-window">
            <div class="modal-header">로그인 <span class="close-btn" onclick="toggleModal('loginModal')">&times;</span></div>
            <input type="text" id="loginId" class="modal-input" placeholder="아이디">
            <input type="password" id="loginPw" class="modal-input" placeholder="비밀번호">
            <button class="modal-btn" onclick="doLogin()">로그인</button>
        </div>
    </div>
    
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-window">
            <div class="modal-header">효빈위키 설정 <span class="close-btn" onclick="toggleModal('settingsModal')">&times;</span></div>
            <div class="flex items-center justify-between mb-4">
                <span>🌙 다크 모드</span>
                <input type="checkbox" id="darkModeCheck" onchange="toggleDarkMode()" class="w-5 h-5 accent-[#7777AA]">
            </div>
            <button class="modal-btn mt-4" onclick="toggleModal('settingsModal')">닫기</button>
        </div>
    </div>

    <!-- 기능 스크립트 영역 -->
    <script>
        function handleSearch(inputId) {
            const el = document.getElementById(inputId);
            if(el && el.value.trim()) {
                window.location.href = encodeURI("효빈위키 검색.html") + "?q=" + encodeURIComponent(el.value.trim());
            }
        }
        function toggleModal(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === 'flex') ? 'none' : 'flex';
        }
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('hb_dark_mode', document.body.classList.contains('dark-mode'));
        }
        
        // 다크모드 유지 및 즐겨찾기 목록 불러오기
        window.addEventListener('DOMContentLoaded', () => {
            // 다크모드 체크
            if(localStorage.getItem('hb_dark_mode') === 'true') {
                document.body.classList.add('dark-mode');
                const cb = document.getElementById('darkModeCheck');
                if(cb) cb.checked = true;
            }

            // 즐겨찾기 목록 렌더링
            let bookmarks = JSON.parse(localStorage.getItem('hyobinBookmarks')) || [];
            const listElement = document.getElementById('bookmarkList');
            const countElement = document.getElementById('bookmarkCount');

            countElement.textContent = `전체 ${bookmarks.length}개 문서`;

            if (bookmarks.length === 0) {
                // 문서가 없을 때
                listElement.innerHTML = '<li style="color: #888; font-style: italic;">아직 즐겨찾기에 추가된 문서가 없습니다. (머쓱)</li>';
            } else {
                // 문서가 있을 때
                bookmarks.forEach(bookmark => {
                    const li = document.createElement('li');
                    
                    // 하이퍼링크 생성
                    const aTag = document.createElement('a');
                    aTag.href = bookmark.url;
                    aTag.className = 'wiki-link';
                    aTag.textContent = bookmark.title;
                    
                    // 삭제 버튼(X) 추가 (선택사항 - 목록에서 바로 지울 수 있게)
                    const deleteBtn = document.createElement('span');
                    deleteBtn.textContent = ' ✕';
                    deleteBtn.style.color = '#ff5555';
                    deleteBtn.style.fontSize = '0.8rem';
                    deleteBtn.style.marginLeft = 'auto';
                    deleteBtn.style.cursor = 'pointer';
                    deleteBtn.title = '즐겨찾기 해제';
                    
                    deleteBtn.onclick = function(e) {
                        e.preventDefault(); // 링크 이동 방지
                        if(confirm(`'${bookmark.title}' 문서를 즐겨찾기에서 지우시겠습니까?`)) {
                            bookmarks = bookmarks.filter(b => b.url !== bookmark.url);
                            localStorage.setItem('hyobinBookmarks', JSON.stringify(bookmarks));
                            location.reload(); // 새로고침해서 반영
                        }
                    };

                    li.appendChild(aTag);
                    li.appendChild(deleteBtn);
                    listElement.appendChild(li);
                });
            }
        });
    </script>

    <script src="assets/wiki_index.js"></script>
    <script src="secret_search.js"></script>
    <script src="assets/hb_wiki_core.js?v=2"></script>
    <script src="assets/hb_index_scripts.js"></script>
    <script src="assets/jana.js"></script>
    <div id="footer-container"></div>
    <script src="assets/load-footer.js"></script>
    <script src="ad_logic.js"></script>
</body>
</html>
