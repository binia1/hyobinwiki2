<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>효빈도시철도 스토리 모드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 게임 전체 윈도우 (16:9 비율) */
        .game-container {
            width: 1280px;
            height: 720px;
            position: relative;
            background-image: url('이미지/벚꽃공원.webp');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            user-select: none;
        }

        /* 캐릭터 스탠딩 레이어 */
        .character-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: 120px; /* 대사창 뒤로 자연스럽게 배치 */
            z-index: 1;
        }

        .char-sprite {
            max-height: 85%;
            transition: all 0.3s ease;
            filter: brightness(0.65); /* 말하지 않는 캐릭터는 어둡게 처리 */
        }

        /* 현재 말하는 캐릭터 강조 효과 */
        .char-sprite.active {
            filter: brightness(1);
            transform: scale(1.03);
            z-index: 2;
        }

        /* UI 레이어 (대사창 및 버튼) */
        .ui-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 230px;
            z-index: 10;
            display: flex;
            align-items: flex-end;
        }

        /* 좌측 하단 캐릭터 얼굴 아이콘 */
        .face-icon-box {
            position: absolute;
            left: 30px;
            bottom: 15px;
            width: 150px;
            height: 150px;
            z-index: 12;
        }

        .face-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        /* 반투명 대사창 본문 */
        .dialogue-box {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            background: linear-gradient(to bottom, rgba(30, 30, 30, 0.85), rgba(15, 15, 15, 0.95));
            border-top: 3px solid rgba(255, 255, 255, 0.2);
            padding: 25px 200px 20px 200px;
            color: #fff;
            cursor: pointer;
        }

        /* 캐릭터 이름표 */
        .name-tag {
            position: absolute;
            top: -40px;
            left: 190px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #EE0022; /* 5호선 미소하 테마 컬러 기본값 */
            padding: 5px 20px;
            border-radius: 5px;
            font-size: 22px;
            font-weight: bold;
            color: #FFCC11;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }

        .voice-icon {
            color: #fff;
            font-size: 18px;
        }

        /* 대사 텍스트 */
        .dialogue-text {
            font-size: 24px;
            line-height: 1.5;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            word-break: keep-all;
        }

        /* 우측 하단 컨트롤 메뉴 버튼 */
        .side-menu {
            position: absolute;
            right: 20px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 15;
        }

        .menu-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 6px 15px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }

        /* 대사 넘김 안내 화살표 애니메이션 */
        .next-indicator {
            position: absolute;
            right: 180px;
            bottom: 20px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid #FFCC11;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }
    </style>
</head>
<body>

<div class="game-container" id="game" onclick="nextDialogue()">
    <!-- 배경 및 캐릭터 스탠딩 레이어 -->
    <div class="character-layer">
        <img src="이미지/유리아.webp" class="char-sprite" id="char-yuria" alt="유리아">
        <img src="이미지/라세나.webp" class="char-sprite" id="char-lasena" alt="라세나">
        <img src="이미지/미소하.webp" class="char-sprite active" id="char-misoha" alt="미소하">
    </div>

    <!-- UI 대사창 레이어 -->
    <div class="ui-layer">
        <!-- 좌측 얼굴 아이콘 -->
        <div class="face-icon-box">
            <img src="이미지/미소하얼굴.webp" class="face-icon" id="face-icon" alt="미소하 얼굴">
        </div>

        <!-- 대사창 본문 -->
        <div class="dialogue-box">
            <div class="name-tag" id="name-tag">
                <span class="voice-icon">🔊</span>
                <span id="speaker-name">미소하 (MISOHA)</span>
            </div>

            <div class="dialogue-text" id="dialogue-text">
                (밝게 웃으며) 라세나! 오늘 날씨가 정말 좋아!<br>우리 저기 벚꽃 나무 아래로 가보자!
            </div>

            <div class="next-indicator"></div>
        </div>

        <!-- 우측 시스템 버튼 (클릭 시 대사 넘어감 방지) -->
        <div class="side-menu" onclick="event.stopPropagation()">
            <button class="menu-btn">⏭ Skip</button>
            <button class="menu-btn">▶ Auto</button>
            <button class="menu-btn">📜 Log</button>
            <button class="menu-btn">⚙ Menu</button>
        </div>
    </div>
</div>

<script>
    // 효빈도시철도 스토리 대사 및 연출 데이터
    const storyData = [
        {
            speaker: "미소하 (MISOHA)",
            text: "(밝게 웃으며) 라세나! 오늘 날씨가 정말 좋아!<br>우리 저기 벚꽃 나무 아래로 가보자!",
            face: "이미지/미소하.webp",
            activeChar: "char-misoha",
            color: "#EE0022" // 5호선 빨간색
        },
        {
            speaker: "라세나 (RASENA)",
            text: "응! 벚꽃이 정말 예쁘게 피었네.<br>유리아도 같이 가서 사진 찍자!",
            face: "이미지/라세나.webp",
            activeChar: "char-lasena",
            color: "#881188" // 6호선 보라색
        },
        {
            speaker: "유리아 (YURIA)",
            text: "좋아요! 다 같이 효빈공원 벚꽃 나무 앞에서 예쁘게 남겨봐요!",
            face: "이미지/유리아.webp",
            activeChar: "char-yuria",
            color: "#9856FF" // 8호선 연보라색
        }
    ];

    let currentStep = 0;

    function nextDialogue() {
        currentStep++;
        if (currentStep >= storyData.length) {
            currentStep = 0; // 대사가 끝나면 처음으로 루프 (필요에 따라 변경 가능)
        }

        const data = storyData[currentStep];

        // 대사, 이름, 얼굴 이미지 업데이트
        document.getElementById("speaker-name").innerText = data.speaker;
        document.getElementById("dialogue-text").innerHTML = data.text;
        document.getElementById("face-icon").src = data.face;

        // 각 호선별 고유 컬러로 이름표 테두리 색상 변경
        document.getElementById("name-tag").style.borderColor = data.color;

        // 현재 말하는 캐릭터 일러스트 강조 (밝기 및 크기 조절)
        document.querySelectorAll(".char-sprite").forEach(el => el.classList.remove("active"));
        const activeEl = document.getElementById(data.activeChar);
        if(activeEl) activeEl.classList.add("active");
    }
</script>

</body>
</html>
