            --wiki-text: #373a3c;
            --wiki-gray-bg: #f9f9f9;
        }

        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f4f5f7; color: var(--wiki-text); line-height: 1.6; margin: 0; }

        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        let docName = urlParams.get("doc"); // 1순위: 주소창 ?doc=야마다_료
        
        if (!docName && window.location.hash) {
            docName = window.location.hash.substring(1); // 2순위: 주소창 #야마다_료
        }
        
        // 3순위 (핵심 기능): URL에 아무것도 없으면 '이전 페이지' 주소를 뜯어서 문서명을 강제로 찾아냄
        if (!docName && document.referrer) {
            try {
                let refUrl = new URL(document.referrer);
                let pathName = refUrl.pathname.split('/').pop(); // 예: "야마다_료.html"
                
                // index.html이나 토론.html 자체에서 새로고침한 게 아닐 때만 적용
                if (pathName && pathName.endsWith('.html') && !pathName.includes('토론') && !pathName.includes('index')) {
                    docName = pathName.replace('.html', ''); // ".html" 떼어내서 "야마다_료" 추출!
                }
            } catch (e) {
                console.error("이전 페이지 추적 실패", e);
            }
        }
        
        // 최종 디코딩 (모든 수단을 동원해도 없으면 그때만 효빈광역시 출력)
        if (docName) {
            docName = decodeURIComponent(docName);
        } else {
            docName = "효빈광역시"; 
        }

            "히라사와_유이": ["🎸", "운탄", "일반 사용자", "대동제", "HTT", ""], 
            "히라사와_우이": ["👧", "보살", "일반 사용자", "자취", "HTT", ""], 
            "나카노_아즈사": ["🐱", "아즈냥", "일반 사용자", "한바다", "HTT", ""], 
            "아키야마_미오": ["🎸", "부끄러움", "일반 사용자", "무대", "HTT", ""], 
            "타이나카_릿츠": ["🥁", "부장", "일반 사용자", "과속방지턱", "HTT", ""],
            "고토_히토리": ["🗑️", "쓰레기통", "일반 사용자", "아싸", "결속밴드", ""], 
            "키타_이쿠요": ["✨", "키타앙", "일반 사용자", "창전구", "결속밴드", ""], 
            "이지치_니지카": ["🥁", "천사", "일반 사용자", "라이브하우스", "결속밴드", ""], 
            "야마다_료": ["🌿", "잔고 부족", "일반 사용자", "화단", "결속밴드", ""],
            "이세리_니나": ["🖕", "록 스피릿", "일반 사용자", "현수막", "걸밴크", ""], 
            "카와라기_모모카": ["🎸", "탈퇴", "일반 사용자", "길거리", "걸밴크", ""], 
            "루파": ["🎸", "미소", "일반 사용자", "취객", "걸밴크", ""], 
            "에비즈카_토모": ["🎹", "독설", "일반 사용자", "토론방", "걸밴크", ""], 
            "아와_스바루": ["🥁", "배려", "일반 사용자", "사과", "걸밴크", ""]
        };

        // ==========================================
        // 3. 토론 생성 엔진 (캐릭터 고유 멘트 + 찌질한 키배 멘트 믹스)
        // ==========================================
        const discussionArea = document.getElementById("discussionArea");
        let threadIndex = 1;

        // 특정 캐릭터 전용 멘트
        const characterSpecificQuotes = {
            "Admin_01": [`${docName} 문서에서 불필요한 편집 분쟁이 발생하고 있습니다. 추가적인 반달리즘 확인 시 영구 차단 조치하겠습니다.`, `나무위키 기본 방침에 의거하여 해당 서술은 롤백합니다.`],
            "TransitNerd": [`이보세요, ${docName}의 헥스코드가 공식 지정 색상(#0077DD, #6677CC 등)과 다르게 서술되어 있습니다. 철덕으로서 용납할 수 없네요. 당장 수정하세요.`, `급행 정차역 비율이 1:1이 아닌데 이걸 공식 설정이라고 우기시면 곤란하죠.`],
            "BusManiac": [`${docName} 내용 보니까 두청운수 시절을 미화하는 것 같은데, 75인승 플라스틱 시트의 허리 파괴 고통을 아신다면 이런 글 못 씁니다. 당장 지우세요.`],
            "사건사고기록반": [`해당 사건(${docName})은 이미 에타에서 박제된 사안입니다. 팩트에 기반한 타임라인대로 서술하겠습니다.`],
            "익명의효빈시민": [`${docName} 문서 띄어쓰기랑 맞춤법 상태가 왜 이러죠? 가독성이 너무 떨어져서 제가 전부 뜯어고쳤습니다.`, `여기 취소선 뇌절 너무 심하네요. 싹 다 밀어버립니다.`],
            "팩트체커": [`해당 내용은 뇌피셜 카더라 통신일 확률이 높습니다. 확실한 효빈일보 뉴스 기사 레퍼런스나 출처가 있는지 확인해 주세요.`],
            "Yohane_Magic": [`크큭... 이 문서(${docName})에도 어둠의 다크가 드리워져 있군요. 악마의 소행이 분명합니다... (블라인드 처리됨)`],
            "에비즈카_토모": [`그딴 논리로 토론방에서 이기려고 들지 마시죠. ${docName} 문서 수준 참 알만하네요. 반박해보시든가요.`],
            "이세리_니나": [`아니 진짜 빡치게 하네. ${docName} 문서 내가 쓴 거 다 날아갔잖아!! 뻐큐나 드시지!!`]
        };

        // 찌질한 나무위키식 범용 멘트 풀
        const genericWikiQuotes = [
            `방금 제가 추가한 내용은 실제 효빈시 지역 커뮤니티와 에타에서 현재진행형으로 돌고 있는 밈입니다. 삭제하지 말아주세요.`,
            `이 부분 설정은 공식 프롬프트 설정과 다릅니다. 제가 수정해두겠습니다.`,
            `어제부터 특정 유동 IP가 이 문서에 반달리즘을 시도하고 있습니다. 관리자님, 문서 보호 조치를 요청합니다.`,
            `여기 취소선 드립이 너무 남발되어 가독성이 떨어집니다. 뇌절 좀 멈춰주세요. 정리하는 것에 동의하시나요?`,
            `기여 내역 보니까 특정 팬덤이신 거 같은데, 다른 캐릭터 비하하면서 억지로 띄워주는 서술은 자제해주시죠.`,
            `이거 에타발 찌라시 아닌가요? 출처 제대로 안 달면 다 롤백하겠습니다.`,
            `이 문단은 문서 주제(${docName})와 아예 맞지 않습니다. 하위 문서로 분리하는 게 맞다고 봅니다.`,
            `서술 방향이 너무 주관적입니다. NPOV(중립적 시각) 원칙 지켜주세요.`,
            `저기요, 토론 합의도 안 끝났는데 마음대로 문서 수정하시면 규정 위반인 거 아시죠?`
        ];

        function getRandomQuote(author) {
            if (characterSpecificQuotes[author] && Math.random() > 0.4) {
                const quotes = characterSpecificQuotes[author];
                return quotes[Math.floor(Math.random() * quotes.length)];
            }
            return genericWikiQuotes[Math.floor(Math.random() * genericWikiQuotes.length)];
        }

        function initializeDiscussions() {
            discussionArea.innerHTML = "";
            const numComments = Math.floor(Math.random() * 5) + 3; // 3~7개의 스레드 생성
            const users = Object.keys(rawMasterDB);
            
            // 첫 번째 글은 문서 생성 관련 시비로 고정
            const firstAuthor = users[Math.floor(Math.random() * users.length)];
            const firstUserData = rawMasterDB[firstAuthor];
            appendThread(firstAuthor, firstUserData[0], `최근 ${docName} 문서의 수정 내역을 보았는데, 해당 부분에 대한 출처가 너무 부족해 보이고 억지 밈이 많습니다. 서술 방향성에 대해 토론을 엽니다.`, "어제");

            // 나머지 글 난수 생성
            let timeOffset = 20;
            for(let i = 1; i < numComments; i++) {
                const randomUser = users[Math.floor(Math.random() * users.length)];
                const userData = rawMasterDB[randomUser];
                const text = getRandomQuote(randomUser);
                
                timeOffset = timeOffset - Math.floor(Math.random() * 4) - 1;
                if(timeOffset < 1) timeOffset = 1;
                const timeStr = `${timeOffset}시간 전`;
                
                appendThread(randomUser, userData[0], text, timeStr);
            }
        }

        function appendThread(author, icon, text, timeStr) {
            const threadHTML = `
                <div class="thread-box">
                    <div class="thread-header">
                        <div>
                            <span class="thread-num">#${threadIndex++}</span>
                            <span class="thread-avatar">${icon}</span>
                            <a href="작성자문서.html#${encodeURIComponent(author)}" class="thread-author">${author.replace(/_/g, ' ')}</a>
                            <span class="text-xs text-gray-500 ml-2">(${rawMasterDB[author] ? rawMasterDB[author][4] : '익명'})</span>
                        </div>
                        <div><i class="fa-regular fa-clock"></i> ${timeStr}</div>
                    </div>
                    <div class="thread-body">${text}</div>
                </div>
            `;
            discussionArea.insertAdjacentHTML('beforeend', threadHTML);
        }

        // ==========================================
        // 4. 의견 등록 (내 글 실시간 추가)
        // ==========================================
        document.getElementById('sendBtn').addEventListener('click', () => {
            const inputEl = document.getElementById('commentInput');
            const text = inputEl.value.trim();

            if (!text) {
                alert("내용을 입력해주세요.");
                return;
            }

            appendThread("127.0.0.1", "🌐", text, "방금 전");
            
            inputEl.value = ""; 
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        });

        window.addEventListener('DOMContentLoaded', initializeDiscussions);
    </script>

    <script src="ad_logic.js"></script>
    <script src="assets/load-footer.js"></script>
</body>
