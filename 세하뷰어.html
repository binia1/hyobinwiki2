<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="이미지/효빈위키아이콘.webp">
    <meta charset="UTF-8">
    <title>효빈위키 - 세하 마스터 제어판 (페르소나 8분할 반응 적용)</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: transparent; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #control-panel {
            position: absolute; top: 0; left: 0; width: 380px; height: 100vh;
            background: rgba(15, 15, 15, 0.95); color: white;
            padding: 25px 20px; box-sizing: border-box;
            font-family: 'Malgun Gothic', sans-serif; font-size: 14px; 
            z-index: 100; overflow-y: auto; box-shadow: 4px 0 15px rgba(0,0,0,0.8);
        }
        #control-panel h3 { margin: 0 0 20px 0; font-size: 20px; border-bottom: 2px solid #00ccaa; padding-bottom: 8px; color: #00ccaa; }
        .category-title { font-size: 15px; font-weight: bold; color: #FFCC11; margin: 25px 0 12px 0; border-left: 4px solid #FFCC11; padding-left: 8px; }
        .mode-switch { margin-bottom: 20px; font-weight: bold; display: block; cursor: pointer; font-size: 15px; background: #222; padding: 12px; border-radius: 6px; border: 1px solid #444; }
        .mode-switch input { transform: scale(1.2); margin-right: 8px; vertical-align: middle; }
        
        .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .preset-btn { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: inherit; transition: all 0.2s; }
        .preset-btn:hover { background: #00B7ED; border-color: #00B7ED; color: #000; }
        .preset-btn.reset { grid-column: span 2; background: #552222; border-color: #ff5555; }
        .preset-btn.reset:hover { background: #ff5555; color: white; }

        .slider-group { margin-bottom: 14px; background: rgba(250,250,250,0.06); padding: 10px; border-radius: 6px; }
        .slider-group label { display: block; margin-bottom: 6px; color: #eee; font-weight: 500; }
        .slider-group input[type="range"] { width: 100%; height: 8px; cursor: pointer; margin: 4px 0; }
        .slider-value { float: right; color: #01B7ED; font-weight: bold; font-size: 15px; }
        .clothing-toggle { background: rgba(0, 204, 170, 0.2); border: 1px solid #00ccaa; }
        
        #reaction-toast {
            position: absolute; top: 40px; left: 420px; background: rgba(0,204,170,0.9);
            color: white; padding: 12px 24px; border-radius: 30px; font-weight: bold; font-size: 16px;
            font-family: 'Malgun Gothic', sans-serif; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #user-identity {
            width: 100%; padding: 10px; background: #1a1a1a; color: #00ccaa; 
            border: 2px solid #00ccaa; border-radius: 6px; font-weight: bold; 
            font-family: 'Malgun Gothic', sans-serif; font-size: 14px; cursor: pointer;
            margin-bottom: 10px; outline: none;
        }
        #user-identity option { background: #222; color: #fff; }
    
    
</style>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.9/dist/browser/pixi.min.js"></script>
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
<script src="ad_logic.js"></script>

    <!-- 효빈위키 폰트 CSS -->
    <link rel="stylesheet" href="wiki_font_standard.css">
</head>
<body>
    <div id="control-panel">
        <h3>세하 마스터 엔진</h3>

        <div class="category-title">접속자(유저) 페르소나 설정</div>
        <select id="user-identity">
            <option value="general">👤 1. 일반인 (직장 동료 / 행인)</option>
            <option value="noah">🍊 2. 전노아 (05년생 찐친 / 빈효선)</option>
            <option value="soha">🎀 3. 미소하 (05년생 찐친 / 5호선)</option>
            <option value="hyobin">💖 4. 박효빈 (2003년생 / 연인)</option>
            <option value="yuria">🔧 5. 유리아 (17세 후배 / 8호선)</option>
            <option value="sejeong">👑 6. 임세정 (30세 맏언니 / 7호선)</option>
            <option value="rasena">⏱️ 7. 라세나 (19세 고3 숨덕 / 6호선)</option>
            <option value="harubin">☕ 8. 하루빈 (24세 뺀질이 선배 / 2호선)</option>
        </select>

        <label class="mode-switch" style="margin-top: 15px;"><input type="checkbox" id="manual-mode"> 🕹️ 수동 제어 모드 활성화</label>

        <div class="category-title">원클릭 표정 프리셋 (수동모드)</div>
        <div class="preset-grid">
            <button class="preset-btn" onclick="setPreset('smile')">😄 기쁨 / 미소</button>
            <button class="preset-btn" onclick="setPreset('shy')">😳 부끄 / 홍조</button>
            <button class="preset-btn" onclick="setPreset('angry')">😠 화남 / 뾰루퉁</button>
            <button class="preset-btn" onclick="setPreset('sad')">😢 슬픔 / 아련</button>
            <button class="preset-btn reset" onclick="setPreset('reset')">🔄 기본 표정으로 초기화</button>
        </div>

        <div class="category-title">의상 제어 (상시 작동)</div>
        <div class="slider-group clothing-toggle"><label>의상 토글 스위치 <span class="slider-value" id="val-ParamClothing">0</span></label><input type="range" id="slider-ParamClothing" min="0" max="1" value="0" step="1"></div>
        
        <div class="category-title">시선 및 신체 방향</div>
        <div class="slider-group"><label>고개 회전 X <span class="slider-value" id="val-ParamAngleX">0</span></label><input type="range" id="slider-ParamAngleX" min="-30" max="30" value="0"></div>
        <div class="slider-group"><label>고개 회전 Y <span class="slider-value" id="val-ParamAngleY">0</span></label><input type="range" id="slider-ParamAngleY" min="-30" max="30" value="0"></div>
        <div class="slider-group"><label>고개 회전 Z <span class="slider-value" id="val-ParamAngleZ">0</span></label><input type="range" id="slider-ParamAngleZ" min="-30" max="30" value="0"></div>

        <div class="category-title">찐 얼굴 파츠 (Param5~9)</div>
        <div class="slider-group"><label>진짜 눈 L (Param5) <span class="slider-value" id="val-Param5">1</span></label><input type="range" id="slider-Param5" min="0" max="1" value="1" step="0.05"></div>
        <div class="slider-group"><label>진짜 눈 R (Param6) <span class="slider-value" id="val-Param6">1</span></label><input type="range" id="slider-Param6" min="0" max="1" value="1" step="0.05"></div>
        <div class="slider-group"><label>찐 입 여닫기 (Param7) <span class="slider-value" id="val-Param7">0</span></label><input type="range" id="slider-Param7" min="0" max="1" value="0" step="0.05"></div>
        <div class="slider-group"><label>찐 입 변형 A (Param8) <span class="slider-value" id="val-Param8">0</span></label><input type="range" id="slider-Param8" min="-1" max="1" value="0" step="0.05"></div>
        <div class="slider-group"><label>찐 입 변형 B (Param9) <span class="slider-value" id="val-Param9">0</span></label><input type="range" id="slider-Param9" min="-1" max="1" value="0" step="0.05"></div>
        
        <div class="slider-group"><label>찐 홍조 (Param) <span class="slider-value" id="val-Param">0</span></label><input type="range" id="slider-Param" min="0" max="1" value="0" step="0.05"></div>

        <div class="category-title">물리 상호작용</div>
        <div class="slider-group"><label>앞머리 흔들림 <span class="slider-value" id="val-ParamHairFront">0</span></label><input type="range" id="slider-ParamHairFront" min="-1" max="1" value="0" step="0.05"></div>
        <div class="slider-group"><label>바보털 제어 <span class="slider-value" id="val-Param11">0</span></label><input type="range" id="slider-Param11" min="-1" max="1" value="0" step="0.05"></div>
        <div class="slider-group"><label>포니테일 제어 <span class="slider-value" id="val-Param12">0</span></label><input type="range" id="slider-Param12" min="-1" max="1" value="0" step="0.05"></div>
        <div class="slider-group"><label>볼 꼬집기 L <span class="slider-value" id="val-ParamCheekPinch_L">0</span></label><input type="range" id="slider-ParamCheekPinch_L" min="0" max="1" value="0" step="0.05"></div>
        <div class="slider-group"><label>볼 꼬집기 R <span class="slider-value" id="val-ParamCheekPinch_R">0</span></label><input type="range" id="slider-ParamCheekPinch_R" min="0" max="1" value="0" step="0.05"></div>
    </div>

    <div id="reaction-toast">반응 메시지</div>
    <canvas id="live2d-canvas"></canvas>

    <script>
        const canvas = document.getElementById('live2d-canvas');
        const app = new PIXI.Application({ view: canvas, width: window.innerWidth, height: window.innerHeight, backgroundAlpha: 0, autoStart: true, antialias: true });
        const { Live2DModel } = PIXI.live2d;
        
        const manualCheckbox = document.getElementById('manual-mode');
        const sliders = {};
        document.querySelectorAll('#control-panel input[type="range"]').forEach(slider => {
            const id = slider.id.replace('slider-', '');
            sliders[id] = slider;
            slider.oninput = (e) => { document.getElementById('val-' + id).innerText = e.target.value; };
        });

        const toast = document.getElementById('reaction-toast');
        let toastTimer = null;
        function showToast(msg) {
            toast.innerText = msg; toast.style.opacity = 1;
            if(toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.style.opacity = 0; }, 3500); 
        }

        window.isTouchReacting = false; 

        window.setPreset = (type, isReaction = false) => {
            if (!isReaction) manualCheckbox.checked = true; 
            
            Object.keys(sliders).forEach(id => { 
                if(id !== 'ParamClothing' && id !== 'ParamAngleX' && id !== 'ParamAngleY' && id !== 'ParamAngleZ') sliders[id].value = 0; 
            });
            sliders['Param5'].value = 1; sliders['Param6'].value = 1;

            if (type === 'smile') {
                sliders['Param8'].value = 1; sliders['Param7'].value = 0.5;
                sliders['Param5'].value = 0; sliders['Param6'].value = 0; 
            } else if (type === 'shy') {
                sliders['Param'].value = 1; sliders['Param8'].value = -0.5; 
                sliders['Param5'].value = 0.85; sliders['Param6'].value = 0.85; 
                if(!isReaction) sliders['ParamAngleZ'].value = -8; 
            } else if (type === 'angry') {
                sliders['Param8'].value = -1; sliders['Param9'].value = -1;  
                sliders['Param'].value = 0.4; 
                sliders['Param5'].value = 0.9; sliders['Param6'].value = 0.9; 
                if(!isReaction) sliders['ParamAngleZ'].value = 10;
            } else if (type === 'sad') {
                sliders['Param8'].value = -0.5; sliders['Param9'].value = -0.5;
                sliders['Param5'].value = 0.85; sliders['Param6'].value = 0.85;
            }

            Object.keys(sliders).forEach(id => {
                const valSpan = document.getElementById('val-' + id);
                if (valSpan) valSpan.innerText = sliders[id].value;
            });
        };

        async function initSeha() {
            const modelUrl = 'assets/seha2/seha2.model3.json';

            try {
                const model = await Live2DModel.from(modelUrl);
                app.stage.addChild(model);

                let baseModelHeight = 0; 

                const resizeModel = () => {
                    app.renderer.resize(window.innerWidth, window.innerHeight);
                    const currentSidebarWidth = 380;
                    model.x = currentSidebarWidth + (window.innerWidth - currentSidebarWidth) / 2;
                    model.y = window.innerHeight - 30; 
                    
                    if (baseModelHeight === 0) baseModelHeight = model.height / model.scale.y;
                    const targetScale = (window.innerHeight * 0.85) / baseModelHeight;
                    model.scale.set(targetScale);
                };
                window.onresize = resizeModel; resizeModel();
                model.anchor.set(0.5, 1.0); 

                let blinkTimer = 0; let blinkProgress = 0; let isBlinking = false;
                let nextBlinkTime = 120 + Math.random() * 150;

                const setParamSafe = (id, val) => {
                    const core = model.internalModel.coreModel;
                    if (core.setParameterValueById) core.setParameterValueById(id, val);
                    if (core.parameters && core.parameters.ids) {
                        const idx = core.parameters.ids.indexOf(id);
                        if (idx !== -1) core.parameters.values[idx] = val;
                    }
                };

                const originalUpdate = model.internalModel.update;
                model.internalModel.update = function(dt, now) {
                    originalUpdate.call(this, dt, now);

                    const clothingVal = parseFloat(document.getElementById('slider-ParamClothing').value);
                    setParamSafe('ParamClothing', clothingVal);

                    if (manualCheckbox.checked || window.isTouchReacting) {
                        const faceParams = ['Param', 'Param5', 'Param6', 'Param7', 'Param8', 'Param9', 'Param11', 'Param12', 'ParamHairFront', 'ParamCheekPinch_L', 'ParamCheekPinch_R'];
                        faceParams.forEach(id => {
                            if (sliders[id]) setParamSafe(id, parseFloat(sliders[id].value));
                        });

                        if (manualCheckbox.checked) {
                            setParamSafe('ParamAngleX', parseFloat(sliders['ParamAngleX'].value));
                            setParamSafe('ParamAngleY', parseFloat(sliders['ParamAngleY'].value));
                            setParamSafe('ParamAngleZ', parseFloat(sliders['ParamAngleZ'].value));
                        }
                    } else {
                        if (!isBlinking) {
                            blinkTimer++;
                            setParamSafe('Param5', 1); setParamSafe('Param6', 1); 
                            if (blinkTimer >= nextBlinkTime) {
                                isBlinking = true; blinkTimer = 0; blinkProgress = 0;
                                nextBlinkTime = 120 + Math.random() * 180;
                            }
                        } else {
                            blinkProgress += 0.25; let eyeValue = 1;
                            if (blinkProgress < 1) eyeValue = 1 - blinkProgress;
                            else if (blinkProgress < 2) eyeValue = blinkProgress - 1;
                            else { isBlinking = false; eyeValue = 1; }
                            setParamSafe('Param5', eyeValue); setParamSafe('Param6', eyeValue); 
                        }
                    }
                };

                app.stage.interactive = true;
                app.stage.on('pointermove', (event) => {
                    if (!manualCheckbox.checked) model.focus(event.data.global.x, event.data.global.y);
                });

                let reactionTimer = null; 

                model.on('hit', (hitAreas) => {
                    console.log("터치된 부위:", hitAreas); 
                    if (reactionTimer) clearTimeout(reactionTimer);
                    let isReacting = false;
                    let targetArea = hitAreas[0];
                    const identity = document.getElementById('user-identity').value;

                    setPreset('reset', true);

                    // 🌟 8분할 페르소나 매트릭스 로직
                    if (targetArea === '얼굴') {
                        if (identity === 'general') {
                            showToast("아... 머리 헝클어지잖아요. 작업 중이니까 방해하지 마세요."); 
                            sliders['Param7'].value = 0.2; sliders['Param8'].value = -0.5; sliders['Param5'].value = 0.8; sliders['Param6'].value = 0.8; 
                        } else if (identity === 'noah') {
                            showToast("노아아앙~! 오늘 행정 깡패 짓 하느라 고생했지? 이리 와!"); 
                            sliders['Param7'].value = 0.8; sliders['Param8'].value = 1; sliders['Param5'].value = 0; sliders['Param6'].value = 0; sliders['Param'].value = 0.8; 
                        } else if (identity === 'soha') {
                            showToast("소하야~! 오늘도 팩폭으로 임원들 명치 뚫고 왔어? 퍼지바 먹을래?"); 
                            sliders['Param7'].value = 0.8; sliders['Param8'].value = 1; sliders['Param5'].value = 0; sliders['Param6'].value = 0; sliders['Param'].value = 0.8; 
                        } else if (identity === 'hyobin') {
                            showToast("오빠아... 나만 봐야 해? 딴 년들 보면 진짜 할퀼 거야 냥?"); 
                            sliders['Param7'].value = 0.5; sliders['Param8'].value = 1; sliders['Param5'].value = 0; sliders['Param6'].value = 0; sliders['Param'].value = 1; 
                        } else if (identity === 'yuria') {
                            showToast("유리아! 너 또 뭐 사고 치고 내 눈치 보는 거지? 똑바로 말해!"); 
                            sliders['Param7'].value = 0.5; sliders['Param8'].value = -0.5; sliders['Param5'].value = 0.85; sliders['Param6'].value = 0.85;
                        } else if (identity === 'sejeong') {
                            showToast("어, 언니...! 저 안 졸았어요! 인버터 디버깅 중이었어요!"); 
                            sliders['Param7'].value = 0.2; sliders['Param8'].value = -0.8; sliders['Param5'].value = 0.95; sliders['Param6'].value = 0.95; sliders['ParamAngleZ'].value = -5;
                        } else if (identity === 'rasena') {
                            showToast("세나야, 너 수능특강 밑에 카나타 선배 굿즈 숨겨놓은 거 다 알아. 무리하지 마~"); 
                            sliders['Param7'].value = 0.8; sliders['Param8'].value = 1; sliders['Param5'].value = 0; sliders['Param6'].value = 0; sliders['Param'].value = 0.5;
                        } else if (identity === 'harubin') {
                            showToast("아오, 하루빈 선배! 자본주의 미소로 은근슬쩍 다가오지 마요. 얼굴에 기름 묻어요!"); 
                            sliders['Param7'].value = 0.2; sliders['Param8'].value = -0.5; sliders['Param5'].value = 0.8; sliders['Param6'].value = 0.8; sliders['ParamAngleZ'].value = 5;
                        }
                        isReacting = true;
                    } 
                    else if (targetArea === '바보털') { 
                        if (identity === 'general') {
                            showToast("앗! 제 와이파이 안테나 건드리지 마시죠? 수신율 떨어집니다.");
                            sliders['Param8'].value = -0.5; sliders['Param11'].value = 0.8; sliders['Param5'].value = 0.95; sliders['Param6'].value = 0.95; 
                        } else if (identity === 'noah') {
                            showToast("앗! 노아, 이거 당기면 나 기획 회로 에러 난다구!");
                            sliders['Param8'].value = -0.5; sliders['Param11'].value = 0.8; sliders['Param5'].value = 0.8; sliders['Param6'].value = 0.8; sliders['Param'].value = 0.5;
                        } else if (identity === 'soha') {
                            showToast("앗! 소하야, 이거 만지면 내 블루투스로 너 데이터 다 날려버릴 거야~!");
                            sliders['Param8'].value = 1; sliders['Param11'].value = 0.8; sliders['Param5'].value = 0; sliders['Param6'].value = 0; sliders['Param'].value = 0.5;
                        } else if (identity === 'hyobin') {
                            showToast("앗! 오빠... 오빠가 만지니까 생체 안테나 도파민 수치 폭발할 것 같아...");
                            sliders['Param8'].value = 0.5; sliders['Param11'].value = 0.8; sliders['Param5'].value = 0.85; sliders['Param6'].value = 0.85; sliders['Param'].value = 1;
                        } else if (identity === 'yuria') {
                            showToast("앗, 유리아! 이거 당기면 언니 머릿속 회로 쇼트 나서 수리비 청구할 거야!");
                            sliders['Param8'].value = -0.5; sliders['Param11'].value = 0.8; sliders['Param5'].value = 0.9; sliders['Param6'].value = 0.9;
                        } else if (identity === 'sejeong') {
                            showToast("아앗! 아테 세정!! 잘못했어요! 어지른 공구 세트 당장 치울게요 ㅠㅠ!");
                            sliders['Param8'].value = -0.8; sliders['Param11'].value = 0.8; sliders['Param5'].value = 0.95; sliders['Param6'].value = 0.95; sliders['ParamAngleZ'].value = -10;
                        } else if (identity === 'rasena') {
                            showToast("세나! 너 지금 인강 스케줄 3분 밀렸잖아. 내 바보털 만질 시간에 영단어나 외워!");
                            sliders['Param8'].value = -0.3; sliders['Param11'].value = 0.8; sliders['Param5'].value = 0.85; sliders['Param6'].value = 0.85;
                        } else if (identity === 'harubin') {
                            showToast("앗! 하루빈 선배! 내 바보털 핑계 대고 농땡이 피우려는 속셈 다 보이거든요?!");
                            sliders['Param8'].value = -0.5; sliders['Param11'].value = 0.8; sliders['Param5'].value = 0.9; sliders['Param6'].value = 0.9; sliders['ParamAngleZ'].value = 5;
                        }
                        isReacting = true;
                    } 
                    else if (targetArea === '포니테일') { 
                        if (identity === 'general') {
                            showToast("아, 엉키면 풀기 힘든데... 스패너 들이밀기 전에 손 떼시죠.");
                            sliders['Param8'].value = -0.3; sliders['ParamAngleZ'].value = 5; sliders['Param12'].value = 0.8; sliders['Param5'].value = 0.85; sliders['Param6'].value = 0.85; 
                        } else if (identity === 'noah') {
                            showToast("노아, 머리 만지는 건 좋은데... 헝클어지면 네가 다시 묶어줘야 돼!");
