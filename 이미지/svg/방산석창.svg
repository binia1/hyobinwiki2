<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="54" height="54">
  <defs>
    <!-- 깔끔하고 굵은 Noto Sans KR 폰트 적용 -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&amp;display=swap');
      .sb-grid-text {
        font-family: 'Noto Sans KR', sans-serif;
        font-weight: 900;
        font-size: 32px;
        fill: #ffffff; /* 흰색 글씨 */
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- #795548 색상의 꽉 찬 원형 배경 -->
  <circle cx="50" cy="50" r="50" fill="#795548"/>

  <!-- 2x2 격자 형태 텍스트 배치 (방산 / 석창) -->
  <!-- 1행: 방산 -->
  <text x="32" y="34" class="sb-grid-text">방</text>
  <text x="68" y="34" class="sb-grid-text">산</text>
  
  <!-- 2행: 석창 -->
  <text x="32" y="74" class="sb-grid-text">석</text>
  <text x="68" y="74" class="sb-grid-text">창</text>
</svg>
