<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="54" height="54">
  <defs>
    <!-- 사용자가 원하신 깔끔하고 굵은 Noto Sans KR 폰트 특징을 벡터화 -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&amp;display=swap');
      .metro-text {
        font-family: 'Noto Sans KR', sans-serif;
        font-weight: 900;
        font-size: 55px;
        fill: #0077DD; /* 1호선 시안색 */
      }
    </style>
  </defs>

  <!-- 효빈 1호선 상징색(#0077DD) 링 -->
  <!-- CSS border: 5px solid 비율에 맞춘 굵은 테두리와 흰색 배경 -->
  <circle cx="50" cy="50" r="42" fill="#ffffff" stroke="#0077DD" stroke-width="10"/>

  <!-- 2호선과 마찬가지로 벡터 패스(Path)로 숫자 1의 모양을 따서 정중앙 좌표에 수동으로 고정했습니다. -->
  <!-- 꺾임이나 받침 없는 깔끔한 산세리프 형태가 정중앙에 위치하며, 하단 뭉개짐(파먹힘) 문제를 해결했습니다. -->
  <path d="M 39 70 L 61 70 L 61 62 L 54 62 L 54 28 L 47 28 L 39 36 L 39 43 L 47 36 L 47 62 L 39 62 Z" fill="#0077DD" />
</svg>
