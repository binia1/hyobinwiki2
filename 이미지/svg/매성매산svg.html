<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="54" height="54">
  <defs>
    <!-- 깔끔하고 굵은 Noto Sans KR 폰트 적용 -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&amp;display=swap');
      .maeseong-grid-text {
        font-family: 'Noto Sans KR', sans-serif;
        font-weight: 900;
        font-size: 32px;
        fill: #ffffff; /* 흰색 글씨 */
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- #009688 색상의 꽉 찬 원형 배경 -->
  <circle cx="50" cy="50" r="50" fill="#009688"/>

  <!-- 2x2 격자 형태 텍스트 배치 (매성 / 매산) -->
  <!-- 1행: 매성 -->
  <text x="31" y="34" class="maeseong-grid-text">매</text>
  <text x="67" y="34" class="maeseong-grid-text">성</text>
  
  <!-- 2행: 매산 -->
  <text x="31" y="74" class="maeseong-grid-text">매</text>
  <text x="67" y="74" class="maeseong-grid-text">산</text>
</svg>
