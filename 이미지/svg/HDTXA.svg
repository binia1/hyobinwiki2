<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="54" height="54">
  <defs>
    <!-- 깔끔하고 굵은 Noto Sans KR 폰트 적용 -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&amp;display=swap');
      .hdtx-top {
        font-family: 'Noto Sans KR', sans-serif;
        font-weight: 900;
        font-size: 26px;
        letter-spacing: -1px;
        fill: #ffffff;
      }
      .hdtx-bottom {
        font-family: 'Noto Sans KR', sans-serif;
        font-weight: 900;
        font-size: 38px;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- #FB637E 색상의 꽉 찬 원형 배경 -->
  <circle cx="50" cy="50" r="50" fill="#FB637E"/>

  <!-- 상단 HDTX 텍스트 -->
  <text x="50" y="40" class="hdtx-top" text-anchor="middle" dominant-baseline="middle">HDTX</text>
  
  <!-- 하단 A 텍스트 -->
  <text x="50" y="74" class="hdtx-bottom" text-anchor="middle" dominant-baseline="middle">A</text>
</svg>
