<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- 투명한 여백(Negative Space)을 뚫기 위한 마스크 설정 -->
    <mask id="cupMask">
      <rect x="0" y="0" width="100" height="100" fill="white" />
      
      <!-- 컵홀더 상하단 경계선 -->
      <line x1="28" y1="52" x2="72" y2="52" stroke="black" stroke-width="3" stroke-linecap="round" />
      <line x1="33" y1="72" x2="67" y2="72" stroke="black" stroke-width="3" stroke-linecap="round" />
      
      <!-- 자본주의 미소 (처세술 만렙 눈웃음) -->
      <!-- 왼쪽 눈 -->
      <path d="M 42 60 Q 44.5 57 47 60" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" />
      <!-- 오른쪽 눈 -->
      <path d="M 53 60 Q 55.5 57 58 60" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" />
      <!-- 입 (미소) -->
      <path d="M 46 65 Q 50 69 54 65" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- 얼음 음료용 빨대 -->
  <line x1="50" y1="35" x2="62" y2="8" stroke="#00CCAA" stroke-width="7" stroke-linecap="round" />

  <!-- 돔(Dome) 형태의 뚜껑 윤곽선 -->
  <path d="M 30 35 C 30 15, 70 15, 70 35" fill="none" stroke="#00CCAA" stroke-width="6" stroke-linecap="round" />
  
  <!-- 뚜껑 하단 결합부 라인 -->
  <line x1="26" y1="35" x2="74" y2="35" stroke="#00CCAA" stroke-width="6" stroke-linecap="round" />

  <!-- 벤티 사이즈 컵 본체 (마스크 적용) -->
  <path d="M 30 38 L 70 38 L 63 90 A 4 4 0 0 1 59 94 L 41 94 A 4 4 0 0 1 37 90 Z" fill="#00CCAA" mask="url(#cupMask)" />
</svg>
