<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- 고급 골드 그라데이션 -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9DF9F" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B5952F" />
      <stop offset="100%" stop-color="#8A6B23" />
    </linearGradient>
    
    <!-- 원형 텍스트 패스 -->
    <path id="topArc" d="M 120,300 A 180,180 0 0,1 480,300" />
    <path id="bottomArc" d="M 135,305 A 165,165 0 0,0 465,305" />
  </defs>

  <!-- 배경 링 (아주르 블루 #0047A0 베이스) -->
  <circle cx="300" cy="300" r="280" fill="url(#gold)" />
  <circle cx="300" cy="300" r="260" fill="#0047A0" />
  <circle cx="300" cy="300" r="190" fill="none" stroke="url(#gold)" stroke-width="5" />
  <circle cx="300" cy="300" r="180" fill="#00357A" />

  <!-- 상단 대학명 -->
  <text fill="url(#gold)" font-family="&#39;Malgun Gothic&#39;, &#39;Noto Sans KR&#39;, sans-serif" font-weight="900" font-size="44" letter-spacing="8">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">효빈외국어대학교</textPath>
  </text>

  <!-- 하단 영문 대학명 -->
  <text fill="url(#gold)" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="2">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">HYOBIN UNIVERSITY OF FOREIGN STUDIES</textPath>
  </text>

  <!-- 좌우 장식용 별 -->
  <polygon points="130,290 135,305 150,305 137,315 142,330 130,320 118,330 123,315 110,305 125,305" fill="url(#gold)" />
  <polygon points="470,290 475,305 490,305 477,315 482,330 470,320 458,330 463,315 450,305 465,305" fill="url(#gold)" />

  <!-- 중앙 방패 문양 -->
  <path d="M 300,160 L 380,160 L 380,270 C 380,350 300,410 300,410 C 300,410 220,350 220,270 L 220,160 Z" fill="#0047A0" stroke="url(#gold)" stroke-width="6" />

  <!-- 방패 내부 글로벌 상징 (지구본) -->
  <circle cx="300" cy="340" r="35" fill="none" stroke="url(#gold)" stroke-width="3" />
  <ellipse cx="300" cy="340" rx="15" ry="35" fill="none" stroke="url(#gold)" stroke-width="2" />
  <ellipse cx="300" cy="340" rx="35" ry="12" fill="none" stroke="url(#gold)" stroke-width="2" />
  <path d="M 300,305 L 300,375" stroke="url(#gold)" stroke-width="2" />

  <!-- 한자 로고 (효빈) -->
  <text x="300" y="255" fill="url(#gold)" font-family="&#39;Batang&#39;, &#39;Myungjo&#39;, serif" font-weight="bold" font-size="75" text-anchor="middle">孝彬</text>
  
  <!-- 개교 연도 -->
  <text x="300" y="285" fill="#E6E6E6" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="3">SINCE 1997</text>

  <!-- 하단 교훈 리본 장식 -->
  <path d="M 70,470 L 110,450 L 110,510 Z" fill="#70561C" />
  <path d="M 530,470 L 490,450 L 490,510 Z" fill="#70561C" />
  <path d="M 90,480 L 510,480 L 490,535 L 110,535 Z" fill="url(#gold)" stroke="#8A6B23" stroke-width="3" />
  <path d="M 105,488 L 495,488 L 478,527 L 122,527 Z" fill="none" stroke="#C29B40" stroke-width="1.5" />

  <!-- 리본 텍스트 (교훈) -->
  <text x="300" y="516" fill="#00357A" font-family="&#39;Malgun Gothic&#39;, &#39;Noto Sans KR&#39;, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="5">세계로, 미래로, 하나로</text>
</svg>