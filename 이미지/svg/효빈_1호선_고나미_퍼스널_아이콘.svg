<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- 투명한 여백(Negative Space)을 뚫기 위한 마스크 설정 -->
    <mask id="micCutout">
      <!-- 기본 배경을 흰색(보이게)으로 설정 -->
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <!-- 마이크 그릴 부분의 타원형 홈을 검은색(투명하게)으로 뚫어냄 -->
      <line x1="36" y1="27" x2="64" y2="27" stroke="black" stroke-width="5" stroke-linecap="round" />
      <line x1="36" y1="37" x2="64" y2="37" stroke="black" stroke-width="5" stroke-linecap="round" />
      <line x1="36" y1="47" x2="64" y2="47" stroke="black" stroke-width="5" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- 마이크 헤드 본체 (마스크 적용) -->
  <rect x="32" y="10" width="36" height="54" rx="18" fill="#0077DD" mask="url(#micCutout)" />

  <!-- 마이크를 감싸는 U자형 스탠드 고리 -->
  <path d="M 18 35 V 50 A 32 32 0 0 0 82 50 V 35" fill="none" stroke="#0077DD" stroke-width="8" stroke-linecap="round" />
  
  <!-- 스탠드 기둥 -->
  <line x1="50" y1="82" x2="50" y2="92" stroke="#0077DD" stroke-width="8" stroke-linecap="round" />
  
  <!-- 스탠드 받침대 -->
  <line x1="28" y1="92" x2="72" y2="92" stroke="#0077DD" stroke-width="8" stroke-linecap="round" />
</svg>
