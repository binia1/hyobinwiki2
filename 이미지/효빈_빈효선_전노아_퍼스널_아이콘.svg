<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- 1. 3줄 요약 음각 및 마커 펜 오버랩의 투명 틈새를 만들기 위한 마스크 -->
    <mask id="noaBulldozerMask">
      <!-- 기본 베이스 (전체 보임) -->
      <rect x="0" y="0" width="100" height="100" fill="white" />
      
      <!-- 핵심만 짚어내는 '3줄 요약' 슬롯 음각화 (Document Lines) -->
      <rect x="25" y="34" width="22" height="3.5" rx="1" fill="black" />
      <rect x="25" y="42" width="27" height="3.5" rx="1" fill="black" />
      <rect x="25" y="50" width="17" height="3.5" rx="1" fill="black" />
      
      <!-- 거침없는 행정 불도저 펜의 관통 궤적을 따라 6px 두께의 투명 여백 타공 -->
      <g transform="translate(50,50) rotate(-35) translate(-50,-50)">
        <rect x="68" y="6" width="10" height="80" rx="2" fill="black" stroke="black" stroke-width="6" stroke-linejoin="round" />
      </g>
    </mask>
  </defs>

  <!-- [레이어 1] 결재 프로세스의 묵직한 기반: 보드 스탠드 및 하단 지지대 -->
  <path d="M 32,60 L 22,84 M 52,60 L 62,84" fill="none" stroke="#6677CC" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 14,84 L 70,84" fill="none" stroke="#6677CC" stroke-width="4.5" stroke-linecap="round" />

  <!-- [레이어 2] 메인 오브젝트: 행정 기획 PPT 슬라이드 프레임 (3줄 요약 및 갭 마스크 적용) -->
  <rect x="17" y="24" width="49" height="40" rx="4" fill="#6677CC" mask="url(#noaBulldozerMask)" />

  <!-- [레이어 3] 톡톡 튀는 관종 자아를 대변하는 상단 바보털(Ahoge) 디테일 -->
  <path d="M 35,24 C 30,7 49,5 43,16 C 40,21 47,20 45,24" fill="none" stroke="#6677CC" stroke-width="3" stroke-linecap="round" fill-rule="evenodd" />

  <!-- [레이어 4] 전면: 프리젠테이션 생태계를 멱살 잡고 캐리하는 역동적인 각도의 펜 -->
  <g transform="translate(50,50) rotate(-35) translate(-50,-50)">
    <!-- 펜 본체 (그립 바디) -->
    <rect x="68" y="22" width="10" height="60" rx="2" fill="#6677CC" />
    <!-- 펜 캡 링 부품 -->
    <rect x="68" y="17" width="10" height="5" fill="#6677CC" />
    <!-- 펜 촉 (샤프한 기획력을 상징하는 삼각형 닙) -->
    <polygon points="68,17 73,8 78,17" fill="#6677CC" />
  </g>
</svg>
