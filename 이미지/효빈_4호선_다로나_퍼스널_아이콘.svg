<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- 투명한 여백(Negative Space)을 뚫기 위한 마스크 설정 -->
    <mask id="clipCutout">
      <!-- 기본 배경(흰색)은 도형을 그대로 렌더링함 -->
      <rect x="0" y="0" width="100" height="100" fill="white" />
      
      <!-- 체크리스트 1열 -->
      <rect x="30" y="32" width="10" height="10" rx="2" fill="none" stroke="black" stroke-width="3" />
      <line x1="48" y1="37" x2="70" y2="37" stroke="black" stroke-width="3" stroke-linecap="round" />
      
      <!-- 체크리스트 2열 (완전무결한 안전 점검 완료 표시) -->
      <rect x="30" y="48" width="10" height="10" rx="2" fill="none" stroke="black" stroke-width="3" />
      <line x1="48" y1="53" x2="70" y2="53" stroke="black" stroke-width="3" stroke-linecap="round" />
      
      <!-- 날카롭고 단호한 체크마크 (FM의 상징) -->
      <path d="M 27 50 L 33 56 L 45 42" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- 하단: 엑셀로 출빵 시간을 관리하는 소금빵 실루엣 -->
      <path d="M 35 76 C 35 64, 65 64, 65 76 Q 50 82, 35 76 Z" fill="black" />
      
      <!-- 소금빵 위의 소금 결정 
           (흰색으로 칠해 마스크 구멍 안에서 주황색 기본 컬러가 다시 살아나게 하는 디테일) -->
      <circle cx="47" cy="70" r="1.2" fill="white" />
      <circle cx="53" cy="70" r="1.2" fill="white" />
      <circle cx="50" cy="67.5" r="1.2" fill="white" />
    </mask>
  </defs>

  <!-- 클립보드 본체 (마스크 적용) -->
  <rect x="20" y="20" width="60" height="70" rx="5" fill="#FF5522" mask="url(#clipCutout)" />
  
  <!-- 상단 클립(집게) 철물 고정부 -->
  <rect x="35" y="14" width="30" height="12" rx="3" fill="#FF5522" />
  
  <!-- 상단 클립 벽걸이용 구멍 -->
  <path d="M 45 14 V 8 A 5 5 0 0 1 55 8 V 14" fill="none" stroke="#FF5522" stroke-width="4" stroke-linecap="round" />
</svg>
