<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- 투명한 여백(Negative Space)을 뚫기 위한 마스크 설정 -->
    <mask id="swMask">
      <!-- 기본 배경(흰색)은 도형을 그대로 렌더링함 -->
      <rect x="0" y="0" width="100" height="100" fill="white" />
      
      <!-- 스톱워치 내부 다이얼 테두리 -->
      <circle cx="50" cy="58" r="22" fill="none" stroke="black" stroke-width="3" />
      
      <!-- 시계 눈금 (12, 3, 6, 9 방향) -->
      <line x1="50" y1="36" x2="50" y2="42" stroke="black" stroke-width="2.5" stroke-linecap="round" />
      <line x1="50" y1="74" x2="50" y2="80" stroke="black" stroke-width="2.5" stroke-linecap="round" />
      <line x1="28" y1="58" x2="34" y2="58" stroke="black" stroke-width="2.5" stroke-linecap="round" />
      <line x1="66" y1="58" x2="72" y2="58" stroke="black" stroke-width="2.5" stroke-linecap="round" />
      
      <!-- 정중앙의 미디어 재생(Play) 버튼 (성우 라디오를 몰래 듣는 숨덕 상징) -->
      <polygon points="46,50 58,58 46,66" fill="black" stroke="black" stroke-width="2" stroke-linejoin="round" />
      
      <!-- 헤드폰 이어컵과 스톱워치 본체 사이를 분리하는 미세한 여백 선 -->
      <line x1="22" y1="48" x2="22" y2="74" stroke="black" stroke-width="2" stroke-linecap="round" />
      <line x1="78" y1="48" x2="78" y2="74" stroke="black" stroke-width="2" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- 스톱워치 상단 조작 버튼 및 고리 -->
  <rect x="44" y="20" width="12" height="10" rx="2" fill="#881188" />
  <circle cx="50" cy="14" r="6" fill="none" stroke="#881188" stroke-width="3.5" />
  <line x1="66" y1="36" x2="74" y2="28" stroke="#881188" stroke-width="4.5" stroke-linecap="round" />

  <!-- 스톱워치 본체 (마스크 적용) -->
  <circle cx="50" cy="58" r="28" fill="#881188" mask="url(#swMask)" />

  <!-- 노이즈 캔슬링 헤드폰 -->
  <!-- 헤드밴드 -->
  <path d="M 16 58 V 46 A 34 34 0 0 1 84 46 V 58" fill="none" stroke="#881188" stroke-width="4" stroke-linecap="round" />
  <!-- 왼쪽 이어컵 -->
  <rect x="10" y="48" width="12" height="26" rx="5" fill="#881188" />
  <!-- 오른쪽 이어컵 -->
  <rect x="78" y="48" width="12" height="26" rx="5" fill="#881188" />

  <!-- 헤드폰 왼쪽에 달린 '별 모양 헤어핀' (라세나의 핵심 뷰티 포인트) -->
  <polygon points="20,30 22,34 26.5,34 23,36.5 24.5,41 20,38.5 15.5,41 17,36.5 13.5,34 18,34" fill="#881188" stroke="#881188" stroke-linejoin="round" stroke-width="1" />
</svg>
