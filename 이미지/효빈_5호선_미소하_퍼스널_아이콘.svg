<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- 투명한 여백(Negative Space)을 뚫기 위한 마스크 설정 -->
    <mask id="binderMask">
      <!-- 기본 배경(흰색)은 도형을 그대로 렌더링함 -->
      <rect x="0" y="0" width="100" height="100" fill="white" />
      
      <!-- 상단: 132페이지 분량의 꼼꼼한 정책 기안서 제목 라인 -->
      <line x1="42" y1="28" x2="68" y2="28" stroke="black" stroke-width="4" stroke-linecap="round" />
      <line x1="42" y1="36" x2="55" y2="36" stroke="black" stroke-width="4" stroke-linecap="round" />
      
      <!-- 하단: 예산팀 명치를 부수는 다중회귀분석 상승 그래프 -->
      <polyline points="42,72 52,58 62,64 72,46" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- 그래프의 데이터 노드(점) -->
      <circle cx="42" cy="72" r="2.5" fill="black" />
      <circle cx="52" cy="58" r="2.5" fill="black" />
      <circle cx="62" cy="64" r="2.5" fill="black" />
      <circle cx="72" cy="46" r="2.5" fill="black" />
    </mask>
  </defs>

  <!-- 메인 바인더 본체 (마스크 적용) -->
  <rect x="35" y="15" width="45" height="70" rx="3" fill="#EE0022" mask="url(#binderMask)" />
  
  <!-- 왼쪽 바인더 철물 링 (3개) -->
  <path d="M 35 25 h -8 a 5 5 0 0 1 0 -10 h 8" fill="none" stroke="#EE0022" stroke-width="4" stroke-linecap="round" />
  <path d="M 35 48 h -8 a 5 5 0 0 1 0 -10 h 8" fill="none" stroke="#EE0022" stroke-width="4" stroke-linecap="round" />
  <path d="M 35 71 h -8 a 5 5 0 0 1 0 -10 h 8" fill="none" stroke="#EE0022" stroke-width="4" stroke-linecap="round" />

  <!-- 우측 상단의 커다란 왕리본 (천사 같은 겉모습 상징) -->
  <g id="giantRibbon">
    <!-- 리본 왼쪽 고리 -->
    <path d="M 77 14 Q 65 5 68 22 Q 74 20 77 17 Z" fill="#EE0022" />
    <!-- 리본 오른쪽 고리 -->
    <path d="M 83 14 Q 95 5 92 22 Q 86 20 83 17 Z" fill="#EE0022" />
    <!-- 리본 꼬리 (좌/우) -->
    <path d="M 78 18 Q 72 30 70 35 L 77 28 Z" fill="#EE0022" />
    <path d="M 82 18 Q 88 30 90 35 L 83 28 Z" fill="#EE0022" />
    <!-- 리본 중앙 매듭 -->
    <circle cx="80" cy="15" r="4.5" fill="#EE0022" />
  </g>

  <!-- 하단 링에 매달린 캡사이신(고추) 키링 (캡사이신 광인 상징) -->
  <g id="capsaicinCharm">
    <!-- 고추 꼭지 -->
    <!-- 고추 본체 (곡선으로 휘어진 형태) -->
  </g>
</svg>
