<script>
document.addEventListener("DOMContentLoaded", function() {
    const urlParams = new URLSearchParams(window.location.search);
    const storeQuery = urlParams.get('store');

    let storeData = null;
    if(storeQuery && typeof mcdonaldsData !== 'undefined') {
        storeData = mcdonaldsData.find(item => item.id === storeQuery);
    }

    if(!storeData) {
        document.getElementById('page-title').innerText = "매장을 찾을 수 없습니다.";
        document.getElementById('wiki-body-content').innerHTML = "URL 파라미터가 잘못되었거나 존재하지 않는 매장입니다.";
        document.querySelector('.infobox').style.display = 'none';
        document.getElementById('toc-box').style.display = 'none';
        return;
    }

    let displayName = storeData.id.endsWith("점") ? storeData.id : storeData.id + "점";
    document.title = `맥도날드 ${displayName} - 효빈위키`;
    document.getElementById('page-title').innerText = `맥도날드 ${displayName}`;

    let openYear = storeData.openDate.split('년')[0] + '년';
    document.getElementById('category-box').innerHTML = `
        <span class="font-bold" style="color: var(--wiki-main);">분류:</span>
        <a class="wiki-link" href="맥도날드/대한민국/${storeData.region}.html">맥도날드/대한민국/${storeData.region}</a> | 
        <a class="wiki-link" href="${storeData.district}의_상업_시설.html">${storeData.district}의 상업 시설</a> | 
        <a class="wiki-link" href="${openYear}_개업.html">${openYear} 개업</a>
    `;

    let navScript = document.createElement('script');
    navScript.src = `js/${storeData.district}시설.js`;
    document.getElementById('district-nav-container').appendChild(navScript);

    let serviceBadges = '';
    const servicesArray = storeData.services.split(',').map(s => s.trim());
    servicesArray.forEach(s => {
        let bgColor = '#DB0007'; let txtColor = '#ffe302';
        if(s.includes('맥모닝')) { bgColor = '#660d10'; txtColor = '#fff'; }
        if(s.includes('디카페인')) { bgColor = '#115e2a'; txtColor = '#fff'; }
        serviceBadges += `
        <div style="background-color: ${bgColor}; display: inline-block; margin: 3px 2px; padding: 2px 6px; border-radius: 10px; border: 1px solid ${bgColor};">
            <span style="color: ${txtColor}; font-size: 0.75rem; font-weight: bold;">${s}</span>
        </div>`;
    });

    // --- 인포박스 렌더링 (한국맥도날드 운영사 추가) ---
    const isClosed = storeData.type.includes('폐점');
    const infoboxHtml = `
        <tr><td colspan="2" style="padding: 0; border: none; border-bottom: 1px solid #ccc; background-color: #DB0007;">
            <div style="display: flex; align-items: center; justify-content: center; padding: 15px;">
                <a href="맥도날드.html" style="width: 60px; margin-right: 15px;">
                    <img src="이미지/svg/맥도날드_로고.svg" style="width: 100%; height: auto; ${isClosed ? 'filter: grayscale(100%);' : ''}">
                </a>
                <div style="color: white; text-align: left; line-height: 1.2;">
                    <div style="font-size: 1.35rem; font-weight: 900;">맥도날드 ${displayName}</div>
                    <div style="font-size: 0.85rem; opacity: 0.9;">McDonald's ${storeData.engName || ''}</div>
                </div>
            </div>
        </td></tr>
        <tr><td colspan="2" style="padding: 10px; background: #fff; text-align: center;">
            <img src="이미지/맥도날드_${displayName}.webp" onerror="this.style.display='none'" style="width:100%; border-radius: 4px; border: 1px solid #ddd;" alt="맥도날드 ${displayName} 전경">
        </td></tr>
        <tr><th>개점일</th><td>${storeData.openDate}</td></tr>
        <tr><th>운영사</th><td><a class="wiki-link" href="한국맥도날드.html">한국맥도날드</a></td></tr>
        <tr><th rowspan="2">주소</th>
            <td style="padding: 0;">
                <div style="width: 100%; height: 250px; overflow: hidden; position: relative;">
                    <iframe src="https://binia1.github.io/mymap/" style="width: 160%; height: 160%; border: none; position: absolute; top: 0; left: 0; transform: scale(0.625); transform-origin: 0 0;"></iframe>
                </div>
            </td>
        </tr>
        <tr><td>${storeData.region} ${storeData.district} ${storeData.address} <a class="wiki-fn-link" href="#fn-1" id="rfn-1">[1]</a></td></tr>
        <tr><th>영업시간</th><td>${storeData.hours}</td></tr>
        <tr><th>전화번호</th><td>${storeData.phone}</td></tr>
        <tr><th>서비스</th><td>${serviceBadges}</td></tr>
    `;
    document.getElementById('infobox-table').innerHTML = infoboxHtml;

    // --- 대중교통 파싱 (예정 노선 SVG 취소선 완벽 적용) ---
    function parseTransitToSvg(transitStr) {
        if (!transitStr || transitStr === "-") return "해당 노선 없음";
        let isPlanned = transitStr.includes('예정') || transitStr.includes('계획');
        let cleanStr = transitStr.replace(/\(예정\)|\(계획\)|예정|계획/g, "").trim();
        let parts = cleanStr.split(" ");
        let stationName = parts.pop();
        let lines = parts.join(" ").replace(/호선/g, "").split("/");
        
        let html = "<div class='flex items-center gap-1 flex-wrap mb-1'>";
        if(isPlanned) html += "<span class='route-planned'>"; 
        
        lines.forEach(l => {
            let svg = "";
            if (["1","2","3","4","5","6","7","8"].includes(l.trim())) svg = `효빈${l.trim()}호선.svg`;
            else if (l.includes("빈효")) svg = "빈효광역선.svg";
            else if (l.includes("빈주1")) svg = "빈주1.svg";
            else if (l.includes("빈주2")) svg = "빈주2.svg";
            else if (l.includes("빈주광역")) svg = "빈주광역선.svg";
            else if (l.includes("덕주1")) svg = "덕주1.svg";
            else if (l.includes("서해")) svg = "서해경전철.svg";
            else if (l.includes("천주1")) svg = "천주1.svg";
            else if (l.includes("HDTX")) svg = "HDTXA.svg";
            if (svg) html += `<img src="이미지/svg/${svg}" class="subway-logo" alt="${l.trim()}"> `;
        });
        
        if(isPlanned) {
            html += `<a class="wiki-link" href="${stationName}.html" style="font-size:1.1rem; margin-left:2px;">${stationName}(예정)</a></span>`;
        } else {
            html += `<a class="wiki-link" href="${stationName}.html" style="font-size:1.1rem; margin-left:4px;">${stationName}</a>`;
        }
        html += "</div>";
        return html;
    }

    // --- 버스 도색 파서 ---
    function getBusColor(busName, region, district) {
        let n = busName.replace(/\s+/g, '');
        let type = '일반';
        if(n.includes('BRT')) type = 'BRT';
        else if(n.includes('광역급행')) type = '광역급행';
        else if(n.includes('급행좌석')) type = '급행좌석';
        else if(n.includes('공항')) type = '공항';
        else if(n.includes('급행')) type = '급행';
        else if(n.includes('광역')) type = '광역';
        else if(n.includes('좌석')) type = '좌석';
        else if(n.includes('간선')) type = '간선';
        else if(n.includes('지선')) type = '지선';
        else if(n.includes('순환')) type = '순환';
        else if(n.includes('마일') || n.includes('마을')) type = '마을';
        else if(n.includes('공영')) type = '공영';
        else if(n.includes('심야')) type = '심야';

        let isLoc = (loc) => (region && region.includes(loc)) || (district && district.includes(loc)) || n.includes(loc);

        if (isLoc('효빈')) {
            const colors = { '간선':'#01B7ED', '지선':'#37B484', '순환':'#E7D600', '급행':'#D81C2F', '좌석':'#FF5800', '광역':'#485EC6', '마을':'#A664A0', '공항':'#84C36E' };
            if(colors[type]) return colors[type];
        }
        if (isLoc('빈주')) {
            if(n.includes('장거리')) return '#AA33CC';
            const colors = { '간선':'#00b5e2', '지선':'#00c7b1', '공영':'#ffeeaa', '심야':'#8DC63F', '마을':'#F7E600', '좌석':'#003366', '급행':'#990033', '광역':'#990033' };
            if(colors[type]) return colors[type];
        }
        if (isLoc('천주')) {
            const colors = { '광역급행':'#990033', '급행':'#990033', '좌석':'#003366', '간선':'#00B5E2', '지선':'#8DC63F', '순환':'#FFBF00', '마을':'#F7E600', '광역':'#990033' };
            if(colors[type]) return colors[type];
        }
        if (isLoc('약산')) {
            if(n.includes('효빈') && type === '광역') return '#485EC6';
            if(n.includes('효빈') && type === '좌석') return '#FF5800';
            const colors = { '급행좌석':'#D81C2F', '간선':'#00b5e2', '지선':'#8DC63F', '순환':'#FFBF00', '마을':'#F7E600', '광역':'#485EC6', '좌석':'#FF5800', '급행':'#D81C2F' };
            if(colors[type]) return colors[type];
        }
        if (isLoc('서진') || isLoc('군천')) {
            const colors = { '급행':'#990033', '간선':'#00B5E2', '지선':'#8DC63F', '순환':'#FFBF00', '마을':'#FFBF00', '광역':'#990033', '좌석':'#990033' };
            if(colors[type]) return colors[type];
        }
        if (isLoc('강주')) {
            const colors = { '광역':'#990033', '간선':'#00B5E2', '지선':'#8DC63F', '순환':'#FFBF00', '마을':'#FFBF00' };
            if(colors[type]) return colors[type];
        }
        if (isLoc('서해')) {
            const colors = { '급행':'#990033', '광역':'#990033', '공항':'#003366', '좌석':'#003366', '간선':'#00B5E2', '지선':'#8DC63F', '순환':'#FFBF00', '마을':'#F7E600' };
            if(colors[type]) return colors[type];
        }
        if (isLoc('계성')) {
            const colors = { '광역':'#990033', '간선':'#00B5E2', '지선':'#8DC63F', '좌석':'#8DC63F', '순환':'#FFBF00', '마을':'#F7E600' };
            if(colors[type]) return colors[type];
        }
        if (isLoc('낭원')) {
            const colors = { '광역':'#990033', '좌석':'#990033', '간선':'#00B5E2', '지선':'#8DC63F', '순환':'#FFBF00', '마을':'#FFBF00' };
            if(colors[type]) return colors[type];
        }
        if (isLoc('기도')) {
            if(n.includes('기도') && type === '광역') return '#77BBDD';
            if(n.includes('효빈') && type === '광역') return '#485EC6';
            if(n.includes('효빈') && type === '좌석') return '#FF5800';
            const colors = { '간선':'#00B5E2', '지선':'#8DC63F', '순환':'#F7E600', '마을':'#F7E600' };
            if(colors[type]) return colors[type];
        }
        if (isLoc('덕주')) {
            const colors = { '급행':'#E60012', '광역':'#8E44AD', '좌석':'#8E44AD', '간선':'#AA66DD', '지선':'#3344aa', '마을':'#FFC107' };
            if(colors[type]) return colors[type];
        }
        if (isLoc('낙주') || isLoc('방산')) {
            const colors = { 'BRT':'#E60012', '급행':'#E60012', '광역':'#8E44AD', '좌석':'#8E44AD', '간선':'#0068B7', '지선':'#66C133', '순환':'#FFC107', '마을':'#FFC107' };
            if(colors[type]) return colors[type];
        }
        if (isLoc('매성') || isLoc('마진') || isLoc('매산')) {
            const colors = { '광역':'#8E44AD', '좌석':'#8E44AD', '간선':'#0068B7', '지선':'#66C133', '순환':'#FFC107', '마을':'#FFC107' };
            if(colors[type]) return colors[type];
        }
        if (isLoc('운진')) {
            const colors = { '좌석':'#8E44AD', '간선':'#0068B7', '지선':'#99DD88', '순환':'#99DD88', '마을':'#99DD88', '광역':'#8E44AD', '급행':'#8E44AD' };
            if(colors[type]) return colors[type];
        }

        // 최후의 보루 (절대 회색 방지)
        const fallback = {
            '간선': '#00B5E2', '지선': '#8DC63F', '급행': '#D81C2F', '광역': '#485EC6', '좌석': '#FF5800', '순환': '#FFBF00', '마을': '#F7E600', 'BRT': '#E60012', '공항': '#003366', '공영': '#ffeeaa', '심야': '#8DC63F'
        };
        return fallback[type] || '#444444';
    }

    function parseBusRoutes(busStr, region, district) {
        if (!busStr || busStr === "-" || busStr === "없음") return "해당 버스 노선 없음";
        let buses = busStr.split(/[,/]/).map(b => b.trim()).filter(b => b);
        let html = "";
        buses.forEach(bus => {
            let color = getBusColor(bus, region, district);
            let textColorClass = (color === '#E7D600' || color === '#ffeeaa' || color === '#FFBF00' || color === '#F7E600' || color === '#FFC107') ? 'yellow-text' : '';
            html += `<span class="bus-badge ${textColorClass}" style="background-color: ${color};">${bus}</span>`;
        });
        return html;
    }

    // --- 배달 서술 생성기 ---
    function generateDeliveryNarrative(data) {
        let isDelivery = data.services.includes("딜리버리") || data.services.includes("맥딜리버리");
        let is24h = data.hours.includes("24시간");
        let dtTag = data.type === 'DT' ? ' <a class="wiki-fn-link" href="#fn-delivery" id="rfn-delivery">[2]</a>' : '';
        let n = `<p style="font-size: 1.05rem; line-height: 1.8;">`;

        if(isDelivery) {
            n += `기본적으로 <strong>맥딜리버리</strong>를 비롯해 배달의민족, 요기요, 쿠팡이츠 등 주요 서드파티 배달 앱을 통한 딜리버리 서비스를 활발하게 지원한다. 주변 ${data.district} 일대의 거대한 주거단지와 상업지구 수요를 전담하는 핵심 배달 거점이다. `;
            if(is24h) {
                n += `특히 24시간 영업 매장이라는 강력한 메리트 덕분에, 심야나 새벽 시간대에도 야식을 찾는 햄버거 배달 수요가 폭발적으로 몰려 라이더들의 발길이 끊이지 않는다.${dtTag} `;
            } else {
                n += `식사 피크 타임에는 배달 콜이 쏟아져 매장 앞이 라이더들의 오토바이로 장사진을 이룬다.${dtTag} `;
            }
        } else {
            n += `이 매장은 <strong>배달 서비스를 일절 지원하지 않는다.</strong> 오직 매장 내 식사(Dine-in)와 포장(Take-out)${data.type === 'DT' ? ', 그리고 드라이브 스루(DT)' : ''}만 이용 가능하므로, 앱으로 배달을 시키려다 낭패를 보지 않도록 주의해야 한다. 배달 수요를 과감히 포기한 대신 매장 내점 고객 회전율에 모든 역량을 집중하는 편이다. `;
        }
        n += `</p>`;
        return n;
    }

    // --- 지능형 교통 서술 생성기 ---
    function generateTrafficNarrative(data) {
        let n = "";
        let isHellRoad = ["효빈광역시", "빈주시", "서해시", "덕주시"].some(loc => data.region.includes(loc) || data.district.includes(loc));
        let isDT = data.type === 'DT';
        let isClosed = data.type.includes('폐점');
        let isPlanned = data.transit && (data.transit.includes('예정') || data.transit.includes('계획'));
        let hasSubway = data.transit && data.transit !== "-" && data.transit !== "해당 없음" && !isPlanned;
        let busArray = (data.bus && data.bus !== "-" && data.bus !== "없음" && data.bus !== "해당 버스 노선 없음") ? data.bus.split(/[,/]/) : [];
        let busCount = busArray.length;

        n += `<p style='font-size: 1.05rem; line-height: 1.8; margin-bottom: 12px;'>`;
        if (isHellRoad) {
            if (isDT) {
                n += `해당 지자체 특유의 막장스러운 도로망과 난개발의 여파로 인해, 명색이 <strong>드라이브 스루(DT) 매장임에도 불구하고 차량 진입 난이도가 생지옥에 가깝다.</strong> 출퇴근 시간대나 주말 식사 피크 타임이 되면 햄버거 하나 사겠다고 꼬리를 문 차량들이 왕복 차선을 꽉 틀어막아 일대 교통을 마비시키는 1등 주범으로 전락한다. 초보 운전자라면 차라리 근처 공터에 차를 던져두고 걸어 들어가는 것이 정신건강에 이로울 정도다.`;
            } else {
                n += `지역 특유의 복잡한 도로 사정과 협소한 골목 상권 탓에 햄버거 하나 먹겠다고 자가용을 끌고 오는 것은 사실상 객기에 가깝다. 주차 공간이 극도로 부족하므로 불법 주정차 딱지를 떼이기 싫다면 대중교통을 이용하는 것이 절대적으로 권장된다.`;
            }
        } else {
            if (isDT) {
                n += `대로변 요지에 자리 잡고 있어 차량 접근성이 매우 쾌적하다. <strong>드라이브 스루(DT)</strong> 라인이 널찍하게 잘 빠져 있어 초보 운전자들도 부담 없이 스티어링 휠을 꺾어 진입할 수 있으며, 주말이면 나들이를 떠나는 가족 단위 차량들이 줄을 잇는다.`;
            } else {
                n += `전형적인 도심형 일반 매장으로, 촘촘하게 짜여진 주변 상권과 밀착되어 있어 뚜벅이 방문객들의 주력 수요를 완벽하게 흡수하고 있다.`;
            }
        }
        n += `</p><p style='font-size: 1.05rem; line-height: 1.8; margin-bottom: 12px;'>`;

        if (isPlanned) {
            n += `가장 큰 문제는 철도 교통이다. 현재 매장 앞을 지나는 도시철도 역사가 <strong>개통 예정(공사 중)</strong> 상태라, 주변은 온통 덤프트럭이 오가고 흙먼지가 펄펄 날리는 어수선한 공사판 뷰를 자랑한다. 당장은 철도 혜택을 1도 볼 수 없으며, 노선이 개통되어 역세권 프리미엄이 터질 때까지 기약 없는 존버를 타야만 하는 상황이다.`;
        } else if (hasSubway) {
            let stationName = data.transit.split(" ").pop();
            n += `그나마 <strong>${stationName}</strong>을(를) 코앞에 끼고 있는 초역세권이라 도시철도를 이용한 접근성은 타의 추종을 불허한다. 역 출구를 빠져나오자마자 감자튀김 냄새가 후각을 강타하며, 헬게이트 같은 도로 사정을 피해 지하철로 방문하는 유동 인구가 쉴 새 없이 매장 안으로 빨려 들어간다.`;
        } else {
            n += `직접적으로 연계되는 도시철도 노선이 전무한 <strong>절망적인 철도 교통 음영 지역</strong>이다. 지하철만 타고 오기에는 무리가 따르며, 반드시 버스 환승이나 자가용의 힘을 빌려야만 매장에 닿을 수 있다.`;
        }
        n += `</p><p style='font-size: 1.05rem; line-height: 1.8; margin-bottom: 15px;'>`;

        if (busCount >= 8) {
            n += `하지만 불행 중 다행으로 대중교통의 꽃인 버스 인프라만큼은 기가 막히게 잘 갖춰져 있다. 무려 ${busCount}여 개에 달하는 간선, 지선, 광역 버스 노선들이 매장 앞 정류장을 빗자루질하듯 쓸고 지나가기 때문에, 철도 인프라의 부재나 자가용 주차의 빡셈을 아주 훌륭하게 하드캐리해 주고 있다.`;
        } else if (busCount >= 3) {
            n += `매장 인근 정류장으로 몇몇 핵심 간선 및 지선 버스가 정차하여 기본적인 대중교통 연계를 간신히 돕고 있다. 버스 배차 시간을 미리 확인하고 방문하는 것이 좋다.`;
        } else {
            if(!hasSubway && !isClosed) {
                n += `설상가상으로 연계 버스 노선마저 처참하게 빈약하여, 사실상 뚜벅이들에게는 가혹하기 짝이 없는 극한의 접근성을 자랑한다.`;
            } else if (!isClosed) {
                n += `연계 버스 노선이 빈약하므로 가급적 지하철 역에서 도보로 이동하거나 자가용을 이용하는 것을 적극 추천한다.`;
            }
        }
        n += `</p>`;
        return n;
    }

    // --- 동적 각주 리스트 생성 ---
    function generateFootnotes(data) {
        let fns = [];
        fns.push(`도로명 주소 기준. 구 지번 주소 표기와 혼동하지 않도록 주의 요망.`);
        if (data.type === 'DT') {
            fns.push(`단, 기상 악화(폭우, 폭설 등)나 라이더 배차 지연 시 배달 앱에서 임시로 매장 주문이 닫힐 수 있다.`);
            fns.push(`드라이브 스루(DT) 진입 시 보행자 도로를 횡단해야 하므로, 보행자와의 추돌 사고에 각별히 유의해야 한다.`);
        }
        if (data.hours.includes("24시간")) {
            fns.push(`24시간 영업 매장이지만, 심야 시간대(02:00~06:00)에는 기기 점검 및 청소로 인해 일부 아이스크림이나 디저트 메뉴 주문이 불가할 수 있다.`);
        }

        let fnHtml = "";
        fns.forEach((text, i) => {
            let idAttr = (i===1 && data.type==='DT') ? `id="fn-delivery"` : `id="fn-${i+1}"`;
            let rIdAttr = (i===1 && data.type==='DT') ? `rfn-delivery` : `rfn-${i+1}`;
            fnHtml += `<li ${idAttr} style="margin-bottom: 6px;">
                <a href="#${rIdAttr}" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[${i+1}]</a> 
                ${text} <a class="wiki-link" href="#${rIdAttr}">↑</a>
            </li>`;
        });
        return fnHtml;
    }

    let cleanAddress = storeData.address.split(' ')[0]; 
    let typeStr = storeData.type === 'DT' ? '드라이브 스루(DT)' : (isClosed ? '과거 영업했던 일반' : '일반');
    let detailOpening = `<span class="font-bold">${storeData.openDate}</span>에 개점한 매장으로, `;
    if(isClosed) detailOpening = `<span class="font-bold">${storeData.openDate}</span>에 개점하여 치열하게 영업했던 매장으로, `;

    const bodyHtml = `
        <h2 id="s-1" class="anchor-offset">1. 개요</h2>
        <p style="font-size: 1.05rem; line-height: 1.8;">
            <a class="wiki-link" href="${storeData.region}.html">${storeData.region}</a> 
            <a class="wiki-link" href="${storeData.district}.html">${storeData.district}</a> 
            <a class="wiki-link" href="${cleanAddress}.html">${cleanAddress}</a>에 위치한 
            <a class="wiki-link" href="맥도날드.html">맥도날드</a> ${typeStr} 매장.
        </p>
        
        <h2 id="s-2" class="anchor-offset">2. 상세</h2>
        <p style="font-size: 1.05rem; line-height: 1.8;">
            ${detailOpening} ${storeData.special || ''}
        </p>
        
        <h3 id="s-2-1" class="anchor-offset">2.1. 여담</h3>
        <p style="font-size: 1.05rem; line-height: 1.8;">${storeData.trivia || '특별히 알려진 여담이 없다.'}</p>
        
        <h3 id="s-2-2" class="anchor-offset">2.2. 드립 및 밈</h3>
        <p style="font-size: 1.05rem; line-height: 1.8; margin-bottom: 10px;">${storeData.drip || ''}</p>
        <p style="font-size: 1.05rem; line-height: 1.8;">${storeData.meme || ''}</p>
        
        <h3 id="s-2-3" class="anchor-offset">2.3. 배달</h3>
        ${generateDeliveryNarrative(storeData)}

        <h2 id="s-3" class="anchor-offset">3. 교통</h2>
        ${generateTrafficNarrative(storeData)}
        <table class="transport-table">
            <tbody>
                <tr>
                    <th>도시철도</th>
                    <td>${parseTransitToSvg(storeData.transit)}</td>
                </tr>
                <tr>
                    <th>버스 노선</th>
                    <td>
                        <div style="line-height: 2.2;">
                            ${parseBusRoutes(storeData.bus, storeData.region, storeData.district)}
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    `;
    document.getElementById('wiki-body-content').innerHTML = bodyHtml;
    document.getElementById('footnotes-container').innerHTML = generateFootnotes(storeData);

    // --- 각주 툴팁 이벤트 로직 ---
    setTimeout(() => {
        const tooltip = document.getElementById('wiki-footnote-tooltip');
        const fnLinks = document.querySelectorAll('.wiki-fn-link');
        
        fnLinks.forEach(link => {
            link.addEventListener('mouseenter', (e) => {
                const targetId = link.getAttribute('href').substring(1); 
                const targetElement = document.getElementById(targetId);
                if (targetElement) {
                    let clone = targetElement.cloneNode(true);
                    const anchors = clone.querySelectorAll('a');
                    anchors.forEach(a => a.remove()); 
                    tooltip.innerHTML = clone.innerHTML.trim();
                    tooltip.style.display = 'block';
                    updateTooltipPosition(e);
                }
            });
            link.addEventListener('mousemove', updateTooltipPosition);
            link.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
        });

        function updateTooltipPosition(e) {
            const margin = 15; 
            let left = e.pageX + margin; let top = e.pageY + margin;
            if (left + tooltip.offsetWidth > window.innerWidth + window.scrollX - margin) { left = e.pageX - tooltip.offsetWidth - margin; }
            if (top + tooltip.offsetHeight > window.innerHeight + window.scrollY - margin) { top = e.pageY - tooltip.offsetHeight - margin; }
            tooltip.style.left = left + 'px'; tooltip.style.top = top + 'px';
        }
    }, 100);
});
</script>
<script src="assets/wiki_index.js"></script>
