    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Noto Sans KR";
            background-color: #fafafa;
            color: #262626;
            overflow: hidden; 
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-scale-in { animation: scaleIn 0.2s ease-out forwards; }

        @keyframes popHeart { 
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
        .pop-heart-anim {
            animation: popHeart 0.8s ease-out forwards;
        }
    </style>
<script src="ad_logic.js"></script>
</head>

        <a href="인스타그램 설정.html" class="flex items-center gap-3 p-4 hover:bg-gray-100 rounded-lg transition text-[#262626]">

            <span class="text-[14px]">로그아웃</span>

    <!-- 좌측 사이드바 -->
    <nav class="fixed top-0 left-0 h-full w-[72px] xl:w-[244px] bg-white border-r border-gray-300 flex flex-col pt-8 pb-5 px-3 z-40 transition-all duration-300">

        <div class="flex flex-col gap-2 flex-1">
            <a href="효빈광역시청 인스타그램.html" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black">
                <i class="fas fa-home text-2xl group-hover:scale-105 transition-transform"></i>

            <a href="인스타그램 검색.html" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black">

            <a href="인스타그램 탐색.html" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black">

            <a href="인스타그램 메시지.html" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black relative">

            <a href="인스타그램 알림.html" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black">

                <span class="hidden xl:block text-[16px]">알림</span>
            </a>
            <a href="인스타그램 만들기.html" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black">
                <i class="far fa-plus-square text-2xl group-hover:scale-105 transition-transform"></i>
                <span class="hidden xl:block text-[16px]">만들기</span>
            </a>
            <a href="효빈광역시청 인스타그램.html" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black">
                <img src="이미지/효빈시_로고.webp" class="w-6 h-6 rounded-full border border-gray-300">
                <span class="hidden xl:block text-[16px]">프로필</span>
            </a>
        </div>

        <a href="#" id="more-btn" onclick="toggleMoreMenu(event)" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black mt-auto relative">
            <i class="fas fa-bars text-2xl group-hover:scale-105 transition-transform"></i>
            <span class="hidden xl:block text-[16px]">더 보기</span>
        </a>
    </nav>

    <!-- 메인 컨텐츠 영역 (릴스 스크롤 컨테이너) -->
    <main class="flex-1 ml-[72px] xl:ml-[244px] h-screen bg-[#fafafa] flex justify-center">
        <div id="reels-container" class="w-full h-full overflow-y-scroll snap-y snap-mandatory scrollbar-hide flex flex-col items-center">
            <!-- 릴스 아이템들이 JS에서 이곳에 렌더링됩니다 -->
        </div>
    </main>

    <!-- 릴스 댓글 모달 -->
    <div id="reel-comments-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center p-4" onclick="closeCommentsModal(event)">
        <div class="bg-white w-full max-w-[450px] h-[70vh] rounded-xl flex flex-col overflow-hidden animate-scale-in" onclick="event.stopPropagation()">
            <!-- 헤더 -->
            <div class="flex items-center justify-between p-4 border-b border-gray-200">
                <div class="w-6"></div>
                <h3 class="font-bold text-[16px]">댓글</h3>
                <i class="fas fa-times text-xl cursor-pointer hover:text-gray-500" onclick="closeCommentsModal()"></i>
            </div>
            
            <!-- 댓글 목록 영역 -->
            <div id="reel-comments-list" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- 동적 렌더링 -->
            </div>

            <!-- 댓글 입력 영역 -->
            <div class="p-4 border-t border-gray-200 flex items-center gap-3">
                <img src="이미지/효빈시_로고.webp" class="w-8 h-8 rounded-full border border-gray-200">
                <input type="text" id="reel-comment-input" placeholder="댓글 달기..." class="flex-1 outline-none text-[14px]" onkeypress="handleCommentInput(event)">
                <button class="text-blue-500 font-bold text-[14px] opacity-50 hover:opacity-100 transition" onclick="submitReelComment()">게시</button>
            </div>
        </div>
    </div>

    <script>
        // 릴스 데이터 (플레이스홀더 제거)
        const reelsData = [
            {
                id: 1,
                username: "hyobin_city_official",
                userImg: "이미지/효빈시_로고.webp",
                media: "이미지/박효빈.webp",
                caption: "시정 평가 1위 달성 공약 이행 완료! 🕺✨ 젊은 피 시장님의 남다른 텐션 보고 가세요 ㅋㅋㅋ #박효빈시장 #제로투 #공약이행",
                audio: "hyobin_city_official · 오리지널 오디오",
                likes: 58241,
                comments: 3211,
                shares: 1402,
                isLiked: false,
                isSaved: false
            },
            {
                id: 2,
                username: "justice_citizen",
                userImg: "이미지/아사카 카린.webp",
                media: "이미지/윤재훈 구속.webp",
                caption: "오늘자 특별교정센터(The Factory) 근황 ㅋㅋㅋㅋ 윤재훈 귤박스 포장하다가 멘탈 나간듯 ㅋㅋㅋㅋ 노동요는 '키세키' 무한루프 🎧 #스타더스트 #참교육 #효빈시",
                audio: "justice_citizen · 키세키 (Kiseki) Loop",
                likes: 84210,
                comments: 5120,
                shares: 8900,
                isLiked: false,
                isSaved: false
            },
            {
                id: 3,
                username: "bus_mania_99",
                userImg: "이미지/하루빈 로고.webp",
                media: "이미지/시즈쿠간선버스.webp",
                caption: "효빈시 3세대 시내버스 '스카이블루' 실물 영접 ㅠㅠㅠ 색감 진짜 미쳤다💙 지나가는 거 겨우 찍음!! #효빈버스 #시즈쿠버스 #대중교통",
                audio: "bus_mania_99 · 오리지널 오디오",
                likes: 12540,
                comments: 420,
                shares: 110,
                isLiked: false,
                isSaved: false
            },
            {
                id: 4,
                username: "clean_hyobin_now",
                userImg: "이미지/심세이_로고.webp",
                media: "이미지/돈불라 화형식.webp",
                caption: "🔥🔥 돈불라 화형식 현장 직캠 🔥🔥 속이 다 뻥 뚫리네 ㅋㅋㅋㅋ 악덕 기업 컷!! #효빈시 #돈불라 #사이다",
                audio: "clean_hyobin_now · 화려한 불꽃놀이 브금",
                likes: 45100,
                comments: 2100,
                shares: 5500,
                isLiked: false,
                isSaved: false
            }
        ];

        let currentActiveReel = null;

        window.onload = () => {
            renderReels();
        };

        function renderReels() {
            const container = document.getElementById('reels-container');
            container.innerHTML = ''; 
            
            const paddingBlock = `<div class="w-full h-[5vh] sm:h-[10vh] flex-shrink-0 snap-start"></div>`;
            container.insertAdjacentHTML('beforeend', paddingBlock);

            reelsData.forEach((reel, index) => {
                const isLikedClass = reel.isLiked ? 'fas text-red-500' : 'far text-white';
                const isSavedClass = reel.isSaved ? 'fas' : 'far';
                const formatCount = (num) => num >= 10000 ? (num / 10000).toFixed(1) + '만' : num.toLocaleString();

                const reelHTML = `
                    <article class="relative flex items-center justify-center w-full max-w-[400px] h-[80vh] sm:h-[85vh] min-h-[600px] snap-center snap-always bg-black sm:rounded-[12px] my-3 overflow-hidden shadow-lg animate-fade-in" style="animation-delay: ${index * 0.1}s">
                        
                        <!-- 미디어 -->
                        <div class="absolute inset-0 w-full h-full cursor-pointer" ondblclick="triggerPopHeart(this, ${reel.id})">
                            <img src="${reel.media}" class="w-full h-full object-cover opacity-90">
                            <i class="fas fa-heart text-white text-9xl absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 opacity-0 z-20 pointer-events-none drop-shadow-2xl"></i>
                        </div>

                        <!-- 우측 액션 버튼들 -->
                        <div class="absolute right-2 bottom-4 flex flex-col items-center gap-6 z-20 w-[60px]">
                            <div class="flex flex-col items-center gap-1 cursor-pointer group" onclick="toggleReelLike(${reel.id})">
                                <i id="reel-like-icon-${reel.id}" class="${isLikedClass} text-[28px] group-hover:scale-110 transition-transform drop-shadow-md"></i>
                                <span id="reel-like-count-${reel.id}" class="text-white text-[12px] font-bold drop-shadow-md">${formatCount(reel.likes)}</span>
                            </div>
                            <div class="flex flex-col items-center gap-1 cursor-pointer group" onclick="openCommentsModal(${reel.id})">
                                <i class="far fa-comment text-white text-[28px] group-hover:scale-110 transition-transform drop-shadow-md"></i>
                                <span class="text-white text-[12px] font-bold drop-shadow-md">${formatCount(reel.comments)}</span>
                            </div>
                            <div class="flex flex-col items-center gap-1 cursor-pointer group" onclick="showToast('이 릴스를 공유합니다.')">
                                <i class="far fa-paper-plane text-white text-[28px] group-hover:scale-110 transition-transform drop-shadow-md"></i>
                                <span class="text-white text-[12px] font-bold drop-shadow-md">${formatCount(reel.shares)}</span>
                            </div>
                            <div class="flex flex-col items-center cursor-pointer group" onclick="toggleReelSave(${reel.id})">
                                <i id="reel-save-icon-${reel.id}" class="${isSavedClass} fa-bookmark text-white text-[28px] group-hover:scale-110 transition-transform drop-shadow-md"></i>
                            </div>
                            <div class="flex flex-col items-center cursor-pointer mt-2" onclick="showToast('오디오 트랙을 확인합니다.')">
                                <div class="w-8 h-8 rounded-md bg-white border-2 border-white overflow-hidden flex items-center justify-center relative spin-slow">
                                    <img src="${reel.userImg}" class="w-full h-full object-cover">
                                    <div class="absolute inset-0 bg-black bg-opacity-20 flex items-center justify-center"><i class="fas fa-music text-[10px] text-white"></i></div>
                                </div>
                            </div>
                        </div>

                        <!-- 하단 정보 영역 -->
                        <div class="absolute left-0 bottom-0 w-full h-[40%] bg-gradient-to-t from-black/80 via-black/40 to-transparent z-10 flex flex-col justify-end p-4 pr-[70px]">
                            <div class="flex items-center gap-3 mb-3 cursor-pointer" onclick="window.location.href='${reel.username} 인스타그램.html'">
                                <img src="${reel.userImg}" class="w-8 h-8 rounded-full border border-gray-400">
                                <span class="text-white font-bold text-[15px] hover:underline">${reel.username}</span>
                                <button class="border border-white text-white font-bold text-[12px] px-2 py-1 rounded-lg hover:bg-white hover:text-black transition ml-1" onclick="event.stopPropagation(); showToast('팔로우 했습니다.')">팔로우</button>
                            </div>
                            <div class="text-white text-[14px] line-clamp-2 mb-3 leading-snug">
                                ${reel.caption}
                            </div>
                            <div class="flex items-center gap-2 text-white text-[13px] bg-white/20 w-max px-3 py-1.5 rounded-full cursor-pointer hover:bg-white/30 transition" onclick="showToast('오디오 페이지로 이동합니다.')">
                                <i class="fas fa-music text-[10px]"></i>
                                <span class="truncate max-w-[180px]">${reel.audio}</span>
                            </div>
                        </div>
                    </article>
                `;
                container.insertAdjacentHTML('beforeend', reelHTML);
            });

            container.insertAdjacentHTML('beforeend', paddingBlock);
        }

        function triggerPopHeart(element, id) {
            const heartIcon = element.querySelector('.fa-heart');
            heartIcon.classList.remove('pop-heart-anim');
            void heartIcon.offsetWidth;
            heartIcon.classList.add('pop-heart-anim');
            
            const reel = reelsData.find(r => r.id === id);
            if(!reel.isLiked) {
                toggleReelLike(id);
            }
        }

        function toggleReelLike(id) {
            const reel = reelsData.find(r => r.id === id);
            reel.isLiked = !reel.isLiked;
            reel.likes += reel.isLiked ? 1 : -1;

            const icon = document.getElementById(`reel-like-icon-${id}`);
            const count = document.getElementById(`reel-like-count-${id}`);

            if (reel.isLiked) {
                icon.classList.remove('far', 'text-white');
                icon.classList.add('fas', 'text-red-500');
                icon.style.transform = 'scale(1.2)';
                setTimeout(() => icon.style.transform = 'scale(1)', 150);
            } else {
                icon.classList.remove('fas', 'text-red-500');
                icon.classList.add('far', 'text-white');
            }

            count.innerText = reel.likes >= 10000 ? (reel.likes / 10000).toFixed(1) + '만' : reel.likes.toLocaleString();
        }

        function toggleReelSave(id) {
            const reel = reelsData.find(r => r.id === id);
            reel.isSaved = !reel.isSaved;
            
            const icon = document.getElementById(`reel-save-icon-${id}`);
            if (reel.isSaved) {
                icon.classList.remove('far');
                icon.classList.add('fas');
                icon.style.transform = 'scale(1.2)';
                setTimeout(() => icon.style.transform = 'scale(1)', 150);
                showToast('저장됨에 추가되었습니다.');
            } else {
                icon.classList.remove('fas');
                icon.classList.add('far');
            }
        }

        function openCommentsModal(id) {
            currentActiveReel = id;
            document.getElementById('reel-comments-modal').classList.remove('hidden');
            renderMockComments(id);
        }

        function closeCommentsModal(event) {
            if (!event || event.target.id === 'reel-comments-modal') {
                document.getElementById('reel-comments-modal').classList.add('hidden');
                currentActiveReel = null;
            }
        }

        function renderMockComments(reelId) {
            const list = document.getElementById('reel-comments-list');
            list.innerHTML = '';
            
            const mockComments = [
                { user: 'hyobin_fan', text: '진짜 최고네요 ㅋㅋㅋ 매번 챙겨보고 있습니다!', time: '2시간 전', likes: 12 },
                { user: 'random_user_99', text: '이거 언제 찍으신 거에요? 대박 ㅋㅋㅋ', time: '5시간 전', likes: 3 },
                { user: 'mayor_supporter', text: '효빈시 파이팅!!! 앞으로도 좋은 행정 부탁드립니다.', time: '1일 전', likes: 85 }
            ];

            mockComments.forEach(c => {
                const html = `
                    <div class="flex gap-3 items-start">
                        <img src="이미지/효빈시_로고.webp" class="w-8 h-8 rounded-full border border-gray-200 mt-1 cursor-pointer">
                        <div class="flex-1">
                            <span class="font-bold cursor-pointer hover:underline text-[14px]">${c.user}</span>
                            <span class="text-[14px]">${c.text}</span>
                            <div class="flex gap-3 text-[12px] text-gray-500 font-bold mt-1">
                                <span>${c.time}</span><span class="cursor-pointer">좋아요 ${c.likes}개</span><span class="cursor-pointer">답글 달기</span>
                            </div>
                        </div>
                        <i class="far fa-heart text-xs pt-2 pr-2 text-gray-400 cursor-pointer hover:text-gray-600" onclick="this.classList.toggle('fas'); this.classList.toggle('far'); this.classList.toggle('text-red-500');"></i>
                    </div>
                `;
                list.insertAdjacentHTML('beforeend', html);
            });
        }

        function handleCommentInput(e) {
            if (e.key === 'Enter') submitReelComment();
        }

        function submitReelComment() {
            const input = document.getElementById('reel-comment-input');
            const text = input.value.trim();
            if(!text || !currentActiveReel) return;

            const list = document.getElementById('reel-comments-list');
            const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            const html = `
                <div class="flex gap-3 items-start animate-fade-in">
                    <img src="이미지/효빈시_로고.webp" class="w-8 h-8 rounded-full border border-gray-200 mt-1 cursor-pointer">
                    <div class="flex-1">
                        <span class="font-bold cursor-pointer hover:underline text-[14px]">hyobin_citizen</span>
                        <span class="text-[14px] break-all">${safeText}</span>
                        <div class="flex gap-3 text-[12px] text-gray-500 font-bold mt-1">
                            <span>방금 전</span><span class="cursor-pointer">답글 달기</span>
                        </div>
                    </div>
                    <i class="far fa-heart text-xs pt-2 pr-2 text-gray-400 cursor-pointer hover:text-gray-600" onclick="this.classList.toggle('fas'); this.classList.toggle('far'); this.classList.toggle('text-red-500');"></i>
                </div>
            `;
            list.insertAdjacentHTML('afterbegin', html);
            input.value = '';
            
            const reel = reelsData.find(r => r.id === currentActiveReel);
            reel.comments++;
            document.querySelector(`#reel-comments-modal .font-bold`).innerText = `댓글 ${reel.comments}개`;
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast-message');
            document.getElementById('toast-text').innerText = message;
            toast.classList.remove('opacity-0', 'translate-y-5');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-5');
            }, 2500);
        }

        function toggleMoreMenu(event) {
            event.preventDefault();
            event.stopPropagation();
            const menu = document.getElementById('more-menu');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                setTimeout(() => {
                    menu.classList.remove('opacity-0', 'translate-y-2');
                    menu.classList.add('opacity-100', 'translate-y-0');
                }, 10);
            } else {
                closeMoreMenu();
            }
        }

        function closeMoreMenu() {
            const menu = document.getElementById('more-menu');
            if (menu && !menu.classList.contains('hidden')) {
                menu.classList.remove('opacity-100', 'translate-y-0');
                menu.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => menu.classList.add('hidden'), 200);
            }
        }

        window.onclick = function(event) {
            const menu = document.getElementById('more-menu');
            const moreBtn = document.getElementById('more-btn');
            if (menu && !menu.classList.contains('hidden')) {
                if (!menu.contains(event.target) && !moreBtn.contains(event.target)) {
                    closeMoreMenu();
                }
            }
        }
    </script>

<script>
    function applyUserData() {
        const storedUser = localStorage.getItem('ig_user_account');
        if (!storedUser) return; // 가입/로그인 정보가 없으면 패스

        const userData = JSON.parse(storedUser);

        // 1. 사이드바 프로필 사진 변경
        const sidebarProfileImgs = document.querySelectorAll('nav img[src*="이미지/효빈시_로고.webp"]');
        sidebarProfileImgs.forEach(img => {
            if (userData.profilePic) img.src = userData.profilePic;
        });

        // 2. 만들기(모달) 프로필 변경
        const createProfileImg = document.querySelector('#step-2 img[src*="이미지/효빈시_로고.webp"]');
        const createProfileName = document.querySelector('#step-2 span.font-bold');
        if (createProfileImg && userData.profilePic) createProfileImg.src = userData.profilePic;
        if (createProfileName) createProfileName.innerText = userData.username;

        // 3. 댓글 입력창 프로필 변경 (있는 경우)
        const commentImgs = document.querySelectorAll('input[placeholder="댓글 달기..."]');
        commentImgs.forEach(input => {
            // 입력창 바로 왼쪽에 있는 프로필 이미지 (또는 아이콘 찾기)
            const parent = input.parentElement;
            const img = parent.querySelector('img');
            if(img && userData.profilePic) img.src = userData.profilePic;
        });
        
        // 4. (추가) 글로벌 변수에 내 정보 저장해두기 (댓글 작성 등에 사용)
        window.myInstagramUser = userData;
    }

    // 화면 로딩 완료 시 실행
    document.addEventListener('DOMContentLoaded', applyUserData);

    // [댓글 작성 함수 덮어쓰기] - 내 이름과 사진으로 달리게 변경
    if (typeof renderIgComment !== 'undefined') {
        window.renderIgComment = function(text, targetAreaId) {
            const targetArea = document.getElementById(targetAreaId);
            const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            // 로그인 데이터 가져오기 (없으면 임시값)
            const me = window.myInstagramUser || { username: 'guest', profilePic: 'https://via.placeholder.com/32' };
            const myPic = me.profilePic ? me.profilePic : 'https://via.placeholder.com/32';
            
            const commentHTML = `
                <div class="flex gap-3 items-start mt-3 animate-fade-in">
                    <img src="${myPic}" class="w-8 h-8 rounded-full mt-1 cursor-pointer border border-gray-200 object-cover">
                    <div class="flex-1">
                        <span class="font-bold cursor-pointer hover:underline text-[14px]">${me.username}</span>
                        <span class="text-[14px] break-all">${safeText}</span>
                        <div class="flex gap-3 text-[11px] text-gray-500 font-bold mt-1">
                            <span>방금 전</span>
                            <span class="cursor-pointer" onclick="document.getElementById('${targetAreaId.replace('area', 'input')}').focus()">답글 달기</span>
                        </div>
                    </div>
                    <button class="text-xs pt-2 pr-2 text-gray-400 hover:text-gray-600" onclick="this.querySelector('i').classList.toggle('fas'); this.querySelector('i').classList.toggle('text-red-500'); this.querySelector('i').classList.toggle('far');"><i class="far fa-heart"></i></button>
                </div>
            `;
            targetArea.insertAdjacentHTML('beforeend', commentHTML);
            const scrollContainer = targetArea.parentElement;
            scrollContainer.scrollTop = scrollContainer.scrollHeight;
        };
    }
</script>
