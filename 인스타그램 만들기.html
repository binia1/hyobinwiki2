 </style>
<script src="ad_logic.js"></script>

<body class="flex h-screen overflow-hidden">

        <i class="fas fa-info-circle"></i>

    <!-- 사이드바 -->
    <nav class="fixed top-0 left-0 h-full w-[72px] xl:w-[244px] bg-white border-r border-gray-300 flex flex-col pt-8 pb-5 px-3 z-[40]">
        <div class="mb-8 px-3 cursor-pointer" onclick="window.location.href='효빈광역시청 인스타그램.html'">
            <img src="이미지/인스타그램.svg" alt="Instagram" class="hidden xl:block h-7 w-auto object-contain">
            <i class="fab fa-instagram text-2xl xl:hidden block text-center"></i>
        </div>
        <div class="flex flex-col gap-2 flex-1 relative z-50">
            <a href="효빈광역시청 인스타그램.html" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black">
                <i class="fas fa-home text-2xl group-hover:scale-105 transition-transform"></i>

            <a href="#" onclick="showToast('검색 패널은 홈 화면에서 이용해 주세요.'); return false;" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black">
                <i class="fas fa-search text-2xl group-hover:scale-105 transition-transform"></i>
                <span class="hidden xl:block text-[16px]">검색</span>
            </a>
            <a href="인스타그램 릴스.html" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black">
                <i class="fas fa-film text-2xl group-hover:scale-105 transition-transform"></i>
                <span class="hidden xl:block text-[16px]">릴스</span>
            </a>
            <a href="인스타그램 메시지.html" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black relative">
                <i class="far fa-paper-plane text-2xl group-hover:scale-105 transition-transform"></i>
                <span class="hidden xl:block text-[16px]">메시지</span>
            </a>
            <a href="인스타그램 만들기.html" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 transition group text-black font-semibold bg-gray-100">
                <i class="fas fa-plus-square text-2xl group-hover:scale-105 transition-transform"></i>
                <span class="hidden xl:block text-[16px]">만들기</span>
            </a>
            <a href="효빈광역시청 인스타그램.html" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-100 group text-black">
                <img id="sidebar-profile-pic" src="이미지/효빈시_로고.webp" class="w-6 h-6 rounded-full border border-gray-300 object-cover">
                <span class="hidden xl:block text-[16px]">프로필</span>
            </a>

    <!-- 메인 컨텐츠 영역 (만들기 모달 UI) -->
    <main class="flex-1 ml-[72px] xl:ml-[244px] h-screen bg-[#fafafa] flex justify-center items-center p-5 relative">
        <!-- 닫기 버튼 (홈으로) -->
        <i class="fas fa-times absolute top-5 right-5 text-3xl text-gray-600 cursor-pointer hover:text-black" onclick="window.location.href='효빈광역시청 인스타그램.html'"></i>
        
        <div class="w-full max-w-[800px] h-[80vh] min-h-[500px] bg-white rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.1)] border border-gray-200 overflow-hidden flex flex-col">
            
            <!-- 헤더 -->
            <div class="h-[43px] border-b border-gray-200 flex items-center justify-between px-4 flex-shrink-0">
                <button class="w-10 text-left text-black font-bold" onclick="resetForm()"><i class="fas fa-arrow-left hidden" id="back-btn"></i></button>
                <h1 class="font-bold text-[16px]">새 게시물 만들기</h1>
                <button class="text-blue-500 font-bold hover:text-[#00376b] w-10 text-right opacity-0 pointer-events-none transition-opacity" id="share-btn" onclick="submitPost()">공유</button>
            </div>

            <!-- 내용 영역 -->
            <div class="flex-1 flex flex-col md:flex-row h-full overflow-hidden relative">
                
                <!-- 스텝 1: 이미지 업로드 (기본 화면) -->
                <div id="step-1" class="absolute inset-0 flex flex-col items-center justify-center bg-white z-10 transition-transform duration-300">
                    <i class="far fa-images text-6xl text-[#262626] mb-4"></i>
                    <h2 class="text-xl font-light mb-6">사진과 동영상을 여기에 끌어다 놓으세요</h2>
                    <button class="bg-[#0095f6] hover:bg-[#1877f2] text-white font-bold py-1.5 px-4 rounded-lg transition" onclick="document.getElementById('file-input').click()">컴퓨터에서 선택</button>
                    <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                </div>

                <!-- 스텝 2: 캡션 입력 및 미리보기 (업로드 후 화면) -->
                <div id="step-2" class="w-full h-full flex flex-col md:flex-row translate-x-full transition-transform duration-300 bg-white">
                    <!-- 왼쪽 이미지 미리보기 -->
                    <div class="w-full md:w-[60%] h-[50%] md:h-full bg-black flex items-center justify-center border-r border-gray-200">
                        <img id="image-preview" src="" class="max-w-full max-h-full object-contain">
                    </div>
                    <!-- 오른쪽 캡션 입력란 -->
                    <div class="w-full md:w-[40%] h-[50%] md:h-full flex flex-col bg-white">
                        <div class="p-4 flex items-center gap-3 border-b border-gray-100">
                            <img id="create-user-pic" src="이미지/효빈시_로고.webp" class="w-8 h-8 rounded-full border border-gray-200 object-cover">
                            <span id="create-username" class="font-bold text-[14px]">hyobin_city_official</span>
                        </div>
                        <div class="flex-1 p-4">
                            <textarea id="caption-input" class="w-full h-full outline-none resize-none text-[15px] placeholder-gray-400 bg-transparent" placeholder="문구를 입력하세요..."></textarea>
                        </div>
                        <div class="p-4 border-t border-gray-100 flex justify-between text-gray-400 text-xl">
                            <i class="far fa-smile cursor-pointer hover:text-gray-600"></i>
                            <span class="text-xs">0/2,200</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        let selectedImageDataUrl = null;

        // 🌟 IndexedDB 설정 추가 (대용량 데이터 저장용)
        const DB_NAME = 'IgCloneDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'ig_activities';

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (event) => reject('IndexedDB error');
                request.onsuccess = (event) => resolve(event.target.result);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
            });
        }

        async function saveActivity(activity) {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.add(activity);
                request.onsuccess = () => resolve();
                request.onerror = (e) => reject(e.target.error);
            });
        }

        // 토스트 알림 함수
        function showToast(message, callback) {
            const toast = document.getElementById('toast-message');
            document.getElementById('toast-text').innerText = message;
            toast.classList.remove('opacity-0', 'translate-y-5');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-5');
                if (callback) callback();
            }, 2000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const storedUser = localStorage.getItem('ig_user_account');
            const userData = storedUser ? JSON.parse(storedUser) : { username: 'hyobin_city_official', profilePic: '이미지/효빈시_로고.webp' };
            
            document.getElementById('sidebar-profile-pic').src = userData.profilePic;
            document.getElementById('create-user-pic').src = userData.profilePic;
            document.getElementById('create-username').innerText = userData.username;
        });

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedImageDataUrl = e.target.result;
                document.getElementById('image-preview').src = selectedImageDataUrl;
                
                // 화면 전환 (Step 1 -> Step 2)
                document.getElementById('step-1').style.transform = 'translateX(-100%)';
                document.getElementById('step-2').style.transform = 'translateX(0)';
                
                // UI 버튼 활성화
                document.getElementById('back-btn').classList.remove('hidden');
                document.getElementById('share-btn').classList.remove('opacity-0', 'pointer-events-none');
            };
            reader.readAsDataURL(file);
        }

        function resetForm() {
            selectedImageDataUrl = null;
            document.getElementById('file-input').value = '';
            document.getElementById('caption-input').value = '';
            
            // 화면 전환 (Step 2 -> Step 1)
            document.getElementById('step-1').style.transform = 'translateX(0)';
            document.getElementById('step-2').style.transform = 'translateX(100%)';
            
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('share-btn').classList.add('opacity-0', 'pointer-events-none');
        }

        async function submitPost() {
            if (!selectedImageDataUrl) return;

            const content = document.getElementById('caption-input').value;
            
            // IndexedDB에 저장 (로컬스토리지 5MB 용량 제한 완벽 해결)
            const newPost = {
                id: Date.now(),
                type: 'post',
                image: selectedImageDataUrl,
                content: content,
                timestamp: '방금 전'
            };

            try {
                await saveActivity(newPost);
                
                // 업로드 완료 후 토스트를 띄우고 홈 화면으로 이동
                showToast("게시물이 성공적으로 공유되었습니다!", () => {
                    window.location.href = '효빈광역시청 인스타그램.html';
                });
                
            } catch (error) {
                console.error("게시물 저장 실패:", error);
                showToast("게시물 저장에 실패했습니다. 용량을 확인해 주세요.");
            }
        }
    </script>
    <script>
    // 페이지 로드 시 IndexedDB에서 활성 유저 데이터 가져와서 DOM에 적용
    async function applyUserData() {
        // 로그인 페이지에서 만든 getActiveUser() 함수를 호출
        const userData = await getActiveUser(); 
        
        // 로그인 안 되어 있으면 아무것도 안 함
        if (!userData) return; 

        // 1. 사이드바 프로필 사진 변경
        const sidebarProfileImgs = document.querySelectorAll('nav img[src*="이미지/효빈시_로고.webp"]');
        sidebarProfileImgs.forEach(img => {
            if (userData.profilePic) img.src = userData.profilePic;
        });

        // 2. 만들기(모달) 프로필 변경
        const createProfileImg = document.querySelector('#step-2 img[src*="이미지/효빈시_로고.webp"]');
        const createProfileName = document.querySelector('#step-2 span.font-bold');
        if (createProfileImg && userData.profilePic) createProfileImg.src = userData.profilePic;
        if (createProfileName) createProfileName.innerText = userData.username;

        // 3. 댓글 입력창 프로필 변경
        const commentImgs = document.querySelectorAll('input[placeholder="댓글 달기..."]');
        commentImgs.forEach(input => {
            const parent = input.parentElement;
            const img = parent.querySelector('img');
            if(img && userData.profilePic) img.src = userData.profilePic;
        });
        
        // 4. 전역 변수에 내 정보 저장 (댓글 작성 등에서 사용)
        window.myInstagramUser = userData;
    }

    // 문서 로드 완료 후 실행
    document.addEventListener('DOMContentLoaded', async () => {
        await applyUserData();
    });

    // 댓글 작성 함수 덮어쓰기 (로그인된 계정 정보 사용)
    if (typeof renderIgComment !== 'undefined') {
        window.renderIgComment = function(text, targetAreaId) {
            const targetArea = document.getElementById(targetAreaId);
            const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            // 로그인 데이터가 없으면 게스트 모드
            const me = window.myInstagramUser || { username: 'guest', profilePic: 'https://via.placeholder.com/32' };
            const myPic = me.profilePic ? me.profilePic : 'https://via.placeholder.com/32';
            
            const commentHTML = `
                <div class="flex gap-3 items-start mt-3 animate-fade-in">
                    <img src="${myPic}" class="w-8 h-8 rounded-full mt-1 cursor-pointer border border-gray-200 object-cover">
                    <div class="flex-1">
                        <span class="font-bold cursor-pointer hover:underline text-[14px]">${me.username}</span>
                        <span class="text-[14px] break-all">${safeText}</span>
                        <div class="flex gap-3 text-[11px] text-gray-500 font-bold mt-1">
                            <span>방금 전</span>
                            <span class="cursor-pointer" onclick="document.getElementById('${targetAreaId.replace('area', 'input')}').focus()">답글 달기</span>
                        </div>
                    </div>
                    <button class="text-xs pt-2 pr-2 text-gray-400 hover:text-gray-600" onclick="this.querySelector('i').classList.toggle('fas'); this.querySelector('i').classList.toggle('text-red-500'); this.querySelector('i').classList.toggle('far');"><i class="far fa-heart"></i></button>
                </div>
            `;
            targetArea.insertAdjacentHTML('beforeend', commentHTML);
            const scrollContainer = targetArea.parentElement;
            scrollContainer.scrollTop = scrollContainer.scrollHeight;
        };
    }
</script>

</body>
