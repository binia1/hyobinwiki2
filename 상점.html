<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAILUMINAE SMILE FESTIVAL - 상점</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Orbitron:wght@700&display=swap');

        :root {
            --color-active: #0077DD;
            --color-festival: #C455F6;
            --color-accent: #FF4F91;
            --header-height: 80px;
            --bg-dark: #050510;
        }

        body {
            margin: 0; overflow: hidden; background-color: var(--bg-dark);
            font-family: 'Noto Sans KR', sans-serif; display: flex;
            justify-content: center; align-items: center; height: 100vh;
            color: white; user-select: none;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(196, 85, 246, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 119, 221, 0.08), transparent 25%);
        }

        #app-container {
            position: relative; width: 1280px; height: 720px;
            background: linear-gradient(135deg, rgba(10,11,26,0.95) 0%, rgba(15,15,30,0.95) 100%);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255,255,255,0.05);
            overflow: hidden; transform-origin: center; display: flex; flex-direction: column;
        }

        .top-bar {
            height: var(--header-height);
            background: linear-gradient(to bottom, rgba(10, 11, 26, 0.9), rgba(10, 11, 26, 0.4));
            backdrop-filter: blur(12px); border-bottom: 2px solid var(--color-festival);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; z-index: 20; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .shop-wrapper {
            display: flex; flex: 1; width: 100%; height: calc(100% - var(--header-height));
            position: relative; overflow: hidden;
        }

        .character-pane {
            width: 38%; min-width: 450px; position: relative; display: flex;
            align-items: flex-end; justify-content: center; pointer-events: none; z-index: 10;
        }

        .character-pane img {
            max-height: 95%; max-width: 100%; object-fit: contain; object-position: bottom;
            filter: drop-shadow(0 0 25px rgba(0,0,0,0.8)) drop-shadow(0 0 10px rgba(196,85,246,0.4));
            animation: breathe 5s infinite ease-in-out; pointer-events: auto; cursor: pointer;
            transition: transform 0.2s, filter 0.3s;
        }
        .character-pane img:active { transform: scale(0.97); }

        @keyframes breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .speech-bubble {
            position: absolute; top: 25%; right: -20px; background: rgba(255, 255, 255, 0.95);
            color: #111; padding: 15px 25px; border-radius: 20px 20px 20px 0; font-weight: 800;
            font-size: 16px; line-height: 1.4; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 15; opacity: 0; transform: translateY(15px); transition: all 0.3s;
            pointer-events: none; width: 280px; word-wrap: break-word; border-left: 5px solid var(--color-festival);
        }
        .speech-bubble.show { opacity: 1; transform: translateY(0); }

        .shop-layout {
            flex: 1; display: flex; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(15px);
            border-left: 2px solid rgba(255,255,255,0.1); border-top-left-radius: 40px;
            margin: 20px 20px 0 0; box-shadow: -10px 0 40px rgba(0,0,0,0.7); overflow: hidden;
            position: relative; z-index: 5;
        }

        .sidebar {
            width: 220px; background: rgba(0, 0, 0, 0.3); border-right: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; padding: 30px 0; gap: 15px; z-index: 10;
        }

        .tab-btn {
            padding: 15px 25px; font-size: 16px; font-weight: 700; color: rgba(255,255,255,0.5);
            text-align: left; cursor: pointer; transition: all 0.3s ease; border-left: 4px solid transparent;
            display: flex; align-items: center; gap: 12px;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.05); color: white; }
        .tab-btn.active {
            background: linear-gradient(90deg, rgba(196,85,246,0.2) 0%, transparent 100%);
            color: white; border-left-color: var(--color-festival); text-shadow: 0 0 10px rgba(196,85,246,0.5);
        }

        .content-area {
            flex: 1; padding: 30px 40px; overflow-y: auto; position: relative;
        }
        .content-area::-webkit-scrollbar { width: 8px; }
        .content-area::-webkit-scrollbar-thumb { background: rgba(196,85,246,0.5); border-radius: 4px; }

        .banner {
            width: 100%; height: 160px; border-radius: 16px; background: linear-gradient(45deg, #2a0845 0%, #6441A5 100%);
            margin-bottom: 25px; display: flex; align-items: center; padding: 0 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.2);
        }

        .item-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; padding-bottom: 40px;
        }

        .item-card {
            background: rgba(20, 22, 45, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            padding: 20px; display: flex; flex-direction: column; transition: all 0.3s; position: relative; overflow: hidden;
        }
        .item-card:hover {
            transform: translateY(-5px); background: rgba(40, 45, 80, 0.9);
            border-color: rgba(196,85,246,0.5); box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px rgba(196,85,246,0.2);
        }
        .item-card.rare { border: 1px solid rgba(255, 204, 17, 0.5); }
        .item-card.epic { border: 1px solid rgba(255, 79, 145, 0.5); }

        .item-icon {
            width: 70px; height: 70px; background: rgba(0,0,0,0.6); border-radius: 12px;
            display: flex; justify-content: center; align-items: center; font-size: 35px;
            margin: 0 auto 15px auto; border: 1px solid rgba(255,255,255,0.05); box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .buy-btn {
            margin-top: auto; width: 100%; padding: 10px; border-radius: 8px; font-weight: 900;
            display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s;
        }
        .buy-btn.gem { background: #1a365d; color: #63b3ed; border: 1px solid #2b6cb0; }
        .buy-btn.gem:hover { background: #2b6cb0; color: white; box-shadow: 0 0 15px rgba(66, 153, 225, 0.6); }
        .buy-btn.coin { background: #4a3f12; color: #f6e05e; border: 1px solid #975a16; }
        .buy-btn.coin:hover { background: #975a16; color: white; box-shadow: 0 0 15px rgba(236, 201, 75, 0.6); }

        .custom-modal {
            position: absolute; inset: 0; background: rgba(5,5,16,0.95); backdrop-filter: blur(15px);
            z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .custom-modal.show { opacity: 1; pointer-events: auto; }

        .toast-container {
            position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9); border: 2px solid var(--color-festival);
            padding: 15px 35px; border-radius: 50px; text-align: center; font-size: 18px; font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 300; opacity: 0; pointer-events: none; transition: all 0.3s;
        }
        .toast-container.show { opacity: 1; transform: translate(-50%, 20px); pointer-events: auto; }

        /* 가챠 결과 카드 (개별 및 10연차 뷰 지원) */
        .gacha-card-mini {
            width: 140px; height: 200px; background: linear-gradient(to bottom, #2d3748, #1a202c);
            border-radius: 12px; border: 2px solid #4a5568; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end; padding: 10px; position: relative; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); transform: scale(0); animation: popIn 0.4s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 100% { transform: scale(1); } }
        
        .gacha-card-mini img { position: absolute; bottom: 40px; max-height: 140px; object-fit: contain; z-index: 5; }
        
        .rarity-R { border-color: #A0AEC0; } 
        .rarity-SR { border-color: #F6E05E; background: linear-gradient(to bottom, #744210, #1a202c); box-shadow: 0 0 10px rgba(246, 224, 94, 0.5); }
        .rarity-SSR { border-color: #D53F8C; background: linear-gradient(to bottom, #702459, #1a202c); box-shadow: 0 0 15px rgba(213, 63, 140, 0.6); }
        .rarity-UR { border-color: #38B2AC; background: linear-gradient(to bottom, #234E52, #1a202c); box-shadow: 0 0 20px rgba(56, 178, 172, 0.8); }
        .rarity-UUR { border-color: #FFFFFF; background: linear-gradient(to bottom, #FFFFFF, #ECC94B); box-shadow: 0 0 30px rgba(255, 255, 255, 1); animation: popIn 0.4s forwards, flash 1s infinite alternate; }
        
        @keyframes flash { 0% { box-shadow: 0 0 20px #fff; } 100% { box-shadow: 0 0 40px #FFD700; } }

        .gacha-badge { position: absolute; top: -5px; right: -5px; padding: 3px 8px; border-radius: 8px; font-size: 10px; font-weight: 900; z-index: 20; transform: rotate(15deg); }
        .badge-new { background: #EE0022; color: white; border: 2px solid white; }
        .badge-dup { background: #4A5568; color: #E2E8F0; border: 2px solid #A0AEC0; }
        
        .qty-btn { width: 30px; height: 30px; background: rgba(255,255,255,0.1); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .qty-btn:hover { background: var(--color-festival); }
        .qty-input { width: 50px; height: 30px; background: black; border: 1px solid gray; color: white; text-align: center; border-radius: 6px; font-weight: bold; }
    
    
</style>

    <!-- 효빈위키 폰트 CSS -->
    <link rel="stylesheet" href="wiki_font_standard.css">
</head>
<body>

<div id="app-container">
    <div class="top-bar">
        <div class="flex items-center gap-4">
            <button class="w-12 h-12 bg-gray-800 hover:bg-gray-700 border border-gray-500 rounded-full flex items-center justify-center text-xl transition shadow-lg" onclick="goToLobby()" title="로비로 돌아가기">◀</button>
            <div>
                <div class="text-xs text-yellow-300 font-bold tracking-widest uppercase">SHOP & GACHA</div>
                <div class="font-black text-2xl font-['Montserrat'] leading-tight tracking-tight text-white">RAILUMINAE STORE</div>
            </div>
        </div>
        
        <div class="flex items-center gap-5">
            <div class="flex items-center bg-black/60 border border-gray-500 rounded-full px-5 py-2 shadow-inner">
                <span class="text-xl">🪙</span><span id="player-coin" class="font-bold font-['Orbitron'] ml-3 text-lg text-gray-200">0</span>
            </div>
            <div class="flex items-center bg-black/60 border border-blue-500 rounded-full px-5 py-2 shadow-[0_0_10px_rgba(0,119,221,0.3)]">
                <span class="text-xl">💎</span><span id="player-gem" class="font-bold font-['Orbitron'] ml-3 text-lg text-blue-300">0</span>
            </div>
        </div>
    </div>

    <div class="shop-wrapper">
        <!-- 왼쪽 캐릭터 패널 -->
        <div class="character-pane">
            <img id="shop-character-img" src="이미지/고나미.webp" alt="상점 마스코트">
            <div id="shop-speech-bubble" class="speech-bubble">어서오십시오. 무엇을 찾으십니까?</div>
        </div>

        <!-- 오른쪽 카테고리 탭 및 상품 목록 -->
        <div class="shop-layout">
            <div class="sidebar">
                <div class="tab-btn active" onclick="switchTab('gacha', this)"><span class="text-2xl">✨</span> 픽업 가챠</div>
                <div class="tab-btn" onclick="switchTab('consumables', this)"><span class="text-2xl">⚡</span> 에너지 회복</div>
                <div class="tab-btn" onclick="switchTab('gifts', this)"><span class="text-2xl">🎁</span> 호감도 선물</div>
                <div class="tab-btn" onclick="switchTab('equip', this)"><span class="text-2xl">🔧</span> 부서별 장비</div>
            </div>

            <div class="content-area" id="content-area">
                <!-- JS에서 동적 렌더링 -->
            </div>
        </div>
    </div>

    <div id="modal-confirm" class="custom-modal">
        <div class="bg-gray-900/95 p-8 rounded-2xl border border-gray-600 shadow-2xl backdrop-blur-md w-[480px] text-center">
            <div id="confirm-icon" class="text-6xl mb-4 drop-shadow-lg">🎁</div>
            <h2 id="confirm-title" class="text-2xl font-black mb-2 text-white break-keep">아이템 이름</h2>
            <p id="confirm-desc" class="text-gray-400 mb-6 text-sm leading-relaxed break-keep h-14 overflow-hidden">아이템 설명이 여기에 표시됩니다.</p>
            
            <div class="bg-black/60 rounded-xl p-5 mb-6 border border-gray-700">
                <div class="flex justify-between items-center mb-4 pb-4 border-b border-gray-700" id="quantity-selector-area">
                    <span class="text-gray-300 font-bold">구매 수량</span>
                    <div class="flex items-center gap-2">
                        <button class="qty-btn" onclick="changeQty(-10)">-10</button>
                        <button class="qty-btn" onclick="changeQty(-1)">-</button>
                        <input type="number" id="input-qty" class="qty-input" value="1" min="1" max="999" onchange="updateTotalPrice()">
                        <button class="qty-btn" onclick="changeQty(1)">+</button>
                        <button class="qty-btn" onclick="changeQty(10)">+10</button>
                    </div>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-300 font-bold">총 결제 금액</span>
                    <span id="confirm-total-price" class="text-3xl font-black font-['Orbitron'] text-yellow-400">💎 300</span>
                </div>
            </div>

            <div class="flex gap-4">
                <button class="flex-1 py-4 bg-gray-700 hover:bg-gray-600 rounded-xl font-bold text-white transition border border-gray-500" onclick="closeModal('modal-confirm')">취소</button>
                <button id="btn-process-buy" class="flex-1 py-4 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold text-white transition border border-blue-400 shadow-[0_0_15px_rgba(37,99,235,0.5)]">구매 확정</button>
            </div>
        </div>
    </div>

    <div id="modal-gacha" class="custom-modal" style="background: rgba(0,0,0,0.98);">
        <div class="text-center w-full max-w-5xl">
            <h2 class="text-5xl font-black mb-2 text-yellow-300 drop-shadow-[0_0_20px_rgba(255,255,0,0.8)] tracking-widest">RECRUIT RESULT</h2>
            <p class="text-gray-300 text-lg mb-8">새로운 카드와 인연을 획득했습니다!</p>
            
            <div id="gacha-results-grid" class="flex flex-wrap justify-center gap-4 mb-10 min-h-[420px]">
                <!-- JS에서 카드 1장 ~ 10장 렌더링 -->
            </div>

            <button class="px-16 py-4 bg-white hover:bg-gray-300 text-black rounded-full font-black text-2xl transition shadow-[0_0_25px_rgba(255,255,255,0.8)]" onclick="closeModal('modal-gacha')">확인 (로비 연동됨)</button>
        </div>
    </div>

    <div id="toast-container" class="toast-container">메시지</div>
</div>

<script>
    // 반응형 대응
    const appContainer = document.getElementById('app-container');
    function resize() {
        const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        appContainer.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resize);
    resize();

    // 토스트 알림 (큐 시스템 도입)
    const toast = document.getElementById('toast-container');
    let toastQueue = [];
    let isToastShowing = false;

    function showToast(message, isError = false) {
        toastQueue.push({ msg: message, err: isError });
        if(!isToastShowing) processToastQueue();
    }

    function processToastQueue() {
        if(toastQueue.length === 0) { isToastShowing = false; return; }
        isToastShowing = true;
        const current = toastQueue.shift();
        
        toast.innerText = current.msg;
        toast.style.borderColor = current.err ? '#EF4444' : 'var(--color-festival)';
        toast.classList.add('show');
        
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(processToastQueue, 400); // 간격 두고 다음 알림
        }, 2200);
    }

    function goToLobby() {
        showToast('로비로 이동합니다...', false);
        setTimeout(() => { location.href = '레일루미네_스마일_페스티벌_게임.html'; }, 600);
    }

    const STORAGE_KEY = 'railumina_save_data_v7_final'; 
    let gameState = {
        playerName: '신입매니저', level: 1, exp: 0, maxExp: 100,
        coin: 0, gem: 0, activeCharId: '1호선',
        ownedChars: ['1호선'], // 캐릭터 잠금 해제용
        ownedCards: [], // 114종 가챠 카드 수집용
        inventory: {}
    };

    function loadGame() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try { 
                const parsed = JSON.parse(saved);
                gameState = { 
                    ...gameState, 
                    ...parsed,
                    inventory: parsed.inventory || gameState.inventory,
                    ownedChars: parsed.ownedChars || ['1호선'],
                    ownedCards: parsed.ownedCards || []
                }; 
            } 
            catch(e) { console.error("Save file corrupted"); }
        }
        updateCurrencyUI();
        initShopCharacter();
    }

    function saveGame() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
        updateCurrencyUI();
    }

    function updateCurrencyUI() {
        document.getElementById('player-coin').innerText = gameState.coin.toLocaleString();
        document.getElementById('player-gem').innerText = gameState.gem.toLocaleString();
    }

    // 상점용 대사 및 캐릭터 이미지 설정
    const charFiles = {
        '1호선': '고나미.webp', '2호선': '하루빈.webp', '3호선': '박라미.webp', '4호선': '다로나.webp', 
        '5호선': '미소하.webp', '6호선': '라세나.webp', '7호선': '임세정.webp', '7호선(세하)': '임세하.webp', 
        '8호선': '유리아.webp', '빈효선': '전노아.webp', '창전선': '심세이.webp', '빈주1호선': '박빛나.webp', 
        '빈주2호선': '김소빈.webp', '덕주1호선': '이덕희.webp', '효빈시청': '한바다_전신.webp'
    };

    const charShopLines = {
        '1호선': ["보급품 신청서 작성하셨습니까?", "공금 횡령은 규정 위반입니다.", "예산 내에서 합리적인 소비를 권장합니다."],
        '2호선': ["매니저님~ 제 간식도 하나 사주시면 안 돼요?", "월급 털어서 플렉스 할 시간~!", "아바라 벤티 기프티콘은 없나?"],
        '3호선': ["여기 인스타 감성템은 없네요. 빵은요?", "영수증은 버리지 말고 주세요! 다꾸하게요.", "돈 아껴서 카메라 렌즈 사야 하는데..."],
        '4호선': ["구매 리스트 엑셀로 정리해 드릴까요?", "재고 파악 완료. 원하시는 품목을 말씀하십시오.", "충동구매는 재무 안정성에 치명적입니다."],
        '5호선': ["예산팀 명치 부수기 전에 합리적으로 소비하세요~", "매니저님 용돈 통계 분석해 드릴까요?", "사각지대 없는 완벽한 보급품 지원이네요."],
        '6호선': ["음, 굿즈는 안 파나요...? 아, 아닙니다!", "빨리 사고 가시죠. 제 스케줄 꼬인다고요.", "효율적인 동선으로 구매 리스트를 클리어하죠."],
        '7호선': ["현장에서 필요한 장비만 쏙쏙 골라 가라고.", "내 동생 밥 먹일 돈 남겨두고 써라?", "필요한 거 있으면 말해! 든든하게 챙겨줄 테니까."],

        currentSelectedItem = item;
        selectedQuantity = 1;

        document.getElementById('confirm-icon').innerText = item.icon;

        document.getElementById('confirm-desc').innerText = item.desc;
        
        // 가챠는 수량 조절 숨김 (정해진 카운트대로)
        if(category === 'gacha') {
            document.getElementById('quantity-selector-area').style.display = 'none';
            selectedQuantity = 1;

        }

        updateTotalPrice();
        document.getElementById('modal-confirm').classList.add('show');

            if(isNaN(val) || val < 1) val = 1;
            selectedQuantity = val;
        }
        
        const total = currentSelectedItem.price * selectedQuantity;
        const priceIcon = currentSelectedItem.currency === 'gem' ? '💎' : '🪙';
        document.getElementById('confirm-total-price').innerText = `${priceIcon} ${total.toLocaleString()}`;
    }

    window.closeModal = function(id) {
        document.getElementById(id).classList.remove('show');
    }

    document.getElementById('btn-process-buy').addEventListener('click', () => {
        if(!currentSelectedItem) return;
        const item = currentSelectedItem;
        const totalPrice = item.price * selectedQuantity;
        
        if (item.currency === 'gem') {
            if (gameState.gem < totalPrice) {
                showToast("보석(💎)이 부족합니다!", true);
                closeModal('modal-confirm');
                return;
            }
            gameState.gem -= totalPrice;
        } else {
            if (gameState.coin < totalPrice) {
                showToast("코인(🪙)이 부족합니다!", true);
                closeModal('modal-confirm');
                return;
            }
            gameState.coin -= totalPrice;
        }

        // 인벤토리 추가
        if (item.type !== 'gacha') {
            if (!gameState.inventory) gameState.inventory = {};
            gameState.inventory[item.name] = (gameState.inventory[item.name] || 0) + selectedQuantity;
        }

        saveGame();
        closeModal('modal-confirm');

        if (item.type === 'gacha') {
            executeGacha(item.count, item.id === 'g3'); // g3는 픽업
        } else {
            showToast(`[${item.name}] ${selectedQuantity}개 구매 완료! (가방 확인)`);
        }
    });

    function executeGacha(count, isPickup) {
        setTimeout(() => {
            const grid = document.getElementById('gacha-results-grid');
            grid.innerHTML = '';
            
            // 확률: UUR 0.2%, UR 1.8%, SSR 8%, SR 30%, R 60%
            // 픽업일 경우 SSR 이상 확률 보정
            
            for(let i=0; i<count; i++) {
                let rVal = Math.random() * 100;
                let drawnRarity = 'R';
                
                if(isPickup) {
                    if(rVal < 0.5) drawnRarity = 'UUR';
                    else if(rVal < 3) drawnRarity = 'UR';
                    else if(rVal < 15) drawnRarity = 'SSR';
                    else if(rVal < 45) drawnRarity = 'SR';
                } else {
                    if(rVal < 0.2) drawnRarity = 'UUR';
                    else if(rVal < 2.0) drawnRarity = 'UR';
                    else if(rVal < 10.0) drawnRarity = 'SSR';
                    else if(rVal < 40.0) drawnRarity = 'SR';
                }
                
                // 특별 영입 10연차 마지막 보정 (SR 확정)
                if (count >= 10 && i === 9 && drawnRarity === 'R') drawnRarity = 'SR';

                // 해당 레어도 풀에서 카드 추출
                const subPool = cardPool.filter(c => c.rarity === drawnRarity);
                const drawnCard = subPool[Math.floor(Math.random() * subPool.length)];

                // 소유 여부 판별 (카드 컬렉션)
                let isDup = gameState.ownedCards.includes(drawnCard.cardId);
                if(!isDup) {
                    gameState.ownedCards.push(drawnCard.cardId);
                    // 캐릭터 해금 연동 로직: 그룹카드가 아니고, 해당 캐릭터가 없으면 로비에 해금
                    if(drawnCard.charId !== 'group' && !gameState.ownedChars.includes(drawnCard.charId)) {
                        gameState.ownedChars.push(drawnCard.charId);
                    }
                } else {
                    // 중복 페이백
                    if(drawnRarity==='UUR') gameState.gem += 1000;
                    else if(drawnRarity==='UR') gameState.gem += 500;
                    else if(drawnRarity==='SSR') gameState.gem += 300;
                    else if(drawnRarity==='SR') gameState.gem += 100;
                    else gameState.coin += 500;
                }

                // 렌더링
                const cardEl = document.createElement('div');
                cardEl.className = `gacha-card-mini rarity-${drawnRarity}`;
                cardEl.style.animationDelay = `${i * 0.1}s`;
                
                const badgeHtml = isDup 
                    ? `<div class="gacha-badge badge-dup">DUP</div>` 
                    : `<div class="gacha-badge badge-new">NEW</div>`;
                
                let rareTitleColor = "text-white";
                if(drawnRarity==='UUR') rareTitleColor = "text-yellow-300 font-black";
                if(drawnRarity==='UR') rareTitleColor = "text-cyan-300 font-bold";

                cardEl.innerHTML = `
                    ${badgeHtml}
                    <div class="text-[10px] font-bold text-gray-400 mb-auto">${drawnRarity}</div>
                    <img src="이미지/${drawnCard.file}">
                    <div class="text-[11px] text-center mt-2 ${rareTitleColor} leading-tight break-keep z-10 bg-black/60 w-full p-1 rounded">${drawnCard.name}</div>
                `;
                grid.appendChild(cardEl);
            }

            saveGame();
            document.getElementById('modal-gacha').classList.add('show');
        }, 400);
    }

    // Initialize Game & Shop UI
    loadGame();
    switchTab('gacha');

</script>
</body>
</html>
