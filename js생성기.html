<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지역 시설 안내표 생성기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Toast 애니메이션 */
    @keyframes slideInUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    .toast-enter {
      animation: slideInUp 0.3s ease-out forwards;
    }
    .toast-exit {
      animation: fadeOut 0.5s ease-out forwards;
    }
    
    /* 미리보기 안의 텍스트가 줄바꿈 없이 길어지는 것을 방지 */
    .preview-container * {
      word-break: keep-all;
    }
  
        /* 일괄 적용된 SVG 수직 정렬 CSS */
        .svg-logo { width: 38px; height: 38px; object-fit: contain; flex-shrink: 0; }
        .svg-logo-sm { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
        .svg-logo-inline { height: 1.5rem; vertical-align: middle; margin-right: 5px; }
        .flex-center-inline { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; }
        .flex-center { display: flex; align-items: center; justify-content: center; gap: 6px; }
        .flex-start { display: flex; align-items: center; justify-content: flex-start; gap: 6px; }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

  <!-- 헤더 -->
  <header class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center z-10">

  </header>

          <button onclick="savePreset()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow transition-colors whitespace-nowrap">저장</button>
        </div>
        <div class="flex gap-2 items-center bg-gray-100 p-2 rounded border border-gray-200">
          <select id="preset-select" class="flex-1 border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500 bg-white">
            <option value="">저장된 데이터가 없습니다.</option>
          </select>
          <button onclick="loadPreset()" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-3 rounded shadow transition-colors whitespace-nowrap">불러오기</button>
          <button onclick="deletePreset()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-3 rounded shadow transition-colors whitespace-nowrap">삭제</button>
        </div>
      </section>

      <!-- 지역 및 테마 설정 -->
      <section class="bg-gray-50 p-4 rounded-lg border border-gray-200">
        <h2 class="text-lg font-semibold mb-4 text-gray-700 border-b pb-2">1. 지역 및 테마 설정</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">광역자치단체</label>
            <select id="prov-select" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500 bg-white" onchange="updateDistricts(); updateThemePreview(); generateOutput();">
              <!-- JS에서 옵션 채움 -->
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">기초자치단체</label>
            <select id="dist-select" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500 bg-white" onchange="updateThemePreview(); generateOutput();">
              <!-- JS에서 옵션 채움 -->
            </select>
          </div>
        </div>
        
        <div class="mt-4 flex items-center p-3 bg-white rounded border border-gray-200 shadow-sm">
          <div class="text-sm font-medium text-gray-600 mr-4">선택된 테마 미리보기:</div>

          <img id="theme-logo-preview" src="" alt="로고" class="h-8 object-contain">
        </div>
      </section>

        </div>
      </section>
    </div>

              복사하기

        </div>

    </div>

      { id: 'cat-transport', name: '교통시설', checked: true, content: "효빈종합버스터미널, 효빈공영차고지", isLogoGroup: false },
      { id: 'cat-hotel', name: '숙박', checked: true, content: "효빈 하라오호텔, 니지벨리 호텔", isLogoGroup: false },
      { id: 'cat-religion', name: '종교시설', checked: true, content: "천왕사, 원각사", isLogoGroup: false },
      { id: 'cat-beach', name: '해수욕장', checked: true, content: "토모리해수욕장", isLogoGroup: false },
      { id: 'cat-library', name: '도서관', checked: true, content: "효빈시청한바다도서관, 중수도서관", isLogoGroup: false },
      { id: 'cat-port', name: '선착장', checked: true, content: "고송선착장", isLogoGroup: false },
      { id: 'cat-bridge', name: '교량', checked: true, content: "[팔천강] 등중교, 중수대교\n[기타하천] 고송교, 소홍교", isLogoGroup: false },
      { id: 'cat-broadcast', name: '방송시설', checked: true, content: "효빈방송", isLogoGroup: false },
      { id: 'cat-skyscraper', name: '마천루', checked: true, content: "고송토모리빌딩", isLogoGroup: false }
    ];

    /* 유틸: Toast 메시지 띄우기 */
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'bg-gray-800 text-white px-4 py-2 rounded shadow-lg text-sm toast-enter pointer-events-auto';
      toast.innerText = message;
      
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.replace('toast-enter', 'toast-exit');
        toast.addEventListener('animationend', () => {
          toast.remove();
        });
      }, 3000);
    }

    /* 저장소(LocalStorage) 관리 */
    const PRESET_KEY = 'hyobin_facility_presets';

    function getSavedPresets() {
      const saved = localStorage.getItem(PRESET_KEY);
      return saved ? JSON.parse(saved) : {};
    }

    function updatePresetDropdown() {
      const presets = getSavedPresets();
      const select = document.getElementById('preset-select');
      const names = Object.keys(presets);
      
      if (names.length === 0) {
        select.innerHTML = '<option value="">저장된 데이터가 없습니다.</option>';
      } else {
        select.innerHTML = '<option value="">불러올 프리셋 선택...</option>' + 
          names.map(name => `<option value="${name}">${name}</option>`).join('');
      }
    }

    // 현재 텍스트상자 상태를 categoryTemplates 배열에 동기화
    function syncCategoriesState() {
      categoryTemplates.forEach(cat => {
        const checkbox = document.getElementById(cat.id);
        const textarea = document.getElementById(`${cat.id}-content`);
        if(checkbox) cat.checked = checkbox.checked;
        if(textarea) cat.content = textarea.value;
      });
    }

    function savePreset() {
      const saveName = document.getElementById('save-name').value.trim();
      if (!saveName) {
        showToast('저장할 이름을 입력해주세요.');
        return;
      }

      syncCategoriesState();

      const presetData = {
        prov: document.getElementById('prov-select').value,
        dist: document.getElementById('dist-select').value,
        categories: JSON.parse(JSON.stringify(categoryTemplates)) // 깊은 복사
      };

      const presets = getSavedPresets();
      presets[saveName] = presetData;
      localStorage.setItem(PRESET_KEY, JSON.stringify(presets));

      document.getElementById('save-name').value = '';
      updatePresetDropdown();
      showToast(`'${saveName}'(으)로 저장되었습니다!`);
    }

    function loadPreset() {
      const selectName = document.getElementById('preset-select').value;
      if (!selectName) {
        showToast('불러올 항목을 선택해주세요.');
        return;
      }

      const presets = getSavedPresets();
      const presetData = presets[selectName];

      if (presetData) {
        document.getElementById('prov-select').value = presetData.prov;
        updateDistricts();
        document.getElementById('dist-select').value = presetData.dist;
        updateThemePreview();

        categoryTemplates.length = 0; 
        presetData.categories.forEach(cat => categoryTemplates.push(cat));
        
        initCategories();
        generateOutput();
        showToast(`'${selectName}'(을)를 성공적으로 불러왔습니다!`);
      }
    }

    function deletePreset() {
      const selectName = document.getElementById('preset-select').value;
      if (!selectName) {
        showToast('삭제할 항목을 선택해주세요.');
        return;
      }

      const presets = getSavedPresets();
      delete presets[selectName];
      localStorage.setItem(PRESET_KEY, JSON.stringify(presets));
      
      updatePresetDropdown();
      showToast(`'${selectName}' 데이터가 삭제되었습니다.`);
    }

    /* 초기화 및 UI 업데이트 */
    function initSelects() {
      const provSelect = document.getElementById('prov-select');
      const provs = [...new Set(regionData.map(item => item.prov))];
      
      provs.forEach(prov => {
        const option = document.createElement('option');
        option.value = prov;
        option.textContent = prov;
        provSelect.appendChild(option);
      });
      
      updateDistricts();
      updateThemePreview();
      initCategories();
    }

    function updateDistricts() {
      const provSelect = document.getElementById('prov-select');
      const distSelect = document.getElementById('dist-select');
      const selectedProv = provSelect.value;
      
      distSelect.innerHTML = '';
      
      const dists = regionData.filter(item => item.prov === selectedProv);
      dists.forEach(item => {
        const option = document.createElement('option');
        option.value = item.dist;
        option.textContent = item.dist;
        distSelect.appendChild(option);
      });
      
      distSelect.value = dists[0].dist;
    }

    function updateThemePreview() {
      const dist = document.getElementById('dist-select').value;
      const data = regionData.find(item => item.dist === dist);
      
      if (data) {
        document.getElementById('theme-color-preview').style.backgroundColor = data.color;
        document.getElementById('theme-color-hex').textContent = data.color;
        document.getElementById('theme-logo-preview').src = data.logo;
      }
    }

    function initCategories() {
      const container = document.getElementById('category-container');
      container.innerHTML = '';
      
      categoryTemplates.forEach((cat, index) => {
        const div = document.createElement('div');
        div.className = 'bg-white p-3 rounded border border-gray-200 shadow-sm';
        
        div.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <label class="flex items-center font-bold text-gray-700 cursor-pointer">
              <input type="checkbox" id="${cat.id}" class="mr-2 w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500" ${cat.checked ? 'checked' : ''} onchange="generateOutput()">
              ${cat.name}
            </label>
            <div class="flex items-center gap-2">
              ${cat.id === 'cat-metro' ? `<span class="text-xs text-blue-600 bg-blue-100 px-2 py-0.5 rounded-full">로고 그룹 지원</span>` : ''}
              <div class="flex bg-gray-100 rounded border border-gray-300 overflow-hidden text-xs">
                <button type="button" onclick="moveCategoryUp(${index})" class="px-2 py-1 hover:bg-gray-200 text-gray-700 transition-colors ${index === 0 ? 'opacity-30 cursor-not-allowed' : ''}" ${index === 0 ? 'disabled' : ''} title="위로 이동">▲</button>
                <button type="button" onclick="moveCategoryDown(${index})" class="px-2 py-1 hover:bg-gray-200 text-gray-700 border-l border-gray-300 transition-colors ${index === categoryTemplates.length - 1 ? 'opacity-30 cursor-not-allowed' : ''}" ${index === categoryTemplates.length - 1 ? 'disabled' : ''} title="아래로 이동">▼</button>
              </div>
            </div>
          </div>
          <textarea id="${cat.id}-content" class="w-full border-gray-300 rounded border p-2 text-sm focus:ring-blue-500 focus:border-blue-500" rows="3" placeholder="시설 이름을 쉼표(,)로 구분하여 입력하세요.\n그룹을 지으려면 [그룹명] 시설1, 시설2 형태로 줄바꿈하여 입력하세요." oninput="generateOutput()">${cat.content}</textarea>
        `;
        container.appendChild(div);
      });
    }

    function moveCategoryUp(index) {
      if (index <= 0) return;
      syncCategoriesState(); // 이동 전 작성 중이던 텍스트 유지
      
      const temp = categoryTemplates[index - 1];
      categoryTemplates[index - 1] = categoryTemplates[index];
      categoryTemplates[index] = temp;
      
      initCategories();
      generateOutput();
    }

    function moveCategoryDown(index) {
      if (index >= categoryTemplates.length - 1) return;
      syncCategoriesState(); // 이동 전 작성 중이던 텍스트 유지
      
      const temp = categoryTemplates[index + 1];
      categoryTemplates[index + 1] = categoryTemplates[index];
      categoryTemplates[index] = temp;
      
      initCategories();
      generateOutput();
    }

    function addNewCategory() {
      const input = document.getElementById('new-cat-name');
      const name = input.value.trim();
      
      if (!name) {
        showToast("추가할 종류의 이름을 입력하세요.");
        return;
      }

      const newId = `cat-custom-${Date.now()}`;
      
      syncCategoriesState();
      
      categoryTemplates.push({
        id: newId,
        name: name,
        checked: true,
        content: "",
        isLogoGroup: false
      });
      
      initCategories();
      input.value = '';
      
      // 스크롤 맨 아래로 이동
      const container = document.getElementById('category-container');
      container.scrollTop = container.scrollHeight;
      
      generateOutput();
      showToast(`'${name}'(이)가 추가되었습니다.`);
    }

    /* 텍스트(문자열)를 HTML 링크 형식 파싱 */
    function parseLinks(text) {
      if(!text) return "";
      
      const items = text.split(',').map(s => s.trim()).filter(s => s.length > 0);
      
      const linkedItems = items.map(item => {
        let mainName = item;
        let suffix = "";
        
        const bracketMatch = item.match(/^(.*?)(\(.*?\))$/);
        if(bracketMatch) {
            mainName = bracketMatch[1].trim();
            const inBracketText = bracketMatch[2].replace(/[()]/g, ''); 
            suffix = `(<a href="${inBracketText.trim()}.html">${inBracketText.trim()}</a>)`;
        }
        
        if (suffix) {
          return `<a href="${mainName}.html">${mainName}</a>${suffix}`;
        }
        return `<a href="${item}.html">${item}</a>`;
      });
      
      return linkedItems.join(' · ');
    }

    /* 표 HTML 생성 핵심 로직 */
    function generateTableHTML() {
      const provStr = document.getElementById('prov-select').value;
      const distStr = document.getElementById('dist-select').value;
      const region = regionData.find(item => item.dist === distStr && item.prov === provStr);
      
      const mainColor = region.color;
      const logoPath = region.logo;
      const titleSubtitle = provStr === distStr ? "" : provStr; 
      const titleMain = provStr === distStr ? distStr + "의 시설" : distStr + "의 시설";
      const regionPrefix = provStr.substring(0, 2); 

      let html = `  <style>
    .hyobin-table { width: 100%; max-width: 1000px; border-collapse: collapse; border: 2px solid ${mainColor}; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; font-size: 13px; margin: 0 auto; }
    .hyobin-table th, .hyobin-table td { border: 1px solid #e0e0e0; padding: 8px; }
    .hyobin-header { background-color: ${mainColor}; text-align: center; padding: 15px !important; border-bottom: none; }
    .hyobin-header-box { display: inline-flex; align-items: center; border: 1px solid white; padding: 8px 15px; color: white; }
    .hyobin-header-logo { padding-right: 15px; border-right: 1px solid white; margin-right: 15px; }
    .hyobin-header-logo img { height: 35px; display: block; }
    .hyobin-header-text { text-align: left; }
    .hyobin-header-text .subtitle { font-size: 12px; display: block; line-height: 1.2; font-weight: normal; }
    .hyobin-header-text .title { font-size: 18px; font-weight: bold; display: block; line-height: 1.2; margin-top: 2px; }
    .hyobin-toggle { background-color: #ffffff; text-align: center; font-weight: bold; color: #333; border-bottom: 2px solid ${mainColor} !important; }
    .hyobin-cat { background-color: ${mainColor}; color: white; font-weight: bold; text-align: center; white-space: nowrap; width: 15%; }
    .hyobin-subcat { background-color: #f8f9fa; text-align: center; font-weight: bold; width: 12%; color: #333; }
    .hyobin-metro-cell { background-color: #f8f9fa; text-align: center !important; vertical-align: middle !important; width: 12%; }
    .hyobin-metro-logo { width: 25px; height: 25px; display: inline-block; vertical-align: middle; }
    .hyobin-content { background-color: #ffffff; text-align: left; line-height: 1.8; word-break: keep-all; }
    .hyobin-content a { color: #0055aa; text-decoration: none; }
    .hyobin-content a:hover { text-decoration: underline; }
  </style>

  <table class="hyobin-table">
    <tr>
      <td colspan="3" class="hyobin-header">
        <div class="hyobin-header-box">
          <div class="hyobin-header-logo">
            <img src="${logoPath}" alt="${distStr} 로고">
          </div>
          <div class="hyobin-header-text">
            ${titleSubtitle ? `<span class="subtitle">${titleSubtitle}</span>` : ''}
            <span class="title">${titleMain}</span>
          </div>
        </div>
      </td>
    </tr>
    <tr>
      <td colspan="3" class="hyobin-toggle">[ 펼치기 · 접기 ]</td>
    </tr>
`;

      categoryTemplates.forEach(cat => {
        const isChecked = document.getElementById(cat.id)?.checked ?? cat.checked;
        const textContent = document.getElementById(`${cat.id}-content`)?.value ?? cat.content;

        if (isChecked && textContent.trim() !== '') {
          const lines = textContent.split('\n').map(l => l.trim()).filter(l => l.length > 0);
          const rowspan = lines.length;
          
          lines.forEach((line, index) => {
            let groupName = "";
            let itemsText = line;
            
            const groupMatch = line.match(/^\[(.*?)\](.*)$/);
            if (groupMatch) {
              groupName = groupMatch[1].trim();
              itemsText = groupMatch[2].trim();
            }

            const parsedContent = parseLinks(itemsText);
            html += `    <tr>\n`;
            
            if (index === 0) {
              html += `      <td ${rowspan > 1 ? `rowspan="${rowspan}" ` : ''}class="hyobin-cat">${cat.name}</td>\n`;
            }
            
            if (groupName) {
              if (cat.isLogoGroup || cat.id === 'cat-metro') {
                let svgName = `${regionPrefix}${groupName}.svg`; 
                const cleanName = groupName.replace(/호선/g, "").trim();
                
                if (["1", "2", "3", "4", "5", "6", "7", "8"].includes(cleanName)) {
                  svgName = `${regionPrefix}${cleanName}호선.svg`;
                } else if (groupName.includes("빈효")) {
                  svgName = "빈효광역선.svg";
                } else if (groupName.includes("빈주1")) {
                  svgName = "빈주1.svg";
                } else if (groupName.includes("빈주2")) {
                  svgName = "빈주2.svg";
                } else if (groupName.includes("빈주광역")) {
                  svgName = "빈주광역선.svg";
                } else if (groupName.includes("덕주1")) {
                  svgName = "덕주1.svg";
                } else if (groupName.includes("서해")) {
                  svgName = "서해경전철.svg";
                } else if (groupName.includes("천주1")) {
                  svgName = "천주1.svg";
                } else if (groupName.includes("HDTX")) {
                  svgName = "HDTXA.svg";
                } else {
                  svgName = `${groupName}.svg`;
                }

                html += `      <td class="hyobin-metro-cell"><img src="이미지/svg/${svgName}" alt="${groupName}" class="hyobin-metro-logo" onerror="var p=this.parentNode; p.className='hyobin-subcat'; p.innerText='${groupName}';"></td>\n`;
              } else {
                html += `      <td class="hyobin-subcat">${groupName}</td>\n`;
              }
            } else {
              html += `      <td colspan="2" class="hyobin-content">\n        ${parsedContent}\n      </td>\n`;
            }
            
            if (groupName) {
              html += `      <td class="hyobin-content">\n        ${parsedContent}\n      </td>\n`;
            }
            
            html += `    </tr>\n`;
          });
        }
      });

      html += `  </table>`;
      return html;
    }

    function generateOutput() {
      syncCategoriesState();
      const tableHtml = generateTableHTML();
      
      // 1. 미리보기에 반영
      document.getElementById('preview-box').innerHTML = tableHtml;

      // 2. JS 코드 생성 및 텍스트 영역에 반영
      const distStr = document.getElementById('dist-select').value;
      const containerId = `district-nav-${distStr}`;

      const finalJS = `(function() {
  const facilityTableHTML = \`
${tableHtml}
  \`;

  const container = document.getElementById('${containerId}');
  if (container) {
    container.innerHTML = facilityTableHTML;
  } else {
    console.error("오류: '${containerId}' 요소를 찾을 수 없어 표를 렌더링하지 못했습니다.");
  }
})();`;

      document.getElementById('code-output').value = finalJS;
      
      // 3. 삽입 안내 문구 동적 업데이트
      const htmlSnippet = `<div id="${containerId}"></div>\n<script src="js/${distStr}시설.js"><\\/script>`;
      
      document.getElementById('instruction-box').innerHTML = `
        <div class="mb-3">
          <strong>💡 1. 파일 저장하기</strong><br>
          위 JS 코드를 <code><strong class="text-red-600">${distStr}시설.js</strong></code>로 저장하여 <code><strong>js/</strong></code> 폴더에 넣으세요.
        </div>
        <div class="mb-3">
          <strong>💡 2. 일반 문서에 삽입하기 (수동)</strong><br>
          일반 HTML 문서에 표를 넣으려면 아래 코드를 복사해서 문서의 원하는 위치에 붙여넣으세요.
          <div class="relative mt-2">
            <textarea id="html-snippet" class="w-full border border-gray-300 rounded p-2 bg-white font-mono text-sm shadow-inner resize-none focus:outline-none focus:ring-1 focus:ring-blue-500" rows="2" readonly>${htmlSnippet}</textarea>
            <button onclick="copyHtmlSnippet()" class="absolute top-1.5 right-1.5 bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold py-1 px-2 rounded shadow-sm transition-colors">HTML 복사</button>
          </div>
        </div>
        <div>
          <span class="text-gray-500 text-xs leading-tight block">※ 단, 맥도날드 매장 템플릿 등 자동화된 문서에는 1번(파일 저장) 과정만 수행하면 자동으로 적용됩니다.</span>
        </div>
      `;
    }

    function copyHtmlSnippet() {
      const snippetOutput = document.getElementById('html-snippet');
      snippetOutput.select();
      snippetOutput.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        showToast("HTML 삽입 코드가 복사되었습니다!");
      } catch(err) {
        showToast("복사에 실패했습니다.");
      }
    }

    function copyCode() {
      const codeOutput = document.getElementById('code-output');
      codeOutput.select();
      codeOutput.setSelectionRange(0, 99999);
      
      try {
        document.execCommand('copy');
        showToast("코드가 클립보드에 복사되었습니다!");
      } catch(err) {
        showToast("복사에 실패했습니다. 직접 선택하여 복사해주세요.");
      }
    }

    function downloadCode() {
      const code = document.getElementById('code-output').value;
      const distStr = document.getElementById('dist-select').value;
      const fileName = `${distStr}시설.js`;

      const blob = new Blob([code], { type: 'text/javascript;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      showToast(`'${fileName}' 파일이 성공적으로 다운로드 되었습니다!`);
    }

    window.onload = () => {
      initSelects();
      updatePresetDropdown();
      generateOutput();
    };
  </script>
</body>
</html>
