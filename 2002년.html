<h3 class="anchor-offset" id="s-3">2.1. 기후</h3>
<a class="wiki-link" href="1972년.html">1972년</a>과 비슷하게, 상승기(1~7월)는 고온이 매우 심한 반면 하강기(8~12월)는 저온이 매우 심했다.
    
    <p>일조시간이 매우 적은 해이다.</p>
<p>1월 초에는 한파가 찾아왔지만 1월 중하순(특히 중순)은 역대 1월 중 <a class="wiki-link" href="이상_고온.html">이상 고온</a>이 2020년 1월과 함께 가장 심했는데, 봄 수준의 날씨에 폭우도 내렸다. 겨울철로서는 드물게 <strong>최저</strong> 기온이 10°C 이상인 지역이 많았다. 특히 제주도는 <strong>1월의 늦봄</strong> 날씨였는데, 제주시는 15일 최고 기온 21.4°C, 서귀포시는 16일 최고 기온 20.7°C를 찍었다.<a class="wiki-fn-link" href="#fn-33" id="rfn-33">[33]</a> 이 영향으로 기상 관측 이후 두 번째로 1월 기온이 전달보다 높게 나왔다. 그 여파로 2월부터 4월까지 이상 고온이 찾아왔고 5월도 평년보다 높았다.</p>
<p>6~7월도 평년보다 약간 높았고 7월 말에는 폭염이 있었으나 8월이 되자마자 비가 자주 많이 내려 폭염이 약해지면서 <a class="wiki-link" href="2014년.html">2014년</a>처럼 <a class="wiki-link" href="이상_저온.html">이상 저온</a>이 찾아왔다. 8월 7일에 중부 지방에서 100mm~300mm나 되는 <a class="wiki-link" href="집중호우.html">집중호우</a>가 내렸고, 원주에는 305.0mm가 되는 폭우가 쏟아져서 원주를 비롯한 영서 남부 곳곳에서 산사태가 발생했으며 도로와 철도에 토사가 덮치는 등 피해가 컸다. 서울, 수원, 천안에는 단일 강수량으로 크게 드러나지 않았지만 8월 6일의 강수량을 합해서, 서울은 329.5mm, 수원은 334.5mm, 천안은 337.5mm가 되는 비가 내렸으며, 집중호우가 쏟아진 경기 남부의 경우에는 하천 범람과 함께 농경지와 도로가 침수되거나 철도가 유실되는 등 교통망이 마비된 적이 있었다. 여기에는 태풍 <a class="wiki-link" href="루사(태풍).html">루사</a>까지 겹쳤다.</p>
<p>다행히도 9월은 서울 등 수도권의 경우 평년이거나 조금 높았으나 전국은 다소 낮아 전체적으로 보면 평년 수준에 가까웠다. 그러나 10월이 되자 바로 늦가을이 되는 등 추워졌고 11월에는 초이상 저온이 나타났다. 이렇듯 11월의 초이상 저온과 12월의 이상 고온까지 겹쳐서 11월과 12월의 차이는 거의 없었다. 그리고 겨울철 세 달이 모두 이상 고온을 보이며 <strong>서울의 월평균기온 영하가 단 하나도 없었다.</strong><a class="wiki-fn-link" href="#fn-34" id="rfn-34">[34]</a></p>

<h3 class="anchor-offset" id="s-4">2.2. 이라크 전쟁 준비</h3>
    2002년 국제외교의 가장 큰 화제는 바로 미국의 <a class="wiki-link" href="이라크_전쟁.html">이라크 침공</a> 여부였다. 직전 해 <a class="wiki-link" href="9.11_테러.html">9.11 테러</a>로 꼭지가 돌아버린 미국은 9.11을 배후/지원한 세력을 종말시키기 위해 <a class="wiki-link" href="테러와의_전쟁.html">테러와의 전쟁</a>을 선포했고 한달 뒤 <a class="wiki-link" href="미국-아프가니스탄_전쟁.html">미국-아프가니스탄 전쟁</a>을 일으켜 탈레반 정권을 축출시켰다. 탈레반 정권이 축출되자 미국은 목표를 곧바로 <a class="wiki-link" href="이라크.html">이라크</a>로 변경하고 <a class="wiki-link" href="사담_후세인.html">사담 후세인</a>에 대한 축출작전을 계획하게 된다. 2002년 신년연설에서 부시 대통령이 <a class="wiki-link" href="북한.html">북한</a>, <a class="wiki-link" href="쿠바.html">쿠바</a>, <a class="wiki-link" href="이란.html">이란</a>, <a class="wiki-link" href="이라크.html">이라크</a> 4개국을 '악의 축'이라고 부르며 선언한 것이 시작이었고, 이후 한 해 내내 미국은 이라크 침공을 위한 대내외적 준비에 착수했다.
    
    <p>같은 해 9월, 9.11 1주기를 맞아 추모식에 참석한 부시는 추도사를 통해 이라크 침공 계획을 직접적으로 발표했다. 다음 달인 10월, 부시는 의회 연설을 통해 후세인 정권이 대량살상무기를 숨겨두고 있으며 이를 통해 세계평화에 심각한 위협이 된다는 점을 들어 무력사용을 허가하는 법안 통과를 국회에 요청했다. 상하원 투표까지 거쳐서 가결되었고,<a class="wiki-fn-link" href="#fn-35" id="rfn-35">[35]</a> 이에 사담 후세인은 99.9%의 당선율로 대통령에 재선되는 것으로 미국에게 응대했다. 이때부터 미국 CIA와 영국의 M16은 이라크전 보고서를 작성했는데, 이는 현재까지도 <strong>날조와 거짓 정보로 쓰여진 보고서</strong>의 대표적인 사례로 남아있다. MBC <a class="wiki-link" href="서프라이즈.html">서프라이즈</a>에서도 이라크 보고서에 대한 에피소드가 나왔고, <a class="wiki-link" href="베트남_전쟁.html">베트남 전쟁</a>에서의 삽질과 함께 미국의 전쟁사에 아주 안 좋은 반면교사로 현재까지도 뽑히고 있다.</p>
<p>결국 이듬해 3월 미국은 이라크를 침공했고, 2주만에 <a class="wiki-link" href="바그다드.html">바그다드</a>를 함락해 후세인 정권을 축출시켰다. 이로써 후세인의 철권통치는 24년 만에 막을 내렸고 그는 아들들과 함께 미군의 추격을 받아 쫓기는 도망자 신세가 된다. 후세인의 축출로 20세기의 잔재까지 <strong>완벽히 청산</strong>되었고 이라크 주민들은 평화가 올 것이라 기뻐했지만... 이는 시작에 불과했고 아무런 명분없이 이뤄진 전쟁 때문에 이후 20여년간 이라크 및 중동사회는 내전으로 엄청난 혼란에 빠지게 된다. 미군은 8년 뒤인 2011년 전쟁 승전을 선언하고 이라크에서 미군을 철수시켰으며, 이라크는 민간정부의 통치 안에 어느 정도 정착하는 데 성공했다.</p>
<p>9.11 테러와 아프간 / 이라크 전쟁을 통해 사실상 20세기에서 21세기로 세기가 완전히 바뀌었다고 할 수 있는데, 이유는 중동에서 큰 영향력을 행사하던 탈레반 / 후세인 두 정권이 완전히 무너졌고 이는 곧 2020년대 현재까지도 중동 지역을 휘감고 있는 내전의 <strong>시작</strong>이 됐기 때문이다. 이 때문에 이라크 전이 나기 전인 2002년이 국제 정세로 보면 20세기의 잔재가 남아있는 <strong>마지막 해</strong>라고 봐도 무방하다.</p>
<h3 class="anchor-offset" id="s-5">2.3. 2002년 가요계</h3>
    2002년에는 1세대 아이돌들의 마지막 전성기로 꼽히는 해임과 동시에 1세대 아이돌들이 해체되기 시작한 해이기도 하다.<a class="wiki-fn-link" href="#fn-36" id="rfn-36">[36]</a><a class="wiki-fn-link" href="#fn-37" id="rfn-37">[37]</a> <a class="wiki-link" href="젝스키스.html">젝스키스</a>나 <a class="wiki-link" href="H.O.T..html">H.O.T.</a>는 각각 <a class="wiki-link" href="2000년.html">2000년</a> 5월, <a class="wiki-link" href="2001년.html">2001년</a> 2월 해체되었고, 끝까지 남아있던 1세대 걸그룹 <a class="wiki-link" href="S.E.S..html">S.E.S.</a>, <a class="wiki-link" href="핑클.html">핑클</a> 역시 2002년을 끝으로 해체하거나 활동을 중단했다.<a class="wiki-fn-link" href="#fn-38" id="rfn-38">[38]</a> 그 뒤를 이어 데뷔한 아이돌 그룹들인 <a class="wiki-link" href="M.I.L.K..html">M.I.L.K.</a>, <a class="wiki-link" href="신비(아이돌).html">신비</a>, <a class="wiki-link" href="블랙비트.html">블랙비트</a>, <a class="wiki-link" href="SWi.T.html">SWi.T</a>, <a class="wiki-link" href="LUV(걸그룹).html">LUV</a>, <a class="wiki-link" href="Q.O.Q.html">Q.O.Q</a> 등이 하나 같이 딱 이 해에 앨범만 내고 소리소문없이 해체 내지는 개인활동을 하는 수순을 밟았다.<a class="wiki-fn-link" href="#fn-39" id="rfn-39">[39]</a> 2007년 <a class="wiki-link" href="원더걸스.html">원더걸스</a>, <a class="wiki-link" href="소녀시대.html">소녀시대</a>가 데뷔하고, 걸그룹 전성기가 시작된 <a class="wiki-link" href="2009년.html">2009년</a>~<a class="wiki-link" href="2012년.html">2012년</a> 이전까지 2002년 ~ 2007년 초의 대한민국 걸그룹 시장은 침체를 맞았다.<a class="wiki-fn-link" href="#fn-40" id="rfn-40">[40]</a> 그리고 2007년 ~ 2008년까지 가요계는 과도기를 맞이한다. 하지만 HOT, 젝스키스, SES, 핑클이 해체한 사이 남은 1세대 아이돌 그룹인 <a class="wiki-link" href="베이비복스.html">베이비복스</a>는 '우연'으로 제2의 전성기를 맞았다.<a class="wiki-fn-link" href="#fn-41" id="rfn-41">[41]</a>
<p>그러나 현재 힙합계의 레전드라 불리는 <a class="wiki-link" href="리쌍.html">리쌍</a>, <a class="wiki-link" href="MC스나이퍼.html">MC스나이퍼</a>, R&amp;B가수로 손꼽히는 <a class="wiki-link" href="휘성.html">휘성</a>, 후에 아시아스타라 불리는 <a class="wiki-link" href="비(연예인).html">비</a>가 데뷔한 해기도 하다. 이 해 지상파 방송 3사 가요대상은 일본에서 예상치 못한 엄청난 인기를 끌었다. 이미 <a class="wiki-link" href="MAMA_AWARDS#엠넷_아시안_뮤직_어워드.html">엠넷 뮤직비디오 페스티벌</a>에서 최고 인기 뮤직비디오상과 <a class="wiki-link" href="서울가요대상.html">서울가요대상</a> 대상을 수상한 <a class="wiki-link" href="보아.html">보아</a>와 전국적으로 '장나라 신드롬'을 일으키며 전국민적으로 사랑을 받고 KMTV 코리안 뮤직 어워드 대상을 받은 <a class="wiki-link" href="장나라.html">장나라</a>의 여인천하 대결이었는데, 결국 <a class="wiki-link" href="장나라.html">장나라</a>는 KBS와 MBC에서 대상을 차지하고, <a class="wiki-link" href="보아.html">보아</a>는 SBS 한 곳만 가져가게 되면서 최종적으로는 <a class="wiki-link" href="장나라.html">장나라</a>의 승리로 끝났다. 참고로 <a class="wiki-link" href="골든디스크어워즈.html">골든디스크 시상식</a> 대상은 <a class="wiki-link" href="쿨(혼성그룹).html">쿨</a>이 차지하였다.</p>
<p><a class="wiki-link" href="음반.html">음반</a> 시장이 마지막 불꽃을 피웠던 시기였다. 음반시장이 음원시장보다 점유율이 높았던 <strong>마지막 해였다.</strong> 직전 해부터 음반판매량은 떨어지고 있었고 월드컵까지 겹치면서 비록 밀리언셀러는 나오지 않았지만 2001년 밀리언셀러를 기록한 이미연 베스트셀러와 god 4집, 김건모 7집의 판매량을 제외하면 2001년과 비슷했다. 이후 음반시장은 다음해인 2003년부터 기하급수적으로 몰락하기 시작했고, 음원시장에 점유율을 추월당했다.</p>
<p>다만 해외시장에선 나름 선전했던 때였는데, 보아는 일본에서 첫 정규앨범을 내 일본 음반판매 1등을 기록하여 승전보를 울렸으며, 신화, 윤미래, 조성우 등이 싱가포르, 미국, 일본 등지에 각각 진출하여 한류열풍의 밑거름을 다지는 시도를 했다. 그 외에 중국 인민라디오방송(CNR)과 일본 스카이퍼펙TV에서도 한국 가요 관련 프로그램이 방영되면서 아시아에서 한국 가요의 위상이 점차 높아졌다.</p>
<p>음반시장의 불황과는 별개로, 2002년에 활동한 가수들의 라인업을 보면 가히 별들의 전쟁이라고 해도 과언이 아닐 정도로 1세대를 대표하는 가수들이 대거 활동했던 시기였다. <a class="wiki-link" href="S.E.S..html">S.E.S.</a>, <a class="wiki-link" href="핑클.html">핑클</a>, <a class="wiki-link" href="신화(아이돌).html">신화</a>, <a class="wiki-link" href="god(아이돌).html">god</a>, <a class="wiki-link" href="베이비복스.html">베이비복스</a>는 물론이고 <a class="wiki-link" href="장나라.html">장나라</a>, <a class="wiki-link" href="이수영(가수).html">이수영</a>, <a class="wiki-link" href="김현정.html">김현정</a>, <a class="wiki-link" href="이정현(멀티_엔터테이너).html">이정현</a>, <a class="wiki-link" href="엄정화.html">엄정화</a> 등 솔로 여가수들과 <a class="wiki-link" href="거북이(혼성그룹).html">거북이</a>, <a class="wiki-link" href="쿨(혼성그룹).html">쿨</a>, <a class="wiki-link" href="코요태.html">코요태</a>, <a class="wiki-link" href="샵.html">샵</a><a class="wiki-fn-link" href="#fn-42" id="rfn-42">[42]</a> 등 1세대 혼성그룹들과 <a class="wiki-link" href="Y2K.html">Y2K</a> 등 세기말을 대표했던 가수들도 활동을 했었다. 1세대 보이그룹이었던 <a class="wiki-link" href="H.O.T..html">H.O.T.</a>, <a class="wiki-link" href="젝스키스.html">젝스키스</a> 멤버들도 솔로로 활동하며 왕성한 인기를 누렸던 시기이기도 했다.</p>
<p>빛이 컸던 만큼 암흑도 있었는데, 연초부터 인기 가수였던 <a class="wiki-link" href="유승준.html">유승준</a>이 미국 시민권을 받으면서 병역기피 의혹이 일자, 법무부가 입국을 거부하면서 대중들 간에 갑론을박이 벌어졌으며 이에 따른 앙금은 20년 넘게 지나도 메워지지 않고 있다.</p>
<h4 class="anchor-offset" id="s-6">2.3.1. 음반판매량 TOP 10</h4>

    음반판매량 1위는 총 76만 장을 판매한 <a class="wiki-link" href="브라운_아이즈.html">브라운 아이즈</a>가 차지했는데, 연말에 발매된 앨범이었음에도 발매한 달동안 61만 장을 파는 기염을 토했다. 2위는 <a class="wiki-link" href="쿨(혼성그룹).html">쿨</a>이었는데, 총 64만 장을 판매하면서 <a class="wiki-link" href="골든디스크.html">골든디스크</a> 대상을 수상하게 된다. 혼성그룹 최초이자 현재까지도 없는 유일한 골든디스크 대상 수상 기록이다.<a class="wiki-fn-link" href="#fn-43" id="rfn-43">[43]</a>
<p>불법 mp3로 인한 음반시장의 침체와 <a class="wiki-link" href="2002_FIFA_월드컵_한국·일본.html">2002년 한일 월드컵</a>에 따른 가요계의 부진으로 밀리언셀러 앨범이 나오지 못했고, 가수들의 평균 음반판매량은 40~50만장대였다. 그나마 밀리언셀러를 제외하면 2001년과 평균적인 판매량이 비슷했기에 어려운 상황 속에서도 선방한 해라고 할 수 있다.</p>
<p>몰락하기 시작한 음반시장은 결국 다음 해인 2003년 불법 음원시장에 점유율마저 추월당해버렸고, 매출도 1000억 원대로 떨어져버린다.</p>
<h3 class="anchor-offset" id="s-7">2.4. HD 방송의 도입</h3>
    한편 HD 방송이 2002년 월드컵을 계기로 상용화되기 시작됐다. 지상파 3사에서 자사의 일부 프로그램을 HD로 시험 편성해 운영하기 시작했던 것. 가장 적극적으로 HD 방송을 밀었던 방송사는 바로 <a class="wiki-link" href="SBS.html">SBS</a>로, 예능/교양 프로그램 등 일부를 HD 방송으로 제작하여 화제를 모았다.<a class="wiki-fn-link" href="#fn-44" id="rfn-44">[44]</a> <a class="wiki-link" href="SBS_인기가요.html">SBS 인기가요</a>, <a class="wiki-link" href="생방송_음악캠프.html">생방송 음악캠프</a>, <a class="wiki-link" href="행복채널.html">행복채널</a>, <a class="wiki-link" href="열린음악회.html">열린음악회</a>, TV쇼 진품명품 등 일부 녹화 예능/교양 프로그램들을 위주로 편성되었으며 상당수의 프로그램들은 SD/HD가 혼합된 구조로 방송되었다. 2010년대에 대중화된 디지털 방송의 시초라고 할 수 있는 셈. 이 때문에 <a class="wiki-link" href="S.E.S..html">S.E.S.</a>, <a class="wiki-link" href="핑클.html">핑클</a>, <a class="wiki-link" href="god.html">god</a> 등 이 시기까지 활동했던 1세대 아이돌들은 HD 영상이 드물게 남아 있다.
    
    <p>다만 이 시기는 시험 방송 수준으로 HD 방송이 편성이 뜸했고, 디지털 TV도 거의 보급되지 않았으며 수도권 외에는 HD가 송출되지 않아 사실상 유명무실한 수준에 가까웠다. 참고로 디지털 방송 전국화는 2006년에 완료되었으며,<a class="wiki-fn-link" href="#fn-45" id="rfn-45">[45]</a> 2000년대 후반부터 본격적으로 HD 방송 편성이 늘어 2010년대 초반에 완전히 대중화되었다. 참고로 아날로그 방송 완전 종료는 2013년 1월 1일에 이루어졌다.</p>
<h3 class="anchor-offset" id="s-8">2.5. <a class="wiki-link" href="2002_FIFA_월드컵_한국·일본.html">2002 FIFA 월드컵 한국·일본</a> 개최</h3>

    대한민국 국민들이 가장 많이 떠올리는 2002년의 기억은 바로 <strong><a class="wiki-link" href="2002_FIFA_월드컵_한국·일본.html">2002 FIFA 월드컵 한국·일본</a>의 4강 신화였다.</strong> 2001년까지만 해도 사실 <a class="wiki-link" href="대한민국_축구_국가대표팀.html">대한민국 축구 국가대표팀</a>에 대한 국민들의 기대는 크지 않았다. 2000년 말 <a class="wiki-link" href="허정무.html">허정무</a>가 경질되고 외국인 감독을 찾던 <a class="wiki-link" href="대한축구협회.html">대한축구협회</a>가 <a class="wiki-link" href="거스_히딩크.html">거스 히딩크</a>와 높은 계약금으로 계약했지만, <a class="wiki-link" href="히딩크호.html">히딩크호</a>는 국민들의 기대에 미치지 못하고 프랑스, 체코전에서 두 번의 5:0 패배를 만들면서 국민들에게 신임을 잃는다.<a class="wiki-fn-link" href="#fn-46" id="rfn-46">[46]</a> 2002년 1월 골드컵까지 위태위태하던 그들은 2002년 5월 스코틀랜드전 4:1 대승, 잉글랜드와의 평가전 1:1 무승부, 프랑스와의 평가전에서 2:3으로 석패하며 달라진 모습을 보여주었고, <strong>"세상을 깜짝 놀라게 할 것이다."</strong>라는 거스 히딩크 전 감독의 비장한 발표와 함께 월드컵이 시작되었다.
    
    <p>그 후 대한민국은 폴란드, 미국, 포르투갈을 상대로 2승 1무 1위로 조별리그를 통과했고 16강 이탈리아전에서는 연장까지 가는 접전 끝에 <a class="wiki-link" href="안정환.html">안정환</a>의 골든골로 2:1 승리를 거두고, 8강 스페인전에서는 <a class="wiki-link" href="이운재.html">이운재</a>의 선방으로 승부차기에서 5:3 승리를 거두며 대한민국 축구 사상 첫 <strong>4강 진출</strong>이라는 쾌거를 얻는다. 이 시기 4강 진출보다도 더 세계를 놀라게 했던 것은 바로 대한민국의 응원 문화로 <a class="wiki-link" href="서울특별시청.html">서울특별시청</a>과 <a class="wiki-link" href="경복궁_광화문.html">광화문</a>, <a class="wiki-link" href="한강공원.html">한강시민공원</a> 등을 가득 채우고 응원하는 국민들과 붉은 악마의 모습은 외신들에게도 엄청난 놀라움으로 다가왔다. 월드컵 기간 동안 대한민국의 경기가 열리는 날이면 서울시청과 광화문을 비롯한 대한민국의 모든 거리와 술집, 공공장소는 <a class="wiki-link" href="길거리_응원.html">길거리 응원</a>을 하는 인파로 온통 붉은색으로 물들었으며, 축구 국가대표팀의 인기는 하늘을 찔렀다.<a class="wiki-fn-link" href="#fn-47" id="rfn-47">[47]</a> 거스 히딩크는 대회 종료 후 명예국민 자격을 받았고 대표팀 선수들은 <a class="wiki-link" href="김대중.html">김대중</a> <a class="wiki-link" href="전직_대통령.html">전 대통령</a>의 특별 허가로 전원 군면제를 받았다. 또한 월드컵 폐막 다음 날인 7월 1일은 임시공휴일로 지정되었다. 포르투갈전 당시 포르투갈 대표팀 소속으로 뛰었던 선수 중 <a class="wiki-link" href="파울루_벤투.html">파울루 벤투</a>는 16년 후 <a class="wiki-link" href="벤투호.html">대한민국 국가대표팀 감독</a>이 된다.</p>
<p>월드컵의 인기는 폐막 이후 10월까지 계속되었다. 월드컵 이후 월드컵 기념우표와 기념 책자, 선수들의 화보집 등은 서점에서 불티나게 팔려나갔고, 남북축구경기와 <a class="wiki-link" href="2002_부산_아시안_게임.html">2002 부산 아시안 게임</a>에서도 <a class="wiki-link" href="홍명보.html">홍명보</a>가 성화를 들었고, <a class="wiki-link" href="거스_히딩크.html">거스 히딩크</a>가 참석했을 정도였다. 이런 월드컵 열기는 2002년 11월 20일 브라질전을 끝으로 <a class="wiki-link" href="황선홍.html">황선홍</a>, <a class="wiki-link" href="홍명보.html">홍명보</a>의 은퇴식과 <a class="wiki-link" href="히딩크호.html">히딩크호</a>가 공식적으로 해체되면서 막을 내렸다.</p>
<p><a class="wiki-link" href="K리그.html">K리그</a>의 인기 역시 K리그 역사에 손꼽히는 시즌으로 남을 정도로 올라갔다. 1999년 이후 2000년~2001년 동안 잠시 내리막길을 탔던 K리그는 2002년 월드컵 폐막 후 7월에 개막한 뒤 275만 관중을 동원하면서 역대 K리그 관중 수 <strong>2위</strong>를 달성했다. 월드컵 스타들이 포진해 있던 <a class="wiki-link" href="수원_삼성_블루윙즈.html">수원 삼성 블루윙즈</a>, <a class="wiki-link" href="안양_LG_치타스.html">안양 LG 치타스</a>, <a class="wiki-link" href="포항_스틸러스.html">포항 스틸러스</a>, <a class="wiki-link" href="전남_드래곤즈.html">전남 드래곤즈</a>, <a class="wiki-link" href="부천_SK.html">부천 SK</a> 등은 특히 더욱 인기가 많았다. K리그 소식이 스포츠 뉴스 뿐만 아니라 각 방송국의 메인 뉴스에도 보도됐을 정도였으니, 당시 국민들이 축구에 대해 가지는 관심이 얼마나 높았는지는 알 수 있다.</p>
<p>또한 축구 관련 자선 사업, 후원 방송 등도 많이 지상파에서 방송되었다. 말 그대로 2002년 한 해가 <strong>그냥 축구로 미친 한 해</strong>였다고 해도 과언이 아니었다. 어느 정도였냐면, <a class="wiki-link" href="음식점.html">음식점</a>과 <a class="wiki-link" href="직장(장소).html">직장</a>에서도 축구 경기에 집중했었고, <a class="wiki-link" href="어린이집.html">어린이집</a>에서 <a class="wiki-link" href="고등학교.html">고등학교</a>, 그리고 직장도 일찍 마치거나 단체로 버스 타고 가서 월드컵을 봤을 정도였다. <a class="wiki-link" href="예식장.html">결혼식장</a>은 당연했지만, 아이러니하게 고인의 상을 치르고 있는 <a class="wiki-link" href="장례식장.html">장례식장</a>에서도 월드컵을 봤었다. 그리고 <a class="wiki-link" href="치킨.html">치킨</a>ㆍ<a class="wiki-link" href="피자.html">피자</a>ㆍ<a class="wiki-link" href="중국_요리.html">중국 요리</a> 등 외식 배달 비율도 상당히 높았다. 그래서 보통 대한민국에서 아무 수식어 없이 '월드컵 열린 해'라고 하면 이 해를 가리킨다. 심지어 2002년생들조차 본인들 태어난 해를 '월드컵 열린 해요'라고 소개하기도 할 정도니.</p>

<h3 class="anchor-offset" id="s-10">2.6. <a class="wiki-link" href="제2연평해전.html">제2연평해전</a> 발발</h3>
    월드컵 3·4위전 열기로 뜨거웠던 2002년 6월 29일, 서해에 위치한 연평도 부근에서 북한 해군이 북방한계선을 넘어 남한 해군을 향해 포격 도발하는 사건이 벌어졌다. 이 사건으로 윤영하 대위, 황도현 중사, 조천형 중사, 서후원 중사가 현장에서 전사하였으며 박동혁 병장과 한상국 중사는 중태에 빠져 2개월~3개월간 치료를 받다가 전사하였다. 또한 18명의 장병들이 부상을 입고, 참수리 357호가 반파되는 피해를 입었다. 1999년 <a class="wiki-link" href="제1연평해전.html">제1연평해전</a> 이후 3년 만의 대남 도발이었으며, 이 사건 때문에 당시 평화 무드로 가던 남북관계가 잠시 악화되었다. 월드컵 열기로 한창 달아오르던 시기에 벌어진 참극이었기에 시민들이 느끼는 충격과 안타까움은 더욱 컸다.
    
    <p>당시 김대중 전 대통령은 NSC 긴급 국가안전보장회의를 소집해 북한의 대응을 규탄하였고, 국방부 역시 북한의 도발을 정전협정 위반으로 규정하고 북한의 사과와 책임자 처벌 및 재발방지를 촉구했다. 이틀 뒤인 7월 1일 국군수도병원에서 합동 영결식이 열렸고, 김대중 전 대통령은 월드컵 결승전 참석차 일본으로 출국한 상태였기에 부득이하게 참석하지 못했고 대신 7월 23일 서해교전 유가족들을 청와대로 불러 면담을 하며 위로했다. 일본 정부 역시 월드컵 축제 분위기에 찬물을 끼얹는다며 비난 성명을 냈고, 북한의 우방국인 중국 역시 연평해전을 북한의 도발행위로 못 박으며 깊은 우려의 뜻을 나타냈다.</p>
<p>2000년대에는 '서해교전'이라는 명칭으로 불렸으나, 이후 1999년 발생한 제1연평해전과 함께 <strong>제2연평해전</strong>이라는 이름으로 바뀌었으며 현재까지 추도식도 이 이름으로 열고 있다. 2015년에는 제2연평해전을 다룬 영화 <a class="wiki-link" href="연평해전.html">연평해전</a>이 개봉하기도 했다.</p>
<h3 class="anchor-offset" id="s-11">2.7. <a class="wiki-link" href="플래시_애니메이션.html">플래시 애니메이션</a>의 마지막 전성기</h3>
    1990년대 말부터 <a class="wiki-link" href="어도비_플래시_플레이어.html">어도비 플래시 플레이어</a>로 제작된 <strong>국산 플래시 애니메이션의 마지막 전성기</strong>라고 할 수 있다. <a class="wiki-link" href="엽기송.html">엽기송</a> 대부분은 물론 당시 <a class="wiki-link" href="야후!_꾸러기.html">야후! 꾸러기</a>나 <a class="wiki-link" href="쥬니어네이버.html">쥬니어네이버</a>에 올라와 있던 플래시 애니메이션과 게임 대다수가 2002년~2003년 전후로 제작되었다.<a class="wiki-fn-link" href="#fn-48" id="rfn-48">[48]</a> 플래시 애니메이션의 전성기로 발돋움한 이유로는 인터넷 홈페이지의 발달과 대중화, <a class="wiki-link" href="2002_FIFA_월드컵_한국·일본.html">2002 FIFA 월드컵 한국·일본</a> 열풍, 교육용 매체의 애니메이션화, 2000년 제작된 <a class="wiki-link" href="마시마로.html">마시마로</a>의 대흥행을 들 수 있다.
    
    <p>비단 어린이용 플래시 뿐만 아니라 성인층을 겨냥한 풍자 애니메이션도 제작되었으며, <a class="wiki-link" href="오인용.html">오인용</a>의 <a class="wiki-link" href="연예인_지옥.html">연예인 지옥</a>은 사회 풍자는 물론 군필자들의 추억을 겨냥하며 군대를 소재로 한 여러 예능 작품에 지대한 영향을 주었다.</p>
<p>그러나 플래시 애니메이션의 인기는 잠깐뿐이었다. 오인용의 <a class="wiki-link" href="장석조.html">장석조</a> 감독이 밝히듯 플래시 애니메이션 시장은 2002년을 전후로 침체되기 시작했고 이후 이지툰, UCC 열풍이 불면서 더 이상 전성기만큼의 인기를 누리지 못하게 되었기 때문이다.</p>

<h2 class="anchor-offset" id="s-48">각주</h2>
<div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #ccc; font-size: 0.9em;">
<ul style="list-style: none !important; padding-left: 0 !important; line-height: 1.8; color: #555;">
<li id="fn-1" style="margin-bottom: 4px;"><a href="#rfn-1" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[1]</a> 2002년의 경우 긍정적인 분위기가 압도적으로 높았다. <a class="wiki-link" href="#rfn-1">↑</a></li>
<li id="fn-2" style="margin-bottom: 4px;"><a href="#rfn-2" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[2]</a> 투표율은 월드컵 때문에 당시 역대 최저였다. <a class="wiki-link" href="#rfn-2">↑</a></li>
<li id="fn-3" style="margin-bottom: 4px;"><a href="#rfn-3" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[3]</a> 노무현이 처음 대통령 선거 출마를 선언한 2001년 12월까지만 해도 그의 지지율은 고작 <strong>2%</strong> 정도였다. <a class="wiki-link" href="#rfn-3">↑</a></li>
<li id="fn-4" style="margin-bottom: 4px;"><a href="#rfn-4" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[4]</a> 이인제는 대통령 선거 후보 경선 8개월 후인 2002년 12월 <a class="wiki-link" href="자유민주연합.html">자유민주연합</a>으로 이적했는데, 이 때문에 이인제의 철새 이미지는 더욱 확고히 자리잡히고 말았다. <a class="wiki-link" href="#rfn-4">↑</a></li>
<li id="fn-5" style="margin-bottom: 4px;"><a href="#rfn-5" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[5]</a> 이 때문에 노무현은 선거사상 최소 비용으로 당선된 후보가 되었다. <a class="wiki-link" href="#rfn-5">↑</a></li>
<li id="fn-6" style="margin-bottom: 4px;"><a href="#rfn-6" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[6]</a> 출산 붐이 일었다는 2007년과 2012년 역시 2002년의 수치를 넘지 못했다. 즉, 2003년, 2007년~2008년, 2010년~2015년의 출산율이 2002년보다 높지만 출생아 수는 2002년의 수치를 넘지 못했다. <a class="wiki-link" href="#rfn-6">↑</a></li>
<li id="fn-7" style="margin-bottom: 4px;"><a href="#rfn-7" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[7]</a> 특히 <a class="wiki-link" href="카드대란.html">카드대란</a>으로 경기가 한창 심란하던 2004년의 영향을 받은 2005년의 출산율이 가장 낮았는데 2005년에 43만 명을 기록해 2000년대에서 가장 낮은 출산율과 출생아 수를 기록했다. 출생아 수로 보면 2015년과 비슷한 수준이다. <a class="wiki-link" href="#rfn-7">↑</a></li>
<li id="fn-8" style="margin-bottom: 4px;"><a href="#rfn-8" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[8]</a> 말띠 여성은 팔자가 세다, 남편의 기를 누른다, 남편의 수명을 짧게 한다, <a class="wiki-link" href="백말띠.html">백말띠</a>(<a class="wiki-link" href="1990년.html">1990년</a>생) 여성이 가장 드세다 등 다양한 미신이 있었다. <a class="wiki-link" href="#rfn-8">↑</a></li>
<li id="fn-9" style="margin-bottom: 4px;"><a href="#rfn-9" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[9]</a> 2002년은 <a class="wiki-link" href="임오년.html">임오년</a>으로 검은색+말띠 해에 해당된다. <a class="wiki-link" href="#rfn-9">↑</a></li>
<li id="fn-10" style="margin-bottom: 4px;"><a href="#rfn-10" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[10]</a> 이 때문에 2002년생 여자의 인원은 저출산+최고 성비라는 조건 때문에 다른 세대에 비해 훨씬 적다. 한창 남녀성비 차이가 극심하던 90년대의 평균 성비가 110이었는데, 저출산으로 인구는 줄어들었지만 성비는 90년대의 평균과 똑같이 나오니 당연히 여성의 인구가 적을 수밖에 없다. <a class="wiki-link" href="#rfn-10">↑</a></li>
<li id="fn-11" style="margin-bottom: 4px;"><a href="#rfn-11" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[11]</a> 하지만 사회적인 저출산 기조를 막을 수는 없었기에 결국 소폭 상승에 그쳤다. 결과적으로는 2003년 전체 출생아 수는 오히려 줄어들었다. <a class="wiki-link" href="#rfn-11">↑</a></li>
<li id="fn-12" style="margin-bottom: 4px;"><a href="#rfn-12" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[12]</a> 물고문을 했던 검사는 홍경령 검사(연수원 21기)였고, 지휘계통에서 홍 검사의 상관이었던 서울지검 3차장인 정현태(연수원 10기) 검사는 법무부장관과 검찰총장까지 사표를 쓴 마당인지라 검사장 승진은 완전히 물 건너갔다. 정 차장검사는 알짜보직에서 해임되고, 고검으로 내쫓겼으며 사실상 권고 사직 수준이다. 이후 15년을 더 고검에서 재직하다가 2017년에 정년 퇴직했다. <a class="wiki-link" href="#rfn-12">↑</a></li>
<li id="fn-13" style="margin-bottom: 4px;"><a href="#rfn-13" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[13]</a> 발생일 수는 전년도인 2001년보다 적은 16회지만 역대 두 번째로 많이 발생했던 해다. 하지만 피해, 정도가 사상 최악의 황사였다. 국내산업 전체가 크게 피해를 입었고, 학교도 휴교령이 떨어졌다. 누런 황사에 뒤덮인 세상은 공포스러울 정도로 끔찍한 모습이었고 현격하게 떨어진 가시거리 때문에 국내선 항공이 결항되고, 길거리 노점상과 상인들은 장사를 포기해야 했을 정도였다. <a class="wiki-link" href="#rfn-13">↑</a></li>
<li id="fn-14" style="margin-bottom: 4px;"><a href="#rfn-14" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[14]</a> 중국 여객기 추락 사고, 김해 한림면 수해 등. 다음해인 2003년에는 대구광역시에서 태풍 매미 상륙, <a class="wiki-link" href="대구_지하철_참사.html">대구 지하철 참사</a> 등 큰 사건사고가 많이 일어났다. <a class="wiki-link" href="#rfn-14">↑</a></li>
<li id="fn-15" style="margin-bottom: 4px;"><a href="#rfn-15" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[15]</a> 한 경기 당 최저 관중도 이때 깨졌다. <a class="wiki-link" href="#rfn-15">↑</a></li>
<li id="fn-16" style="margin-bottom: 4px;"><a href="#rfn-16" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[16]</a> 준우승한 팀은 모두 <a class="wiki-link" href="서울특별시.html">서울</a> 연고 팀이었다. <a class="wiki-link" href="#rfn-16">↑</a></li>
<li id="fn-17" style="margin-bottom: 4px;"><a href="#rfn-17" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[17]</a> 첫 스타트는 SBS에서 2002년에 방영된 <a class="wiki-link" href="대망(SBS).html">대망</a>부터, MBC는 2003년 <a class="wiki-link" href="다모(드라마).html">다모</a>부터, KBS는 2004년 <a class="wiki-link" href="해신(드라마).html">해신</a>부터 도입되었다. <a class="wiki-link" href="#rfn-17">↑</a></li>
<li id="fn-18" style="margin-bottom: 4px;"><a href="#rfn-18" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[18]</a> 2002년 당시 HD로 방송되던 프로그램은 &lt;<a class="wiki-link" href="SBS_인기가요.html">SBS 인기가요</a>&gt;, &lt;<a class="wiki-link" href="생방송_음악캠프.html">생방송 음악캠프</a>&gt;, &lt;<a class="wiki-link" href="열린음악회.html">열린음악회</a>&gt;, &lt;<a class="wiki-link" href="도전_1000곡.html">도전 1000곡</a>&gt;, &lt;생방송 행복찾기&gt;, &lt;행복채널&gt;, &lt;아침마당&gt; 등. <a class="wiki-link" href="#rfn-18">↑</a></li>
<li id="fn-19" style="margin-bottom: 4px;"><a href="#rfn-19" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[19]</a> 유튜브에 올라온 화질이 선명한 음악 방송이나 예능 프로그램은 모두 보정하거나 방송국에서 구해왔거나 개인이 DVR로 녹화한 자료로, 화질이 별로 좋지 않은 파일들은 방송을 녹화한 것이다. <a class="wiki-link" href="#rfn-19">↑</a></li>
<li id="fn-20" style="margin-bottom: 4px;"><a href="#rfn-20" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[20]</a> 그래서 당시까지만 해도 <a class="wiki-link" href="ATSC.html">미국식 방식</a> 대신에 <a class="wiki-link" href="DVB.html">유럽식 방식</a>으로 쓰자고 제안하는 일이 심심치 않게 있었다. 일단 당시 기준으로는 유럽식 디지털 TV의 가격이 미국식 디지털 TV에 비해 가격이 싼 데다 화질이 상당히 떨어지기는 했어도 다채널 구현이 안정적으로 이루어질 수 있었고 이동방식도 미국식에 비해 우월했기에 그랬던 것. <a class="wiki-link" href="#rfn-20">↑</a></li>
<li id="fn-21" style="margin-bottom: 4px;"><a href="#rfn-21" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[21]</a> 당시 TV가격은 아날로그&lt;<a class="wiki-link" href="HD_Ready.html">HD Ready</a>(분리형)&lt;내장형 순으로 비쌌다. <a class="wiki-link" href="#rfn-21">↑</a></li>
<li id="fn-22" style="margin-bottom: 4px;"><a href="#rfn-22" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[22]</a> 그 당시 유일한 다채널 방송은 디지털 위성방송인 스카이라이프 뿐이었다. <a class="wiki-link" href="#rfn-22">↑</a></li>
<li id="fn-23" style="margin-bottom: 4px;"><a href="#rfn-23" style="color: var(--wiki-link); font-weight: bold; text-decoration: none;">[23]</a> 영화진흥위원회(세계 영화시장규모, 2006) <a class="wiki-link" href="#rfn-23">↑</a></li>
