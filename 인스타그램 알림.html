        window.onload = () => {
            renderNotifications();
        };

        function renderNotifications() {
            const container = document.getElementById('notifications-container');
            container.innerHTML = '';

            notificationsData.forEach((sectionData, index) => {
                // 섹션 헤더 (오늘, 이번 주 등)
                const sectionHTML = `
                    <div class="px-5 pt-6 pb-2">
                        <h2 class="font-bold text-[16px] text-[#262626]">${sectionData.section}</h2>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', sectionHTML);

                // 알림 아이템들
                sectionData.items.forEach((item, itemIndex) => {
                    let actionHTML = '';

                    // 팔로우 타입이면 버튼 렌더링
                    if (item.type === 'follow') {
                        if (item.isFollowing) {
                            actionHTML = `<button class="bg-[#efefef] hover:bg-[#dbdbdb] text-black font-bold text-sm px-4 py-1.5 rounded-lg transition ml-3 flex-shrink-0" onclick="toggleFollow(this, '${item.user}')">팔로잉</button>`;
                        } else {
                            actionHTML = `<button class="bg-blue-500 hover:bg-blue-600 text-white font-bold text-sm px-4 py-1.5 rounded-lg transition ml-3 flex-shrink-0" onclick="toggleFollow(this, '${item.user}')">팔로우</button>`;
                        }
                    } 
                    // 그 외 (좋아요, 댓글 등) 타입이면 게시물 썸네일 렌더링
                    else {
                        actionHTML = `
                            <div class="w-11 h-11 flex-shrink-0 ml-3 cursor-pointer" onclick="showToast('해당 게시물로 이동합니다.')">
                                <img src="${item.targetImg}" class="w-full h-full object-cover rounded-[4px]" onerror="this.src='${item.targetPlaceholder}'">
                            </div>
                        `;
                    }

                    // 전체 알림 로우 조립
                    const itemHTML = `
                        <div class="flex items-center px-5 py-3 hover:bg-gray-50 transition cursor-pointer animate-fade-in" style="animation-delay: ${(index * 0.1) + (itemIndex * 0.05)}s">
                            <!-- 프로필 이미지 -->
                            <div class="w-11 h-11 flex-shrink-0 cursor-pointer" onclick="window.location.href='${item.user} 인스타그램.html'">
                                <img src="${item.img}" class="w-full h-full rounded-full border border-gray-200 object-cover" onerror="this.src='${item.placeholder}'">
                            </div>
                            
                            <!-- 알림 텍스트 -->
                            <div class="ml-3 flex-1 text-[14px] leading-tight" onclick="showToast('${item.type === 'follow' ? '프로필로 이동합니다.' : '게시물로 이동합니다.'}')">
                                <span class="font-bold hover:underline" onclick="event.stopPropagation(); window.location.href='${item.user} 인스타그램.html'">${item.alias || item.user}</span>
                                <span>${item.text}</span>
                                <span class="text-gray-500 text-[13px] ml-1">${item.time}</span>
                            </div>

                            <!-- 우측 액션 (버튼 또는 썸네일) -->
                            ${actionHTML}
                        </div>
                    `;
                    
                    container.insertAdjacentHTML('beforeend', itemHTML);
                });
            });
        }

        // 팔로우 버튼 토글 로직
        function toggleFollow(btnElement, username) {
            // 부모의 onClick(게시물/프로필 이동) 방지
            event.stopPropagation(); 

            const isFollowing = btnElement.innerText === '팔로잉';
            
            if (isFollowing) {
                // 팔로잉 -> 팔로우 취소
                btnElement.innerText = '팔로우';
                btnElement.classList.remove('bg-[#efefef]', 'hover:bg-[#dbdbdb]', 'text-black');
                btnElement.classList.add('bg-blue-500', 'hover:bg-blue-600', 'text-white');
                showToast(`${username}님 팔로우를 취소했습니다.`);
            } else {
                // 팔로우 -> 팔로잉
                btnElement.innerText = '팔로잉';
                btnElement.classList.remove('bg-blue-500', 'hover:bg-blue-600', 'text-white');
                btnElement.classList.add('bg-[#efefef]', 'hover:bg-[#dbdbdb]', 'text-black');
                showToast(`${username}님을 팔로우합니다.`);
            }
        }

        // 공통 기능: 토스트 알림 및 더보기 메뉴
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast-message');
            document.getElementById('toast-text').innerText = message;
            toast.classList.remove('opacity-0', 'translate-y-5');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-5');
            }, 2500);
        }

        function toggleMoreMenu(event) {
            event.preventDefault();
            event.stopPropagation();
            const menu = document.getElementById('more-menu');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                setTimeout(() => {
                    menu.classList.remove('opacity-0', 'translate-y-2');
                    menu.classList.add('opacity-100', 'translate-y-0');
                }, 10);
            } else {
                closeMoreMenu();
            }
        }

        function closeMoreMenu() {
            const menu = document.getElementById('more-menu');
            if (menu && !menu.classList.contains('hidden')) {
                menu.classList.remove('opacity-100', 'translate-y-0');
                menu.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => menu.classList.add('hidden'), 200);
            }
        }

        window.onclick = function(event) {
            const menu = document.getElementById('more-menu');
            const moreBtn = document.getElementById('more-btn');
            if (menu && !menu.classList.contains('hidden')) {
                if (!menu.contains(event.target) && !moreBtn.contains(event.target)) {
                    closeMoreMenu();
                }
            }
        }
    </script>
<script>
    function applyUserData() {
        const storedUser = localStorage.getItem('ig_user_account');
        if (!storedUser) return; // 가입/로그인 정보가 없으면 패스

        const userData = JSON.parse(storedUser);

        // 1. 사이드바 프로필 사진 변경
        const sidebarProfileImgs = document.querySelectorAll('nav img[src*="이미지/효빈시_로고.webp"]');
        sidebarProfileImgs.forEach(img => {
            if (userData.profilePic) img.src = userData.profilePic;
        });

        // 2. 만들기(모달) 프로필 변경
        const createProfileImg = document.querySelector('#step-2 img[src*="이미지/효빈시_로고.webp"]');
        const createProfileName = document.querySelector('#step-2 span.font-bold');
        if (createProfileImg && userData.profilePic) createProfileImg.src = userData.profilePic;
        if (createProfileName) createProfileName.innerText = userData.username;

        // 3. 댓글 입력창 프로필 변경 (있는 경우)
        const commentImgs = document.querySelectorAll('input[placeholder="댓글 달기..."]');
        commentImgs.forEach(input => {
            // 입력창 바로 왼쪽에 있는 프로필 이미지 (또는 아이콘 찾기)
            const parent = input.parentElement;
            const img = parent.querySelector('img');
            if(img && userData.profilePic) img.src = userData.profilePic;
        });
        
        // 4. (추가) 글로벌 변수에 내 정보 저장해두기 (댓글 작성 등에 사용)
        window.myInstagramUser = userData;
    }

    // 화면 로딩 완료 시 실행
    document.addEventListener('DOMContentLoaded', applyUserData);

    // [댓글 작성 함수 덮어쓰기] - 내 이름과 사진으로 달리게 변경
    if (typeof renderIgComment !== 'undefined') {
        window.renderIgComment = function(text, targetAreaId) {
            const targetArea = document.getElementById(targetAreaId);
            const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            // 로그인 데이터 가져오기 (없으면 임시값)
            const me = window.myInstagramUser || { username: 'guest', profilePic: 'https://via.placeholder.com/32' };
            const myPic = me.profilePic ? me.profilePic : 'https://via.placeholder.com/32';
            
            const commentHTML = `
                <div class="flex gap-3 items-start mt-3 animate-fade-in">
                    <img src="${myPic}" class="w-8 h-8 rounded-full mt-1 cursor-pointer border border-gray-200 object-cover">
                    <div class="flex-1">
                        <span class="font-bold cursor-pointer hover:underline text-[14px]">${me.username}</span>
                        <span class="text-[14px] break-all">${safeText}</span>
                        <div class="flex gap-3 text-[11px] text-gray-500 font-bold mt-1">
                            <span>방금 전</span>
                            <span class="cursor-pointer" onclick="document.getElementById('${targetAreaId.replace('area', 'input')}').focus()">답글 달기</span>
                        </div>
                    </div>
                    <button class="text-xs pt-2 pr-2 text-gray-400 hover:text-gray-600" onclick="this.querySelector('i').classList.toggle('fas'); this.querySelector('i').classList.toggle('text-red-500'); this.querySelector('i').classList.toggle('far');"><i class="far fa-heart"></i></button>
                </div>
            `;
            targetArea.insertAdjacentHTML('beforeend', commentHTML);
            const scrollContainer = targetArea.parentElement;
            scrollContainer.scrollTop = scrollContainer.scrollHeight;
        };
    }
</script>
